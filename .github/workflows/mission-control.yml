name: Mission Control

on:
  pull_request:
    paths:
      - '.github/workflows/mission-control.yml'
      - 'CURRENT.md'
      - 'content/xizong/CURRENT.md'
      - 'content/xizong/CONTENT_MAINLINE.md'
      - 'content/english/CURRENT.md'
      - 'content/politics/CURRENT.md'
      - 'content/lexical/CURRENT.md'
      - 'static-web/src/lib/missionControl.mjs'
      - 'static-web/src/pages/current.astro'
      - 'static-web/scripts/validate-mission-control.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mission-control.yml'
      - 'CURRENT.md'
      - 'content/xizong/CURRENT.md'
      - 'content/xizong/CONTENT_MAINLINE.md'
      - 'content/english/CURRENT.md'
      - 'content/politics/CURRENT.md'
      - 'content/lexical/CURRENT.md'
      - 'static-web/src/lib/missionControl.mjs'
      - 'static-web/src/pages/current.astro'
      - 'static-web/scripts/validate-mission-control.mjs'

permissions:
  contents: read

concurrency:
  group: mission-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-read-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Mission Control projection
        working-directory: static-web
        run: node scripts/validate-mission-control.mjs
      - name: Build learner site
        working-directory: static-web
        run: |
          npm install --no-audit --no-fund
          npm run build
