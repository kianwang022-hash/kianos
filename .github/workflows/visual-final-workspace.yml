name: Visual Final Workspace
on:
  workflow_dispatch:
  push:
    branches: ['ui/visual-convergence-20260916']
    paths: ['.github/workflows/visual-final-workspace.yml']
permissions:
  contents: write
concurrency:
  group: visual-final-workspace
  cancel-in-progress: false
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/visual-convergence-20260916
          fetch-depth: 0
      - name: Reconcile pinned current main without overwriting conflicts
        run: |
          git config user.name 'KianOS visual worker'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit d36a93f81eaf4bb4aca29a649457bd9fd59068fe
          git push origin HEAD:refs/heads/ui/visual-convergence-20260916
          git rev-parse HEAD > commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reusable tooling
        working-directory: static-web
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Build reconciled site
        working-directory: static-web
        run: npm run build
      - name: Package local development environment
        if: always()
        run: |
          git status --short > workspace-status.txt
          git rev-parse HEAD > commit.txt
          tar --exclude='.git' --exclude='workspace.tar.gz' --exclude='node_modules/.cache' -czf workspace.tar.gz .github content tools static-web *.md package.json commit.txt workspace-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-final-local-workspace
          path: |
            workspace.tar.gz
            commit.txt
            workspace-status.txt
          retention-days: 3
