name: Xizong Source Revision Transitive

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'static-web/src/components/XizongBlockV6.astro'
      - 'static-web/src/lib/xizongStudyPacket.mjs'
      - 'static-web/scripts/test-xizong-source-revision-transitive.mjs'
      - '.github/workflows/xizong-source-revision-transitive.yml'
  push:
    branches: [main]
    paths:
      - 'static-web/src/components/XizongBlockV6.astro'
      - 'static-web/src/lib/xizongStudyPacket.mjs'
      - 'static-web/scripts/test-xizong-source-revision-transitive.mjs'
      - '.github/workflows/xizong-source-revision-transitive.yml'

jobs:
  source-revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared runtime dependencies
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Run Source revision transitive invalidation proof
        working-directory: static-web
        run: node scripts/test-xizong-source-revision-transitive.mjs
