name: Lexical pkg256 sync latest main

on:
  push:
    branches: [lexical/pkg256-exec]
    paths:
      - '.github/workflows/lexical-pkg256-sync-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexical-pkg256-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg256-exec
          fetch-depth: 0
      - name: Merge latest main or report exact conflicts
        run: |
          set -euo pipefail
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git fetch origin main
          if git merge --no-edit origin/main; then
            git push origin HEAD:lexical/pkg256-exec
          else
            echo 'PKG256_MAIN_SYNC_CONFLICTS'
            git diff --name-only --diff-filter=U
            exit 1
          fi
