name: Lexical Reconciled Corrective Runner

on:
  push:
    branches:
      - lexical-reconciled-corrective-o3125-o3374
    paths:
      - 'tools/lexical_apply_reconciled_corrective_o3125_o3374.py'
      - '.github/workflows/lexical-reconciled-corrective-run.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout bounded branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply reconciled corrective package
        env:
          KIANOS_BASELINE_MAIN: 88eedd381aa7c719467c0e925b4147ac31d68537
        run: python tools/lexical_apply_reconciled_corrective_o3125_o3374.py

      - name: Natural Owner audit
        run: python tools/lexical_natural_owner.py audit

      - name: Lexical tests
        run: |
          python tools/test_lexical_transport_guards.py
          python tools/test_lexical_shard.py

      - name: Parse lexical JSON and diff-check
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          count = 0
          for p in Path('content/lexical').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
              count += 1
          print(f'JSON_OK={count}')
          PY
          git diff --check

      - name: Install Astro dependencies
        working-directory: static-web
        run: npm install --no-audit --no-fund

      - name: Astro build
        working-directory: static-web
        run: npm run build

      - name: Commit bounded implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/lexical-reconciled-corrective-run.yml
          git add content/lexical
          git diff --cached --check
          git status --short
          git commit -m 'lexical: implement Sol-reconciled o3125-o3374 corrective package'
          git push origin HEAD:lexical-reconciled-corrective-o3125-o3374
