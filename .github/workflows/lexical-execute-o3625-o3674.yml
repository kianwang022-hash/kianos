name: Lexical Execute o3625-o3674

on:
  push:
    branches:
      - lexical/execute-o3625-o3874-20260916
    paths:
      - .github/workflows/lexical-execute-o3625-o3674.yml
      - content/lexical/execution/o3625-o3674.ACTIVE

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Current gate and restore helper
        shell: bash
        run: |
          set -euo pipefail
          BASE=78aecd90163ad735e389708b2562a5b8671dede8
          git fetch origin main:refs/remotes/origin/main
          DRIFT=$(git diff --name-only "$BASE..origin/main" -- \
            content/lexical/words/by-ordinal \
            content/lexical/canonical/senses/shards \
            content/lexical/canonical/collocations/shards \
            content/lexical/relations/by-id \
            content/lexical/relations/manifest.json || true)
          if [ -n "$DRIFT" ]; then
            echo "LEXICAL_SEMANTIC_DRIFT_SINCE_EXECUTION_BASE"
            echo "$DRIFT"
            exit 1
          fi
          git fetch origin 4c85edc2911928e20e264bb13d232949bb953984:refs/remotes/origin/forward-helper
          git show origin/forward-helper:tools/lexical_apply_retro_o0025_o0224.py > tools/lexical_apply_retro_o0025_o0224.py

      - name: Patch two executor mechanics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/lexical_apply_forward_o3625_o3674.py')
          t=p.read_text()
          old="plateau=s.add_new(3631,'reach_stable_level_verb','verb','达到并停留在稳定水平；进入平台期','to reach and remain at a relatively stable level after growth or progress','L2','vi.')"
          new=old+"\n    s.update_sense(3631,plateau,pattern='vi.',transitivity='vi')"
          if old not in t: raise SystemExit('PLATEAU_PATCH_ANCHOR_MISSING')
          t=t.replace(old,new,1)
          old2="s.demote(3666,'sense:polish:39482ccccdc650b0',status='deprecated')"
          new2="s.drop_colloc(3666,'the Poles')\n    "+old2
          if old2 not in t: raise SystemExit('POLISH_PATCH_ANCHOR_MISSING')
          t=t.replace(old2,new2,1)
          p.write_text(t)
          PY

      - name: Execute shard
        run: python tools/lexical_apply_forward_o3625_o3674.py

      - name: Natural Owner audit
        run: python tools/lexical_natural_owner.py audit
      - name: Transport guards
        run: python tools/test_lexical_transport_guards.py
      - name: Shard tests
        run: python tools/test_lexical_shard.py
      - name: Parse all Lexical JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          n=0
          for p in Path('content/lexical').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8')); n+=1
          print('parsed',n,'lexical json files')
          PY

      - name: Exact shard diff gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected={3627,3629,3630,3631,3634,3644,3646,3647,3650,3653,3656,3657,3658,3660,3662,3663,3664,3666,7278}
          raw=subprocess.check_output(['git','status','--porcelain=v1','-z','--untracked-files=all'])
          changed_words=set(); bad=[]
          for e in raw.split(b'\0'):
              if not e: continue
              p=e.decode('utf-8','surrogateescape')[3:]
              if ' -> ' in p: p=p.split(' -> ',1)[1]
              if p.startswith('content/lexical/words/by-ordinal/o') and p.endswith('.json'):
                  changed_words.add(int(p.rsplit('/o',1)[1][:-5])); continue
              if p.startswith('content/lexical/canonical/senses/shards/') or p.startswith('content/lexical/canonical/collocations/shards/'): continue
              if p.startswith('content/lexical/relations/by-id/') or p=='content/lexical/relations/manifest.json': continue
              if p=='content/lexical/execution/receipts/o3625-o3674.json': continue
              if p.startswith('tools/') or p.startswith('.github/workflows/') or p=='content/lexical/execution/o3625-o3674.ACTIVE': continue
              if p.startswith('content/lexical/'): bad.append(p)
          if changed_words!=expected: raise SystemExit(f'WORD_WRITE_SET_MISMATCH:{sorted(changed_words)}')
          if bad: raise SystemExit(f'UNAUTHORIZED_LEXICAL_PATHS:{sorted(set(bad))}')
          print('exact shard diff gate PASS')
          PY

      - name: Commit shard result
        shell: bash
        run: |
          set -euo pipefail
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "Kian"
          git config user.email "kianwang022@gmail.com"
          git add content/lexical/words/by-ordinal content/lexical/canonical/senses/shards content/lexical/canonical/collocations/shards content/lexical/relations content/lexical/execution/receipts/o3625-o3674.json
          git diff --cached --quiet && { echo 'No shard changes'; exit 1; }
          git commit -m "lexical: execute forward shard o3625-o3674"
          git push origin HEAD
