name: Xizong B Learning Candidate

on:
  push:
    branches: [main]
    paths:
      - 'static-web/scripts/build-xizong-b-learning-candidate.mjs'
      - '.github/workflows/xizong-b-learning-candidate.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build audited B learning candidate
        working-directory: static-web
        run: node scripts/build-xizong-b-learning-candidate.mjs

      - name: Fail closed on write set
        shell: bash
        run: |
          git config core.quotePath false
          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'content/xizong/knowledge/learner/b-digestive-metabolic-endocrine-tumor-learning.json'

      - name: Commit candidate owner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'content/xizong/knowledge/learner/b-digestive-metabolic-endocrine-tumor-learning.json'
          git commit -m 'xizong: materialize B learning support candidate'
          git pull --rebase origin main
          git push origin HEAD:main
