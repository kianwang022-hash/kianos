name: Lexical Direct Render Owner Audit

on:
  pull_request:
    paths:
      - 'content/lexical/**'
      - 'static-web/src/components/VocabularyWordRuntime.astro'
      - 'static-web/src/lib/lexical.mjs'
      - 'tools/lexical_direct_render_owner_audit.py'
      - '.github/workflows/lexical-direct-render-owner-audit.yml'
  push:
    branches: [main]
    paths:
      - 'content/lexical/**'
      - 'static-web/src/components/VocabularyWordRuntime.astro'
      - 'static-web/src/lib/lexical.mjs'
      - 'tools/lexical_direct_render_owner_audit.py'
      - '.github/workflows/lexical-direct-render-owner-audit.yml'

permissions:
  contents: read

concurrency:
  group: lexical-direct-render-owner-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Audit all Current Lexical owners
        id: audit
        continue-on-error: true
        run: |
          python tools/lexical_direct_render_owner_audit.py --output lexical-direct-render-audit/report.json

      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexical-direct-render-audit-${{ github.sha }}
          path: lexical-direct-render-audit/report.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce direct-render readiness
        if: steps.audit.outcome != 'success'
        run: exit 1
