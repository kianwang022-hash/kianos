name: TEMP Xizong 168 Projection Validation

on:
  push:
    branches:
      - chat/xizong-multipass-question-attempts

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            content/xizong
      - name: Validate exact bindings and adversarial mutations
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/xizong-projection-report
          python3 -B content/xizong/projection/tools/validate_projection.py --self-test --json /tmp/xizong-projection-report/report.json 2>&1 | tee /tmp/xizong-projection-report/validation.log
      - name: Validate freeze accounting and provenance
        shell: bash
        run: |
          set -o pipefail
          python3 -B content/xizong/projection/tools/validate_projection_acceptance.py --self-test --json /tmp/xizong-projection-report/acceptance.json 2>&1 | tee /tmp/xizong-projection-report/acceptance.log
      - name: Verify protected source worktree unchanged
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all -- content/xizong/knowledge)"
          echo "tested_commit=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xizong-168-projection-${{ github.event.before }}
          path: /tmp/xizong-projection-report
          retention-days: 7
