name: TEMP Xizong Real Multipass Journey Fix

on:
  push:
    branches:
      - chat/xizong-multipass-question-attempts

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/xizong-multipass-question-attempts
      - name: Replace synthetic completion with real UI journey
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          test = Path('static-web/scripts/test-xizong-a2-functional-journey.mjs')
          s = test.read_text()

          new_first = "\n".join([
              "  // Finish the rest of round 1 through the real UI. Do not manufacture",
              "  // completion by editing localStorage behind the Runtime's back.",
              "  const currentPayloadQuestion = async () => {",
              "    const meta = (await exit.locator('[data-question-meta]').textContent() || '').trim();",
              "    return payload.questions.find((q) => meta.includes(String(q.year)) && meta.includes(`第 ${q.number} 题`)) || null;",
              "  };",
              "  const answerCurrentStable = async () => {",
              "    const question = await currentPayloadQuestion();",
              "    if (!question) throw new Error(`A2_CURRENT_QUESTION_NOT_RESOLVED:${await exit.locator('[data-question-meta]').textContent()}`);",
              "    const letters = String(question.correctAnswer || '').toUpperCase().match(/[A-Z]/g) || [];",
              "    for (const letter of letters) await exit.locator(`[data-question-options] [data-option=\\\"${letter}\\\"]`).click();",
              "    await exit.locator('[data-submit-answer]').click();",
              "    await exit.locator('[data-mark-stable]').click();",
              "    return question;",
              "  };",
              "",
              "  if (await exit.locator('[data-next-uncertain]').isVisible()) await exit.locator('[data-next-uncertain]').click();",
              "  for (let guard = 0; guard <= payload.questions.length && !(await exit.locator('[data-sweep-done]').isVisible()); guard += 1) {",
              "    await answerCurrentStable();",
              "  }",
              "  check(await exit.locator('[data-sweep-done]').isVisible(), 'first_pass_real_ui_reaches_done_surface');",
          ])
          first_pattern = re.compile(r"  // Complete the remaining current-round session state without manufacturing\n.*?  await exit\.locator\('\[data-sweep-done\]'\)\.waitFor\(\{ state: 'visible' \}\);", re.S)
          s, count = first_pattern.subn(new_first, s, count=1)
          if count != 1:
              raise SystemExit(f'FIRST_SYNTHETIC_BLOCK_REPLACED:{count}')

          new_second = "\n".join([
              "  // Walk round 2 through the same Runtime until the reviewed target re-enters.",
              "  // Every prior second-pass result is a real browser attempt, not fixture state.",
              "  let secondPassTargetReached = false;",
              "  for (let guard = 0; guard <= payload.questions.length; guard += 1) {",
              "    const question = await currentPayloadQuestion();",
              "    if (!question) break;",
              "    if (question.questionId === target.questionId) {",
              "      secondPassTargetReached = true;",
              "      break;",
              "    }",
              "    await answerCurrentStable();",
              "  }",
              "  check(secondPassTargetReached, 'same_question_reenters_in_second_pass');",
          ])
          second_pattern = re.compile(r"  // Navigate the deterministic browser journey back to the same reviewed target\n.*?  check\(\(await exit\.locator\('\[data-question-meta\]'\)\.textContent\(\) \|\| ''\)\.includes\(String\(target\.number\)\), 'same_question_reenters_in_second_pass'\);", re.S)
          s, count = second_pattern.subn(new_second, s, count=1)
          if count != 1:
              raise SystemExit(f'SECOND_SYNTHETIC_BLOCK_REPLACED:{count}')
          test.write_text(s)

          runtime = Path('static-web/src/components/XizongSystemExitRuntime.astro')
          r = runtime.read_text()
          r, count = re.subn(r"\n    const syncSweepState = \(\) => \{\n.*?\n    \};\n", "\n", r, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'SYNC_BLOCK_REPLACED:{count}')
          r = r.replace("      syncSweepState();\n", "")
          if 'syncSweepState' in r:
              raise SystemExit('SYNC_RESIDUE_REMAINS')
          runtime.write_text(r)
          PY
          git diff --check
          git diff -- static-web/scripts/test-xizong-a2-functional-journey.mjs static-web/src/components/XizongSystemExitRuntime.astro
      - name: Commit bounded fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static-web/scripts/test-xizong-a2-functional-journey.mjs static-web/src/components/XizongSystemExitRuntime.astro
          git commit -m "test(xizong): prove multipass through real browser attempts"
          git push origin HEAD:chat/xizong-multipass-question-attempts
