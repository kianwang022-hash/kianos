name: Writing Acceptance Gates

on:
  push:
    branches:
      - main
      - feat/writing-learning-loop-v1
    paths:
      - static-web/src/lib/englishWriting.mjs
      - static-web/src/lib/englishWritingLearning.mjs
      - static-web/src/pages/writing-learn.astro
      - static-web/src/pages/index.astro
      - static-web/scripts/inspect-writing-source.mjs
      - static-web/scripts/validate-writing-source.mjs
      - static-web/scripts/validate-writing-learning.mjs
      - static-web/package.json
      - .github/workflows/writing-source-inspection.yml
      - content/english/modules/writing/learning.md
      - content/english/manifest.json
      - content/english/provenance.json
      - content/english/source/question_bank.v1.json

permissions:
  contents: read

jobs:
  validate-writing-acceptance-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install static web dependencies
        working-directory: static-web
        run: npm install --no-audit --no-fund

      - name: Inspect Current Writing source boundary
        working-directory: static-web
        run: |
          mkdir -p audit-output
          KIANOS_AUDIT_OUT="$PWD/audit-output/writing-source-inspection.json" node scripts/inspect-writing-source.mjs

      - name: Validate Writing Source gate
        working-directory: static-web
        run: |
          KIANOS_WRITING_SOURCE_GATE_OUT="$PWD/audit-output/writing-source-gate.json" npm run validate:writing-source

      - name: Validate Writing Projection gate
        working-directory: static-web
        run: |
          KIANOS_WRITING_PROJECTION_GATE_OUT="$PWD/audit-output/writing-projection-gate.json" npm run validate:writing-learning

      - name: Build learner projection
        working-directory: static-web
        run: npm run build

      - name: Upload Writing acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: writing-acceptance-gates
          path: static-web/audit-output/*.json
          if-no-files-found: error
          retention-days: 7
