name: Xizong Biochemistry Source Lifecycle

on:
  push:
    branches: [main]
    paths:
      - 'content/xizong/CURRENT.md'
      - 'content/xizong/CONTENT_MAINLINE.md'
      - 'content/xizong/knowledge/learner/BIOCHEMISTRY_CONTRACT.md'
      - 'content/xizong/knowledge/learner/xizong-2027-biochemistry-delta-slot.json'
      - 'content/xizong/knowledge/learner/biochemistry-27-source-map.json'
      - 'content/xizong/knowledge/learner/b-digestive-metabolic-endocrine-tumor-learning.json'
      - 'content/xizong/knowledge/learner/b-digestive-metabolic-endocrine-tumor-guide.md'
      - 'content/xizong/knowledge/learner/guide-bindings.json'
      - 'content/xizong/knowledge/learner/b-digestive-metabolic-endocrine-tumor-question-scope.json'
      - 'content/xizong/knowledge/systems/b-digestive-metabolic-endocrine-tumor/**'
      - 'content/xizong/source-snapshots/27/manifest.json'
      - 'content/xizong/source-snapshots/27/生物化学讲义_AI阅读版_27跟课_UnifiedSource_v1.md'
      - 'content/xizong/MATURITY_PACKAGE.md'
      - 'static-web/src/lib/xizongStudyPacket.mjs'
      - 'static-web/src/lib/xizongForecastModel.mjs'
      - 'static-web/src/lib/xizongMemoryModel.mjs'
      - 'static-web/src/lib/xizong.mjs'
      - 'static-web/src/lib/xizongSemanticAdapter.mjs'
      - 'static-web/src/components/XizongSystemWorkspace.astro'
      - 'static-web/src/components/XizongBlockV6.astro'
      - 'static-web/scripts/xizongDependencyFreshness.mjs'
      - 'static-web/scripts/test-xizong-source-revision-transitive.mjs'
      - 'static-web/scripts/test-xizong-forecast-real-u-adapter.mjs'
      - 'static-web/scripts/validate-xizong-memory-retention.mjs'
      - 'content/xizong/explanations/**'
      - 'content/xizong/question-relations/**'
      - 'static-web/scripts/validate-xizong-b-knowledge.mjs'
      - 'static-web/scripts/validate-xizong-biochemistry-source-lifecycle.mjs'
      - '.github/workflows/xizong-biochemistry-source-lifecycle.yml'
  pull_request:
    paths:
      - 'content/xizong/CURRENT.md'
      - 'content/xizong/CONTENT_MAINLINE.md'
      - 'content/xizong/knowledge/learner/BIOCHEMISTRY_CONTRACT.md'
      - 'content/xizong/knowledge/learner/xizong-2027-biochemistry-delta-slot.json'
      - 'content/xizong/knowledge/learner/biochemistry-27-source-map.json'
      - 'content/xizong/knowledge/learner/b-digestive-metabolic-endocrine-tumor-learning.json'
      - 'content/xizong/knowledge/learner/b-digestive-metabolic-endocrine-tumor-guide.md'
      - 'content/xizong/knowledge/learner/guide-bindings.json'
      - 'content/xizong/knowledge/learner/b-digestive-metabolic-endocrine-tumor-question-scope.json'
      - 'content/xizong/knowledge/systems/b-digestive-metabolic-endocrine-tumor/**'
      - 'content/xizong/source-snapshots/27/manifest.json'
      - 'content/xizong/source-snapshots/27/生物化学讲义_AI阅读版_27跟课_UnifiedSource_v1.md'
      - 'content/xizong/MATURITY_PACKAGE.md'
      - 'static-web/src/lib/xizongStudyPacket.mjs'
      - 'static-web/src/lib/xizongForecastModel.mjs'
      - 'static-web/src/lib/xizongMemoryModel.mjs'
      - 'static-web/src/lib/xizong.mjs'
      - 'static-web/src/lib/xizongSemanticAdapter.mjs'
      - 'static-web/src/components/XizongSystemWorkspace.astro'
      - 'static-web/src/components/XizongBlockV6.astro'
      - 'static-web/scripts/xizongDependencyFreshness.mjs'
      - 'static-web/scripts/test-xizong-source-revision-transitive.mjs'
      - 'static-web/scripts/test-xizong-forecast-real-u-adapter.mjs'
      - 'static-web/scripts/validate-xizong-memory-retention.mjs'
      - 'content/xizong/explanations/**'
      - 'content/xizong/question-relations/**'
      - 'static-web/scripts/validate-xizong-b-knowledge.mjs'
      - 'static-web/scripts/validate-xizong-biochemistry-source-lifecycle.mjs'
      - '.github/workflows/xizong-biochemistry-source-lifecycle.yml'

permissions:
  contents: read

jobs:
  source-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Current 27 Biochemistry Source lifecycle
        working-directory: static-web
        run: |
          node scripts/validate-xizong-biochemistry-source-lifecycle.mjs
          node scripts/test-xizong-source-revision-transitive.mjs
          node scripts/test-xizong-forecast-real-u-adapter.mjs
          node scripts/validate-xizong-memory-retention.mjs
