name: Lexical C o3051-o3150

on:
  push:
    branches:
      - work/lexical-c-o3051-o3150-20260923
    paths:
      - 'content/lexical/semantic-review/dual/C/o3051-o3150.decision.json'
      - 'tools/lexical_apply_c_o3051_o3150.py'
      - '.github/workflows/lexical-c-o3051-o3150.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply C window
        run: python3 tools/lexical_apply_c_o3051_o3150.py

      - name: Natural Owner audit
        run: python3 tools/lexical_natural_owner.py audit

      - name: Verify bounded scope
        run: |
          python3 - <<'PY'
          import subprocess,sys
          files=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          ords=[]
          prefix='content/lexical/words/by-ordinal/o'
          for p in files:
              if p.startswith(prefix) and p.endswith('.json'):
                  ords.append(int(p[len(prefix):-5]))
          bad=[o for o in ords if not (o==2935 or 3051<=o<=3150)]
          print({'changed_files':len(files),'changed_word_ordinals':ords,'bad':bad})
          if bad:
              sys.exit(1)
          PY
          git diff --check

      - name: Commit canonical mutation
        id: mutation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/lexical
          git commit -m "Lexical C: reconcile o3051-o3150"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Seal cursor and self-delete executor
        env:
          MUTATION_SHA: ${{ steps.mutation.outputs.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os

          p=Path('content/lexical/execution/dual-review-C.json')
          d=json.loads(p.read_text())
          d['status']='ACTIVE_PREFIX_GATED'
          d['next_ordinal']=3151
          d['completed_through']=3150
          d['semantic_decided_through']=3150
          d['canonical_applied_through']=3150
          d['next_semantic_ordinal']=3151
          d['active_checkpoint_branch']=None
          d['checkpoint_start_ordinal']=3051
          d['checkpoint_target_through']=3550
          d['checkpoint_staged_through']=3150
          d['checkpoint_full_rebuild_pending']=False
          d['checkpoint_batch_apply_pending']=False
          d['pending_decision_manifests']=[]
          d['checkpoint']={
              'start_ordinal':3051,
              'target_end_ordinal':3550,
              'semantic_completed_through':3150,
              'semantic_decided_through':3150,
              'canonical_applied_through':3150,
              'pending_batch_apply':False,
              'pending_full_7946_flob_rebuild':False,
              'windows':[{
                  'range':[3051,3150],
                  'a_review_commit':'b8e8576d507880782a5a5417f2b89f9929d287d5',
                  'b_review_commit':'bd005d5d40743e946e55af24669e190095f94c3a',
                  'c_mutation_commit':os.environ['MUTATION_SHA'],
                  'decision_manifest':'content/lexical/semantic-review/dual/C/o3051-o3150.decision.json'
              }]
          }
          d['deferred_beyond_c_frontier']=[x for x in d.get('deferred_beyond_c_frontier',[]) if x.get('source_ordinal')!=2935]
          new_defer={'source_ordinal':3063,'remote_ordinal':5977,'owner':'minimise/minimize regional spelling Relation/Form'}
          if not any(x.get('source_ordinal')==3063 and x.get('remote_ordinal')==5977 for x in d.get('deferred_cross_watermark',[])):
              d.setdefault('deferred_cross_watermark',[]).append(new_defer)

          receipt={
              'schema':'kianos.lexical.streaming_c_window_receipt.v1',
              'status':'PASS',
              'range':[3051,3150],
              'semantic_baseline_sha':'12766cf94b89bd135016e3213637e31edd19adfe',
              'shared_watermark_at_reconcile':5550,
              'a_review_commit':'b8e8576d507880782a5a5417f2b89f9929d287d5',
              'b_review_commit':'bd005d5d40743e946e55af24669e190095f94c3a',
              'c_mutation_commit':os.environ['MUTATION_SHA'],
              'decision_manifest':'content/lexical/semantic-review/dual/C/o3051-o3150.decision.json',
              'semantic_decided_through':3150,
              'canonical_applied_through':3150,
              'natural_owner_audit':'PASS',
              'flob_required_for_semantic_closure':False,
              'noop_ordinals':[3078],
              'deferred_cross_watermark':[new_defer],
              'resolved_prior_deferred':[{'source_ordinal':2935,'remote_ordinal':3068,'owner':'majority/minority sense-bound relation'}]
          }
          rp=Path('content/lexical/execution/mutation-receipts/dual-review-c-o3051-o3150.json')
          rp.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          d.setdefault('window_receipts',[]).append(str(rp))
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY

          git rm tools/lexical_apply_c_o3051_o3150.py .github/workflows/lexical-c-o3051-o3150.yml
          git add content/lexical/semantic-review/dual/C/o3051-o3150.decision.json content/lexical/execution/dual-review-C.json content/lexical/execution/mutation-receipts/dual-review-c-o3051-o3150.json
          git commit -m "Lexical C: seal o3051-o3150"
          git push origin HEAD:${GITHUB_REF_NAME}
