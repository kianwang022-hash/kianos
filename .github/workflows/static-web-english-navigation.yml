name: English Navigation Hierarchy

on:
  pull_request:
    paths:
      - 'static-web/src/lib/sharedNavigation.mjs'
      - 'static-web/src/components/EnglishObjectiveLocalNav.astro'
      - 'static-web/src/pages/reading.astro'
      - 'static-web/src/pages/cloze.astro'
      - 'static-web/src/pages/reading-b.astro'
      - 'static-web/ENGLISH_PRODUCT_BRIEF.md'
      - 'static-web/UI_STYLE_BRIEF.md'
      - 'static-web/scripts/test-english-navigation-hierarchy.mjs'
      - '.github/workflows/static-web-english-navigation.yml'
  push:
    branches: [main]
    paths:
      - 'static-web/src/lib/sharedNavigation.mjs'
      - 'static-web/src/components/EnglishObjectiveLocalNav.astro'
      - 'static-web/src/pages/reading.astro'
      - 'static-web/src/pages/cloze.astro'
      - 'static-web/src/pages/reading-b.astro'
      - 'static-web/ENGLISH_PRODUCT_BRIEF.md'
      - 'static-web/UI_STYLE_BRIEF.md'
      - 'static-web/scripts/test-english-navigation-hierarchy.mjs'
      - '.github/workflows/static-web-english-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Build learner site
        working-directory: static-web
        run: npm run build
      - name: Install browser acceptance
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Prove English navigation hierarchy
        working-directory: static-web
        run: node scripts/test-english-navigation-hierarchy.mjs
      - name: Upload navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-navigation-${{ github.sha }}
          path: english-navigation-audit/
          retention-days: 14
