name: Xizong B Runtime Acceptance

on:
  pull_request:
    paths:
      - 'content/xizong/knowledge/systems/b-digestive-metabolic-endocrine-tumor/**'
      - 'content/xizong/knowledge/learner/b-digestive-metabolic-endocrine-tumor-learning.json'
      - 'content/xizong/projection/**'
      - 'static-web/src/lib/xizong.mjs'
      - 'static-web/scripts/validate-xizong-bc-production-compatibility.mjs'
      - 'static-web/scripts/test-xizong-b-runtime-journey.mjs'
      - '.github/workflows/xizong-b-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xizong-b-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: static-web
    steps:
      - name: Checkout Current candidate
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime
        run: npm install --no-audit --no-fund
      - name: Validate B projectability and C boundary
        run: node scripts/validate-xizong-bc-production-compatibility.mjs
      - name: Build Current site with all B routes
        run: npm run build
      - name: Install isolated browser acceptance tool
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute B shared Runtime journey
        run: node scripts/test-xizong-b-runtime-journey.mjs
      - name: Upload B Runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xizong-b-runtime-${{ github.sha }}
          path: static-web/.qa/xizong-b-runtime-journey.json
          if-no-files-found: warn
          retention-days: 14
