name: Xizong Representation Gate

on:
  push:
    branches: [main]
    paths:
      - 'static-web/XIZONG_REPRESENTATION_GATE.md'
      - 'static-web/CURRENT.md'
      - 'static-web/package.json'
      - 'static-web/src/lib/xizongRepresentationGate.mjs'
      - 'static-web/src/components/XizongCognitiveProjectionStage.astro'
      - 'static-web/src/components/XizongLearnerObjectBridge.astro'
      - 'static-web/src/components/XizongBlockWorkspaceShell.astro'
      - 'static-web/src/components/XizongBlockAuxLayoutSync.astro'
      - 'static-web/src/pages/xizong/**'
      - 'static-web/scripts/validate-xizong-representation-gate.mjs'
      - 'content/xizong/projection/**'
      - '.github/workflows/xizong-representation-gate.yml'
  pull_request:
    paths:
      - 'static-web/XIZONG_REPRESENTATION_GATE.md'
      - 'static-web/CURRENT.md'
      - 'static-web/package.json'
      - 'static-web/src/lib/xizongRepresentationGate.mjs'
      - 'static-web/src/components/XizongCognitiveProjectionStage.astro'
      - 'static-web/src/components/XizongLearnerObjectBridge.astro'
      - 'static-web/src/components/XizongBlockWorkspaceShell.astro'
      - 'static-web/src/components/XizongBlockAuxLayoutSync.astro'
      - 'static-web/src/pages/xizong/**'
      - 'static-web/scripts/validate-xizong-representation-gate.mjs'
      - 'content/xizong/projection/**'
      - '.github/workflows/xizong-representation-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xizong-representation-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install static web runtime
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Validate representation gate
        working-directory: static-web
        run: npm run validate:xizong-representation
      - name: Build Current site
        working-directory: static-web
        run: npm run build
