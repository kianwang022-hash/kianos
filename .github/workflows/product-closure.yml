name: Product Closure
on:
  workflow_dispatch:
  push:
    branches: ['product/orchestrator-politics-closure-20260916']
permissions:
  contents: read
concurrency:
  group: product-closure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: product-closure-node22-playwright1561-${{ hashFiles('static-web/package.json') }}
      - name: Build one immutable candidate
        working-directory: static-web
        run: |
          mkdir -p ../product-closure-evidence
          git rev-parse HEAD > ../product-closure-evidence/commit.txt
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          npm run build > ../product-closure-evidence/build.log 2>&1
      - name: Test product consumers and preserved subject journeys
        working-directory: static-web
        run: |
          set +e
          for script in test-product-closure-model test-product-closure-browser test-visual-home-contract test-politics-functional-journey test-politics-mao-runtime test-politics-mao-evidence test-politics-xi-runtime test-politics-xi-evidence test-politics-ethics-runtime test-politics-ethics-evidence test-politics-compiled-presentation; do
            timeout 150s node scripts/$script.mjs > ../product-closure-evidence/$script.log 2>&1
            echo "$script $?" >> ../product-closure-evidence/status.txt
          done
          exit 0
      - name: Preserve exact source and all checks
        if: always()
        run: |
          git archive --format=tar.gz HEAD > product-closure-evidence/source.tar.gz
          git diff --exit-code -- static-web/src content
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-closure-${{ github.sha }}
          path: |
            product-closure-evidence/
            politics-*-audit/report.json
          retention-days: 7
      - name: Enforce every executed check
        if: always()
        shell: python
        run: |
          from pathlib import Path
          p=Path('product-closure-evidence/status.txt')
          rows=p.read_text().splitlines() if p.exists() else []
          bad=[r for r in rows if r.rsplit(' ',1)[-1]!='0']
          print('\n'.join(rows))
          assert len(rows)==11 and not bad, f'Missing/failed checks: {bad}'
