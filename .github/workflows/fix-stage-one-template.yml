name: Fix bounded Astro presentation expression
on:
  push:
    branches: ['ui/visual-convergence-20260916']
    paths: ['.github/workflows/fix-stage-one-template.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('static-web/src/components/VocabularyWordRuntime.astro')
          s=p.read_text();assert s.count(' as Record<string,string>')==1
          p.write_text(s.replace(' as Record<string,string>',''))
          PY
          rm .github/workflows/fix-stage-one-template.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static-web/src/components/VocabularyWordRuntime.astro .github/workflows/fix-stage-one-template.yml
          git commit -m 'fix(ui): keep Relation label expression valid in Astro template'
          git push origin HEAD:ui/visual-convergence-20260916
