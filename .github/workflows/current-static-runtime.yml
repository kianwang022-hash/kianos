name: Current Static Runtime

on:
  pull_request:
    paths:
      - "static-web/scripts/kianos-candidate-runtime.mjs"
      - "static-web/scripts/test-kianos-candidate-runtime.mjs"
      - "static-web/scripts/test-kianos-fast-lane-workflow.mjs"
      - "static-web/scripts/kianos-current-sync.mjs"
      - "static-web/scripts/currentRelease.mjs"
      - "static-web/scripts/kianos-safe-astro-build.mjs"
      - "static-web/scripts/install-current-macos.sh"
      - "static-web/scripts/privateLearnerBridge.mjs"
      - "static-web/scripts/privateDailyLearningPacketRelayWorker.mjs"
      - "static-web/scripts/test-private-daily-learning-packet-worker.mjs"
      - "static-web/scripts/privateExternalReadingBridge.mjs"
      - "static-web/scripts/privateControlBridge.mjs"
      - "static-web/scripts/kianos-static-server.mjs"
      - "static-web/scripts/currentStaticImpact.mjs"
      - "static-web/scripts/currentStaticSlots.mjs"
      - "static-web/scripts/currentDependencies.mjs"
      - "static-web/scripts/test-current-dependency-reuse.mjs"
      - "static-web/scripts/test-current-static-impact.mjs"
      - "static-web/scripts/test-current-build-recovery.mjs"
      - "static-web/scripts/test-current-static-slots.mjs"
      - "static-web/scripts/test-current-static-runtime.mjs"
      - "static-web/scripts/test-current-runtime-reload.mjs"
      - "static-web/scripts/test-current-safe-build.mjs"
      - "static-web/scripts/test-current-release-cleanup.mjs"
      - "static-web/scripts/test-current-offline-startup.mjs"
      - "static-web/scripts/test-current-install-recovery.mjs"
      - "static-web/scripts/test-current-runtime-rollback.mjs"
      - "static-web/scripts/test-current-delivery-lock.mjs"
      - "static-web/scripts/test-current-delivery-concurrency.mjs"
      - "static-web/scripts/test-current-fetch-toctou.mjs"
      - "static-web/scripts/test-current-build-identity.mjs"
      - "static-web/scripts/test-current-release-retention.mjs"
      - "static-web/scripts/test-current-superseded-target.mjs"
      - "static-web/astro.config.mjs"
      - "static-web/src/layouts/BaseFrame.astro"
      - "static-web/package.json"
      - "static-web/CURRENT.md"
      - ".github/workflows/current-static-runtime.yml"
  push:
    branches: [main]
    paths:
      - "static-web/scripts/kianos-candidate-runtime.mjs"
      - "static-web/scripts/test-kianos-candidate-runtime.mjs"
      - "static-web/scripts/test-kianos-fast-lane-workflow.mjs"
      - "static-web/scripts/kianos-current-sync.mjs"
      - "static-web/scripts/currentRelease.mjs"
      - "static-web/scripts/kianos-safe-astro-build.mjs"
      - "static-web/scripts/install-current-macos.sh"
      - "static-web/scripts/privateLearnerBridge.mjs"
      - "static-web/scripts/privateDailyLearningPacketRelayWorker.mjs"
      - "static-web/scripts/test-private-daily-learning-packet-worker.mjs"
      - "static-web/scripts/privateExternalReadingBridge.mjs"
      - "static-web/scripts/privateControlBridge.mjs"
      - "static-web/scripts/kianos-static-server.mjs"
      - "static-web/scripts/currentStaticImpact.mjs"
      - "static-web/scripts/currentStaticSlots.mjs"
      - "static-web/scripts/currentDependencies.mjs"
      - "static-web/scripts/test-current-dependency-reuse.mjs"
      - "static-web/scripts/test-current-static-impact.mjs"
      - "static-web/scripts/test-current-build-recovery.mjs"
      - "static-web/scripts/test-current-static-slots.mjs"
      - "static-web/scripts/test-current-static-runtime.mjs"
      - "static-web/scripts/test-current-runtime-reload.mjs"
      - "static-web/scripts/test-current-safe-build.mjs"
      - "static-web/scripts/test-current-release-cleanup.mjs"
      - "static-web/scripts/test-current-offline-startup.mjs"
      - "static-web/scripts/test-current-install-recovery.mjs"
      - "static-web/scripts/test-current-runtime-rollback.mjs"
      - "static-web/scripts/test-current-delivery-lock.mjs"
      - "static-web/scripts/test-current-delivery-concurrency.mjs"
      - "static-web/scripts/test-current-fetch-toctou.mjs"
      - "static-web/scripts/test-current-build-identity.mjs"
      - "static-web/scripts/test-current-release-retention.mjs"
      - "static-web/scripts/test-current-superseded-target.mjs"
      - "static-web/astro.config.mjs"
      - "static-web/src/layouts/BaseFrame.astro"
      - "static-web/package.json"
      - "static-web/CURRENT.md"
      - ".github/workflows/current-static-runtime.yml"

permissions:
  contents: read

concurrency:
  group: current-static-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      fast_lane: ${{ steps.classify.outputs.fast_lane }}
      impact: ${{ steps.classify.outputs.impact }}
      delivery: ${{ steps.classify.outputs.delivery }}
      static_output: ${{ steps.classify.outputs.static_output }}
      bridge: ${{ steps.classify.outputs.bridge }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: classify
        name: Classify changed delivery claims
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          head="$HEAD_SHA"
          if [[ -z "$head" ]] || ! git cat-file -e "$head^{commit}" 2>/dev/null; then
            head="$(git rev-parse HEAD)"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse "$head^" 2>/dev/null || printf '%s' "$head")"
          fi
          git diff --name-only "$base" "$head" > "$RUNNER_TEMP/current-static-changed.txt"
          cat "$RUNNER_TEMP/current-static-changed.txt"

          has() {
            grep -Eq "$1" "$RUNNER_TEMP/current-static-changed.txt"
          }
          emit() {
            local name="$1" value="$2"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_OUTPUT"
          }

          fast=false
          impact=false
          delivery=false
          static_output=false
          bridge=false

          if has '^static-web/scripts/(kianos-candidate-runtime|test-kianos-candidate-runtime|test-kianos-fast-lane-workflow|currentDependencies|currentRelease)\.mjs$|^static-web/package\.json$'; then
            fast=true
          fi
          if has '^static-web/scripts/(currentStaticImpact|test-current-static-impact)\.mjs$'; then
            impact=true
          fi
          if has '^static-web/scripts/(kianos-current-sync|currentRelease|currentStaticImpact|currentStaticSlots|currentDependencies|test-current-dependency-reuse|test-current-build-recovery|test-current-static-slots|test-current-runtime-reload|test-current-release-cleanup|test-current-offline-startup|test-current-install-recovery|test-current-runtime-rollback|test-current-delivery-lock|test-current-delivery-concurrency|test-current-fetch-toctou|test-current-release-retention|test-current-superseded-target)\.mjs$|^static-web/scripts/install-current-macos\.sh$|^static-web/package\.json$'; then
            delivery=true
          fi
          if has '^static-web/scripts/(kianos-safe-astro-build|kianos-static-server|test-current-safe-build|test-current-static-runtime|test-current-build-identity)\.mjs$|^static-web/(astro\.config\.mjs|package\.json)$|^static-web/src/layouts/BaseFrame\.astro$'; then
            static_output=true
          fi
          if has '^static-web/scripts/(privateLearnerBridge|privateDailyLearningPacketRelayWorker|test-private-daily-learning-packet-worker|privateExternalReadingBridge|privateControlBridge)\.mjs$'; then
            bridge=true
          fi
          if has '^\.github/workflows/current-static-runtime\.yml$'; then
            fast=true
            impact=true
            delivery=true
            static_output=true
            bridge=true
          fi

          emit fast_lane "$fast"
          emit impact "$impact"
          emit delivery "$delivery"
          emit static_output "$static_output"
          emit bridge "$bridge"

  fast-lane:
    needs: scope
    if: needs.scope.outputs.fast_lane == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: static-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Syntax check Candidate Fast Lane
        run: |
          node --check scripts/kianos-candidate-runtime.mjs
          node --check scripts/test-kianos-candidate-runtime.mjs
          node --check scripts/test-kianos-fast-lane-workflow.mjs
      - name: Prove isolated Candidate dependency reuse
        run: node scripts/test-kianos-candidate-runtime.mjs
      - name: Measure one-process Astro dev HMR loop
        run: node scripts/test-kianos-fast-lane-workflow.mjs

  build-impact:
    needs: scope
    if: needs.scope.outputs.impact == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: static-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prove conservative build-impact and runtime-reload classification
        run: node scripts/test-current-static-impact.mjs

  delivery-runtime:
    needs: scope
    if: needs.scope.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: static-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check delivery owners
        run: |
          node --check scripts/kianos-current-sync.mjs
          node --check scripts/currentRelease.mjs
          node --check scripts/currentStaticImpact.mjs
          node --check scripts/currentStaticSlots.mjs
          node --check scripts/currentDependencies.mjs
          node --check scripts/test-current-superseded-target.mjs
          bash -n scripts/install-current-macos.sh
      - name: Prove dependency reuse and build-impact recovery
        run: |
          node scripts/test-current-dependency-reuse.mjs
          node scripts/test-current-build-recovery.mjs
          node scripts/test-current-static-slots.mjs
          node scripts/test-current-release-cleanup.mjs
      - name: Prove managed sync safety and rollback
        run: |
          node scripts/test-current-sync-startup-boundary.mjs
          node scripts/test-current-offline-startup.mjs
          node scripts/test-current-install-recovery.mjs
          node scripts/test-current-runtime-rollback.mjs
          node scripts/test-current-runtime-reload.mjs
      - name: Prove serialized exact delivery and superseded-target coalescing
        run: |
          node scripts/test-current-delivery-lock.mjs
          node scripts/test-current-delivery-concurrency.mjs
          node scripts/test-current-fetch-toctou.mjs
          node scripts/test-current-release-retention.mjs
          node scripts/test-current-superseded-target.mjs

  static-output:
    needs: scope
    if: needs.scope.outputs.static_output == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: static-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Prove safe output targeting and exact build identity
        run: |
          node scripts/test-current-safe-build.mjs
          node scripts/test-current-build-identity.mjs
      - name: Build one Astro staging output
        run: |
          rm -rf dist
          KIANOS_RELEASE_SHA=ci-static-output npm run build:astro -- --outDir "$PWD/dist"
      - name: Prove prebuilt static runtime behavior
        run: node scripts/test-current-static-runtime.mjs

  private-runtime-bridge:
    needs: scope
    if: needs.scope.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: static-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check private runtime bridges
        run: |
          node --check scripts/privateLearnerBridge.mjs
          node --check scripts/privateDailyLearningPacketRelayWorker.mjs
          node --check scripts/privateExternalReadingBridge.mjs
          node --check scripts/privateControlBridge.mjs
      - name: Prove bridge worker and reload boundary
        run: |
          node scripts/test-private-daily-learning-packet-worker.mjs
          node scripts/test-current-runtime-reload.mjs
