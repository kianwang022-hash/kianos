name: Xizong B+C Compatibility

on:
  pull_request:
    paths:
      - 'content/xizong/projection/**'
      - 'content/xizong/knowledge/learner/b-digestive-metabolic-endocrine-tumor-learning.json'
      - 'content/xizong/knowledge/learner/c-hematology-immunity-infection-learning.json'
      - 'content/xizong/knowledge/learner/c-hematology-immunity-infection-learning/**'
      - 'content/xizong/knowledge/systems/b-digestive-metabolic-endocrine-tumor/**'
      - 'content/xizong/knowledge/systems/c-hematology-immunity-infection/**'
      - 'static-web/XIZONG_PRODUCT_STATUS.md'
      - 'static-web/package.json'
      - 'static-web/src/components/XizongBlockV6.astro'
      - 'static-web/src/lib/xizongSemanticAdapter.mjs'
      - 'static-web/src/lib/xizongProductionProjection.mjs'
      - 'static-web/scripts/validate-xizong-bc-production-compatibility.mjs'
      - '.github/workflows/xizong-bc-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Validate B+C production compatibility
        working-directory: static-web
        run: npm run validate:xizong-bc-compatibility
      - name: Validate Current Xizong
        working-directory: static-web
        run: npm run validate:xizong
      - name: Build Current site
        working-directory: static-web
        run: npm run build
