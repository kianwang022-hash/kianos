name: Lexical Verify o3625-o3874 Package

on:
  push:
    branches:
      - lexical/execute-o3625-o3874-20260916
    paths:
      - .github/workflows/lexical-verify-o3625-o3874-package.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fresh Current drift gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=78aecd90163ad735e389708b2562a5b8671dede8
          git fetch origin main:refs/remotes/origin/main
          DRIFT=$(git diff --name-only "$BASE..origin/main" -- \
            content/lexical/words/by-ordinal \
            content/lexical/canonical/senses/shards \
            content/lexical/canonical/collocations/shards \
            content/lexical/relations/by-id \
            content/lexical/relations/manifest.json || true)
          if [ -n "$DRIFT" ]; then
            echo "LEXICAL_SEMANTIC_DRIFT_SINCE_EXECUTION_BASE"
            echo "$DRIFT"
            exit 1
          fi
          echo 'Current semantic drift gate PASS'

      - name: Verify five receipts and exact package accounting
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          windows=['o3625-o3674','o3675-o3724','o3725-o3774','o3775-o3824','o3825-o3874']
          expected_sources={3627,3629,3630,3631,3634,3644,3646,3647,3650,3653,3656,3657,3658,3660,3662,3663,3664,3666,3675,3676,3680,3683,3685,3686,3691,3694,3695,3698,3699,3704,3711,3717,3718,3720,3722,3723,3725,3726,3730,3735,3737,3739,3744,3745,3747,3752,3753,3757,3766,3768,3769,3770,3774,3775,3778,3791,3794,3799,3803,3804,3805,3806,3808,3809,3811,3812,3813,3816,3820,3826,3828,3831,3832,3833,3835,3837,3840,3841,3845,3847,3848,3849,3850,3858,3859,3863,3864,3867,3868,3870,3871}
          expected_remote={3880,7278,7289}
          expected_shards=[(3625,3674),(3675,3724),(3725,3774),(3775,3824),(3825,3874)]
          sources=set(); remote=set(); reviewed=0
          receipts=[]
          for i,w in enumerate(windows):
              p=Path(f'content/lexical/execution/receipts/{w}.json')
              if not p.exists(): raise SystemExit(f'MISSING_RECEIPT:{w}')
              r=json.loads(p.read_text()); receipts.append(r)
              if tuple(r.get('shard',[]))!=expected_shards[i]: raise SystemExit(f'SHARD_SCOPE_MISMATCH:{w}:{r.get("shard")}')
              if r.get('status')!='LOCAL_CLOSED_PENDING_PACKAGE_INTEGRATION': raise SystemExit(f'SHARD_NOT_CLOSED:{w}:{r.get("status")}')
              if r.get('readback',{}).get('all_50_owner_views')!='PASS': raise SystemExit(f'OWNER_READBACK_NOT_PASS:{w}')
              sources.update(int(x) for x in r.get('semantic_source_ordinals',[]))
              remote.update(int(x) for x in r.get('out_of_range_dependency_ordinals',[]))
              reviewed += int(r.get('reviewed_owner_count',0))
          if reviewed!=250: raise SystemExit(f'REVIEWED_COUNT:{reviewed}')
          if sources!=expected_sources: raise SystemExit(f'SOURCE_UNION_MISMATCH:missing={sorted(expected_sources-sources)} extra={sorted(sources-expected_sources)}')
          if remote!=expected_remote: raise SystemExit(f'REMOTE_UNION_MISMATCH:{sorted(remote)}')
          for o in range(3625,3875):
              p=Path(f'content/lexical/words/by-ordinal/o{o:04d}.json')
              if not p.exists(): raise SystemExit(f'MISSING_OWNER:o{o:04d}')
          marker='semantic-reconciliation:o3625-o3874'
          missing_marker=[]
          for o in sorted(expected_sources):
              d=json.loads(Path(f'content/lexical/words/by-ordinal/o{o:04d}.json').read_text())
              if marker not in d.get('record',{}).get('review_signature',[]): missing_marker.append(o)
          if missing_marker: raise SystemExit(f'SOURCE_MARKER_MISSING:{missing_marker}')
          manifest=json.loads(Path('content/lexical/relations/manifest.json').read_text())
          if manifest.get('relation_count')!=383: raise SystemExit(f'RELATION_MANIFEST_COUNT:{manifest.get("relation_count")}')
          print(json.dumps({'reviewed_owners':reviewed,'semantic_source_union':len(sources),'out_of_range_dependencies':sorted(remote),'relation_manifest_count':383,'status':'PASS'},indent=2))
          PY

      - name: Natural Owner registry audit
        run: python tools/lexical_natural_owner.py audit
      - name: Lexical transport guards
        run: python tools/test_lexical_transport_guards.py
      - name: Lexical shard tests
        run: python tools/test_lexical_shard.py
      - name: Parse all Lexical JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          n=0
          for p in Path('content/lexical').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8')); n+=1
          print('parsed',n,'lexical json files')
          PY
      - name: Install static-web dependencies
        run: npm --prefix static-web install --no-audit --no-fund
      - name: Full Astro build
        run: npm --prefix static-web run build

      - name: Write durable package receipt
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          windows=['o3625-o3674','o3675-o3724','o3725-o3774','o3775-o3824','o3825-o3874']
          sources=set(); remote=set(); words=set(); rels=set(); new=set(); react=set(); demote=set()
          for w in windows:
              r=json.loads(Path(f'content/lexical/execution/receipts/{w}.json').read_text())
              sources.update(int(x) for x in r.get('semantic_source_ordinals',[]))
              remote.update(int(x) for x in r.get('out_of_range_dependency_ordinals',[]))
              words.update(int(x) for x in r.get('changed_word_ordinals',[]))
              rels.update(r.get('changed_relation_owner_paths',[]))
              new.update(r.get('new_semantic_branch_ids',[]))
              react.update(r.get('reactivated_stable_ids',[]))
              demote.update(r.get('demoted_stable_ids',[]))
          receipt={
            'schema':'kianos.lexical.forward_package_receipt.v3',
            'status':'VERIFIED_READY_FOR_MAIN',
            'scope':[3625,3874],
            'production_review':'content/lexical/semantic-review/o3625-o3874.md',
            'audit_inputs':['content/lexical/semantic-audit/o3625-o3824.audit.md','content/lexical/semantic-audit/o3825-o4024.audit.md'],
            'authority':'content/lexical/semantic-reconciliation/o3625-o3874.md',
            'semantic_source_union_count':len(sources),
            'exact_word_write_union_count':len(words),
            'out_of_range_dependency_ordinals':sorted(remote),
            'relation_delta_path_count':len(rels),
            'new_semantic_branch_count':len(new),
            'reactivated_stable_count':len(react),
            'demoted_stable_count':len(demote),
            'relation_manifest_count':383,
            'shard_receipts':[f'content/lexical/execution/receipts/{w}.json' for w in windows],
            'checks':{
              'current_semantic_drift_gate':'PASS',
              'five_shard_receipts':'PASS',
              '250_owner_readback':'PASS',
              'exact_91_source_union':'PASS',
              'exact_remote_dependency_union':'PASS',
              'natural_owner_registry_audit':'PASS',
              'transport_guards':'PASS',
              'shard_tests':'PASS',
              'all_lexical_json':'PASS',
              'astro_build':'PASS'
            },
            'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'next_catalog':'o3875+ NOT_ACTIVATED_UNTIL_THIS_PACKAGE_MERGES'
          }
          Path('content/lexical/execution/receipts/o3625-o3874.forward-package.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

      - name: Remove one-time execution transport
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            tools/lexical_apply_forward_o3625_o3674.py \
            tools/lexical_apply_forward_o3675_o3724.py \
            tools/lexical_apply_forward_o3725_o3774.py \
            tools/lexical_apply_forward_o3775_o3824.py \
            tools/lexical_apply_forward_o3825_o3874.py \
            .github/workflows/lexical-execute-o3625-o3674.yml \
            .github/workflows/lexical-execute-o3675-o3724.yml \
            .github/workflows/lexical-execute-o3725-o3774.yml \
            .github/workflows/lexical-execute-o3775-o3824.yml \
            .github/workflows/lexical-execute-o3825-o3874.yml \
            .github/workflows/lexical-o3675-o3724-introspect.yml \
            .github/workflows/lexical-o3725-o3774-introspect.yml \
            .github/workflows/lexical-o3775-o3824-introspect.yml \
            .github/workflows/lexical-o3825-o3874-introspect.yml \
            content/lexical/execution/o3625-o3674.ACTIVE \
            .github/workflows/lexical-verify-o3625-o3874-package.yml
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit verified package receipt and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kian"
          git config user.email "kianwang022@gmail.com"
          git add content/lexical/execution/receipts/o3625-o3874.forward-package.json
          git add -u
          git commit -m "lexical: verify forward package o3625-o3874"
          git push origin HEAD
