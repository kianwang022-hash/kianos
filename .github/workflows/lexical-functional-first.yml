name: Lexical Functional First
on:
  push:
    branches: [main, 'lexical/evidence-runtime-ffv-*']
    paths: ['content/lexical/**','static-web/src/lib/lexical*.mjs','static-web/src/components/Vocabulary*.astro','static-web/src/pages/vocabulary/**','static-web/scripts/*lexical*functional-first*.mjs','static-web/scripts/validate-lexical-evidence-memory.mjs','static-web/package.json','.github/workflows/lexical-functional-first.yml']
  pull_request:
    paths: ['content/lexical/**','static-web/src/lib/lexical*.mjs','static-web/src/components/Vocabulary*.astro','static-web/src/pages/vocabulary/**','static-web/scripts/*lexical*functional-first*.mjs','static-web/scripts/validate-lexical-evidence-memory.mjs','static-web/package.json','.github/workflows/lexical-functional-first.yml']
permissions:
  contents: read
concurrency:
  group: lexical-functional-first-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bounded-ffv:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Astro dependencies
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Verify bounded Evidence / Memory model on accepted fixture
        working-directory: static-web
        run: node scripts/validate-lexical-evidence-memory.mjs
      - name: Build learner projection
        working-directory: static-web
        run: npm run build
      - name: Install isolated browser acceptance tool
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute isolated accepted-fixture learner journey
        working-directory: static-web
        run: node scripts/test-lexical-functional-first-browser.mjs
      - name: Preserve bounded browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexical-functional-first-${{ github.sha }}
          path: lexical-ffv-audit/
          if-no-files-found: warn
          retention-days: 7
