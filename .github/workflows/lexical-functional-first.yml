name: Lexical Functional First
on:
  push:
    branches: [main, 'lexical/evidence-runtime-ffv-*', 'lexical/repair-evidence-current-closure-*', 'lexical/full-catalog-k-reacceptance']
    paths: ['content/lexical/**','static-web/src/lib/lexical*.mjs','static-web/src/components/Vocabulary*.astro','static-web/src/layouts/Base.astro','static-web/src/pages/vocabulary/**','static-web/scripts/*lexical*functional-first*.mjs','static-web/scripts/verify-lexical-full-catalog-k.mjs','static-web/scripts/test-lexical-full-catalog-k-browser.mjs','static-web/scripts/validate-lexical-evidence-memory.mjs','static-web/scripts/validate-lexical-english-handoff.mjs','static-web/scripts/validate-lexical-repair-target-surfaces.mjs','static-web/scripts/test-lexical-english-handoff-browser.mjs','static-web/scripts/test-lexical-form-identity-browser.mjs','static-web/scripts/test-lexical-ledger-word-projection-browser.mjs','static-web/scripts/test-lexical-challenge-resume-browser.mjs','static-web/scripts/test-lexical-content-shape-browser.mjs','static-web/package.json','.github/workflows/lexical-functional-first.yml']
  pull_request:
    paths: ['content/lexical/**','static-web/src/lib/lexical*.mjs','static-web/src/components/Vocabulary*.astro','static-web/src/layouts/Base.astro','static-web/src/pages/vocabulary/**','static-web/scripts/*lexical*functional-first*.mjs','static-web/scripts/verify-lexical-full-catalog-k.mjs','static-web/scripts/test-lexical-full-catalog-k-browser.mjs','static-web/scripts/validate-lexical-evidence-memory.mjs','static-web/scripts/validate-lexical-english-handoff.mjs','static-web/scripts/validate-lexical-repair-target-surfaces.mjs','static-web/scripts/test-lexical-english-handoff-browser.mjs','static-web/scripts/test-lexical-form-identity-browser.mjs','static-web/scripts/test-lexical-ledger-word-projection-browser.mjs','static-web/scripts/test-lexical-challenge-resume-browser.mjs','static-web/scripts/test-lexical-content-shape-browser.mjs','static-web/package.json','.github/workflows/lexical-functional-first.yml']
permissions:
  contents: write
concurrency:
  group: lexical-functional-first-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bounded-ffv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Astro dependencies
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Verify full-catalog K intrinsic integrity and projection fidelity
        working-directory: static-web
        run: node scripts/verify-lexical-full-catalog-k.mjs
      - name: Verify Natural Owner registry and transport integrity
        run: |
          python tools/lexical_natural_owner.py audit
          python tools/test_lexical_transport_guards.py
          python tools/test_lexical_shard.py
      - name: Verify full-catalog Repair target surfaces
        working-directory: static-web
        run: node scripts/validate-lexical-repair-target-surfaces.mjs
      - name: Verify bounded Evidence / Memory model on accepted fixture
        working-directory: static-web
        run: node scripts/validate-lexical-evidence-memory.mjs
      - name: Verify exact English to Lexical evidence bridge
        working-directory: static-web
        run: node scripts/validate-lexical-english-handoff.mjs
      - name: Build learner projection
        working-directory: static-web
        run: npm run build
      - name: Install isolated browser acceptance tool
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute full-catalog representative learner projection proof
        working-directory: static-web
        run: node scripts/test-lexical-full-catalog-k-browser.mjs
      - name: Execute isolated accepted-fixture learner journey
        working-directory: static-web
        run: node scripts/test-lexical-functional-first-browser.mjs
      - name: Execute exact English to Lexical browser journey
        working-directory: static-web
        run: node scripts/test-lexical-english-handoff-browser.mjs
      - name: Execute real form identity browser journey
        working-directory: static-web
        run: node scripts/test-lexical-form-identity-browser.mjs
      - name: Execute ledger to Word UI projection journey
        working-directory: static-web
        run: node scripts/test-lexical-ledger-word-projection-browser.mjs
      - name: Execute Challenge resume browser journey
        working-directory: static-web
        run: node scripts/test-lexical-challenge-resume-browser.mjs
      - name: Execute sparse and rich content-shape journey
        working-directory: static-web
        run: node scripts/test-lexical-content-shape-browser.mjs
      - name: Persist full-catalog K evidence
        if: success() && github.ref == 'refs/heads/lexical/full-catalog-k-reacceptance'
        run: |
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical/acceptance/full-catalog-k-conclusions.json content/lexical/acceptance/full-catalog-k-report.json content/lexical/acceptance/full-catalog-k-browser.json
          if ! git diff --cached --quiet; then
            git commit -m 'lexical: preserve full-catalog K evidence [skip ci]'
            git push origin HEAD:lexical/full-catalog-k-reacceptance
          fi
      - name: Preserve bounded browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexical-functional-first-${{ github.sha }}
          path: lexical-ffv-audit/
          if-no-files-found: warn
          retention-days: 7
