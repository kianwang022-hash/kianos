name: Lexical Functional First
on:
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: lexical-functional-first-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bounded-ffv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Astro dependencies
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Verify full-catalog K intrinsic integrity and projection fidelity
        working-directory: static-web
        run: node scripts/verify-lexical-full-catalog-k.mjs
      - name: Verify Natural Owner registry and transport integrity
        run: |
          python tools/lexical_natural_owner.py audit
          python tools/test_lexical_transport_guards.py
          python tools/test_lexical_shard.py
      - name: Verify full-catalog Repair target surfaces
        working-directory: static-web
        run: node scripts/validate-lexical-repair-target-surfaces.mjs
      - name: Verify bounded Evidence / Memory model on accepted fixture
        working-directory: static-web
        run: node scripts/validate-lexical-evidence-memory.mjs
      - name: Verify Current evidence identity lineage
        working-directory: static-web
        run: node scripts/validate-lexical-evidence-identity-lineage.mjs
      - name: Verify exact English to Lexical evidence bridge
        working-directory: static-web
        run: node scripts/validate-lexical-english-handoff.mjs
      - name: Build learner projection
        working-directory: static-web
        run: npm run build
      - name: Install isolated browser acceptance tool
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute full-catalog representative learner projection proof
        working-directory: static-web
        run: node scripts/test-lexical-full-catalog-k-browser.mjs
      - name: Execute modern same-owner Form boundary proof
        working-directory: static-web
        run: node scripts/test-lexical-full-catalog-form-boundary-browser.mjs
      - name: Execute isolated accepted-fixture learner journey
        working-directory: static-web
        run: node scripts/test-lexical-functional-first-browser.mjs
      - name: Execute exact English to Lexical browser journey
        working-directory: static-web
        run: node scripts/test-lexical-english-handoff-browser.mjs
      - name: Execute real form identity browser journey
        working-directory: static-web
        run: node scripts/test-lexical-form-identity-browser.mjs
      - name: Execute ledger to Word UI projection journey
        working-directory: static-web
        run: node scripts/test-lexical-ledger-word-projection-browser.mjs
      - name: Execute Current evidence identity lineage browser journey
        working-directory: static-web
        run: node scripts/test-lexical-functional-first-identity-lineage-browser.mjs
      - name: Execute Challenge resume browser journey
        working-directory: static-web
        run: node scripts/test-lexical-challenge-resume-browser.mjs
      - name: Execute sparse and rich content-shape journey
        working-directory: static-web
        run: node scripts/test-lexical-content-shape-browser.mjs
      - name: Preserve bounded browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexical-functional-first-${{ github.sha }}
          path: |
            lexical-ffv-audit/
            content/lexical/acceptance/full-catalog-k-browser.json
            content/lexical/acceptance/full-catalog-k-report.json
          if-no-files-found: warn
          retention-days: 7
