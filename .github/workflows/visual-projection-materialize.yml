name: Refine compiled subject presentation
on:
  push:
    branches: ['ui/visual-convergence-20260916']
    paths:
      - 'tools/visual_projection_transfer/**'
      - '.github/workflows/visual-projection-materialize.yml'
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply exact-source presentation refinement
        run: |
          python tools/visual_projection_transfer/apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static-web/src/lib/politicsCompiledPresentation.mjs static-web/src/components/PoliticsProjectionValue.astro static-web/src/components/PoliticsCompiledGeometry.astro static-web/src/components/PoliticsChapterRuntime.astro 'static-web/src/pages/politics/[subject]/[chapter].astro' static-web/src/styles/politics-presentation.css static-web/src/styles/xizong-presentation.css static-web/scripts/audit-politics-xi-projection.mjs static-web/scripts/audit-politics-ethics-projection.mjs static-web/scripts/test-politics-functional-journey.mjs static-web/scripts/test-politics-compiled-presentation.mjs tools/visual_projection_transfer .github/workflows/visual-projection-materialize.yml
          git commit -m 'ui: restore accepted Politics projection geometry and foreground Xizong Recall'
          git push origin HEAD:${{ github.ref_name }}
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p visual-stage-two
          git rev-parse HEAD > visual-stage-two/commit.txt
          git archive --format=tar.gz HEAD > visual-stage-two/inputs.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and screenshot tools
        working-directory: static-web
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npx playwright install --with-deps chromium
      - name: Build candidate and validate exact compiled selectors
        working-directory: static-web
        run: |
          node scripts/test-politics-compiled-presentation.mjs > ../visual-stage-two/compiled-selectors.log
          node scripts/audit-politics-xi-projection.mjs > ../visual-stage-two/xi-projection.log
          node scripts/audit-politics-ethics-projection.mjs > ../visual-stage-two/ethics-projection.log
          npm run build > ../visual-stage-two/build.log 2>&1
      - name: Capture Politics and Xizong candidate
        working-directory: static-web
        run: node scripts/capture-visual-stage-two.mjs
      - name: Capture preserved English and Lexical
        if: always()
        working-directory: static-web
        run: node scripts/capture-visual-stage-one.mjs
      - name: Execute Politics functional journey
        if: always()
        working-directory: static-web
        run: node scripts/test-politics-functional-journey.mjs > ../visual-stage-two/politics-journey.log 2>&1
      - name: Execute Xizong A2 functional journey
        if: always()
        working-directory: static-web
        run: node scripts/test-xizong-a2-functional-journey.mjs > ../visual-stage-two/xizong-journey.log 2>&1
      - name: Preserve candidate and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refined-subjects-${{ env.CANDIDATE_HEAD }}
          path: |
            visual-stage-two/
            visual-evidence/stage1/
            politics-functional-audit/
            xizong-a2-functional-audit/
          retention-days: 7
          if-no-files-found: error
