name: Lexical o3625-o3674 Introspect

on:
  push:
    branches:
      - lexical/forward-o3625-o3874-20260916
    paths:
      - .github/workflows/lexical-o3625-o3674-introspect.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Summarize shard-1 Current owners
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ords=[3627,3629,3630,3631,3634,3644,3646,3647,3650,3653,3656,3657,3658,3660,3662,3663,3664,3666,7278]
          root=Path('content/lexical/words/by-ordinal')
          for o in ords:
              d=json.loads((root/f'o{o:04d}.json').read_text())
              r=d['record']
              print('\n###',o,d['word'])
              print('CORE',json.dumps(r.get('core_concept',{}),ensure_ascii=False,sort_keys=True))
              print('SENSES')
              for s in r.get('senses',[]):
                  print(json.dumps({k:s.get(k) for k in ['sense_id','pos','definition_cn','definition_en','level','governing_pattern','transitivity','usage_note','lexical_identity_overlay']},ensure_ascii=False,sort_keys=True))
                  for c in s.get('collocations',[]): print('  COLL',json.dumps(c,ensure_ascii=False,sort_keys=True))
              print('REFS')
              for s in d.get('reference_senses',[]): print(json.dumps({k:s.get(k) for k in ['stable_sense_id','status','merged_into_sense_id','pos','definition_cn','definition_en']},ensure_ascii=False,sort_keys=True))
              print('CONSTRUCTIONS',json.dumps(r.get('constructions',[]),ensure_ascii=False,sort_keys=True))
              print('RELREFS',json.dumps(d.get('relation_refs',[]),ensure_ascii=False,sort_keys=True))
              print('FORM',json.dumps(r.get('form_identity'),ensure_ascii=False,sort_keys=True))
          PY
