name: Lexical Forward o3375-o3624 v3

on:
  push:
    branches:
      - lexical/forward-o3375-o3624-v3-20260916
    paths:
      - .github/workflows/lexical-forward-o3375-o3624-v3.yml

permissions:
  contents: write

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch candidate and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 4c85edc2911928e20e264bb13d232949bb953984:refs/remotes/origin/verified-forward-candidate
          git fetch origin d27c00375a2e8b1e25c9e406627c0c8b0dc1eb61:refs/remotes/origin/forward-precheckpoint

      - name: Restore authority and executor stack
        shell: bash
        run: |
          set -euo pipefail
          CAND=origin/verified-forward-candidate
          mkdir -p content/lexical/semantic-reconciliation
          git show "$CAND:content/lexical/semantic-reconciliation/o3375-o3624.md" > content/lexical/semantic-reconciliation/o3375-o3624.md
          python - <<'PY'
          from pathlib import Path
          p=Path('content/lexical/semantic-reconciliation/o3375-o3624.md')
          t=p.read_text()
          t=t.replace('Status: **RECONCILED / READY_FOR_BOUNDED_FORWARD_IMPLEMENTATION**','Status: **CURRENT-REVALIDATED / READY_FOR_BOUNDED_FORWARD_IMPLEMENTATION**',1)
          note='''\n## 2026-09-16 Current revalidation\n\nThis package is being executed in the correct forward implementation lane. The earlier Chat routing mistake is provenance only; semantic authority remains the accepted Production review + Independent Audit + Sol reconciliation. The executor starts from current main and preserves any disjoint newer Current rows in shared registry shards. `o3625+` remains not activated.\n\n'''
          t=t.replace('## Frozen inputs\n',note+'## Frozen inputs\n',1)
          p.write_text(t)
          PY
          for s in \
            lexical_apply_retro_o0025_o0224.py \
            lexical_apply_retro_o2425_o2624.py \
            lexical_apply_forward_o3375_o3424.py \
            lexical_apply_forward_o3425_o3474.py \
            lexical_apply_forward_o3475_o3524.py \
            lexical_apply_forward_o3525_o3574.py \
            lexical_apply_forward_o3575_o3624.py; do
            git show "$CAND:tools/$s" > "tools/$s"
          done

      - name: Owner-level prestate gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          CAND='origin/verified-forward-candidate'; PRE='origin/forward-precheckpoint'
          WINDOWS=['o3375-o3424','o3425-o3474','o3475-o3524','o3525-o3574','o3575-o3624']
          def sh(*a): return subprocess.check_output(['git',*a],text=True).strip()
          def show(ref,p): return sh('show',f'{ref}:{p}')
          def exists(ref,p): return subprocess.run(['git','cat-file','-e',f'{ref}:{p}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
          changed=set(); relpaths=set()
          for w in WINDOWS:
              r=json.loads(show(CAND,f'content/lexical/execution/receipts/{w}.json'))
              changed|={int(x) for x in r.get('changed_word_ordinals',[])}
              relpaths|=set(r.get('changed_relation_owner_paths',[]))
          owners=set(range(3375,3625))|changed
          bad=[]
          for o in sorted(owners):
              p=f'content/lexical/words/by-ordinal/o{o:04d}.json'
              if not exists(PRE,p) or not Path(p).exists() or json.loads(show(PRE,p))!=json.loads(Path(p).read_text()): bad.append(p)
          # Existing relation owners touched by package must match prestate; new relation paths may be absent.
          for p in sorted(relpaths):
              pre=exists(PRE,p); cur=Path(p).exists()
              if pre!=cur:
                  bad.append(p); continue
              if pre and json.loads(show(PRE,p))!=json.loads(Path(p).read_text()): bad.append(p)
          # Shared identity registries: compare only rows anchored to exact package/dependency owners.
          target_ords=owners
          for p in sh('diff','--name-only',f'{PRE}..{CAND}','--','content/lexical/canonical/senses/shards','content/lexical/canonical/collocations/shards').splitlines():
              if not p: continue
              pre_rows=json.loads(show(PRE,p)); cur_rows=json.loads(Path(p).read_text())
              def keyed(rows,kind):
                  out={}
                  for row in rows:
                      o=row.get('anchor_ordinal')
                      if o not in target_ords: continue
                      rec=row.get('record',{})
                      key=rec.get('stable_sense_id') if kind=='sense' else rec.get('collocation_id')
                      if key: out[key]=row
                  return out
              kind='sense' if '/senses/' in p else 'collocation'
              if keyed(pre_rows,kind)!=keyed(cur_rows,kind): bad.append(p+':target_rows')
          # Relation manifest must retain lawful pre-forward count.
          pm=json.loads(show(PRE,'content/lexical/relations/manifest.json'))
          cm=json.loads(Path('content/lexical/relations/manifest.json').read_text())
          if pm.get('relation_count')!=cm.get('relation_count'): bad.append('content/lexical/relations/manifest.json:relation_count')
          if bad: raise SystemExit('FORWARD_OWNER_PRESTATE_DRIFT:'+json.dumps(sorted(set(bad)),ensure_ascii=False))
          print(json.dumps({'package_owners':250,'exact_word_targets_including_dependencies':len(owners),'owner_level_prestate':'PASS'},indent=2))
          PY

      - name: Replay five bounded shards
        shell: bash
        run: |
          set -euo pipefail
          for s in lexical_apply_forward_o3375_o3424.py lexical_apply_forward_o3425_o3474.py lexical_apply_forward_o3475_o3524.py lexical_apply_forward_o3525_o3574.py lexical_apply_forward_o3575_o3624.py; do
            echo "==> $s"
            python "tools/$s"
          done

      - name: Verify final owner truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          CAND='origin/verified-forward-candidate'; PRE='origin/forward-precheckpoint'
          WINDOWS=['o3375-o3424','o3425-o3474','o3475-o3524','o3525-o3574','o3575-o3624']
          def sh(*a): return subprocess.check_output(['git',*a],text=True).strip()
          def show(ref,p): return sh('show',f'{ref}:{p}')
          changed=set()
          for w in WINDOWS:
              r=json.loads(Path(f'content/lexical/execution/receipts/{w}.json').read_text())
              changed|={int(x) for x in r.get('changed_word_ordinals',[])}
          owners=set(range(3375,3625))|changed
          for o in sorted(owners):
              p=f'content/lexical/words/by-ordinal/o{o:04d}.json'
              if json.loads(Path(p).read_text())!=json.loads(show(CAND,p)): raise SystemExit(f'FINAL_WORD_MISMATCH:{p}')
          # For shared registries, candidate-changed target rows must match candidate; disjoint newer rows are preserved.
          for p in sh('diff','--name-only',f'{PRE}..{CAND}','--','content/lexical/canonical/senses/shards','content/lexical/canonical/collocations/shards').splitlines():
              if not p: continue
              cand=json.loads(show(CAND,p)); cur=json.loads(Path(p).read_text())
              kind='sense' if '/senses/' in p else 'collocation'
              def keyed(rows):
                  out={}
                  for row in rows:
                      if row.get('anchor_ordinal') not in owners: continue
                      rec=row.get('record',{})
                      key=rec.get('stable_sense_id') if kind=='sense' else rec.get('collocation_id')
                      if key: out[key]=row
                  return out
              if keyed(cand)!=keyed(cur): raise SystemExit(f'FINAL_REGISTRY_TARGET_ROW_MISMATCH:{p}')
          print(json.dumps({'final_word_owners_verified':len(owners),'shared_registry_target_rows':'PASS'},indent=2))
          PY

      - name: Natural Owner audit
        run: python tools/lexical_natural_owner.py audit
      - name: Transport guards
        run: python tools/test_lexical_transport_guards.py
      - name: Shard tests
        run: python tools/test_lexical_shard.py
      - name: Parse all Lexical JSON
        run: python - <<'PY'
          import json
          from pathlib import Path
          n=0
          for p in Path('content/lexical').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8')); n+=1
          print('parsed',n,'json files')
          PY
      - name: Install static-web dependencies
        run: npm --prefix static-web install --no-audit --no-fund
      - name: Astro build
        run: npm --prefix static-web run build

      - name: Write package receipt
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          windows=['o3375-o3424','o3425-o3474','o3475-o3524','o3525-o3574','o3575-o3624']
          changed=set(); remote=set(); new=set(); react=set(); rel=set()
          for w in windows:
              r=json.loads(Path(f'content/lexical/execution/receipts/{w}.json').read_text())
              changed|={int(x) for x in r.get('changed_word_ordinals',[])}
              remote|={int(x) for x in r.get('out_of_range_dependency_ordinals',[])}
              new|=set(r.get('new_semantic_branch_ids',[])); react|=set(r.get('reactivated_stable_ids',[])); rel|=set(r.get('changed_relation_owner_paths',[]))
          out={'schema':'kianos.lexical.forward_package_receipt.v3','status':'VERIFIED_READY_FOR_MAIN','scope':[3375,3624],
               'production_review':'content/lexical/semantic-review/o3375-o3624.md','audit_inputs':['content/lexical/semantic-audit/o3225-o3424.audit.md','content/lexical/semantic-audit/o3425-o3624.audit.md'],
               'authority':'content/lexical/semantic-reconciliation/o3375-o3624.md','semantic_source_union_count':92,'exact_word_write_union':len(changed),
               'out_of_range_dependency_ordinals':sorted(remote),'relation_delta_path_count':len(rel),'new_semantic_branch_count':len(new),'reactivated_stable_count':len(react),
               'checks':{'owner_level_current_gate':'PASS','five_shard_replay':'PASS','final_owner_truth':'PASS','natural_owner_audit':'PASS','transport_guards':'PASS','shard_tests':'PASS','all_json':'PASS','astro_build':'PASS'},
               'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'next_catalog':'o3625+ NOT_ACTIVATED'}
          Path('content/lexical/execution/receipts/o3375-o3624.forward-package.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Remove executor transport and commit
        shell: bash
        run: |
          set -euo pipefail
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          for f in tools/lexical_apply_retro_o0025_o0224.py tools/lexical_apply_retro_o2425_o2624.py tools/lexical_apply_forward_o3375_o3424.py tools/lexical_apply_forward_o3425_o3474.py tools/lexical_apply_forward_o3475_o3524.py tools/lexical_apply_forward_o3525_o3574.py tools/lexical_apply_forward_o3575_o3624.py; do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then git show "HEAD:$f" > "$f"; else rm -f "$f"; fi
          done
          git config user.name "Kian"
          git config user.email "kianwang022@gmail.com"
          git add content/lexical
          git diff --cached --quiet && { echo 'No content changes'; exit 1; }
          git commit -m "lexical: integrate forward package o3375-o3624"
          git push origin HEAD
