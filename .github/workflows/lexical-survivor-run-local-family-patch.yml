name: Lexical survivor patch local family anchors

on:
  push:
    branches:
      - lexical/execute-o3875-o4124-20260916
    paths:
      - content/lexical/execution/o4025-o4124.RUN_LOCAL_FAMILY_PATCH

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch executor local family anchors
        shell: bash
        run: |
          set -euo pipefail
          python tools/lexical_patch_o4025_o4124_local_family_anchors.py
          python -m py_compile tools/lexical_apply_forward_o3875_o4124_remaining.py
          git config user.name "Kian"
          git config user.email "kianwang022@gmail.com"
          git add tools/lexical_apply_forward_o3875_o4124_remaining.py
          git diff --cached --quiet && { echo NO_LOCAL_FAMILY_PATCH_DIFF; exit 1; }
          git commit -m "lexical: patch local family execution anchors"
          git push origin HEAD:lexical/execute-o3875-o4124-20260916
