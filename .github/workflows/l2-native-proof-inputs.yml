name: L2 Native Retirement Conflict Proof
on:
  push:
    branches: [work/l2-english-native-closure-20260921]
    paths: [.github/workflows/l2-native-proof-inputs.yml]
permissions:
  contents: write
jobs:
  retirement-conflict:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce and verify exact native equal-revision correction
        run: |
          python3 - <<'PY'
          import pathlib,subprocess
          root=pathlib.Path('.')
          evi=root/'static-web/src/lib/englishLearnerEvidence.mjs'
          test=root/'static-web/scripts/validate-english-native-closure.mjs'
          blob=lambda p:subprocess.check_output(['git','hash-object',str(p)]).decode().strip()
          assert blob(evi)=='456828cd16005b064b7f24789f8552cd346d070d'
          assert blob(test)=='bb1358e402f709ce0b89a0997691bf81709e6f4e'
          evi.write_text(evi.read_text().replace('binding.revision>row.archived_revision','binding.revision>=row.archived_revision'))
          case="""test('equal-revision divergent local draft is not retired by a backup archive',()=>{
           const key='kianos-reading-attempt-v1:fork',archiveKey='kianos-english-attempt-archive-v1:fork-attempt';
           const archived={answers:{q1:'A'},binding:{task:'reading_a',object_id:'fork',source_hash:'h',attempt_id:'fork-attempt',revision:4}};
           const local=clone(archived);local.answers.q1='B';const raw=JSON.stringify(local),storage=new MemoryStorage({[key]:raw});
           evidence.restoreEnglishCheckpoint(storage,{schema:'kianos.english.private-payload.v1',entries:{[archiveKey]:JSON.stringify(archived)}});
           assert.equal(storage.getItem(key),raw);
          });
          """
          test.write_text(test.read_text().replace('const report={basis:',case+'const report={basis:'))
          assert blob(evi)=='d6c89197605256abeca5bf8dcc85b6751b621eb1'
          assert blob(test)=='ccf996f58bb284912338852ce66c76bd43511b95'
          PY
          node static-web/scripts/validate-english-native-closure.mjs > l2-native-70.json
          node static-web/scripts/validate-english-evidence-fidelity-e4.mjs > l2-e4.json
          node static-web/scripts/validate-english-forecast-model.mjs > l2-forecast.json
      - name: Publish only the two verified native blobs without changing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,base64,os,pathlib,urllib.request
          rows=[('static-web/src/lib/englishLearnerEvidence.mjs','d6c89197605256abeca5bf8dcc85b6751b621eb1'),('static-web/scripts/validate-english-native-closure.mjs','ccf996f58bb284912338852ce66c76bd43511b95')]
          for path,sha in rows:
              data=json.dumps({'content':base64.b64encode(pathlib.Path(path).read_bytes()).decode(),'encoding':'base64'}).encode()
              req=urllib.request.Request('https://api.github.com/repos/kianwang022-hash/kianos/git/blobs',data=data,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:result=json.load(response)
              assert result['sha']==sha
              print(path+' '+sha)
          pathlib.Path('l2-verified-retirement-blobs.json').write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l2-retirement-proof-${{ github.sha }}
          retention-days: 7
          path: |
            l2-native-70.json
            l2-e4.json
            l2-forecast.json
            l2-verified-retirement-blobs.json
            static-web/src/lib/englishLearnerEvidence.mjs
            static-web/scripts/validate-english-native-closure.mjs
