name: Governance Anti-Entropy

on:
  push:
    paths:
      - 'PROJECT_DEFINITION.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'CURRENT.md'
      - 'GOVERNANCE_ACCEPTANCE.md'
      - 'SYSTEM_CONTRACT.md'
      - 'static-web/CURRENT.md'
      - 'content/**/CURRENT.md'
      - 'content/**/ACCEPTANCE.md'
      - 'content/**/manifest.json'
      - 'content/**/continuation.json'
      - 'content/**/acceptance-status.json'
      - 'tools/governance_current_audit.py'
      - '.github/workflows/governance-anti-entropy.yml'
  pull_request:
    paths:
      - 'PROJECT_DEFINITION.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'CURRENT.md'
      - 'GOVERNANCE_ACCEPTANCE.md'
      - 'SYSTEM_CONTRACT.md'
      - 'static-web/CURRENT.md'
      - 'content/**/CURRENT.md'
      - 'content/**/ACCEPTANCE.md'
      - 'content/**/manifest.json'
      - 'content/**/continuation.json'
      - 'content/**/acceptance-status.json'
      - 'tools/governance_current_audit.py'
      - '.github/workflows/governance-anti-entropy.yml'

permissions:
  contents: read

concurrency:
  group: governance-anti-entropy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-ownership-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Current ownership and retirement boundaries
        run: python tools/governance_current_audit.py
