name: Xizong A1 Retire Legacy Lecture Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xizong-a1-r-retire-legacy-lecture-gate.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retire redundant Block lecture confirmation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          def rw(path, fn):
              p = Path(path)
              before = p.read_text(encoding='utf-8')
              after = fn(before)
              if after == before:
                  raise SystemExit(f'NO_CHANGE:{path}')
              p.write_text(after, encoding='utf-8')
              changed.append(path)

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}:count={count}')
              return text.replace(old, new, 1)

          def study(text):
              text = once(text, "\n".join([
                  '  <div class="xv6DockLecture">',
                  '    <button type="button" data-lecture-read aria-pressed="false">原讲义一轮 · 未确认</button>',
                  '    <small>在 iPad / MarginNote 连续完成本 Block 原讲义学习后再确认；网页 Core 只作需要时参考。</small>',
                  '  </div>',
                  '',
              ]), '', 'study:remove-legacy-lecture-dock')
              text = once(text, '    let personal = { lectureRead: false, kp: {} };', '    let personal = { kp: {} };', 'study:personal-shape')
              text = once(text, "    const lectureButton = dock.querySelector('[data-lecture-read]');\n", '', 'study:lecture-button-var')
              text = once(text, "\n".join([
                  '      button.disabled = !personal.lectureRead || !coreReady || Boolean(study.completed);',
                  "      button.title = personal.lectureRead ? '' : '先在 iPad / MarginNote 确认本 Block 原讲义已完成一轮';",
              ]), "\n".join([
                  '      button.disabled = !coreReady || Boolean(study.completed);',
                  "      button.title = '';",
              ]), 'study:completion-gate')
              text = once(text, "\n".join([
                  '      if (lectureButton) {',
                  "        lectureButton.setAttribute('aria-pressed', String(Boolean(personal.lectureRead)));",
                  "        lectureButton.textContent = personal.lectureRead ? '原讲义一轮 · 已确认' : '原讲义一轮 · 未确认';",
                  "        lectureButton.classList.toggle('active', Boolean(personal.lectureRead));",
                  '      }',
              ]) + '\n', '', 'study:render-legacy-lecture')
              text = once(text, "    lectureButton?.addEventListener('click', () => { personal.lectureRead = !personal.lectureRead; savePersonal(); renderDock(); });\n", '', 'study:legacy-click')
              text = once(text, "      if (key === 'l') { event.preventDefault(); lectureButton?.click(); }\n", '', 'study:legacy-key')
              css = '.xv6DockLecture{display:grid;gap:3px}.xv6DockLecture button{min-height:28px;border:1px solid var(--study-line);border-radius:7px;background:#fff;color:var(--study-green);font-size:9px;font-weight:800}.xv6DockLecture button.active{border-color:var(--study-green);background:var(--study-green-soft)}.xv6DockLecture small{color:var(--study-faint);font-size:8px;line-height:1.35}'
              text = once(text, css, '', 'study:legacy-css')
              if 'lectureRead' in text or 'data-lecture-read' in text:
                  raise SystemExit('study:legacy-lecture-reference-remains')
              return text

          def guard(text):
              personal_reader = "\n".join([
                  '  const readBlockPersonal = (id) => {',
                  '    if (!id) return {};',
                  '    try {',
                  "      return JSON.parse(localStorage.getItem(`kianos-xizong-personal-v1:xizong:${id}`) || 'null') || {};",
                  '    } catch {',
                  '      return {};',
                  '    }',
                  '  };',
                  '',
              ])
              text = once(text, personal_reader, '', 'guard:personal-reader')
              text = once(text, '      const personal = readBlockPersonal(blockId);\n', '', 'guard:personal-read')
              old = "\n".join([
                  "        if (requested === 'block_complete') {",
                  '          const ready = Boolean(personal?.lectureRead) && counts.total > 0 && counts.learned >= counts.total && counts.recalled >= counts.total && Boolean(state?.blockRecallDone);',
                  '          if (!ready) {',
                  '            stop(event);',
                  '            setBlockStatus(root, !personal?.lectureRead',
                  "              ? 'Block 完成证据还缺原讲义一轮确认'",
                  '              : `Block 完成证据未闭合（学习接触 ${counts.learned}/${counts.total} · Recall ${counts.recalled}/${counts.total} · Block Recall ${state?.blockRecallDone ? \'完成\' : \'未完成\'}）`);',
                  '            return;',
                  '          }',
                  '        }',
              ])
              new = "\n".join([
                  "        if (requested === 'block_complete') {",
                  '          const ready = counts.total > 0 && counts.learned >= counts.total && counts.recalled >= counts.total && Boolean(state?.blockRecallDone);',
                  '          if (!ready) {',
                  '            stop(event);',
                  '            setBlockStatus(root, `Block 完成证据未闭合（学习接触 ${counts.learned}/${counts.total} · Recall ${counts.recalled}/${counts.total} · Block Recall ${state?.blockRecallDone ? \'完成\' : \'未完成\'}）`);',
                  '            return;',
                  '          }',
                  '        }',
              ])
              text = once(text, old, new, 'guard:stage-block-complete')
              old = "\n".join([
                  "      const blockComplete = target.closest('[data-block-complete]');",
                  '      if (blockComplete) {',
                  '        const ready = Boolean(personal?.lectureRead) && counts.total > 0 && counts.learned >= counts.total && counts.recalled >= counts.total && Boolean(state?.blockRecallDone);',
                  '        if (!ready) {',
                  '          stop(event);',
                  '          setBlockStatus(root, !personal?.lectureRead',
                  "            ? 'Block 完成证据还缺原讲义一轮确认'",
                  '            : `Block 完成证据未闭合（学习接触 ${counts.learned}/${counts.total} · Recall ${counts.recalled}/${counts.total} · Block Recall ${state?.blockRecallDone ? \'完成\' : \'未完成\'}）`);',
                  '          return;',
                  '        }',
                  '      }',
              ])
              new = "\n".join([
                  "      const blockComplete = target.closest('[data-block-complete]');",
                  '      if (blockComplete) {',
                  '        const ready = counts.total > 0 && counts.learned >= counts.total && counts.recalled >= counts.total && Boolean(state?.blockRecallDone);',
                  '        if (!ready) {',
                  '          stop(event);',
                  '          setBlockStatus(root, `Block 完成证据未闭合（学习接触 ${counts.learned}/${counts.total} · Recall ${counts.recalled}/${counts.total} · Block Recall ${state?.blockRecallDone ? \'完成\' : \'未完成\'}）`);',
                  '          return;',
                  '        }',
                  '      }',
              ])
              text = once(text, old, new, 'guard:click-block-complete')
              if 'lectureRead' in text or 'readBlockPersonal' in text:
                  raise SystemExit('guard:legacy-personal-gate-remains')
              return text

          def browser(text):
              text = once(text, "  const personalKey = 'kianos-xizong-personal-v1:xizong:circulation-b02';\n", '', 'browser:personal-key')
              old = "\n".join([
                  '  // Block completion requires Block Recall + Block-level original Lecture confirmation.',
                  '  await cdp.evaluate(clickExpr(\'[data-stage-target="block_complete"]\'));',
                  "  check(await cdp.evaluate(visibleStageExpr) === 'block_recall', 'block_complete_before_block_recall_rejected');",
                  "  await cdp.evaluate(clickExpr('[data-block-recall-complete]'));",
                  "  check(await cdp.evaluate(visibleStageExpr) === 'block_complete', 'block_recall_completion_advances_to_close');",
                  "  check(await cdp.evaluate(`document.querySelector('[data-block-complete]')?.disabled === true`), 'lecture_confirmation_keeps_block_completion_locked');",
                  "  await cdp.evaluate(clickExpr('[data-lecture-read]'));",
                  '  await sleep(80);',
                  "  check(await cdp.evaluate(`document.querySelector('[data-block-complete]')?.disabled === false`), 'lecture_confirmation_unlocks_block_completion');",
                  "  await cdp.evaluate(clickExpr('[data-block-complete]'));",
                  "  state = await cdp.evaluate(`JSON.parse(localStorage.getItem(${js(studyKey)})||'null')`);",
                  "  check(state?.completed === true, 'block_completion_persists');",
                  "  check((await cdp.evaluate(`JSON.parse(localStorage.getItem(${js(personalKey)})||'null')`))?.lectureRead === true, 'lecture_confirmation_persists');",
              ])
              new = "\n".join([
                  '  // Block completion requires formal contact for every KP + every KP Recall + Block Recall.',
                  '  await cdp.evaluate(clickExpr(\'[data-stage-target="block_complete"]\'));',
                  "  check(await cdp.evaluate(visibleStageExpr) === 'block_recall', 'block_complete_before_block_recall_rejected');",
                  "  await cdp.evaluate(clickExpr('[data-block-recall-complete]'));",
                  "  check(await cdp.evaluate(visibleStageExpr) === 'block_complete', 'block_recall_completion_advances_to_close');",
                  "  check(await cdp.evaluate(`document.querySelector('[data-lecture-read]') === null`), 'legacy_block_lecture_confirmation_removed');",
                  "  check(await cdp.evaluate(`document.querySelector('[data-block-complete]')?.disabled === false`), 'formal_contact_recall_and_block_recall_unlock_completion');",
                  "  await cdp.evaluate(clickExpr('[data-block-complete]'));",
                  "  state = await cdp.evaluate(`JSON.parse(localStorage.getItem(${js(studyKey)})||'null')`);",
                  "  check(state?.completed === true, 'block_completion_persists');",
              ])
              return once(text, old, new, 'browser:completion-journey')

          def functional(text):
              text = once(text,
                  "assert(blockRuntime.includes('const groupPosition = groupKpIds.indexOf(currentKpId);'), 'runtime-local-position-does-not-use-group-membership');\nassert(blockRuntime.includes('const atGroupEnd = groupPosition >= 0 && groupPosition === groupKpIds.length - 1;'), 'runtime-group-close-does-not-use-group-membership');",
                  "assert(blockRuntime.includes(\"const firstMissingId = ids.find((id) => !state.ratings?.[id]);\"), 'runtime-group-close-does-not-check-missing-recall');\nassert(blockRuntime.includes(\"window.setTimeout(() => setStage('group_close'), 120);\"), 'runtime-group-close-transition-missing');",
                  'functional:group-close-contract')
              old = "\n".join([
                  '// Completion evidence must be enforced at the transition owner, not merely by',
                  '// a disabled-looking companion button. Lecture completion is browser evidence.',
                  "const stageGuard = read('static-web/src/components/XizongRuntimeStageGuard.astro');",
                  "assert(stageGuard.includes('const readBlockPersonal = (id) =>'), 'block-complete-has-no-personal-evidence-reader');",
                  "assert(stageGuard.includes(\"target.closest('[data-block-complete]')\"), 'block-complete-transition-not-guarded');",
                  "assert(stageGuard.includes('Boolean(personal?.lectureRead)'), 'block-complete-does-not-require-lecture-evidence');",
                  "assert(stageGuard.includes('Boolean(state?.blockRecallDone)'), 'block-complete-does-not-require-block-recall-evidence');",
              ])
              new = "\n".join([
                  '// Completion evidence is enforced at the transition owner. Logic Group lecture contact',
                  '// already records formal KP contact, so no second Block-level lecture checkbox is required.',
                  "const stageGuard = read('static-web/src/components/XizongRuntimeStageGuard.astro');",
                  "assert(!stageGuard.includes('readBlockPersonal'), 'legacy-block-personal-reader-remains');",
                  "assert(!stageGuard.includes('personal?.lectureRead'), 'legacy-block-lecture-confirmation-remains');",
                  "assert(stageGuard.includes(\"target.closest('[data-block-complete]')\"), 'block-complete-transition-not-guarded');",
                  "assert(stageGuard.includes('counts.learned >= counts.total'), 'block-complete-does-not-require-formal-contact');",
                  "assert(stageGuard.includes('counts.recalled >= counts.total'), 'block-complete-does-not-require-kp-recall');",
                  "assert(stageGuard.includes('Boolean(state?.blockRecallDone)'), 'block-complete-does-not-require-block-recall-evidence');",
              ])
              text = once(text, old, new, 'functional:block-complete-contract')
              return once(text, 'BlockComplete=lecture+learn+recall+block-recall-fail-closed', 'BlockComplete=formal-contact+recall+block-recall-fail-closed', 'functional:summary')

          def runtime_validator(text, prefix):
              text = once(text,
                  'const canCloseBlock = (state, totalKp, lectureRead) => canRecordBlockRecall(state, totalKp) && Boolean(state?.blockRecallDone) && Boolean(lectureRead);',
                  'const canCloseBlock = (state, totalKp) => canRecordBlockRecall(state, totalKp) && Boolean(state?.blockRecallDone);',
                  f'{prefix}:can-close')
              if prefix == 'a2':
                  text = once(text, "\n".join([
                      'state.blockRecallDone = true;',
                      "assert(!canCloseBlock(state, totalFirstKp, false), 'block-close-without-lecture');",
                      "assert(canCloseBlock(state, totalFirstKp, true), 'clean-block-cannot-close');",
                  ]), "\n".join([
                      "assert(!canCloseBlock(state, totalFirstKp), 'block-close-before-block-recall');",
                      'state.blockRecallDone = true;',
                      "assert(canCloseBlock(state, totalFirstKp), 'clean-block-cannot-close');",
                  ]), 'a2:block-close')
                  oldgate = "matches(enhancerUi, /!personal\\.lectureRead\\s*\\|\\|\\s*!coreReady/, 'lecture-close-gate');"
              else:
                  text = once(text, "\n".join([
                      'state.blockRecallDone = true;',
                      "assert(!canCloseBlock(state, kpIds.length, false), 'block-close-without-original-lecture');",
                      "assert(canCloseBlock(state, kpIds.length, true), 'clean-block-cannot-close');",
                  ]), "\n".join([
                      "assert(!canCloseBlock(state, kpIds.length), 'block-close-before-block-recall');",
                      'state.blockRecallDone = true;',
                      "assert(canCloseBlock(state, kpIds.length), 'clean-block-cannot-close');",
                  ]), 'a3:block-close')
                  oldgate = "matches(enhancerUi, /!personal\\.lectureRead\\s*\\|\\|\\s*!coreReady/, 'original-lecture-close-gate');"
              newgate = "has(enhancerUi, 'button.disabled = !coreReady || Boolean(study.completed);', 'block-completion-ui-gate');\nassert(!enhancerUi.includes('lectureRead'), 'legacy-block-lecture-confirmation-remains');"
              return once(text, oldgate, newgate, f'{prefix}:enhancer-gate')

          rw('static-web/src/components/XizongStudyEnhancer.astro', study)
          rw('static-web/src/components/XizongRuntimeStageGuard.astro', guard)
          rw('static-web/scripts/test-xizong-a1-browser-journey.mjs', browser)
          rw('static-web/scripts/validate-xizong-functional-first.mjs', functional)
          rw('static-web/scripts/validate-xizong-a2-runtime.mjs', lambda t: runtime_validator(t, 'a2'))
          rw('static-web/scripts/validate-xizong-a3-runtime.mjs', lambda t: runtime_validator(t, 'a3'))
          print('\n'.join(changed))
          PY
      - name: Fail closed on write set
        shell: bash
        run: |
          git config core.quotePath false
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 6
          for path in \
            static-web/src/components/XizongStudyEnhancer.astro \
            static-web/src/components/XizongRuntimeStageGuard.astro \
            static-web/scripts/test-xizong-a1-browser-journey.mjs \
            static-web/scripts/validate-xizong-functional-first.mjs \
            static-web/scripts/validate-xizong-a2-runtime.mjs \
            static-web/scripts/validate-xizong-a3-runtime.mjs; do
            printf '%s\n' "${changed[@]}" | grep -Fx "$path"
          done
      - name: Commit bounded Runtime repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            static-web/src/components/XizongStudyEnhancer.astro \
            static-web/src/components/XizongRuntimeStageGuard.astro \
            static-web/scripts/test-xizong-a1-browser-journey.mjs \
            static-web/scripts/validate-xizong-functional-first.mjs \
            static-web/scripts/validate-xizong-a2-runtime.mjs \
            static-web/scripts/validate-xizong-a3-runtime.mjs
          git commit -m 'xizong: retire redundant Block lecture confirmation'
          git pull --rebase origin main
          git push origin HEAD:main
