name: Politics Xi Runtime Journey

on:
  pull_request:
    paths:
      - 'content/politics/**'
      - 'static-web/src/components/Politics*.astro'
      - 'static-web/src/lib/politics*.mjs'
      - 'static-web/src/pages/politics/**'
      - 'static-web/scripts/test-politics-xi-runtime.mjs'
      - '.github/workflows/static-web-politics-xi-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: politics-xi-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Validate Politics runtime
        working-directory: static-web
        run: npm run validate:politics
      - name: Build Current site
        working-directory: static-web
        run: npm run build
      - name: Install browser acceptance tool
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute Xi Runtime journey
        working-directory: static-web
        run: node scripts/test-politics-xi-runtime.mjs
      - name: Save Xi Runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: politics-xi-runtime-${{ github.sha }}
          path: politics-xi-runtime-audit/
          retention-days: 7
