name: Lexical vNext Wave03 Apply Shard02

on:
  push:
    branches:
      - lexical/vnext-wave03-o0025-o0124

permissions:
  contents: write

concurrency:
  group: lexical-vnext-wave03-shard02
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stop if shard already applied
        id: guard
        shell: bash
        run: |
          [[ -f content/lexical/audit/vnext-content-execution/wave03-shard02-o0065-o0124-receipt.json ]] && echo 'done=true' >> "$GITHUB_OUTPUT" || echo 'done=false' >> "$GITHUB_OUTPUT"
      - name: Direct-close o0065-o0124 from Current truth
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          W=Path('content/lexical/words/by-ordinal'); O=Path('content/lexical/audit/vnext-content-execution'); O.mkdir(parents=True,exist_ok=True)
          B='vnext-wave03-shard02-o0065-o0124'
          safe={67,69,73,74,81,83,84,90,94,98,101,108,109,110,111,121,122}
          upgraded={68,72,76,85,86,87,93,95,96,103,104,106,123}
          def p(n): return W/f'o{n:04d}.json'
          def load(n): return json.loads(p(n).read_text())
          def save(n,d): p(n).write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          def ss(d): return d['record']['senses']
          def C(i,l,cn,pat,dir='R+P'): return {'construction_id':i,'direction':dir,'level':l,'meaning_cn':cn,'pattern':pat}
          def core(d,cn,en,mcn,men,groups=None):
              c=d['record']['core_concept']; c.update(core_meaning_cn=cn,core_meaning_en=en,mental_model_cn=mcn,mental_model_en=men)
              if groups is not None: c['core_clusters']=[{'label_cn':a,'label_en':b,'pos':q,'sense_ids':ids} for a,b,q,ids in groups]
          def mark(d,n,semantic=True):
              d['record']['needs_delta_review']=False
              q=d.setdefault('provenance',{}); q['vnext_content_batch']=B; q['vnext_content_judgment']='fresh_current_readback'
              if semantic: q['semantic_delta']=max(1,int(q.get('semantic_delta') or 0))
          def promote(d,needle,level,cn,en,label,pos=None,trans='nonverb',pattern='',usage=None):
              refs=d.get('reference_senses',[]); ix=None
              for i,r in enumerate(refs):
                  if needle.lower() in (((r.get('definition_en') or '')+' '+(r.get('definition_cn') or '')).lower()): ix=i; break
              if ix is None: raise RuntimeError(f'REF_NOT_FOUND:{d["word"]}:{needle}')
              r=refs.pop(ix); sid=r['stable_sense_id']; item={'collocations':[],'confidence':'high','definition_cn':cn,'definition_en':en,'governing_pattern':pattern,'level':level,'needs_human_review':0,'pos':pos or r.get('pos'),'sense_id':sid,'sense_label_en':label,'sort_order':len(ss(d)),'transitivity':trans}
              if usage: item['usage_note']=usage
              ss(d).append(item)
              for x in d.get('identity_refs',{}).get('senses',[]):
                  if x.get('sense_id')==sid: x['status']='active'; x['merged_into_sense_id']=None
              return sid

          # 68 addition — promote fixed additive phrases to first-class Expansion.
          d=load(68); ids=[x['sense_id'] for x in ss(d)]
          core(d,'“加进来”的名词结果：增加这一动作、后来加进来的部分，以及数学加法。','the noun space of adding: the act of adding, an added item, or mathematical addition','in addition＝另外；in addition to＝除了……还；a new addition＝新增的人/物；数学 addition 后置。','route additive discourse first, then added item, then math', [('增加；补充','act of adding','noun',[ids[0]]),('新增的人或物','added person or thing','noun',[ids[1]]),('加法','mathematical addition','noun',[ids[2]])])
          d['record']['constructions']=[C('construction:68addition0001','L1','另外；此外','in addition'),C('construction:68addition0002','L1','除……之外还……','in addition to + noun/doing'),C('construction:68addition0003','L2','新增的人或物','a new addition to + group/place')]
          for s in ss(d): s['confidence']='high'
          mark(d,68); save(68,d)

          # 72 adhere — one literal/metaphorical STICK-TO model.
          d=load(72); ids=[x['sense_id'] for x in ss(d)]
          core(d,'核心是“牢牢贴在……上”：可物理附着，也可抽象地坚持规则、计划、信念或阵营。','stick firmly to something, literally on a surface or figuratively to a rule, plan, belief, or allegiance','adhere to surface＝粘住；adhere to rules/plan＝遵守坚持；adhere to a belief/cause＝拥护。','use the object after to to choose physical sticking, compliance, or allegiance',[('粘附','stick to a surface','verb',[ids[0]]),('遵守；坚持','follow a rule or plan','verb',[ids[1]]),('拥护；追随','remain loyal to a belief or group','verb',[ids[2]])])
          d['record']['constructions']=[C('construction:72adhere0001','L1','粘附于表面','adhere to + surface/material'),C('construction:72adhere0002','L1','遵守/坚持规则、计划、原则','adhere to + rule/plan/principle'),C('construction:72adhere0003','L2','拥护某种信念/阵营','adhere to + belief/cause/group','R')]
          for s in ss(d): s['confidence']='high'
          mark(d,72); save(72,d)

          # 76 administer — lifecycle recovery of ordinary management and medication branches.
          d=load(76); helpid=ss(d)[0]['sense_id']
          manage=promote(d,'manage or supervise','L1','管理；执行；负责运作','to manage, organize, or carry out the operation of something','manage or carry out',pos='verb',trans='vt')
          med=promote(d,'give or apply (medication)','L1','给予；施用（药物、疫苗、治疗等）','to give or apply a drug, vaccine, treatment, or test','give or apply a treatment',pos='verb',trans='vt')
          ss(d)[0]['level']='L3'; ss(d)[0]['confidence']='high'; ss(d)[0]['usage_note']='The older administer to = give aid/service frame is much less central than manage or give medication.'
          core(d,'两条现代主干都是“按规则把某事实施出去”：管理/执行一个系统，或给人施用药物、治疗、测验等。','carry something out under an organized procedure: manage/execute a system or give/apply a medicine, treatment, or test','administer a program/estate＝管理执行；administer a drug/vaccine＝给药/施用；administer to the sick 是低优先旧式分支。','route by object: organization/program versus drug/treatment',[('管理；执行','manage or carry out','verb',[manage]),('给予；施用','give or apply treatment','verb',[med]),('给予帮助（低频）','render aid or service','verb',[helpid])])
          d['record']['constructions']=[C('construction:76administer0001','L1','管理/执行制度、项目、事务','administer + program/system/estate/policy'),C('construction:76administer0002','L1','给药/施用疫苗或治疗','administer + drug/vaccine/treatment + to + patient')]
          mark(d,76); save(76,d)

          # 85 advance — recover noun progress and academic propose branch; keep low-value finance/romance reference-only.
          d=load(85); base=[x['sense_id'] for x in ss(d)]
          prog=promote(d,'forward movement or progress','L1','前进；进展；进步','forward movement, progress, or development','progress or forward movement',pos='noun')
          prop=promote(d,'suggest or propose something','L2','提出（理论、论点、建议等）','to put forward a theory, argument, proposal, or idea for consideration','put forward an idea or argument',pos='verb',trans='vt')
          core(d,'共同轴是“往前推”：人/过程前进，研究或论点被推进/提出，名词表示进展；advance 作定语还表示预先的。','move or push something forward in space, development, or argument; as a noun progress, and as an attributive adjective beforehand','advance science / advance on＝推进；an advance＝进展；advance a theory＝提出；in advance / advance warning＝提前。','use forward movement as the spine, then distinguish progress, proposition, and beforehand',[('推进；前进','move or push forward','verb',[base[0]]),('进展；进步','forward movement or progress','noun',[prog]),('提出理论/论点','put forward an idea','verb',[prop]),('预先的','done beforehand','adjective',[base[1]])])
          d['record']['constructions']=[C('construction:85advance0001','L1','提前；预先','in advance'),C('construction:85advance0002','L1','推进某事业/知识/过程','advance + science/cause/process'),C('construction:85advance0003','L2','提出论点/理论','advance + argument/theory/proposal'),C('construction:85advance0004','L2','预先通知/预订/付款','advance + warning/booking/payment')]
          for s in ss(d): s['confidence']='high'
          mark(d,85); save(85,d)

          # 86 advanced — repair stage/age branch.
          d=load(86); ids=[x['sense_id'] for x in ss(d)]
          core(d,'表示已经推进到较高层级或较后阶段：可以是技术/课程水平高，也可以是年龄、疾病、发展进程已进入后期。','far along in level, sophistication, or stage: high-level technology/course, or a late stage of age, disease, or development','advanced technology/course＝高阶先进；advanced age/disease＝进入较后阶段，不是“更聪明”。','choose high-level sophistication versus far-along stage',[('高级的；先进的','high-level or sophisticated','adjective',[ids[0]]),('进展到较后阶段的','far along in stage or development','adjective',[ids[1]])])
          s=ss(d)[1]; s['confidence']='high'; s['definition_cn']='进展到较后阶段的；高龄的；晚期的'; s['definition_en']='far along in age, disease, development, or another process'; s['sense_label_en']='far along in a stage or process'; s['collocations']=[*s.get('collocations',[]),{'collocation_id':'vnext:advanced:disease','exam_value':'usage_example','legacy_source_object_ids':[],'meaning_cn':'晚期疾病','phrase':'advanced disease'}]
          d['record']['constructions']=[C('construction:86advanced0001','L1','先进技术/高阶课程','advanced + technology/course/method'),C('construction:86advanced0002','L1','高龄/晚期疾病','advanced + age/disease/cancer/stage')]
          mark(d,86); save(86,d)

          # 87 advantage — Active=0 lifecycle recovery.
          d=load(87)
          posid=promote(d,'favorable or superior position','L1','优势；有利条件','a condition or circumstance that puts someone in a favorable or superior position','favorable position or condition',pos='noun')
          benid=promote(d,'benefit or profit gained','L1','好处；益处','a benefit, gain, or useful result obtained from something','benefit or useful gain',pos='noun')
          core(d,'都表示“让你处在更有利的位置”：既可指相对优势，也可指某事带来的具体好处。','something that puts you in a more favorable position: a comparative edge or a concrete benefit','have an advantage over＝有优势；advantage of X＝X 的好处；take advantage of＝利用机会/条件（也可指占便宜）。','separate comparative edge from benefit, then retrieve fixed phrases',[('优势；有利条件','comparative favorable position','noun',[posid]),('好处；益处','benefit or gain','noun',[benid])])
          d['record']['constructions']=[C('construction:87advantage0001','L1','比……有优势','have an advantage over + sb/sth'),C('construction:87advantage0002','L1','……的优点/好处','the advantage(s) of + sth'),C('construction:87advantage0003','L1','利用机会/条件；占……便宜','take advantage of + sb/sth'),C('construction:87advantage0004','L2','对某人有利','to + sb’s advantage')]
          mark(d,87); save(87,d)

          # 93 advice — Active=0 lifecycle recovery.
          d=load(93)
          aid=promote(d,'proposal for an appropriate course of action','L1','建议；忠告','guidance or a recommendation about what someone should do','guidance or recommendation',pos='noun')
          core(d,'不可数名词：给别人关于“应该怎么做”的建议或指导。','uncountable guidance or recommendation about what someone should do','advice 不数：some advice / a piece of advice；advice on/about；take/follow advice。','treat advice as uncountable guidance, distinct from the verb advise',[('建议；忠告','guidance or recommendation','noun',[aid])])
          d['record']['constructions']=[C('construction:93advice0001','L1','关于……的建议','advice on/about + sth'),C('construction:93advice0002','L1','一条建议','a piece of advice'),C('construction:93advice0003','L1','听取/遵循建议','take/follow + advice')]
          mark(d,93); save(93,d)

          # 95 advise — expose real complement grammar.
          d=load(95); ids=[x['sense_id'] for x in ss(d)]
          core(d,'动词 advise 主要是“给出行动建议”，正式语境还可表示“通知/告知”。','verb: give guidance about what to do; formally, inform someone of something','advise sb to do；advise doing；advise against；advise that…；正式 advise sb of…＝告知。','grammar of the complement is the key retrieval boundary',[('建议；劝告','give guidance','verb',[ids[0]]),('告知（正式）','formally inform','verb',[ids[1]])])
          d['record']['constructions']=[C('construction:95advise0001','L1','建议某人做某事','advise + sb + to do'),C('construction:95advise0002','L1','建议做某事','advise + doing'),C('construction:95advise0003','L1','建议不要/反对做某事','advise against + noun/doing'),C('construction:95advise0004','L1','建议……','advise that + clause'),C('construction:95advise0005','L2','正式告知某人某事','advise + sb + of + sth','R')]
          for s in ss(d): s['confidence']='high'
          mark(d,95); save(95,d)

          # 96 advocate — Active=0 lifecycle recovery.
          d=load(96)
          nid=promote(d,'person who publicly supports','L1','倡导者；拥护者','a person who publicly supports or recommends a cause, policy, or idea','public supporter or proponent',pos='noun')
          vid=promote(d,'publicly support or recommend','L1','提倡；主张；拥护','to publicly support, recommend, or argue for a cause, policy, or course of action','publicly support or recommend',pos='verb',trans='vt/vi')
          core(d,'围绕“公开站出来支持某个主张/政策”：可作人（倡导者），也可作动词（提倡）。律师义保留 reference。','public support for a cause or policy: a proponent as noun, or to advocate it as verb; lawyer sense remains reference','an advocate of/for reform＝倡导者；advocate reform/doing＝主张；advocate for sb/cause＝为……发声。','one public-support model across noun and verb',[('倡导者；拥护者','public supporter','noun',[nid]),('提倡；主张','publicly support or recommend','verb',[vid])])
          d['record']['constructions']=[C('construction:96advocate0001','L1','……的倡导者','an advocate of/for + cause/policy'),C('construction:96advocate0002','L1','主张某事/做某事','advocate + noun/doing'),C('construction:96advocate0003','L1','为某人/事业公开发声','advocate for + sb/cause')]
          mark(d,96); save(96,d)

          # 103 affirm — distinguish declare true from formally uphold/confirm.
          d=load(103); ids=[x['sense_id'] for x in ss(d)]
          core(d,'核心是“明确确认某事成立”：可以郑重声明为真，也可以正式确认/维持一个决定或裁决。','explicitly confirm something as valid or true: state it firmly, or formally uphold/confirm a decision','affirm that＝确认/声明；affirm a judgment/decision＝确认并维持；不是普通口语 agree 的同义词。','formal confirmation is the shared model; distinguish assertion from institutional upholding',[('郑重确认/声明','state or confirm as true','verb',[ids[0]]),('正式确认/维持决定','formally uphold or confirm','verb',[ids[1]])])
          s=ss(d)[1]; s['confidence']='high'; s['definition_cn']='正式确认；维持（决定、判决等）'; s['definition_en']='to formally confirm, uphold, or ratify a decision, judgment, or position'; s['sense_label_en']='formally confirm or uphold'
          d['record']['constructions']=[C('construction:103affirm0001','L1','确认/郑重声明……','affirm + noun / affirm that + clause'),C('construction:103affirm0002','L2','确认或维持决定/判决','affirm + decision/judgment/ruling','R')]
          for s in ss(d): s['confidence']='high'
          mark(d,103); save(103,d)

          # 104 affluent — restore the ordinary adjective.
          d=load(104); old=[x['sense_id'] for x in ss(d)]
          adj=promote(d,'abundant supply of money','L1','富裕的；富有的','having a great deal of money, property, or material wealth','wealthy or prosperous',pos='adjective')
          ss(d)[0]['level']='L2'; ss(d)[0]['confidence']='high'; ss(d)[0]['definition_cn']='富裕人群；富人（较少单独作普通可数名词）'; ss(d)[0]['usage_note']='More natural in many contexts as the affluent = wealthy people.'
          ss(d)[1]['level']='L3'; ss(d)[1]['confidence']='high'
          core(d,'现代主干是形容词“富裕的”；the affluent 可指富裕人群。河流“支流”是低优先技术/旧义。','modern core is the adjective wealthy/prosperous; the affluent can mean wealthy people, while tributary is low-priority','affluent society/area/family＝富裕；the affluent＝富裕人群；tributary sense 不应抢主干。','put the wealthy adjective first, then the affluent as people, with tributary last',[('富裕的','wealthy or prosperous','adjective',[adj]),('富裕人群','wealthy people','noun',[old[0]]),('支流（低优先）','tributary stream','noun',[old[1]])])
          d['record']['constructions']=[C('construction:104affluent0001','L1','富裕的社会/地区/家庭','affluent + society/area/family'),C('construction:104affluent0002','L2','富裕人群','the affluent','R')]
          mark(d,104); save(104,d)

          # 106 afraid — restore high-value discourse use I'm afraid.
          d=load(106); sid=ss(d)[0]['sense_id']
          core(d,'既表示真实恐惧，也常用来礼貌地表达坏消息、担忧或不同意。','expresses fear, and also a very common polite discourse stance for regret, concern, or disagreement','afraid of + n＝害怕对象；afraid to do＝因害怕不敢；I’m afraid (that)…＝恐怕/很遗憾。','separate literal fear from the polite discourse frame',[('害怕；担心','fear or anxiety','adjective',[sid])])
          d['record']['constructions']=[C('construction:106afraid0001','L1','害怕某人/某事','be afraid of + sb/sth'),C('construction:106afraid0002','L1','因害怕而不敢做','be afraid to do'),C('construction:106afraid0003','L1','恐怕……；很遗憾……（礼貌表达）','I’m afraid (that) + clause')]
          ss(d)[0]['confidence']='high'; ss(d)[0]['usage_note']='I’m afraid (that)… is a high-frequency polite stance marker and often does not describe literal fear.'
          mark(d,106); save(106,d)

          # 123 agree — make complement/meaning routing explicit.
          d=load(123); ids=[x['sense_id'] for x in ss(d)]
          core(d,'核心是“两方匹配/不冲突”，但补语决定分支：人/观点一致、接受提议/行动、就议题达成一致，或某物适合某人。','two sides match without conflict, with complements selecting opinion agreement, consent, agreement on a topic, grammatical matching, or suitability','agree with sb/view＝意见一致；agree to plan / to do＝接受；agree on issue＝就议题一致；food doesn’t agree with me＝不适合身体。','let the preposition/complement choose the branch',[('意见一致','share the same opinion','verb',[ids[0]]),('同意提议/行动','consent to something or to act','verb',[ids[1]]),('语法一致','show grammatical agreement','verb',[ids[2]]),('适合；相宜','be suitable or healthy for','verb',[ids[3]]),('一致认定（正式）','formal agreed conclusion','verb',[ids[4]])])
          d['record']['constructions']=[C('construction:123agree0001','L1','同意某人/观点；与事实吻合','agree with + sb/view/account'),C('construction:123agree0002','L1','接受提议/条件','agree to + proposal/terms'),C('construction:123agree0003','L1','同意做某事','agree to do'),C('construction:123agree0004','L1','就某议题达成一致','agree on + issue/price/plan'),C('construction:123agree0005','L2','某物适合某人身体/脾胃','sth agrees with + sb','R'),C('construction:123agree0006','L2','一致认为……','it is agreed / be agreed that + clause','R')]
          for s in ss(d): s['confidence']='high'
          mark(d,123); save(123,d)

          # Semantic NO_CHANGE owners: close stale legacy delta-review metadata only.
          for n in range(65,125):
              if n in upgraded: continue
              d=load(n); mark(d,n,semantic=False); save(n,d)

          # Final integrated readback.
          rows=[]
          for n in range(65,125):
              d=load(n); active=[x.get('sense_id') for x in ss(d)]
              if not active: raise RuntimeError(f'ACTIVE_ZERO:o{n:04d}:{d["word"]}')
              if len(active)!=len(set(active)): raise RuntimeError(f'DUP_ACTIVE:o{n:04d}:{d["word"]}')
              aset=set(active)
              for c in d['record'].get('core_concept',{}).get('core_clusters',[]):
                  bad=set(c.get('sense_ids',[]))-aset
                  if bad: raise RuntimeError(f'CORE_CLUSTER_BAD:o{n:04d}:{bad}')
              if d['record'].get('needs_delta_review'): raise RuntimeError(f'OPEN_DELTA:o{n:04d}:{d["word"]}')
              raw=p(n).read_bytes(); rows.append({'ordinal':n,'word_id':d['word_id'],'word':d['word'],'operation':'UPGRADED' if n in upgraded else 'NO_CHANGE','final_quality':'SAFE_SIMPLE' if n in safe else 'DEPTH_READY','active_sense_count':len(active),'construction_count':len(d['record'].get('constructions',[])),'relation_ref_count':len(d.get('relation_refs',[])),'final_content_sha256':hashlib.sha256(raw).hexdigest()})
          receipt={'schema':'kianos.lexical.vnext_content_execution_receipt.v1','wave':'wave03-o0025-o0124','shard':'o0065-o0124','status':'PASS','authority':'fresh vNext judgment over Current Natural Owners; old Fresh-Rebuild work is candidate/sentinel evidence only','owner_count':60,'upgraded_count':len(upgraded),'no_change_count':60-len(upgraded),'depth_ready_count':60-len(safe),'safe_simple_count':len(safe),'blocked_count':0,'relation_mutations':0,'form_mutations':0,'learner_state_mutation':0,'pack_membership_mutation':0,'owners':rows}
          (O/'wave03-shard02-o0065-o0124-receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY
      - name: Validate JSON corpus
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for root in ['content/lexical/words/by-ordinal','content/lexical/relations/by-id']:
              for p in Path(root).rglob('*.json'): json.loads(p.read_text())
          print('LEXICAL_JSON_READBACK_PASS')
          PY
      - name: Build Astro
        if: steps.guard.outputs.done != 'true'
        working-directory: static-web
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit direct-close shard
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          git config user.name 'kianos-lexical-vnext'
