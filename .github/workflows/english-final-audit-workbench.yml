name: English fresh independent acceptance
on:
  push:
    branches: [work/english-final-audit-20260919]
    paths: ['.github/workflows/english-final-audit-workbench.yml','tools/_english_audit_*','static-web/scripts/english-final-fresh-*','static-web/src/**','content/english/**']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: apply
        run: |
          set -euo pipefail
          if test -f tools/_english_audit_apply_v2.py; then
            python3 tools/_english_audit_apply_v2.py
            python3 tools/_english_audit_objective_v2.py
            python3 tools/_english_audit_tests_v2.py
            git rm tools/_english_audit_apply_v2.py tools/_english_audit_objective_v2.py tools/_english_audit_tests_v2.py
            git add static-web/src static-web/scripts/english-final-fresh-audit.mjs static-web/scripts/english-final-fresh-browser.mjs
            git diff --cached --check
            git config user.name 'KianOS bounded audit worker'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(english): validate complete returns against immutable Current evidence'
            git push origin HEAD:work/english-final-audit-20260919
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install current dependencies
        working-directory: static-web
        run: |
          if test -f package-lock.json; then npm ci; else npm install --package-lock=false; fi
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          mkdir -p .qa/english-final
          npm ls --depth=0 > .qa/english-final/dependencies.txt || true
      - name: Independent synthetic adversarial proof
        working-directory: static-web
        run: |
          git rev-parse HEAD > .qa/english-final/tested-head.txt
          AUDIT_OUTPUT=.qa/english-final/candidate-probes.json node scripts/english-final-fresh-audit.mjs
      - name: Native browser verification
        working-directory: static-web
        shell: bash
        run: |
          set -euo pipefail
          node scripts/english-final-fresh-fixtures.mjs
          npm run dev -- --host 127.0.0.1 --port 4321 > .qa/english-final/astro.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" || true; node scripts/english-final-fresh-fixtures.mjs clean' EXIT
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:4321/reading/audit-reading-0/ >/dev/null && break; sleep 2; done
          AUDIT_URL=http://127.0.0.1:4321 AUDIT_BROWSER_OUTPUT=.qa/english-final/browser node scripts/english-final-fresh-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-fresh-${{ matrix.os }}
          path: static-web/.qa/english-final
          include-hidden-files: true
          retention-days: 14
