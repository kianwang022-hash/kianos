name: Xizong Projection Validation

on:
  push:
    branches: [main]
    paths:
      - 'content/xizong/projection/**'
      - 'content/xizong/knowledge/systems/**'
      - 'content/xizong/knowledge/learner/**'
      - 'content/xizong/knowledge/manifest.json'
  pull_request:
    paths:
      - 'content/xizong/projection/**'
      - 'content/xizong/knowledge/systems/**'
      - 'content/xizong/knowledge/learner/**'
      - 'content/xizong/knowledge/manifest.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Xizong cognitive projection v1
        run: python3 content/xizong/projection/tools/validate_projection_v1.py --self-test
