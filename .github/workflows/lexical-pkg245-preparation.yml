name: Lexical pkg245 preparation

on:
  push:
    branches:
      - lexical/pkg245-exec
    paths:
      - 'tools/lexical_prepare_execution_package.py'
      - 'tools/lexical_scan_package_remote_refs.py'
      - '.github/workflows/lexical-pkg245-preparation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexical-pkg245-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg245-exec
          fetch-depth: 0

      - name: Compile package preparation assets
        run: |
          python tools/lexical_prepare_execution_package.py \
            --accounting content/lexical/execution/preflight/o4875-o5374.reconciliation-compile.json \
            --reconciliation content/lexical/semantic-reconciliation/o4875-o5374.md \
            --issue 245 \
            --remote 1020 \
            --remote 1410 \
            --remote 2069 \
            --remote 2586 \
            --remote 2671 \
            --remote 4524 \
            --remote 4825 \
            --remote 5416 \
            --out-prefix content/lexical/execution/preflight/o4875-o5374
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('content/lexical/execution/preflight')
          pre=json.loads((p/'o4875-o5374.current-identities.json').read_text(encoding='utf-8'))
          cand=json.loads((p/'o4875-o5374.manifest-candidates.json').read_text(encoding='utf-8'))
          sheet=(p/'o4875-o5374.execution-sheet.md').read_text(encoding='utf-8')
          assert pre['status']=='READ_ONLY_CURRENT_EVIDENCE'
          assert pre['package_range']==[4875,5374]
          assert pre['source_owner_count']==159
          assert pre['remote_word_dependencies']==[1020,1410,2069,2586,2671,4524,4825,5416]
          assert pre['identity_owner_count']==167
          assert len(pre['internal_receipt_counts'])==10
          assert sum(x[2] for x in pre['internal_receipt_counts'])==159
          assert cand['owner_count']==159
          for heading in ('## o4972 — there','## o4986 — think','## o5159 — turkey','## o5276 — verse'):
              assert heading in sheet, heading
          print('PKG245_PREPARATION_CONTRACT_PASS', cand['stats'])
          PY

      - name: Scan all inline remote owner references
        run: |
          python tools/lexical_scan_package_remote_refs.py \
            --sheet content/lexical/execution/preflight/o4875-o5374.execution-sheet.md \
            --start 4875 \
            --end 5374 \
            --out content/lexical/execution/preflight/o4875-o5374.remote-reference-scan.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('content/lexical/execution/preflight/o4875-o5374.remote-reference-scan.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['status']=='READ_ONLY_REMOTE_CANDIDATES'
          assert 1020 in x['remote_ordinals']
          assert 4825 in x['remote_ordinals']
          print('REMOTE_REFERENCE_SCAN_CONTRACT_PASS', x['remote_ordinals'])
          PY

      - name: Verify read-only lexical owner preparation
        run: |
          status=$(git status --short)
          printf '%s\n' "$status"
          if printf '%s\n' "$status" | grep -E 'content/lexical/(words/by-ordinal|canonical/)' ; then
            echo 'Preparation mutated lexical canonical state unexpectedly'
            exit 1
          fi

      - name: Commit package preparation assets
        run: |
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add \
            content/lexical/execution/preflight/o4875-o5374.current-identities.json \
            content/lexical/execution/preflight/o4875-o5374.identity-index.json \
            content/lexical/execution/preflight/o4875-o5374.execution-sheet.md \
            content/lexical/execution/preflight/o4875-o5374.manifest-candidates.json \
            content/lexical/execution/preflight/o4875-o5374.manifest-summary.md \
            content/lexical/execution/preflight/o4875-o5374.unresolved-resolution.md \
            content/lexical/execution/preflight/o4875-o5374.remote-reference-scan.json
          if git diff --cached --quiet; then
            echo 'No preparation asset changes'
            exit 0
          fi
          git commit -m 'lexical: compile pkg245 execution preparation [skip ci]'
          git push origin HEAD:lexical/pkg245-exec
