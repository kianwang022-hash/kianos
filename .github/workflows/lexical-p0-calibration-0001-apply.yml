name: LexicalOS P0 Calibration 0001 Apply

on:
  push:
    branches:
      - lexical/p0-calibration-0001
    paths:
      - 'content/lexical/audit/knowledge-reacceptance/batches/p0-0001.json'
      - 'tools/lexical_apply_knowledge_reacceptance_batch.py'
      - '.github/workflows/lexical-p0-calibration-0001-apply.yml'

permissions:
  contents: write

jobs:
  apply-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: lexical/p0-calibration-0001

      - name: Apply bounded repair
        shell: bash
        run: |
          python tools/lexical_apply_knowledge_reacceptance_batch.py \
            content/lexical/audit/knowledge-reacceptance/batches/p0-0001.json \
            --report /tmp/p0-0001-apply.json

      - name: Read back Knowledge gate
        shell: bash
        run: |
          python tools/lexical_knowledge_reacceptance_audit.py \
            --output /tmp/p0-0001-reacceptance.json \
            --summary /tmp/p0-0001-reacceptance.md
          python - <<'PY'
          import json
          report=json.load(open('/tmp/p0-0001-reacceptance.json', encoding='utf-8'))
          summary=report['summary']
          assert summary['p0_count'] == 361, summary
          abandon=next(x for x in report['sentinels'] if x['ordinal']==2)
          assert abandon['status'] == 'PASS', abandon
          print('P0_0001_READBACK_PASS')
          PY

      - name: Commit generated Current owners
        shell: bash
        run: |
          git config user.name 'KianOS Lexical Repair'
          git config user.email 'kianos-lexical-repair@users.noreply.github.com'
          git add content/lexical/words/by-ordinal/o0002.json \
                  content/lexical/words/by-ordinal/o0017.json \
                  content/lexical/words/by-ordinal/o0020.json \
                  content/lexical/words/by-ordinal/o0028.json \
                  content/lexical/words/by-ordinal/o0049.json \
                  content/lexical/words/by-ordinal/o0067.json \
                  content/lexical/words/by-ordinal/o0074.json
          git diff --cached --quiet && exit 1
          git commit -m 'fix(lexical): restore P0 calibration batch 0001'
          git push origin HEAD:lexical/p0-calibration-0001

      - name: Upload readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexical-p0-calibration-0001
          path: |
            /tmp/p0-0001-apply.json
            /tmp/p0-0001-reacceptance.json
            /tmp/p0-0001-reacceptance.md
          if-no-files-found: warn
          retention-days: 14
