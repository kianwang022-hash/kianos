name: Politics Current Reconcile Once

on:
  push:
    branches: ['chat/politics-current-reconcile']

permissions:
  contents: write

env:
  LEGACY_HEAD: d2f63f38707603c209a3813c3069a47b0ea64b72

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[politics-reconcile-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/politics-current-reconcile
          fetch-depth: 0

      - name: Fetch bounded legacy candidate
        run: git fetch origin politics-legacy-parity-migration --no-tags

      - name: Reconcile unique Politics Workbench files
        run: |
          set -euo pipefail
          files=(
            static-web/src/lib/politicsPractice.mjs
            static-web/src/lib/politicsPracticeBridge.mjs
            static-web/src/lib/politicsPracticeClient.mjs
            static-web/src/lib/politicsPracticeView.mjs
            static-web/src/components/PoliticsPracticeBridge.astro
            static-web/src/components/PoliticsPracticeWorkbench.astro
            static-web/src/pages/politics/practice.astro
            'static-web/src/pages/politics/practice-review/[id].json.ts'
            static-web/scripts/validate-politics-practice-parity.mjs
            static-web/scripts/test-politics-practice-journey.mjs
            static-web/scripts/test-politics-practice-formal.mjs
          )
          for f in "${files[@]}"; do
            mkdir -p "$(dirname "$f")"
            git show "$LEGACY_HEAD:$f" > "$f"
          done

          while IFS= read -r f; do
            mkdir -p "$(dirname "$f")"
            git show "$LEGACY_HEAD:$f" > "$f"
          done < <(git ls-tree -r --name-only "$LEGACY_HEAD" -- static-web/scripts/fixtures/politics-practice)

          python3 - <<'PY'
          from pathlib import Path
          import json

          chapter = Path('static-web/src/pages/politics/[subject]/[chapter].astro')
          text = chapter.read_text()
          if 'PoliticsPracticeBridge' not in text:
              anchor = "import PoliticsUnitReturnEnhancer from '../../../components/PoliticsUnitReturnEnhancer.astro';\n"
              if anchor not in text: raise SystemExit('chapter import anchor missing')
              text = text.replace(anchor, anchor + "import PoliticsPracticeBridge from '../../../components/PoliticsPracticeBridge.astro';\n", 1)
              render_anchor = "  <script is:inline>\n    (() => {\n"
              if render_anchor not in text: raise SystemExit('chapter render anchor missing')
              text = text.replace(render_anchor, "  <PoliticsPracticeBridge chapter={data} base={base} />\n\n" + render_anchor, 1)
              chapter.write_text(text)

          package = Path('static-web/package.json')
          data = json.loads(package.read_text())
          scripts = data['scripts']
          base_validate = scripts['validate:politics']
          parity = 'node scripts/validate-politics-practice-parity.mjs'
          if parity not in base_validate:
              scripts['validate:politics'] = base_validate + ' && ' + parity
          scripts['test:politics-practice'] = 'node scripts/test-politics-practice-journey.mjs'
          scripts['test:politics-practice-formal'] = 'node scripts/test-politics-practice-formal.mjs'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Install dependencies
        working-directory: static-web
        run: npm install --no-audit --no-fund

      - name: Validate Politics Current and Workbench parity
        working-directory: static-web
        run: npm run validate:politics

      - name: Build production learner projection
        working-directory: static-web
        run: npm run build

      - name: Install browser acceptance tool
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Execute isolated synthetic Workbench journey
        working-directory: static-web
        run: npm run test:politics-practice

      - name: Execute formal Current-data Workbench journey
        working-directory: static-web
        run: |
          npm run preview -- --host 127.0.0.1 --port 4337 > /tmp/politics-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill "$PREVIEW_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4337/politics/practice/ >/dev/null; then break; fi
            if [ "$i" -eq 80 ]; then cat /tmp/politics-preview.log; exit 1; fi
            sleep .25
          done
          npm run test:politics-practice-formal

      - name: Write Current reconciliation receipt
        run: |
          cat > static-web/POLITICS_CURRENT_RECONCILIATION.md <<'EOF'
          # Politics Current reconciliation

          Status: **PASS — bounded Workbench salvage on latest Current**

          Historical candidate: PR #117 / `d2f63f38707603c209a3813c3069a47b0ea64b72`.

          This reconciliation does **not** merge the historical branch. It salvages only the still-unique Politics Xiao1000 Workbench implementation onto the latest Current mainline.

          ## Salvaged functional surface

          - Current-data practice catalog / exact learner-explanation binding;
          - clean-vs-submitted Workbench projection;
          - Normal / Fast interaction, Favorite / Uncertain / discussion signals;
          - immutable first-attempt preservation and private local evidence;
          - exact source / Natural Unit Return;
          - fail-closed storage, stale return and review-payload behavior;
          - Current chapter → practice bridge;
          - static review payload route;
          - bounded synthetic and formal browser acceptance harnesses.

          ## Deliberately not salvaged

          - `output/playwright/**` historical screenshots/logs;
          - old free-polish snapshots and visual iteration history;
          - old PR #117 receipt as Current authority;
          - `test-politics-practice-polish.mjs` and its frozen aesthetic assertions;
          - any retired xiao-reference learner display, OCR fallback, due scheduler, duplicate Chengfeng reader, or mandatory Recall ritual.

          ## Executed on this reconciliation

          - Current Politics validators + Workbench parity: PASS;
          - production Astro build: PASS;
          - isolated synthetic Workbench browser journey: PASS;
          - formal Current-data Workbench browser journey: PASS.

          These are engineering acceptance results, not Kian learner U and not final visual acceptance. Final styling remains downstream screenshot-driven work.
          EOF

      - name: Commit bounded Current reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static-web/package.json \
                  static-web/src/lib/politicsPractice*.mjs \
                  static-web/src/components/PoliticsPracticeBridge.astro \
                  static-web/src/components/PoliticsPracticeWorkbench.astro \
                  static-web/src/pages/politics/practice.astro \
                  'static-web/src/pages/politics/practice-review/[id].json.ts' \
                  'static-web/src/pages/politics/[subject]/[chapter].astro' \
                  static-web/scripts/validate-politics-practice-parity.mjs \
                  static-web/scripts/test-politics-practice-journey.mjs \
                  static-web/scripts/test-politics-practice-formal.mjs \
                  static-web/scripts/fixtures/politics-practice \
                  static-web/POLITICS_CURRENT_RECONCILIATION.md
          git commit -m 'feat(politics): reconcile Workbench onto Current [politics-reconcile-applied]'
          git push origin HEAD:chat/politics-current-reconcile

      - name: Preserve fresh browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: politics-current-reconcile-${{ github.sha }}
          path: |
            output/playwright/issue117/
            output/playwright/issue139/
          if-no-files-found: warn
          retention-days: 7
