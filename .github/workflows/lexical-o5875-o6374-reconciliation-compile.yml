name: Lexical o5875-o6374 reconciliation compile

on:
  push:
    branches:
      - lexical/pkg-next-5875
    paths:
      - '.github/workflows/lexical-o5875-o6374-reconciliation-compile.yml'
      - 'tools/lexical_compile_reconciliation_package.py'
      - 'tools/lexical_compile_reconciliation_extras.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexical-o5875-o6374-reconciliation-compile
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg-next-5875
          fetch-depth: 0
      - name: Compile exact package accounting
        run: |
          python tools/lexical_compile_reconciliation_package.py \
            --start 5875 --end 6374 \
            --production content/lexical/semantic-review/o5875-o6124.md \
            --production content/lexical/semantic-review/o6125-o6374.md \
            --audit content/lexical/semantic-audit/o5825-o6024.audit.md \
            --audit content/lexical/semantic-audit/o6025-o6224.audit.md \
            --audit content/lexical/semantic-audit/o6225-o6424.audit.md \
            --out content/lexical/execution/preflight/o5875-o6374.reconciliation-compile.json
          python tools/lexical_compile_reconciliation_extras.py \
            --start 5875 --end 6374 \
            --production content/lexical/semantic-review/o5875-o6124.md \
            --production content/lexical/semantic-review/o6125-o6374.md \
            --audit content/lexical/semantic-audit/o5825-o6024.audit.md \
            --audit content/lexical/semantic-audit/o6025-o6224.audit.md \
            --audit content/lexical/semantic-audit/o6225-o6424.audit.md \
            --out content/lexical/execution/preflight/o5875-o6374.reconciliation-extras.json
      - name: Commit compiled inputs
        run: |
          set -euo pipefail
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical/execution/preflight/o5875-o6374.reconciliation-compile.json content/lexical/execution/preflight/o5875-o6374.reconciliation-extras.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'lexical: compile o5875-o6374 reconciliation inputs [skip ci]'
          git push origin HEAD:lexical/pkg-next-5875
