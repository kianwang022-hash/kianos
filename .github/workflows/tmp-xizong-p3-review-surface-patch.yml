name: Temp Xizong P3 Review Surface Patch

on:
  push:
    branches:
      - work/xizong-second-pass-p3-review-surface

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/xizong-second-pass-p3-review-surface
          fetch-depth: 0
      - name: Apply P3 phase-aware review surface
        run: node static-web/scripts/tmp-p3-review-surface-patch.mjs
      - name: Commit P3 product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static-web/src/lib/xizongQuestions.mjs static-web/src/components/XizongSystemExitRuntime.astro static-web/scripts/validate-xizong-learning.mjs static-web/scripts/test-xizong-a2-functional-journey.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "xizong: add phase-aware second-pass review surface"
          git push origin HEAD:work/xizong-second-pass-p3-review-surface
