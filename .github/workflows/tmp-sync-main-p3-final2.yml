name: Temp Sync Main P3 Final2

on:
  push:
    branches:
      - work/xizong-second-pass-p3-review-surface

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/xizong-second-pass-p3-review-surface
          fetch-depth: 0
      - name: Merge latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:work/xizong-second-pass-p3-review-surface
