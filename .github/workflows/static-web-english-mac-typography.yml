name: English macOS Typography Gate

on:
  pull_request:
    paths:
      - 'static-web/src/styles/shared-visual-foundation.css'
      - 'static-web/src/styles/shared-shell.css'
      - 'static-web/src/styles/english*.css'
      - 'static-web/src/layouts/Base.astro'
      - 'static-web/scripts/test-english-l1-typography-mac.mjs'
      - '.github/workflows/static-web-english-mac-typography.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-mac-typography-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l1-typography-macos:
    runs-on: macos-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install learner site
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Build learner site
        working-directory: static-web
        run: npm run build
      - name: Install Chromium acceptance tool
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Verify PingFang-first English L1 typography
        working-directory: static-web
        run: node scripts/test-english-l1-typography-mac.mjs
      - name: Preserve macOS typography evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-mac-typography-${{ github.sha }}
          path: english-mac-typography-audit/
          retention-days: 14
