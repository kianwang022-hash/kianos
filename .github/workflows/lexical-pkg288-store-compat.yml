name: Lexical pkg288 Store relation compatibility

on:
  push:
    branches:
      - lexical/pkg288-exec
    paths:
      - '.github/workflows/lexical-pkg288-store-compat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg288-exec
          fetch-depth: 0
      - name: Add extra changed-path compatibility to package Store
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/lexical_execute_o6375_o6874.py')
          s=p.read_text()
          old="store=base.Store(); sense_touched=set(); explicit_core=set(); relation_ids=set()"
          new="store=base.Store(); store.extra_changed_paths=set(); sense_touched=set(); explicit_core=set(); relation_ids=set()"
          if new in s:
              print('already patched')
          elif old in s:
              p.write_text(s.replace(old,new,1))
              print('patched')
          else:
              raise SystemExit('STORE_COMPAT_ANCHOR_MISSING')
          PY
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add tools/lexical_execute_o6375_o6874.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'lexical: make pkg288 Store relation-compatible [skip ci]'
          git push origin HEAD:lexical/pkg288-exec
