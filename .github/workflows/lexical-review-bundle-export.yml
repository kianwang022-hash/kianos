name: Lexical Review Bundle Export

on:
  push:
    branches:
      - 'lexical-*'
      - 'work/lexical-*'
    paths:
      - 'content/lexical/execution/review-bundle-request.json'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build bounded review bundles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          req_path = Path("content/lexical/execution/review-bundle-request.json")
          req = json.loads(req_path.read_text(encoding="utf-8"))
          assert req.get("schema") == "kianos.lexical.review_bundle_request.v1"
          start = int(req["start_ordinal"])
          end = int(req["end_ordinal"])
          assert 1 <= start <= end <= 7946
          max_words = int(req.get("max_words", 50))
          max_bytes = int(req.get("max_bytes", 48000))
          request_id = str(req["request_id"]).strip()
          assert request_id and "/" not in request_id

          out = Path("review-bundle-artifact")
          out.mkdir(exist_ok=False)
          rows = []
          cursor = start
          for i in range(1, 9):
              target = out / f"bundle-{i:02d}.json"
              subprocess.run([
                  "python", "tools/lexical_shard.py", "export",
                  "--root", ".",
                  "--start", str(cursor),
                  "--end", str(end),
                  "--max-words", str(max_words),
                  "--max-bytes", str(max_bytes),
                  "--out", str(target.resolve()),
              ], check=True)
              packet = json.loads(target.read_text(encoding="utf-8"))
              words = packet["words"]
              if not words:
                  raise SystemExit("empty review bundle")
              rows.append({
                  "file": target.name,
                  "bundle_id": packet["bundle_id"],
                  "start_ordinal": words[0]["view"]["ordinal"],
                  "end_ordinal": words[-1]["view"]["ordinal"],
                  "word_count": len(words),
                  "next_ordinal": packet.get("next_ordinal"),
                  "base_commit": packet.get("base_commit"),
              })
              nxt = packet.get("next_ordinal")
              if nxt is None:
                  break
              if int(nxt) <= cursor:
                  raise SystemExit("non-progressing bundle cursor")
              cursor = int(nxt)
          else:
              raise SystemExit("too many bundles for one request")

          if rows[-1]["end_ordinal"] != end:
              raise SystemExit(f"incomplete coverage: {rows[-1]['end_ordinal']} != {end}")

          index = {
              "schema": "kianos.lexical.review_bundle_artifact_index.v1",
              "request_id": request_id,
              "requested_range": [start, end],
              "bundle_count": len(rows),
              "bundles": rows,
          }
          (out / "index.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(index, ensure_ascii=False))
          PY

      - name: Upload review bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: lexical-review-bundle
          path: review-bundle-artifact/
          if-no-files-found: error
          retention-days: 7
