      - 'static-web/src/components/XizongMemoryReleaseBridge.astro'
      - 'static-web/src/pages/xizong/memory/**'
      - 'static-web/src/pages/xizong/[system]/[block].astro'
      - 'static-web/src/styles/xizong-memory-workspace.css'
      - 'static-web/scripts/validate-xizong-memory-style-ownership.mjs'
      - 'static-web/scripts/validate-xizong-memory-workspace.mjs'
      - 'static-web/scripts/validate-xizong-memory-retention.mjs'
      - 'static-web/scripts/validate-xizong-memory-auto-release.mjs'
      - 'static-web/scripts/test-xizong-memory-workspace-browser.mjs'
      - 'static-web/scripts/test-xizong-memory-auto-release-browser.mjs'
      - 'static-web/scripts/test-xizong-prepared-memory-browser.mjs'
      - 'static-web/scripts/test-xizong-prepared-memory-availability.mjs'
      - 'static-web/scripts/test-xizong-memory-presentation.mjs'
