name: Xizong Memory Workspace

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'static-web/XIZONG_MEMORY_PRODUCT.md'
      - 'static-web/src/lib/xizongMemory*.mjs'
      - 'static-web/src/components/XizongMemoryWorkspace.astro'
      - 'static-web/src/components/XizongMemoryReleaseBridge.astro'
      - 'static-web/src/pages/xizong/memory/**'
      - 'static-web/src/pages/xizong/[system]/[block].astro'
      - 'static-web/src/styles/xizong-memory-workspace.css'
      - 'static-web/scripts/validate-xizong-memory-style-ownership.mjs'
      - 'static-web/scripts/validate-xizong-memory-workspace.mjs'
      - 'static-web/scripts/validate-xizong-memory-auto-release.mjs'
      - 'static-web/scripts/test-xizong-memory-workspace-browser.mjs'
      - 'static-web/scripts/test-xizong-chat-session-browser.mjs'
      - 'static-web/scripts/test-xizong-memory-auto-release-browser.mjs'
      - '.github/workflows/xizong-memory-workspace.yml'

permissions:
  contents: read

jobs:
  memory-workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-web
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Memory single visual owner
        run: node scripts/validate-xizong-memory-style-ownership.mjs
      - name: Validate Memory model and surface contract
        run: node scripts/validate-xizong-memory-workspace.mjs
      - name: Validate Block Complete Memory release contract
        run: node scripts/validate-xizong-memory-auto-release.mjs
      - name: Build Astro
        run: npm run build
      - name: Install isolated browser acceptance tool
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute Memory browser journey
        run: node scripts/test-xizong-memory-workspace-browser.mjs
      - name: Execute Block Complete Memory release journey
        run: node scripts/test-xizong-memory-auto-release-browser.mjs
      - name: Execute Chat-controlled Xizong review journey
        run: node scripts/test-xizong-chat-session-browser.mjs
      - name: Upload Memory browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xizong-memory-workspace-browser
          path: |
            static-web/.qa/xizong-memory-workspace-browser.json
            static-web/.qa/xizong-memory-workspace.png
            static-web/.qa/xizong-memory-auto-release-browser.json
            static-web/.qa/xizong-chat-session-browser.json
          if-no-files-found: warn
