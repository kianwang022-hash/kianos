      - 'static-web/src/lib/xizongProductionProjection.mjs'
      - 'static-web/src/components/XizongBlockV6.astro'
      - 'content/xizong/knowledge/learner/a2-respiratory-learning-cues.json'
      - 'content/xizong/knowledge/learner/shared-fields.json'
      - 'content/xizong/knowledge/systems/a2-respiratory/**'
      - 'content/xizong/projection/a2-respiratory/chat/**'
      - '.github/workflows/xizong-memory-workspace.yml'

permissions:
  contents: read

jobs:
  memory-workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-web
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Memory single visual owner
        run: node scripts/validate-xizong-memory-style-ownership.mjs
      - name: Validate Memory model and surface contract
        run: node scripts/validate-xizong-memory-workspace.mjs
      - name: Validate Block Complete Memory release contract
        run: node scripts/validate-xizong-memory-auto-release.mjs
      - name: Validate selective delayed retention clock
        run: node scripts/validate-xizong-memory-retention.mjs
      - name: Validate coherent A1 prepared owners and negative freshness cases
        run: node scripts/test-xizong-a1-system-prepared-memory.mjs
      - name: Validate coherent A2 native owners and negative freshness cases
        run: node scripts/test-xizong-a2-system-prepared-memory.mjs
      - name: Validate coherent A3 native owners and independent legacy snapshots
        run: node scripts/test-xizong-a3-system-prepared-memory.mjs
      - name: Validate same-model reader retrieval and exact owner destinations
        run: python3 scripts/test-xizong-reader-retrieval.py
      - name: Validate prepared Memory grouping and provenance disclosure
        run: node scripts/test-xizong-memory-presentation.mjs
      - name: Validate A3 raw pre-entry routing and legacy compatibility
        run: node scripts/test-xizong-a3-preentry.mjs
      - name: Validate B5 full contract bytes and fresh-process raw owner mutations
        run: python3 scripts/test-xizong-a3-raw-owner-mutations.py
      - name: Validate Study dock cannot override complete eligibility
        run: node scripts/test-xizong-study-dock-completion-gate.mjs
      - name: Validate A1, A2 and A3 post-Chat state and prerequisite gates
        run: node scripts/test-xizong-post-chat-recall.mjs
      - name: Build Astro
        run: npm run build
      - name: Install isolated browser acceptance tool
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute Memory browser journey
        run: node scripts/test-xizong-memory-workspace-browser.mjs
      - name: Execute Block Complete Memory release journey
        run: node scripts/test-xizong-memory-auto-release-browser.mjs
      - name: Upload Memory browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xizong-memory-workspace-browser
          path: |
            static-web/.qa/xizong-a2-system-prepared-memory.json
            static-web/.qa/xizong-a3-system-prepared-memory.json
            static-web/.qa/xizong-a3-preentry.json
            static-web/.qa/xizong-a3-raw-owner-mutations.json
            static-web/.qa/xizong-memory-workspace-browser.json
            static-web/.qa/xizong-memory-workspace.png
            static-web/.qa/xizong-memory-auto-release-browser.json
            static-web/.qa/xizong-prepared-memory-browser/
          if-no-files-found: warn

