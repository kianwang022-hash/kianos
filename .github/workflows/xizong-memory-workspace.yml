      - 'static-web/scripts/test-xizong-a1-system-prepared-memory.mjs'
      - 'static-web/scripts/test-xizong-a2-system-prepared-memory.mjs'
      - 'static-web/scripts/test-xizong-a2-prepared-memory-browser.mjs'
      - 'static-web/scripts/test-xizong-a3-prepared-memory-browser.mjs'
      - 'static-web/scripts/test-xizong-a3-system-prepared-memory.mjs'
      - 'static-web/scripts/test-xizong-a3-preentry.mjs'
      - 'static-web/scripts/test-xizong-a3-raw-owner-mutations.py'
      - 'static-web/scripts/xizong-a3-raw-owner-probe.mjs'
      - 'static-web/scripts/xizong-a3-raw-admission-probe.mjs'
      - 'static-web/scripts/fixtures/a3-*.json'
      - 'content/xizong/knowledge/learner/a3-urinary-*.json'
      - 'content/xizong/knowledge/systems/a3-urinary/**'
      - 'content/xizong/projection/a3-urinary/chat/**'
      - 'static-web/src/lib/xizongLearningCues.mjs'
      - 'static-web/src/lib/xizongProductionProjection.mjs'
      - 'static-web/src/components/XizongBlockV6.astro'
      - 'content/xizong/knowledge/learner/a2-respiratory-learning-cues.json'
      - 'content/xizong/knowledge/learner/shared-fields.json'
      - 'content/xizong/knowledge/systems/a2-respiratory/**'
      - 'content/xizong/projection/a2-respiratory/chat/**'
