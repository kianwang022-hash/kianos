name: LexicalOS Current Runtime

on:
  push:
    branches:
      - main
    paths:
      - 'LEARNING_ACCEPTANCE.md'
      - 'content/lexical/**'
      - 'static-web/package.json'
      - 'static-web/astro.config.mjs'
      - 'static-web/src/layouts/**'
      - 'static-web/src/styles/global.css'
      - 'static-web/src/styles/runtime.css'
      - 'static-web/src/styles/lexical*.css'
      - 'static-web/src/styles/vocabulary*.css'
      - 'static-web/src/lib/current.mjs'
      - 'static-web/src/lib/lexical*.mjs'
      - 'static-web/src/components/Lexical*.astro'
      - 'static-web/src/pages/vocabulary.astro'
      - 'static-web/src/pages/vocabulary/**'
      - 'static-web/src/pages/lexical.astro'
      - 'static-web/src/pages/lexical/**'
      - 'static-web/scripts/*lexical*.mjs'
      - '.github/workflows/lexical-runtime.yml'
  pull_request:
    paths:
      - 'LEARNING_ACCEPTANCE.md'
      - 'content/lexical/**'
      - 'static-web/package.json'
      - 'static-web/astro.config.mjs'
      - 'static-web/src/layouts/**'
      - 'static-web/src/styles/global.css'
      - 'static-web/src/styles/runtime.css'
      - 'static-web/src/styles/lexical*.css'
      - 'static-web/src/styles/vocabulary*.css'
      - 'static-web/src/lib/current.mjs'
      - 'static-web/src/lib/lexical*.mjs'
      - 'static-web/src/components/Lexical*.astro'
      - 'static-web/src/pages/vocabulary.astro'
      - 'static-web/src/pages/vocabulary/**'
      - 'static-web/src/pages/lexical.astro'
      - 'static-web/src/pages/lexical/**'
      - 'static-web/scripts/*lexical*.mjs'
      - '.github/workflows/lexical-runtime.yml'

permissions:
  contents: read

concurrency:
  group: lexical-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate lexical JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          roots = [
              Path('content/lexical/manifest.json'),
              Path('content/lexical/schema.json'),
              Path('content/lexical/continuation.json'),
              Path('content/lexical/learner/packet-contract.json'),
          ]
          roots += list(Path('content/lexical/words/by-ordinal').glob('*.json'))
          roots += list(Path('content/lexical/relations/by-id').glob('*/*.json'))
          roots += [Path('content/lexical/final-learner-object-decisions.json'), Path('content/lexical/learner/final/manifest.json')]
          roots += list(Path('content/lexical/learner/final/shards').glob('*.json'))
          for path in roots:
              json.loads(path.read_text())
          print(f'validated {len(roots)} lexical JSON files')
          PY

      - name: Verify Current catalog and representative hydration
        working-directory: static-web
        run: |
          node --input-type=module - <<'NODE'
          import {
            inspectLexicalSources,
            listLexicalOrdinals,
            listLexicalWordSummaries,
            loadLexicalWordByOrdinal
          } from './src/lib/lexical.mjs';

          const inspection = inspectLexicalSources();
          if (inspection.status !== 'ready' || inspection.semanticAuthority !== true) throw new Error('LEXICAL_SOURCE_NOT_READY');
          if (inspection.websiteConsumesFinalLearnerObject !== true) throw new Error('LEXICAL_WEBSITE_NOT_ON_FINAL_LEARNER_OBJECT');

          const ordinalsAll = listLexicalOrdinals();
          const summaries = listLexicalWordSummaries();
          if (ordinalsAll.length !== inspection.wordCount || summaries.length !== inspection.wordCount) throw new Error('LEXICAL_CATALOG_COUNT_MISMATCH');
          if (inspection.wordCount !== 7946) throw new Error('LEXICAL_CURRENT_WORD_COUNT_UNEXPECTED');
          if (ordinalsAll[0] !== 1 || ordinalsAll.at(-1) !== inspection.wordCount) throw new Error('LEXICAL_ORDINAL_RANGE_INVALID');
          if (summaries.some((row, index) => row.ordinal !== index + 1 || !row.objectId || !row.word)) throw new Error('LEXICAL_CATALOG_SUMMARY_INVALID');

          const ordinals = [1917, 1931, 1259, 1264, 1282, 314, 1670];
          const words = ordinals.map(loadLexicalWordByOrdinal);
          if (words.length !== ordinals.length) throw new Error('LEXICAL_VALIDATION_BATCH_INCOMPLETE');
          const byWord = Object.fromEntries(words.map((item) => [item.record.word, item]));
          if (!byWord.deduct.record.constructions.some((item) => item.pattern === 'deduct A from B')) throw new Error('DEDUCT_CONSTRUCTION_MISSING');
          if (!byWord.default.record.constructions.some((item) => item.pattern === 'by default')) throw new Error('DEFAULT_BY_DEFAULT_MISSING');
          if ((byWord.delicate.record.secondary_senses || []).length < 2) throw new Error('DELICATE_DEPTH_BRANCHES_MISSING');
          if (!(byWord.fine.record.secondary_senses || []).some((item) => item.definition_cn === '处以罚款')) throw new Error('FINE_HIDDEN_SENSE_MISSING');
          if (!(byWord.assure.record.reference?.relations || []).some((item) => item.target_word === 'ensure')) throw new Error('ASSURE_ENSURE_RELATION_MISSING');
          if (!(byWord.ensure.record.reference?.relations || []).some((item) => item.target_word === 'assure')) throw new Error('ENSURE_ASSURE_RELATION_MISSING');
          NODE

      - name: Install Astro dependencies
        working-directory: static-web
        run: npm install --no-audit --no-fund

      - name: Build Astro
        working-directory: static-web
        run: npm run build
