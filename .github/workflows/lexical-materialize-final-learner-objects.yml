name: Lexical Materialize Final Learner Objects

on:
  push:
    branches:
      - work/lexical-architecture-v2-20260918
    paths:
      - 'content/lexical/learner/final/materialize-trigger.json'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lexical-architecture-v2-20260918
          fetch-depth: 0

      - name: Build Final Learner Objects
        run: python tools/lexical_build_final_learner_objects.py

      - name: Verify catalog closure
        run: |
          python - <<'PY'
          import json
          m=json.load(open('content/lexical/learner/final/manifest.json',encoding='utf-8'))
          assert m['object_count']==7946, m
          assert len(m['shards'])>100, m
          print({'object_count':m['object_count'],'shard_count':len(m['shards'])})
          PY

      - name: Commit materialized learner objects
        run: |
          git config user.name "KianOS Lexical Materializer"
          git config user.email "actions@users.noreply.github.com"
          git add content/lexical/learner/final
          git commit -m "content(lexical): materialize Final Learner Objects"
          git push origin HEAD:work/lexical-architecture-v2-20260918
