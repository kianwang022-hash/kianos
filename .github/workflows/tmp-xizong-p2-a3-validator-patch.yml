name: Temp Xizong P2 A3 Validator Patch

on:
  push:
    branches:
      - work/xizong-second-pass-p2-targeted-queue

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/xizong-second-pass-p2-targeted-queue
          fetch-depth: 0
      - name: Update A3 Evidence validator
        run: node static-web/scripts/tmp-p2-a3-validator-patch.mjs
      - name: Commit validator update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static-web/scripts/validate-xizong-a3-evidence.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(xizong): validate A3 holdout before phase-aware queue"
          git push origin HEAD:work/xizong-second-pass-p2-targeted-queue
