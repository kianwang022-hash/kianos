name: Lexical #245 continuous v4

on:
  push:
    branches:
      - lexical/pkg245-exec
    paths:
      - 'tools/lexical_execute_o4875_o5374_v4.py'
      - '.github/workflows/lexical-pkg245-continuous-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexical-pkg245-continuous-v4
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      KIANOS_BASELINE_MAIN: 70bdbf12f87ab8707e95d0a8f998457497ef5622
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg245-exec
          fetch-depth: 0

      - name: Validate package manifest
        run: |
          python tools/lexical_execute_o4875_o5374_v4.py --validate-manifest
          python -m py_compile tools/lexical_manifest_o4875_o5374.py tools/lexical_execute_o4875_o5374.py tools/lexical_execute_o4875_o5374_v2.py tools/lexical_execute_o4875_o5374_v3.py tools/lexical_execute_o4875_o5374_v4.py tools/lexical_verify_o4875_o5374.py tools/lexical_package_runtime.py

      - name: Execute package from durable receipts
        run: |
          set -euo pipefail
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          ranges=(4875-4924 4925-4974 4975-5024 5025-5074 5075-5124 5125-5174 5175-5224 5225-5274 5275-5324 5325-5374)
          for i in $(seq 0 9); do
            r=${ranges[$i]}
            receipt="content/lexical/execution/receipts/o${r%-*}-o${r#*-}.json"
            if [ -f "$receipt" ]; then
              echo "RESUME_SKIP checkpoint=$i range=$r"
              continue
            fi
            echo "EXECUTE checkpoint=$i range=$r"
            python tools/lexical_execute_o4875_o5374_v4.py --checkpoint "$i"
            python tools/test_lexical_transport_guards.py
            python tools/test_lexical_shard.py
            python - <<'PY'
          import json, subprocess
          from pathlib import Path
          changed=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          targets=[p for p in changed if p.startswith('content/lexical/') and p.endswith('.json') and Path(p).exists()]
          for p in targets: json.loads(Path(p).read_text(encoding='utf-8'))
          print('CHECKPOINT_JSON_PASS',len(targets))
          PY
            git add content/lexical
            git commit -m "lexical: execute o${r%-*}-o${r#*-} internal receipt [skip ci]"
            git push origin HEAD:lexical/pkg245-exec
          done

      - name: Package verification
        run: |
          python tools/lexical_verify_o4875_o5374.py
          python tools/lexical_natural_owner.py audit
          python tools/test_lexical_transport_guards.py
          python tools/test_lexical_shard.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          base='70bdbf12f87ab8707e95d0a8f998457497ef5622'
          changed=subprocess.check_output(['git','diff','--name-only',f'{base}..HEAD'],text=True).splitlines()
          targets=[p for p in changed if p.startswith('content/lexical/') and p.endswith('.json') and Path(p).exists()]
          for p in targets: json.loads(Path(p).read_text(encoding='utf-8'))
          print('PACKAGE_JSON_PASS',len(targets))
          PY

      - name: Full Astro build
        working-directory: static-web
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run build

      - name: Finalize durable package receipt
        env:
          KIANOS_ASTRO_BUILD: PASS
        run: |
          python tools/lexical_verify_o4875_o5374.py --finalize
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical/execution/o4875-o5374.package-receipt.json
          git commit -m 'lexical: verify o4875-o5374 package closure [skip ci]'
          git push origin HEAD:lexical/pkg245-exec
