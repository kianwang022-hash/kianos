name: Lexical Execute o3725-o3774

on:
  push:
    branches:
      - lexical/execute-o3625-o3874-20260916
    paths:
      - .github/workflows/lexical-execute-o3725-o3774.yml

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Current gate and restore helper
        shell: bash
        run: |
          set -euo pipefail
          BASE=78aecd90163ad735e389708b2562a5b8671dede8
          git fetch origin main:refs/remotes/origin/main
          DRIFT=$(git diff --name-only "$BASE..origin/main" -- content/lexical/words/by-ordinal content/lexical/canonical/senses/shards content/lexical/canonical/collocations/shards content/lexical/relations/by-id content/lexical/relations/manifest.json || true)
          if [ -n "$DRIFT" ]; then echo "LEXICAL_SEMANTIC_DRIFT_SINCE_EXECUTION_BASE"; echo "$DRIFT"; exit 1; fi
          git fetch origin 4c85edc2911928e20e264bb13d232949bb953984:refs/remotes/origin/forward-helper
          git show origin/forward-helper:tools/lexical_apply_retro_o0025_o0224.py > tools/lexical_apply_retro_o0025_o0224.py
      - name: Patch executor syntax only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/lexical_apply_forward_o3725_o3774.py')
          t=p.read_text()
          old="fwd.add_construction(s,3769,\"prey on one's mind\",'萦绕心头；使人持续担忧','to worry, trouble, or occupy someone’s mind persistently',level='L1','idiomatic psychological use, not literal predation')"
          new="fwd.add_construction(s,3769,\"prey on one's mind\",'萦绕心头；使人持续担忧','to worry, trouble, or occupy someone’s mind persistently',source_sid=None,level='L1',boundary='idiomatic psychological use, not literal predation')"
          if old not in t: raise SystemExit('PREY_PATCH_ANCHOR_MISSING')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Execute shard
        run: python tools/lexical_apply_forward_o3725_o3774.py
      - name: Natural Owner audit
        run: python tools/lexical_natural_owner.py audit
      - name: Transport guards
        run: python tools/test_lexical_transport_guards.py
      - name: Shard tests
        run: python tools/test_lexical_shard.py
      - name: Parse all Lexical JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          n=0
          for p in Path('content/lexical').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8')); n+=1
          print('parsed',n,'lexical json files')
          PY
      - name: Exact shard diff gate
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          expected={3725,3726,3730,3735,3737,3739,3743,3744,3745,3747,3752,3753,3756,3757,3766,3768,3769,3770,3773,3774,3788,3794}
          raw=subprocess.check_output(['git','status','--porcelain=v1','-z','--untracked-files=all']); changed=set(); bad=[]
          for e in raw.split(b'\0'):
              if not e: continue
              p=e.decode('utf-8','surrogateescape')[3:]
              if ' -> ' in p: p=p.split(' -> ',1)[1]
              if p.startswith('content/lexical/words/by-ordinal/o') and p.endswith('.json'): changed.add(int(p.rsplit('/o',1)[1][:-5])); continue
              if p.startswith('content/lexical/canonical/senses/shards/') or p.startswith('content/lexical/canonical/collocations/shards/'): continue
              if p.startswith('content/lexical/relations/by-id/') or p=='content/lexical/relations/manifest.json': continue
              if p=='content/lexical/execution/receipts/o3725-o3774.json': continue
              if p.startswith('tools/'): continue
              if p.startswith('content/lexical/'): bad.append(p)
          if changed!=expected: raise SystemExit(f'WORD_WRITE_SET_MISMATCH:{sorted(changed)}')
          if bad: raise SystemExit(f'UNAUTHORIZED_LEXICAL_PATHS:{sorted(set(bad))}')
          print('exact shard diff gate PASS')
          PY
      - name: Commit shard result
        shell: bash
        run: |
          set -euo pipefail
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "Kian"; git config user.email "kianwang022@gmail.com"
          git add content/lexical/words/by-ordinal content/lexical/canonical/senses/shards content/lexical/canonical/collocations/shards content/lexical/relations content/lexical/execution/receipts/o3725-o3774.json
          git diff --cached --quiet && { echo 'No shard changes'; exit 1; }
          git commit -m "lexical: execute forward shard o3725-o3774"
          git push origin HEAD
