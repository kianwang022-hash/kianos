name: English Current Cleanup Once

on:
  push:
    branches: ['chat/english-current-cleanup']
  pull_request:
    branches: [main]
    paths:
      - 'content/english/**'
      - '.github/workflows/english-current-cleanup-once.yml'

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[english-cleanup-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/english-current-cleanup
          fetch-depth: 0
      - name: Apply bounded English reconciliation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}')
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              'content/english/modules/translation/learning.md',
              '''MAIN\n越来越依赖某些 systems\n→ may create new problems''',
              '''MAIN\n对某些 systems 的依赖日益加深\n→ may create new problems'''
          )

          replace_exact(
              'content/english/modules/translation/learning.md',
              '''> 人们越来越依赖那些旨在简化决策的系统；如果使用者想当然地认为这些系统始终可靠，这种依赖反而可能带来新的问题。\n\n这里做了几件合法的 form change：\n\n```text\n名词化 reliance → “人们越来越依赖”\n长 modifier → 放回 systems 后理解，再在中文里自然承载\nwhen-clause → 条件 / 情境前置\nreference → “这种依赖 / 这些系统”适度显化\n```''',
              '''> 对那些旨在简化决策的系统的依赖日益加深；当使用者想当然地认为这些系统始终可靠时，这种依赖可能带来新的问题。\n\n这里做了几件合法的 form change，同时守住 Fidelity：\n\n```text\nthe growing reliance → 保留为“依赖日益加深”，不新增原文未明示的通用施事\n长 modifier → 放回 systems 后理解，再在中文里自然承载\nwhen-clause → 时间 / 情境关系前置，不强化成“如果”条件\nreference → “这种依赖 / 这些系统”适度显化\n```'''
          )

          replace_exact(
              'content/english/modules/translation/learning.reference.md',
              '''> **定位**：Translation 的 Current learner-facing 能力资产。  \n> **第一次学习**：先建立整张能力地图，再连续学习 4 个 Core Learning Blocks；不要把第一次学习切成几十个孤立 Skill。''',
              '''> **定位**：Translation 的**保留型高密度 repair / reference reservoir**；它不是 Current learner-facing 首学路线。Current learner-facing authority 是同目录 `learning.md`。  \n> **当前入口**：Current 首学采用 `Representation → Reconstruction under Fidelity → Delivery` 三块主干，并且 targeted / skippable。下文旧版四块结构保留用于需要时下钻，不构成必修顺序。  \n> **历史结构边界**：下文任何“第一次学习连续建立 4 个 Core Learning Blocks”之类措辞都只描述旧版组织，不得重新解释为 Current Runtime / Projection 指令。'''
          )

          replace_exact(
              'content/english/modules/writing/learning.reference.md',
              '''> **定位**：Writing 的 Current learner-facing 能力资产。  \n> **适用状态**：学习者此前没有系统做过考研英语作文，需要先把“从题目生成一篇合格作文”的能力建立起来，再进入宝贵真题。  \n> **第一次学习**：先建立整张 Global Map，再连续学习 Core Learning Blocks；不要把第一次学习切成几十个孤立技巧、模板或句型。''',
              '''> **定位**：Writing 的**保留型高密度 repair / reference reservoir**；它不是 Current learner-facing 首学路线。Current learner-facing authority 是同目录 `learning.md`。  \n> **当前入口**：Current Writing 以六个真实 primitives 为主干，First Learning targeted / skippable；真实 productive Runtime evidence 而不是 Guide 完成度决定后续动作。  \n> **历史结构边界**：下文旧版 B1–B8 连续学习与“先完整框架再进入真题”的措辞仅作为深层参考结构保留，不得重新解释为 Current 必修入口或 true-exam gate。'''
          )

          receipt = Path('content/english/audit/2026-09-16-post-optimization-reconciliation.md')
          receipt.parent.mkdir(parents=True, exist_ok=True)
          receipt.write_text('''# English post-optimization reconciliation — 2026-09-16\n\nStatus: **BOUNDED RECONCILIATION APPLIED**  \nAuthority: `content/english/CURRENT.md` + scoped Current / Acceptance + `content/english/LEARNING_CONTRACT.md`  \nOriginating audit evidence: PR #137  \nTracking issue: #178\n\n## Scope\n\nThis reconciliation closes only the three bounded post-optimization K/L debts identified by fresh audit. It does not reopen Source, Runtime, Evidence, protected-material boundaries, or learner U.\n\n### T1 — Translation Fidelity exemplar\n\nRepaired the Integrated Walkthrough so the Chinese reconstruction no longer:\n\n- invents an explicit generic human agent for `the growing reliance ...`;\n- strengthens `when` into an `if`-style condition.\n\nThe example now preserves agent neutrality and the source relation while still demonstrating legitimate Chinese restructuring.\n\n### T2 — Translation deep-reference status\n\n`translation/learning.reference.md` is now explicitly labeled as a preserved high-density repair/reference reservoir. The Current learner-facing route remains the three-core model in `translation/learning.md`; historical four-block wording inside the preserved body is not Current Runtime/Projection instruction.\n\n### W1 — Writing deep-reference status\n\n`writing/learning.reference.md` is now explicitly labeled as a preserved high-density repair/reference reservoir. Current learner-facing Writing remains the six-primitive, targeted/skippable model in `writing/learning.md`; historical B1–B8 wording is not a mandatory Current entry path or true-exam gate.\n\n## Frozen boundaries\n\n- Objective: no semantic delta.\n- Translation Runtime / Evidence / Projection semantics: unchanged.\n- Writing Runtime / Evidence / Projection semantics: unchanged.\n- Lexical ownership boundary: unchanged.\n- Protected true-exam material: untouched.\n- Learner U: not inferred.\n\nAfter existing English QA passes on this exact branch, PR #137 can be retained only as historical audit evidence and English returns to its existing S–E frozen state.\n''')
          PY
      - name: Commit bounded reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/english/modules/translation/learning.md \
                  content/english/modules/translation/learning.reference.md \
                  content/english/modules/writing/learning.reference.md \
                  content/english/audit/2026-09-16-post-optimization-reconciliation.md
          if git diff --cached --quiet; then
            echo 'No cleanup changes needed.'
            exit 0
          fi
          git commit -m 'fix(english): reconcile post-optimization K/L debt [english-cleanup-applied]'
          git push origin HEAD:chat/english-current-cleanup
