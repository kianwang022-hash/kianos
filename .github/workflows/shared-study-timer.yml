name: Shared Study Timer

on:
  pull_request:
    paths:
      - '.github/workflows/shared-study-timer.yml'
      - 'static-web/src/lib/studyTimer.mjs'
      - 'static-web/src/lib/studyTimerClient.mjs'
      - 'static-web/src/lib/studyTimerReview.mjs'
      - 'static-web/src/lib/studyTimerDockClient.mjs'
      - 'static-web/src/lib/examStudyTime.mjs'
      - 'static-web/src/lib/examOrchestrator.mjs'
      - 'static-web/src/lib/examOrchestratorClient.mjs'
      - 'static-web/src/lib/examPlanReadModel.mjs'
      - 'static-web/src/lib/dailyLearningPacket.mjs'
      - 'static-web/src/components/StudyTimerDock.astro'
      - 'static-web/src/styles/study-timer.css'
      - 'static-web/src/layouts/Base.astro'
      - 'static-web/scripts/test-study-timer.mjs'
      - 'static-web/scripts/test-study-timer-review.mjs'
      - 'static-web/scripts/test-exam-study-time.mjs'
      - 'static-web/scripts/test-exam-current-phases.mjs'
      - 'static-web/scripts/test-study-timer-dock.mjs'
      - 'static-web/scripts/test-study-timer-dock-browser.mjs'
      - 'static-web/scripts/test-exam-plan-read-model.mjs'
      - 'static-web/scripts/test-exam-plan-publish.mjs'
      - 'static-web/scripts/test-daily-learning-packet.mjs'
      - 'static-web/src/lib/privateCheckpointRuntime.mjs'
      - 'static-web/src/lib/privateCheckpointRuntime.mjs'
      - 'static-web/src/lib/privateLearnerCheckpoint.mjs'
      - 'static-web/src/lib/privateLearnerCheckpoint.mjs'
      - 'static-web/src/lib/privateSubjectCheckpoints.mjs'
      - 'static-web/src/lib/privateSubjectCheckpoints.mjs'
      - 'static-web/src/lib/xizongPrivateCheckpoint.mjs'
      - 'static-web/src/lib/xizongPrivateCheckpoint.mjs'
      - 'static-web/scripts/privateLearnerBridge.mjs'
      - 'static-web/scripts/privateLearnerBridge.mjs'
      - 'static-web/scripts/privateLearnerStore.mjs'
      - 'static-web/scripts/privateLearnerStore.mjs'
      - 'static-web/scripts/test-private-learner-checkpoint.mjs'
      - 'static-web/scripts/test-private-learner-checkpoint.mjs'
      - 'static-web/package.json'
  push:
    paths:
      - '.github/workflows/shared-study-timer.yml'
      - 'static-web/src/lib/studyTimer.mjs'
      - 'static-web/src/lib/studyTimerClient.mjs'
      - 'static-web/src/lib/studyTimerReview.mjs'
      - 'static-web/src/lib/studyTimerDockClient.mjs'
      - 'static-web/src/lib/examStudyTime.mjs'
      - 'static-web/src/lib/examOrchestrator.mjs'
      - 'static-web/src/lib/examOrchestratorClient.mjs'
      - 'static-web/src/lib/examPlanReadModel.mjs'
      - 'static-web/src/lib/dailyLearningPacket.mjs'
      - 'static-web/src/components/StudyTimerDock.astro'
      - 'static-web/src/styles/study-timer.css'
      - 'static-web/src/layouts/Base.astro'
      - 'static-web/scripts/test-study-timer.mjs'
      - 'static-web/scripts/test-study-timer-review.mjs'
      - 'static-web/scripts/test-exam-study-time.mjs'
      - 'static-web/scripts/test-exam-current-phases.mjs'
      - 'static-web/scripts/test-study-timer-dock.mjs'
      - 'static-web/scripts/test-study-timer-dock-browser.mjs'
      - 'static-web/scripts/test-exam-plan-read-model.mjs'
      - 'static-web/scripts/test-exam-plan-publish.mjs'
      - 'static-web/scripts/test-daily-learning-packet.mjs'
      - 'static-web/package.json'

permissions:
  contents: read

concurrency:
  group: shared-study-timer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timer-logic-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install learner site dependencies
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Test shared study timer and scheduler logic
        working-directory: static-web
        run: npm run test:study-timer
      - name: Build learner site
        working-directory: static-web
        run: npm run build
      - name: Install isolated browser acceptance tool
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify nonblocking timer dock in browser
        working-directory: static-web
        run: node scripts/test-study-timer-dock-browser.mjs
      - name: Save timer UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-timer-ui-${{ github.sha }}
          path: study-timer-ui-audit/
          retention-days: 7
