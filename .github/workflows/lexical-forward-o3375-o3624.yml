name: Lexical Forward o3375-o3624

on:
  push:
    branches:
      - lexical/forward-o3375-o3624-20260916
    paths:
      - .github/workflows/lexical-forward-o3375-o3624.yml

permissions:
  contents: write

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current forward branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch verified candidate, lawful precheckpoint, and Current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git fetch origin 4c85edc2911928e20e264bb13d232949bb953984:refs/remotes/origin/verified-forward-candidate
          git fetch origin d27c00375a2e8b1e25c9e406627c0c8b0dc1eb61:refs/remotes/origin/forward-precheckpoint

      - name: Revalidate exact package prestate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          CAND='origin/verified-forward-candidate'; PRE='origin/forward-precheckpoint'
          WINDOWS=['o3375-o3424','o3425-o3474','o3475-o3524','o3525-o3574','o3575-o3624']
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          def show(ref,p): return git('show',f'{ref}:{p}')
          def exists(ref,p): return subprocess.run(['git','cat-file','-e',f'{ref}:{p}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
          changed=set()
          for w in WINDOWS:
              r=json.loads(show(CAND,f'content/lexical/execution/receipts/{w}.json'))
              changed |= {int(x) for x in r.get('changed_word_ordinals',[])}
          owners=set(range(3375,3625))|changed
          bad=[]
          for o in sorted(owners):
              p=f'content/lexical/words/by-ordinal/o{o:04d}.json'
              if not exists(PRE,p) or not Path(p).exists() or json.loads(show(PRE,p))!=json.loads(Path(p).read_text()): bad.append(p)
          # Package-specific Relation + registry inputs must equal the lawful precheckpoint too.
          diff_paths=git('diff','--name-only',f'{PRE}..{CAND}','--',
              'content/lexical/relations/by-id','content/lexical/relations/manifest.json',
              'content/lexical/canonical/senses/shards','content/lexical/canonical/collocations/shards',
              'content/lexical/canonical/lookup/spelling').splitlines()
          for p in filter(None,diff_paths):
              pre=exists(PRE,p); cur=Path(p).exists()
              if pre!=cur: bad.append(p); continue
              if pre and json.loads(show(PRE,p))!=json.loads(Path(p).read_text()): bad.append(p)
          if bad: raise SystemExit('FORWARD_PRESTATE_DRIFT_REQUIRES_SOL:'+json.dumps(sorted(set(bad)),ensure_ascii=False))
          print(json.dumps({'package_owners':250,'exact_word_targets_including_dependencies':len(owners),'package_specific_dependency_paths':len(diff_paths),'prestate':'PASS'},indent=2))
          PY

      - name: Restore Current-revalidated Sol authority and executor stack
        shell: bash
        run: |
          set -euo pipefail
          CAND=origin/verified-forward-candidate
          mkdir -p content/lexical/semantic-reconciliation
          git show "$CAND:content/lexical/semantic-reconciliation/o3375-o3624.md" > /tmp/authority.md
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/authority.md'); text=p.read_text()
          text=text.replace('Status: **RECONCILED / READY_FOR_BOUNDED_FORWARD_IMPLEMENTATION**','Status: **CURRENT-REVALIDATED / READY_FOR_BOUNDED_FORWARD_IMPLEMENTATION**',1)
          text=text.replace('- Current branch execution baseline: `lexical/retro-audit-debt-20260915`','- Current execution baseline: `main@301d4af2ee8640c8a0aeaf93811d00a283f5ee72`; the historical branch name is provenance only.',1)
          note='''\n## 2026-09-16 Current revalidation\n\nThe earlier Chat lane/accounting was wrong, but the semantic inputs were the correct Production + Independent Audit evidence for this forward package. This authority is reused only after a fresh gate proved the complete package owner/dependency prestate equals lawful pre-forward checkpoint `d27c00375a2e8b1e25c9e406627c0c8b0dc1eb61`. The user has now explicitly continued the task of landing the already-reviewed catalog. `o3625+` remains not activated.\n\n'''
          text=text.replace('## Frozen inputs\n',note+'## Frozen inputs\n',1)
          Path('content/lexical/semantic-reconciliation/o3375-o3624.md').write_text(text)
          PY
          for s in \
            lexical_apply_retro_o0025_o0224.py \
            lexical_apply_retro_o2425_o2624.py \
            lexical_apply_forward_o3375_o3424.py \
            lexical_apply_forward_o3425_o3474.py \
            lexical_apply_forward_o3475_o3524.py \
            lexical_apply_forward_o3525_o3574.py \
            lexical_apply_forward_o3575_o3624.py; do
            git show "$CAND:tools/$s" > "tools/$s"
          done

      - name: Replay five bounded forward shards
        shell: bash
        run: |
          set -euo pipefail
          for s in lexical_apply_forward_o3375_o3424.py lexical_apply_forward_o3425_o3474.py lexical_apply_forward_o3475_o3524.py lexical_apply_forward_o3525_o3574.py lexical_apply_forward_o3575_o3624.py; do
            echo "==> $s"; python "tools/$s"
          done

      - name: Verify accepted final package state exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          CAND='origin/verified-forward-candidate'; PRE='origin/forward-precheckpoint'
          WINDOWS=['o3375-o3424','o3425-o3474','o3475-o3524','o3525-o3574','o3575-o3624']
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          def show(ref,p): return git('show',f'{ref}:{p}')
          def exists(ref,p): return subprocess.run(['git','cat-file','-e',f'{ref}:{p}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
          changed=set()
          for w in WINDOWS:
              r=json.loads(Path(f'content/lexical/execution/receipts/{w}.json').read_text())
              changed|={int(x) for x in r.get('changed_word_ordinals',[])}
          owners=set(range(3375,3625))|changed
          for o in sorted(owners):
              p=f'content/lexical/words/by-ordinal/o{o:04d}.json'
              if json.loads(Path(p).read_text())!=json.loads(show(CAND,p)): raise SystemExit(f'FINAL_WORD_MISMATCH:{p}')
          final_paths=git('diff','--name-only',f'{PRE}..{CAND}','--',
              'content/lexical/relations/by-id','content/lexical/relations/manifest.json',
              'content/lexical/canonical/senses/shards','content/lexical/canonical/collocations/shards',
              'content/lexical/canonical/lookup/spelling').splitlines()
          for p in filter(None,final_paths):
              cand=exists(CAND,p); cur=Path(p).exists()
              if cand!=cur: raise SystemExit(f'FINAL_PRESENCE_MISMATCH:{p}')
              if cand and json.loads(Path(p).read_text())!=json.loads(show(CAND,p)): raise SystemExit(f'FINAL_DEPENDENCY_MISMATCH:{p}')
          print(json.dumps({'final_word_owners_verified':len(owners),'final_dependency_paths_verified':len(final_paths),'status':'PASS'},indent=2))
          PY

      - name: Natural Owner registry reconstruction audit
        run: python tools/lexical_natural_owner.py audit
      - name: Lexical transport guards
        run: python tools/test_lexical_transport_guards.py
      - name: Lexical shard tests
        run: python tools/test_lexical_shard.py
      - name: Parse all Lexical JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          n=0
          for p in Path('content/lexical').rglob('*.json'): json.loads(p.read_text(encoding='utf-8')); n+=1
          print('parsed',n,'json files')
          PY
      - name: Install static-web dependencies
        run: npm --prefix static-web install --no-audit --no-fund
      - name: Full Astro build
        run: npm --prefix static-web run build

      - name: Write durable Current forward receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          CAND='origin/verified-forward-candidate'; PRE='origin/forward-precheckpoint'
          WINDOWS=['o3375-o3424','o3425-o3474','o3475-o3524','o3525-o3574','o3575-o3624']
          changed=set(); remote=set(); new=[]; react=[]
          for w in WINDOWS:
              r=json.loads(Path(f'content/lexical/execution/receipts/{w}.json').read_text())
              changed|={int(x) for x in r.get('changed_word_ordinals',[])}
              remote|={int(x) for x in r.get('out_of_range_dependency_ordinals',[])}
              new+=r.get('new_semantic_branch_ids',[]); react+=r.get('reactivated_stable_ids',[])
          rel=subprocess.check_output(['git','diff','--name-only',f'{PRE}..{CAND}','--','content/lexical/relations/by-id'],text=True).splitlines()
          receipt={
            'schema':'kianos.lexical.forward_package_receipt.v2','status':'CURRENT_REVALIDATED_VERIFIED_READY_FOR_MAIN','scope':[3375,3624],
            'production_review':'content/lexical/semantic-review/o3375-o3624.md',
            'audit_inputs':['content/lexical/semantic-audit/o3225-o3424.audit.md','content/lexical/semantic-audit/o3425-o3624.audit.md'],
            'authority':'content/lexical/semantic-reconciliation/o3375-o3624.md','lawful_precheckpoint':'d27c00375a2e8b1e25c9e406627c0c8b0dc1eb61',
            'historical_verified_candidate':'4c85edc2911928e20e264bb13d232949bb953984','semantic_source_union_count':92,
            'exact_word_write_union':len(changed),'out_of_range_dependency_ordinals':sorted(remote),'relation_delta_path_count':len([x for x in rel if x]),
            'new_semantic_branch_count':len(set(new)),'reactivated_stable_count':len(set(react)),
            'checks':{'current_prestate_gate':'PASS','five_executor_replay':'PASS','accepted_final_state':'PASS','natural_owner_registry_audit':'PASS','transport_guards':'PASS','shard_tests':'PASS','all_lexical_json':'PASS','astro_build':'PASS'},
            'workflow':{'run_id':int(os.environ['GITHUB_RUN_ID']),'job':'forward'},'next_catalog':'o3625+ NOT_ACTIVATED'
          }
          Path('content/lexical/execution/receipts/o3375-o3624.forward-package.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Diff hygiene and remove one-time executor transport
        shell: bash
        run: |
          set -euo pipefail
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          for f in tools/lexical_apply_retro_o0025_o0224.py tools/lexical_apply_retro_o2425_o2624.py tools/lexical_apply_forward_o3375_o3424.py tools/lexical_apply_forward_o3425_o3474.py tools/lexical_apply_forward_o3475_o3524.py tools/lexical_apply_forward_o3525_o3574.py tools/lexical_apply_forward_o3575_o3624.py; do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then git show "HEAD:$f" > "$f"; else rm -f "$f"; fi
          done
          python - <<'PY'
          import subprocess
          raw=subprocess.check_output(['git','status','--porcelain=v1','-z','--untracked-files=all'])
          bad=[]
          for e in raw.split(b'\0'):
              if not e: continue
              p=e.decode('utf-8','surrogateescape')[3:]
              if ' -> ' in p: p=p.split(' -> ',1)[1]
              if p.startswith('tools/') or p.startswith('.github/workflows/') and p!='.github/workflows/lexical-forward-o3375-o3624.yml': bad.append(p)
              if p.startswith('content/lexical/canonical/words/') or p.startswith('content/lexical/canonical/relations/'): bad.append(p)
          if bad: raise SystemExit('DIFF_HYGIENE_FAIL:'+str(sorted(set(bad))))
          print('diff hygiene PASS')
          PY

      - name: Commit verified forward package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kian"; git config user.email "kianwang022@gmail.com"
          git add content/lexical
          git diff --cached --quiet && { echo 'No forward changes'; exit 1; }
          git commit -m "lexical: integrate Current-revalidated forward package o3375-o3624"
          git push origin HEAD
