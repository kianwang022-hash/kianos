name: Lexical o4125-o4374 identity preflight

on:
  push:
    branches:
      - lexical/execute-o4125-o4374-20260916
    paths:
      - tools/lexical_apply_o4125_o4374.py
      - .github/workflows/lexical-o4125-o4374-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Current exact identity evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/lexical_apply_o4125_o4374.py --preflight
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('content/lexical/execution/preflight/o4125-o4374.current-identities.json')
          x=json.loads(p.read_text())
          assert x['status']=='READ_ONLY_CURRENT_EVIDENCE'
          assert len(x['source_owners'])==81
          assert x['remote_word_dependencies']==[6139]
          assert len(x['owners'])==82
          print('IDENTITY_PREFLIGHT_SCHEMA_PASS')
          PY
          git config user.name "Kian"
          git config user.email "kianwang022@gmail.com"
          git add content/lexical/execution/preflight/o4125-o4374.current-identities.json
          if git diff --cached --quiet; then
            echo PREFLIGHT_REPORT_UNCHANGED
          else
            git commit -m "lexical: compile o4125-o4374 identity preflight"
            git push origin HEAD:lexical/execute-o4125-o4374-20260916
          fi
