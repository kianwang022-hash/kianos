name: Lexical pkg288 package closure

# Final post-main-sync + governance-compliant Current revalidation gate.
on:
  push:
    branches: [lexical/pkg288-exec]
    paths:
      - '.github/workflows/lexical-pkg288-closure.yml'
      - 'tools/lexical_verify_o6375_o6874.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexical-pkg288-closure
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      KIANOS_BASELINE_MAIN: e5f3f72bce3aeb1e7386beb2984401954565211f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg288-exec
          fetch-depth: 0
      - name: Package verification
        run: |
          python tools/lexical_verify_o6375_o6874.py
          python tools/lexical_natural_owner.py audit
          python tools/test_lexical_transport_guards.py
          python tools/test_lexical_shard.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          base='e5f3f72bce3aeb1e7386beb2984401954565211f'
          changed=subprocess.check_output(['git','diff','--name-only',f'{base}..HEAD'],text=True).splitlines()
          targets=[p for p in changed if p.startswith('content/lexical/') and p.endswith('.json') and Path(p).exists()]
          for p in targets:
              json.loads(Path(p).read_text(encoding='utf-8'))
          print('PACKAGE_JSON_PASS',len(targets))
          PY
      - name: Full Astro build
        working-directory: static-web
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run build
      - name: Finalize durable package receipt
        env:
          KIANOS_ASTRO_BUILD: PASS
        run: |
          python tools/lexical_verify_o6375_o6874.py --finalize
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical/execution/o6375-o6874.package-receipt.json
          if ! git diff --cached --quiet; then
            git commit -m 'lexical: verify o6375-o6874 package closure [skip ci]'
            git push origin HEAD:lexical/pkg288-exec
          fi
