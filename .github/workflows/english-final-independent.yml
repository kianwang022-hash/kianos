name: English Final Fresh Proof
on:
  push:
    branches: [audit/english-final-independent-20260919]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENGLISH_AUDIT_DIR: /tmp/english-final-proof
      KIANOS_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/english-final-independent-20260919
      - name: Shared durability targeted proof
        run: |
          node static-web/scripts/test-private-learner-checkpoint.mjs
      - name: Fresh independent model and adversarial proof
        run: |
          mkdir -p "$ENGLISH_AUDIT_DIR"
          node tools/english-final/model-attacks.mjs
          node tools/english-final/adversarial-attacks.mjs
          node tools/english-final/delivery-recovery-attacks.mjs
      - name: Bounded integration regression
        run: |
          node static-web/scripts/validate-english-chat-control.mjs
          node static-web/scripts/validate-english-exam-session.mjs
          node static-web/scripts/validate-lexical-english-handoff.mjs
