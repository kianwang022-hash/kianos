name: Lexical pkg256 package closure

on:
  push:
    branches: [lexical/pkg256-exec]
    paths:
      - '.github/workflows/lexical-pkg256-closure.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexical-pkg256-closure
  cancel-in-progress: false

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg256-exec
          fetch-depth: 0
      - name: Merge latest main preserving closed Lexical Current
        run: |
          set -euo pipefail
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'PKG256_MAIN_SYNC_CONFLICTS\n%s\n' "${conflicts[@]}"
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != 'content/lexical/CURRENT.md' ]; then
              echo 'UNEXPECTED_MAIN_SYNC_CONFLICT_SET'
              exit 1
            fi
            git checkout --ours content/lexical/CURRENT.md
            git add content/lexical/CURRENT.md
          fi
          git commit -m 'lexical: sync pkg256 with latest main [skip ci]'
          git push origin HEAD:lexical/pkg256-exec
