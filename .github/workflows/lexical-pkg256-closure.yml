name: Lexical pkg256 package closure

on:
  push:
    branches: [lexical/pkg256-exec]
    paths:
      - '.github/workflows/lexical-pkg256-closure.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexical-pkg256-closure
  cancel-in-progress: false

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg256-exec
          fetch-depth: 0
      - name: Merge latest main or report exact conflicts
        run: |
          set -euo pipefail
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo 'PKG256_MAIN_SYNC_CONFLICTS'
            git diff --name-only --diff-filter=U
            exit "$rc"
          fi
          git commit -m 'lexical: sync pkg256 with latest main [skip ci]'
          git push origin HEAD:lexical/pkg256-exec
