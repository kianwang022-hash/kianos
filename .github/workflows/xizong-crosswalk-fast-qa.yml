name: Xizong Crosswalk Fast QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/xizong/question-relations/**'
      - 'static-web/scripts/apply-xizong-crosswalk-reviewed-batches.mjs'
      - 'static-web/scripts/sync-xizong-question-relations-manifest.mjs'
      - 'static-web/scripts/validate-xizong-question-crosswalk.mjs'
      - 'static-web/scripts/audit-xizong-reviewed-relation-freshness.mjs'
      - 'static-web/scripts/validate-xizong-crosswalk-review-pipeline.mjs'
      - 'static-web/scripts/validate-xizong-crosswalk-throughput.mjs'
      - 'static-web/scripts/build-xizong-crosswalk-review-queue.mjs'
      - 'static-web/scripts/build-xizong-kp-lookup-index.mjs'
      - '.github/workflows/xizong-crosswalk-fast-qa.yml'
  pull_request:
    paths:
      - 'content/xizong/question-relations/**'
      - 'static-web/scripts/apply-xizong-crosswalk-reviewed-batches.mjs'
      - 'static-web/scripts/sync-xizong-question-relations-manifest.mjs'
      - 'static-web/scripts/validate-xizong-question-crosswalk.mjs'
      - 'static-web/scripts/audit-xizong-reviewed-relation-freshness.mjs'
      - 'static-web/scripts/validate-xizong-crosswalk-review-pipeline.mjs'
      - 'static-web/scripts/validate-xizong-crosswalk-throughput.mjs'
      - 'static-web/scripts/build-xizong-crosswalk-review-queue.mjs'
      - 'static-web/scripts/build-xizong-kp-lookup-index.mjs'
      - '.github/workflows/xizong-crosswalk-fast-qa.yml'

permissions:
  contents: read

concurrency:
  group: xizong-crosswalk-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crosswalk-fast-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-web
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate single-pass throughput materializer
        run: node scripts/validate-xizong-crosswalk-throughput.mjs
      - name: Validate staged reviewed decisions without writing
        run: node scripts/apply-xizong-crosswalk-reviewed-batches.mjs --check
      - name: Validate relation manifest synchronization
        run: node scripts/sync-xizong-question-relations-manifest.mjs --check
      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch'
        run: npm install --no-audit --no-fund
      - name: Validate reviewed Question Crosswalk
        run: node scripts/validate-xizong-question-crosswalk.mjs
      - name: Audit reviewed relation freshness
        run: node scripts/audit-xizong-reviewed-relation-freshness.mjs --out .qa/xizong-relation-freshness.json
      - name: Validate Crosswalk review queue pipeline
        run: node scripts/validate-xizong-crosswalk-review-pipeline.mjs
      - name: Build larger next-review queue
        run: node scripts/build-xizong-crosswalk-review-queue.mjs --limit 100 --out .qa/xizong-crosswalk-review-queue.json
      - name: Build derived KP lookup index
        run: node scripts/build-xizong-kp-lookup-index.mjs --out .qa/xizong-kp-lookup-index.json
      - name: Upload Crosswalk review support
        uses: actions/upload-artifact@v4
        with:
          name: xizong-crosswalk-review-support
          path: |
            static-web/.qa/xizong-crosswalk-review-queue.json
            static-web/.qa/xizong-kp-lookup-index.json
            static-web/.qa/xizong-relation-freshness.json
          if-no-files-found: error
      - name: Build Astro at explicit integration checkpoint
        if: github.event_name == 'workflow_dispatch'
        run: npm run build
      - name: Explicit checkpoint full Xizong contract regression
        if: github.event_name == 'workflow_dispatch'
        run: |
          node scripts/validate-xizong-current-owners.mjs
          node scripts/validate-xizong-learning-owner-lifecycle.mjs
          node scripts/validate-xizong-question-attempts.mjs
          node scripts/validate-xizong-learning.mjs
          node scripts/validate-xizong-a1-projection.mjs
          node scripts/validate-xizong-a1-evidence.mjs
          A3_SOURCE_PHASE=owner node scripts/validate-xizong-a3-source.mjs
          A3_SOURCE_PHASE=truth node scripts/validate-xizong-a3-source.mjs
          A3_SOURCE_PHASE=boundary node scripts/validate-xizong-a3-source.mjs
          node scripts/validate-xizong-b-knowledge.mjs
          node scripts/validate-xizong-a2-runtime.mjs
          node scripts/validate-xizong-a2-repair-return.mjs
          node scripts/validate-xizong-a2-evidence.mjs
          node scripts/validate-xizong-repair-inbox.mjs
          node scripts/validate-xizong-a3-runtime.mjs
          node scripts/validate-xizong-a3-evidence.mjs
          node scripts/validate-xizong-source-visuals.mjs
      - name: Install checkpoint browser
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Checkpoint browser Runtime journey
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/test-xizong-a1-browser-journey.mjs
      - name: Checkpoint browser Evidence journey
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/test-xizong-a1-evidence-journey.mjs
      - name: Upload periodic browser evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: xizong-crosswalk-periodic-browser-evidence
          path: |
            static-web/.qa/xizong-a1-browser-runtime.json
            static-web/.qa/xizong-a1-browser-evidence.json
          if-no-files-found: warn
