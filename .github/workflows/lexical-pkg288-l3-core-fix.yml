name: Lexical pkg288 L3-only Core fix

on:
  push:
    branches:
      - lexical/pkg288-exec
    paths:
      - '.github/workflows/lexical-pkg288-l3-core-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg288-exec
          fetch-depth: 0
      - name: Add explicit Core to L3-only lexical owners
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          mapping={
            6399:("to assert, affirm, or acknowledge something openly and confidently; formal/literary","（正式/文学）断言；明确承认或保证"),
            6401:("to speak maliciously or unfairly about someone who is absent; old-fashioned","（旧式）在背后恶意或不公地说某人坏话"),
            6432:("to flatter or coax someone in order to persuade them; rare/formal","（罕见/正式）奉承、哄劝某人以说服对方"),
            6581:("very fat; formal, dated, and often disapproving","（正式、旧式且常带贬义）非常肥胖的"),
            6621:("dated or literary: to corrupt through excessive self-indulgence, or a bout of such excess","（旧式/文学）使堕落、沉溺于过度享乐；也指一段纵酒纵欲式的放纵"),
            6658:("scheming and crafty in pursuing one's own interests; old-fashioned/literary","（旧式/文学）工于心计、为自身利益精心算计的"),
            6700:("argumentative or inclined to dispute or quarrel; formal","（正式）好争辩、好争吵的"),
            6732:("to instruct, improve, or enlighten morally or intellectually; formal/often humorous","（正式，有时幽默）教化、启迪，使人在道德或知识上受益"),
            6754:("to weaken or drain physical or mental energy; formal","（正式）使衰弱；耗尽体力或精神活力"),
            6799:("to make wrongdoing or a fault seem less serious or more forgivable; formal","（正式）减轻过错或罪责的严重性，使显得情有可原"),
            6810:("artificially created or contrived rather than naturally arising; formal","（正式）人为制造、非自然形成或刻意炮制的"),
          }
          d=Path('content/lexical/execution/manifests/o6375-o6874')
          changed=[]
          for path in sorted(d.glob('*.json')):
            x=json.loads(path.read_text())
            dirty=False
            for row in x['patches']:
              o=int(row['ordinal'])
              if o not in mapping: continue
              if any(op.get('kind')=='core' for op in row['ops']): continue
              en,cn=mapping[o]
              row['ops'].append({'kind':'core','en':en,'cn':cn})
              dirty=True
            if dirty:
              path.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n')
              changed.append(str(path))
          print('L3_CORE_PIN_PASS',changed)
          PY
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical/execution/manifests/o6375-o6874
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'lexical: pin pkg288 L3-only cores [skip ci]'
          git push origin HEAD:lexical/pkg288-exec
