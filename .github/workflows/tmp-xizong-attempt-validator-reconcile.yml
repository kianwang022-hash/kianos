name: Temporary Xizong attempt validator reconcile

on:
  push:
    branches:
      - chat/xizong-multipass-question-attempts

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/xizong-multipass-question-attempts
          fetch-depth: 0
      - name: Reconcile A1 contract assertions with Current attempt owner
        shell: python
        run: |
          from pathlib import Path
          p = Path('static-web/scripts/validate-xizong-learning.mjs')
          text = p.read_text(encoding='utf-8')
          replacements = {
            "has(exitUi, \"persistResult(currentQuestion, 'wrong', currentSelection);\", 'wrong-path');": "has(exitUi, \"if (!persistResult(currentQuestion, 'wrong', currentSelection)) return;\", 'wrong-path');",
            "has(exitUi, \"persistResult(currentQuestion, 'uncertain', currentSelection);\", 'uncertain-path');": "has(exitUi, \"if (!persistResult(currentQuestion, 'uncertain', currentSelection)) return;\", 'uncertain-path');",
            "has(exitUi, 'results[question.questionId] = {', 'question-result-not-keyed-by-truth-id');": "has(exitUi, 'recordXizongQuestionAttempt(sweepState, {', 'question-result-not-routed-through-stable-attempt-owner');"
          }
          for old, new in replacements.items():
            if text.count(old) != 1:
              raise SystemExit(f'expected one match: {old} / found {text.count(old)}')
            text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
      - name: Self-remove and commit bounded validator reconciliation
        run: |
          git rm .github/workflows/tmp-xizong-attempt-validator-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static-web/scripts/validate-xizong-learning.mjs
          git diff --cached --check
          git commit -m "test(xizong): reconcile A1 contract with attempt owner"
          git push origin HEAD:chat/xizong-multipass-question-attempts
