name: Xizong System Workspace

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'static-web/src/components/XizongSystemWorkspace.astro'
      - 'static-web/src/components/XizongSystemV6.astro'
      - 'static-web/src/pages/xizong/[system]/index.astro'
      - 'static-web/src/styles/xizong-system-workspace.css'
      - 'static-web/src/styles/xizong-presentation.css'
      - 'static-web/scripts/test-xizong-system-workspace.mjs'
      - 'static-web/scripts/validate-xizong-system-style-ownership.mjs'
      - '.github/workflows/xizong-system-workspace.yml'
  push:
    branches: [main]
    paths:
      - 'static-web/src/components/XizongSystemWorkspace.astro'
      - 'static-web/src/components/XizongSystemV6.astro'
      - 'static-web/src/pages/xizong/[system]/index.astro'
      - 'static-web/src/styles/xizong-system-workspace.css'
      - 'static-web/src/styles/xizong-presentation.css'
      - 'static-web/scripts/test-xizong-system-workspace.mjs'
      - 'static-web/scripts/validate-xizong-system-style-ownership.mjs'
      - '.github/workflows/xizong-system-workspace.yml'

permissions:
  contents: read

concurrency:
  group: xizong-system-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-web
    steps:
      - name: Checkout Current candidate
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate single System visual owner
        run: node scripts/validate-xizong-system-style-ownership.mjs
      - name: Build Astro
        run: npm run build
      - name: Install browser acceptance tool
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute System workspace browser acceptance
        run: node scripts/test-xizong-system-workspace.mjs
      - name: Upload System workspace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xizong-system-workspace
          path: |
            static-web/.qa/xizong-system-workspace.json
            static-web/.qa/xizong-system-a1.png
            static-web/.qa/xizong-system-a2.png
            static-web/.qa/xizong-system-a3.png
          if-no-files-found: warn
