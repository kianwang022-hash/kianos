name: Lexical o4875-o5374 reconciliation compile

on:
  push:
    branches:
      - lexical/reconcile-o4875-o5374-20260916
    paths:
      - 'tools/lexical_compile_reconciliation_package.py'
      - '.github/workflows/lexical-o4875-o5374-reconciliation-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/reconcile-o4875-o5374-20260916
          fetch-depth: 0

      - name: Compile package reconciliation accounting
        run: |
          python tools/lexical_compile_reconciliation_package.py \
            --start 4875 \
            --end 5374 \
            --production content/lexical/semantic-review/o4875-o5124.md \
            --production content/lexical/semantic-review/o5125-o5374.md \
            --audit content/lexical/semantic-audit/o4825-o5024.audit.md \
            --audit content/lexical/semantic-audit/o5025-o5224.audit.md \
            --audit content/lexical/semantic-audit/o5225-o5424.audit.md \
            --out content/lexical/execution/preflight/o4875-o5374.reconciliation-compile.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('content/lexical/execution/preflight/o4875-o5374.reconciliation-compile.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['package']=={'start':4875,'end':5374,'owner_count':500}
          assert x['production_upgrade_count']==102, x['production_upgrade_count']
          assert x['identity_risks']==[4972,4986,5159,5276], x['identity_risks']
          assert len(x['receipt_counts'])==10
          assert sum(r['source_count'] for r in x['receipt_counts'])==x['semantic_source_owner_count']
          print('RECONCILIATION_COMPILE_CONTRACT_PASS', x['semantic_source_owner_count'])
          PY

      - name: Commit compiled accounting
        run: |
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical/execution/preflight/o4875-o5374.reconciliation-compile.json
          if git diff --cached --quiet; then
            echo 'No reconciliation accounting change'
            exit 0
          fi
          git commit -m 'lexical: compile o4875-o5374 reconciliation accounting [skip ci]'
          git push origin HEAD:lexical/reconcile-o4875-o5374-20260916
