name: A2 One-Shot Semantic Patch

on:
  push:
    branches: [a2-fresh-functional-first]
    paths:
      - '.github/workflows/a2-one-shot-semantic-patch.yml'
      - 'static-web/scripts/patch-a2-system-one-shot.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a2-fresh-functional-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Current owners
        working-directory: static-web
        run: node scripts/patch-a2-system-one-shot.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/xizong/knowledge/systems/a2-respiratory/system.json content/xizong/knowledge/learner/a2-respiratory-pathways.json
          git diff --cached --quiet && exit 0
          git commit -m 'Fresh re-accept A2 System failure model'
          git push origin HEAD:a2-fresh-functional-first
