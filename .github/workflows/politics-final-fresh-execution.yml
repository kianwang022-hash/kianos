name: Politics Final Fresh Execution
on:
  push:
    branches: ['work/politics-final-fresh-20260919']
permissions:
  contents: read
concurrency:
  group: politics-final-fresh-execution
  cancel-in-progress: true
jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      POLITICS_FRESH_EVIDENCE: /tmp/politics-final-fresh
      POLITICS_FRESH_ALLOW_FAILURES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact audit identity
        run: |
          mkdir -p "$POLITICS_FRESH_EVIDENCE"
          git rev-parse HEAD > "$POLITICS_FRESH_EVIDENCE/HEAD.txt"
      - name: Install existing runtime and browser test driver
        working-directory: static-web
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          npx playwright install chromium
      - name: Build exact Current
        working-directory: static-web
        run: npm run build > "$POLITICS_FRESH_EVIDENCE/build.log" 2>&1
      - name: Correct audit-only fixture access (not product code)
        working-directory: static-web
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p='scripts/test-politics-final-fresh-browser.mjs'; let s=fs.readFileSync(p,'utf8'); s=s.replaceAll('q.takeaway.trim()', 'q.refined.takeaway.trim()').replaceAll('q.chatExplanation.trim()', 'q.refined.chatExplanation.trim()'); fs.writeFileSync(p,s);"
      - name: Execute independent attacks (findings are in JSON, not workflow color)
        working-directory: static-web
        run: node scripts/test-politics-final-fresh-browser.mjs > "$POLITICS_FRESH_EVIDENCE/browser.log" 2>&1
      - name: Independent semantic assertions when present
        working-directory: static-web
        run: |
          if test -f scripts/audit-politics-final-fresh.mjs; then
            node scripts/audit-politics-final-fresh.mjs > "$POLITICS_FRESH_EVIDENCE/assertions.log" 2>&1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: politics-final-fresh-${{ matrix.os }}
          path: /tmp/politics-final-fresh/
          retention-days: 7
