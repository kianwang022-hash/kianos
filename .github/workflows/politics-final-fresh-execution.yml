name: Politics Final Fresh Execution
on:
  push:
    branches: ['work/politics-final-fresh-20260919']
permissions:
  contents: read
concurrency:
  group: politics-final-fresh-execution
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact audit identity
        run: |
          mkdir -p /tmp/politics-final-fresh
          git rev-parse HEAD > /tmp/politics-final-fresh/HEAD.txt
      - name: Install existing runtime
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Build exact Current
        working-directory: static-web
        run: npm run build > /tmp/politics-final-fresh/build.log 2>&1
      - name: Export bounded Politics browser surface
        run: |
          tar --exclude='*.woff*' --exclude='*.ttf' --exclude='*.otf' -czf /tmp/politics-final-fresh/site.tar.gz -C static-web/dist politics _astro
      - name: Independent fresh assertions when present
        working-directory: static-web
        run: |
          if test -f scripts/audit-politics-final-fresh.mjs; then
            node scripts/audit-politics-final-fresh.mjs | tee /tmp/politics-final-fresh/assertions.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: politics-final-fresh-browser
          path: /tmp/politics-final-fresh/
          retention-days: 7
