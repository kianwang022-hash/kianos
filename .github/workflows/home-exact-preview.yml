name: Home Exact Preview

on:
  pull_request:
    paths:
      - '.github/workflows/home-exact-preview.yml'
      - 'static-web/src/pages/index.astro'
      - 'static-web/src/styles/home-workbench.css'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site dependencies
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture Home
        working-directory: static-web
        run: |
          mkdir -p .qa
          npm run dev -- --host 127.0.0.1 --port 4348 > .qa/home-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4348/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:1512,height:982}});
          const page = await context.newPage();
          await page.addInitScript(() => localStorage.setItem('kianos-global-rail-expanded-v1','1'));
          await page.goto('http://127.0.0.1:4348/', {waitUntil:'networkidle'});
          await page.waitForTimeout(500);
          await page.screenshot({path:'.qa/home-exact-1512x982.png', fullPage:false});
          const metrics = await page.evaluate(() => ({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,title:document.title}));
          console.log(JSON.stringify(metrics));
          await browser.close();
          NODE
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-exact-preview
          path: |
            static-web/.qa/home-exact-1512x982.png
            static-web/.qa/home-dev.log
          if-no-files-found: warn
