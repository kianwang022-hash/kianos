name: TEMP Xizong Done DOM Diagnose

on:
  push:
    branches:
      - chat/xizong-multipass-question-attempts

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build
        working-directory: static-web
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inject DOM diagnostic
        working-directory: static-web
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-xizong-a2-functional-journey.mjs')
          s = p.read_text()
          needle = "  await exit.locator('[data-sweep-done]').waitFor({ state: 'visible' });"
          repl = r'''  await page.waitForTimeout(100);
          const doneDomProbe = await page.evaluate(() => {
            const root = document.querySelector('[data-xizong-system-exit="respiratory"]');
            const key = 'kianos:xizong:system-question-sweep:respiratory:v1';
            const state = JSON.parse(localStorage.getItem(key) || '{"results":{}}');
            return {
              resultCount: Object.keys(state.results || {}).length,
              round: state.round || null,
              startDisabled: root?.querySelector('[data-start-sweep]')?.disabled,
              workspaceHidden: root?.querySelector('[data-question-workspace]')?.hidden,
              doneHidden: root?.querySelector('[data-sweep-done]')?.hidden,
              questionHidden: root?.querySelector('.xseQuestion')?.hidden,
              questionMeta: root?.querySelector('[data-question-meta]')?.textContent,
              questionProgress: root?.querySelector('[data-question-progress]')?.textContent,
              remainingText: root?.querySelector('[data-stat-remaining]')?.textContent,
              phaseText: root?.querySelector('[data-study-phase]')?.textContent
            };
          });
          if (doneDomProbe.doneHidden) throw new Error('A2_DONE_DOM_PROBE:' + JSON.stringify(doneDomProbe));
          await exit.locator('[data-sweep-done]').waitFor({ state: 'visible' });'''
          if needle not in s:
              raise SystemExit('WAIT_NEEDLE_NOT_FOUND')
          p.write_text(s.replace(needle, repl, 1))
          PY
      - name: Run diagnostic journey
        working-directory: static-web
        run: node scripts/test-xizong-a2-functional-journey.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xizong-done-dom-diagnostic-${{ github.sha }}
          path: xizong-a2-functional-audit/
          retention-days: 3
