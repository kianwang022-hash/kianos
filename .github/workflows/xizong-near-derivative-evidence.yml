name: Xizong Near-Derivative Evidence

on:
  pull_request:
    paths:
      - 'static-web/src/lib/xizongSessionInstruction.mjs'
      - 'static-web/src/lib/xizongQuestionAttempts.mjs'
      - 'static-web/src/lib/xizongRetainedPractice.mjs'
      - 'static-web/src/lib/xizongStudyPacket.mjs'
      - 'static-web/src/lib/xizongChatReturn.mjs'
      - 'static-web/scripts/validate-xizong-targeted-practice.mjs'
      - '.github/workflows/xizong-near-derivative-evidence.yml'
  push:
    branches:
      - work/xizong-near-derivative-evidence-fix-20260921

jobs:
  semantic-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove near-derivative cannot multiply fresh evidence
        working-directory: static-web
        run: node scripts/validate-xizong-targeted-practice.mjs
