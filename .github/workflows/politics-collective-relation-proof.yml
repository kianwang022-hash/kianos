name: Politics Collective Relation Proof

on:
  push:
    branches:
      - 'verify/politics-collective-relation-20260918'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime
        working-directory: static-web
        run: npm install --no-audit --no-fund

      - name: Audit Politics learning semantics
        working-directory: static-web
        run: node scripts/audit-politics-learning-semantics.mjs

      - name: Audit Marxism content
        working-directory: static-web
        run: node scripts/audit-politics-marxism-content.mjs

      - name: Scan Politics for likely relation-atomization candidates
        working-directory: static-web
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root=path.resolve(process.cwd(),'..');
          const learningRoot=path.join(root,'content/politics/learning');
          const files=[];
          const walk=(dir)=>fs.readdirSync(dir,{withFileTypes:true}).forEach(e=>{
            const p=path.join(dir,e.name);
            if(e.isDirectory()) walk(p);
            else if(/^ch\d+\.json$/i.test(e.name)) files.push(p);
          });
          walk(learningRoot);

          const candidates=[];
          for(const file of files){
            const raw=JSON.parse(fs.readFileSync(file,'utf8'));
            const units=raw.unit_projections||raw.units||(raw.unit?[raw.unit]:[]);
            for(const unit of units){
              for(const map of unit?.learning_semantics?.framework_maps||[]){
                const groups=new Map();
                for(const edge of map.edges||[]){
                  const key=`${edge.to}||${edge.relation}`;
                  if(!groups.has(key)) groups.set(key,[]);
                  groups.get(key).push(edge);
                }
                for(const [key,edges] of groups){
                  if(edges.length>=2){
                    candidates.push({
                      file:path.relative(root,file),
                      unit:unit.natural_unit_id||unit.unit_id,
                      map:map.id,
                      target:edges[0]?.to,
                      relation:edges[0]?.relation,
                      sources:edges.map(e=>e.from)
                    });
                  }
                }
              }
            }
          }
          console.log('POLITICS_RELATION_ATOMIZATION_CANDIDATES');
          console.log(JSON.stringify({count:candidates.length,candidates},null,2));
          NODE

      - name: Prove C00 collective relation is not atomized
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('content/politics/learning/marxism/ch00.json','utf8'));
          const unit=raw.unit_projections.find(u=>u.natural_unit_id==='POL27-CF-MARX-C00-S02');
          const map=unit.learning_semantics.framework_maps.find(m=>m.id==='MARX-C00-S02-MAP-CHARACTER-01');
          const relation=(map.collective_relations||[]).find(r=>r.id==='MARX-C00-S02-COLLECTIVE-REVOLUTION-01');
          if(!relation) throw new Error('COLLECTIVE_RELATION_MISSING');
          const expected=['people_nature','practicality','development_quality'];
          if(relation.member_ids.join('|')!==expected.join('|')) throw new Error('COLLECTIVE_MEMBERS_CHANGED');
          if(relation.relation!=='集中体现为') throw new Error('COLLECTIVE_PREDICATE_CHANGED');
          if(relation.target_id!=='revolutionary_character') throw new Error('COLLECTIVE_TARGET_CHANGED');
          const atomized=(map.edges||[]).filter(e=>expected.includes(e.from)&&e.to==='revolutionary_character');
          if(atomized.length) throw new Error('COLLECTIVE_RELATION_REATOMIZED');
          console.log('POLITICS_C00_COLLECTIVE_RELATION_PASS');
          console.log(JSON.stringify({collective_relation:relation, atomized_edges:atomized.length},null,2));
          NODE
