name: Xizong Fresh Independent Acceptance
on:
  push:
    branches: [work/xizong-final-learner-20260919-independent]
concurrency:
  group: xizong-final-independent
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      head: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply final bounded patch when present
        run: |
          if test -f .github/xizong-final-closeout.py; then
            python3 .github/xizong-final-closeout.py
            git diff --check
            git add static-web/src/components/XizongPracticeWorkbench.astro static-web/src/components/XizongSystemExitRuntime.astro static-web/src/components/XizongSystemEvidenceGuard.astro static-web/scripts/test-xizong-final-independent.mjs
            git rm .github/xizong-final-closeout.py
            git config user.name 'KianOS acceptance worker'
            git config user.email 'noreply@users.noreply.github.com'
            git commit -m 'fix(xizong): restore post-question reconstruction and preserve System Recall evidence'
            git push origin HEAD:work/xizong-final-learner-20260919-independent
          fi
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  independent:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and browser harness
        working-directory: static-web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Fresh independent learner probes
        working-directory: static-web
        env:
          KIANOS_REPO_ROOT: ${{ github.workspace }}
          XIZONG_AUDIT_HEAD: ${{ needs.prepare.outputs.head }}
          ASTRO_TELEMETRY_DISABLED: '1'
        run: node scripts/test-xizong-final-independent.mjs
      - name: Bounded dependent regression, not broad CI
        if: always()
        working-directory: static-web
        shell: bash
        run: |
          mkdir -p .qa/xizong-final-independent
          status=0
          for script in test-xizong-daily-learning-packet validate-xizong-paper-practice validate-xizong-retained-practice validate-xizong-projection-current validate-xizong-learner-object validate-xizong-representation-gate; do
            node "scripts/$script.mjs" > ".qa/xizong-final-independent/$script.log" 2>&1 || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xizong-fresh-${{ matrix.os }}-${{ needs.prepare.outputs.head }}
          path: static-web/.qa/xizong-final-independent
          retention-days: 14
