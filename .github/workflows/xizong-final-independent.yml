name: Xizong Fresh Independent Acceptance
on:
  push:
    branches: [work/xizong-final-learner-20260919-independent]
permissions:
  contents: read
jobs:
  independent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and isolated browser harness
        working-directory: static-web
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Fresh independent contract and browser probes
        working-directory: static-web
        env:
          KIANOS_REPO_ROOT: ${{ github.workspace }}
          ASTRO_TELEMETRY_DISABLED: '1'
        run: node scripts/test-xizong-final-independent.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xizong-fresh-${{ matrix.os }}-${{ github.sha }}
          path: static-web/.qa/xizong-final-independent
          retention-days: 14
