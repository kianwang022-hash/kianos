name: Lexical Retro Replay o0025-o3124

on:
  push:
    branches:
      - lexical/retro-replay-integration-o0025-o3124-20260916

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean Current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Current main and preserved retro source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git fetch origin lexical/retro-audit-debt-20260915:refs/remotes/origin/lexical/retro-audit-debt-20260915
          echo "branch=$(git rev-parse HEAD)"
          echo "main=$(git rev-parse origin/main)"
          echo "retro=$(git rev-parse origin/lexical/retro-audit-debt-20260915)"

      - name: Preflight receipt union and Current overlap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          RETRO = 'origin/lexical/retro-audit-debt-20260915'
          BASE = '88eedd381aa7c719467c0e925b4147ac31d68537'
          WINDOWS = [
              'o0025-o0224','o0225-o0424','o0425-o0624','o0625-o0824',
              'o0825-o1024','o1025-o1224','o1225-o1424','o1425-o1624',
              'o1625-o1824','o1825-o2024','o2025-o2224','o2225-o2424',
              'o2425-o2624','o2625-o2824','o2825-o3024','o3025-o3124',
          ]
          def git(*a):
              return subprocess.check_output(['git', *a], text=True).strip()
          def show(ref, path):
              return git('show', f'{ref}:{path}')

          if git('merge-base', BASE, RETRO) != BASE:
              raise SystemExit('RETRO_BASELINE_NOT_ANCESTOR')

          words=set(); rels=set(); expected=25
          for w in WINDOWS:
              rp=f'content/lexical/audit/retro-corrections/{w}.json'
              r=json.loads(show(RETRO,rp))
              scope=r.get('scope')
              if not isinstance(scope,list) or len(scope)!=2 or scope[0]!=expected:
                  raise SystemExit(f'BAD_SCOPE:{w}:{scope}:expected={expected}')
              expected=scope[1]+1
              auth=r.get('authority')
              if auth != f'content/lexical/semantic-reconciliation/{w}.md':
                  raise SystemExit(f'BAD_AUTHORITY:{w}:{auth}')
              show(RETRO, auth)
              words |= {int(x) for x in r.get('changed_word_ordinals',[])}
              rels |= {str(x) for x in r.get('changed_relation_owner_paths',[])}
          if expected != 3125:
              raise SystemExit(f'NONCONTIGUOUS_END:{expected}')
          if any(1 <= o <= 24 for o in words):
              raise SystemExit('PREFIX_WRITE_FORBIDDEN')

          targets={f'content/lexical/words/by-ordinal/o{o:04d}.json' for o in words} | rels
          drift=set(filter(None, git('diff','--name-only',f'{BASE}..origin/main','--','content/lexical/words/by-ordinal','content/lexical/relations/by-id').splitlines()))
          overlap=sorted(targets & drift)
          if overlap:
              raise SystemExit('CURRENT_NATURAL_OWNER_OVERLAP:'+json.dumps(overlap,ensure_ascii=False))

          print(json.dumps({
              'windows':len(WINDOWS),
              'word_write_union':len(words),
              'relation_write_union':len(rels),
              'main_natural_drift_since_baseline':len(drift),
              'overlap':0,
          },ensure_ascii=False,indent=2))
          PY

      - name: Restore accepted Sol authorities and original executors
        shell: bash
        run: |
          set -euo pipefail
          RETRO=origin/lexical/retro-audit-debt-20260915
          windows=(
            o0025-o0224 o0225-o0424 o0425-o0624 o0625-o0824
            o0825-o1024 o1025-o1224 o1225-o1424 o1425-o1624
            o1625-o1824 o1825-o2024 o2025-o2224 o2225-o2424
            o2425-o2624 o2625-o2824 o2825-o3024 o3025-o3124
          )
          scripts=(
            lexical_apply_retro_o0025_o0224.py
            lexical_apply_retro_o0225_o0424.py
            lexical_apply_retro_o0425_o0624.py
            lexical_apply_retro_o0625_o0824.py
            lexical_apply_retro_o0825_o1024.py
            lexical_apply_retro_o1025_o1224.py
            lexical_apply_retro_o1225_o1424.py
            lexical_apply_retro_o1425_o1624.py
            lexical_apply_retro_o1625_o1824.py
            lexical_apply_retro_o1825_o2024.py
            lexical_apply_retro_o2025_o2224.py
            lexical_apply_retro_o2225_o2424.py
            lexical_apply_retro_o2425_o2624.py
            lexical_apply_retro_o2625_o2824.py
            lexical_apply_retro_o2825_o3024.py
            lexical_apply_retro_o3025_o3124.py
          )
          mkdir -p content/lexical/semantic-reconciliation content/lexical/audit/retro-corrections
          for w in "${windows[@]}"; do
            git show "$RETRO:content/lexical/semantic-reconciliation/$w.md" > "content/lexical/semantic-reconciliation/$w.md"
          done
          for s in "${scripts[@]}"; do
            git show "$RETRO:tools/$s" > "tools/$s"
          done

      - name: Replay 16 accepted corrective executors in order
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            lexical_apply_retro_o0025_o0224.py
            lexical_apply_retro_o0225_o0424.py
            lexical_apply_retro_o0425_o0624.py
            lexical_apply_retro_o0625_o0824.py
            lexical_apply_retro_o0825_o1024.py
            lexical_apply_retro_o1025_o1224.py
            lexical_apply_retro_o1225_o1424.py
            lexical_apply_retro_o1425_o1624.py
            lexical_apply_retro_o1625_o1824.py
            lexical_apply_retro_o1825_o2024.py
            lexical_apply_retro_o2025_o2224.py
            lexical_apply_retro_o2225_o2424.py
            lexical_apply_retro_o2425_o2624.py
            lexical_apply_retro_o2625_o2824.py
            lexical_apply_retro_o2825_o3024.py
            lexical_apply_retro_o3025_o3124.py
          )
          for s in "${scripts[@]}"; do
            echo "==> $s"
            python "tools/$s"
          done

      - name: Remove temporary executor transport
        shell: bash
        run: |
          set -euo pipefail
          for f in tools/lexical_apply_retro_o*.py; do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              git show "HEAD:$f" > "$f"
            else
              rm -f "$f"
            fi
          done

      - name: Verify final accepted Natural Owners and identity registry closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          ROOT=Path.cwd(); RETRO='origin/lexical/retro-audit-debt-20260915'
          WINDOWS=[
              'o0025-o0224','o0225-o0424','o0425-o0624','o0625-o0824',
              'o0825-o1024','o1025-o1224','o1225-o1424','o1425-o1624',
              'o1625-o1824','o1825-o2024','o2025-o2224','o2225-o2424',
              'o2425-o2624','o2625-o2824','o2825-o3024','o3025-o3124',
          ]
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          def show(ref,path): return git('show',f'{ref}:{path}')
          words=set(); rels=set()
          for w in WINDOWS:
              r=json.loads(show(RETRO,f'content/lexical/audit/retro-corrections/{w}.json'))
              words |= {int(x) for x in r.get('changed_word_ordinals',[])}
              rels |= {str(x) for x in r.get('changed_relation_owner_paths',[])}

          for o in sorted(words):
              p=f'content/lexical/words/by-ordinal/o{o:04d}.json'
              current=json.loads((ROOT/p).read_text())
              accepted=json.loads(show(RETRO,p))
              if current != accepted:
                  raise SystemExit(f'WORD_FINAL_STATE_MISMATCH:{p}')

          for p in sorted(rels):
              current=json.loads((ROOT/p).read_text())
              accepted=json.loads(show(RETRO,p))
              if current != accepted:
                  raise SystemExit(f'RELATION_FINAL_STATE_MISMATCH:{p}')

          sense_by_id={}; coll_by_id={}
          for p in sorted((ROOT/'content/lexical/canonical/senses/shards').glob('*.json')):
              for row in json.loads(p.read_text()):
                  sid=row.get('record',{}).get('stable_sense_id')
                  if sid: sense_by_id[sid]=row['record']
          for p in sorted((ROOT/'content/lexical/canonical/collocations/shards').glob('*.json')):
              for row in json.loads(p.read_text()):
                  cid=row.get('record',{}).get('collocation_id')
                  if cid: coll_by_id[cid]=row['record']

          for o in sorted(words):
              owner=json.loads((ROOT/f'content/lexical/words/by-ordinal/o{o:04d}.json').read_text())
              active={s.get('sense_id'):s for s in owner.get('record',{}).get('senses',[]) if s.get('sense_id')}
              for sid,s in active.items():
                  reg=sense_by_id.get(sid)
                  if not reg or reg.get('status')!='active':
                      raise SystemExit(f'ACTIVE_SENSE_REGISTRY_CLOSURE:o{o:04d}:{sid}')
                  for c in s.get('collocations',[]) or []:
                      cid=c.get('collocation_id')
                      if not cid: continue
                      cr=coll_by_id.get(cid)
                      if not cr or cr.get('status')!='active' or cr.get('sense_id')!=sid:
                          raise SystemExit(f'ACTIVE_COLLOCATION_REGISTRY_CLOSURE:o{o:04d}:{cid}:{sid}')
              for ref in owner.get('identity_refs',{}).get('senses',[]) or []:
                  sid=ref.get('sense_id')
                  reg=sense_by_id.get(sid)
                  if not reg:
                      raise SystemExit(f'IDENTITY_REF_SENSE_MISSING:o{o:04d}:{sid}')
                  if reg.get('status') != ref.get('status') or reg.get('merged_into_sense_id') != ref.get('merged_into_sense_id'):
                      raise SystemExit(f'IDENTITY_REF_SENSE_STATE_MISMATCH:o{o:04d}:{sid}')
              for rr in owner.get('relation_refs',[]) or []:
                  rp=ROOT/rr['owner_path']
                  if not rp.exists():
                      raise SystemExit(f'RELATION_REF_PATH_MISSING:o{o:04d}:{rr["owner_path"]}')
                  robj=json.loads(rp.read_text())
                  if robj.get('relation_id') != rr.get('relation_id'):
                      raise SystemExit(f'RELATION_REF_ID_MISMATCH:o{o:04d}:{rr["relation_id"]}')
              for lr in owner.get('lookup_refs',[]) or []:
                  src=ROOT/lr['source']
                  if not src.exists():
                      raise SystemExit(f'LOOKUP_SOURCE_MISSING:o{o:04d}:{lr["source"]}')
                  data=json.loads(src.read_text())
                  candidates=data.get(lr['spelling'],[])
                  if not any(x.get('word_id')==owner.get('word_id') and x.get('ordinal')==o for x in candidates):
                      raise SystemExit(f'LOOKUP_CLOSURE:o{o:04d}:{lr["spelling"]}')

          print(json.dumps({'word_final_state':len(words),'relation_final_state':len(rels),'identity_registry_closure':'PASS'},indent=2))
          PY

      - name: Validate receipts and authority preservation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          R=Path.cwd(); RETRO='origin/lexical/retro-audit-debt-20260915'
          WINDOWS=[
              'o0025-o0224','o0225-o0424','o0425-o0624','o0625-o0824',
              'o0825-o1024','o1025-o1224','o1225-o1424','o1425-o1624',
              'o1625-o1824','o1825-o2024','o2025-o2224','o2225-o2424',
              'o2425-o2624','o2625-o2824','o2825-o3024','o3025-o3124',
          ]
          def show(path): return subprocess.check_output(['git','show',f'{RETRO}:{path}'],text=True)
          for w in WINDOWS:
              a=f'content/lexical/semantic-reconciliation/{w}.md'
              if (R/a).read_text() != show(a): raise SystemExit(f'AUTHORITY_DRIFT:{w}')
              rp=f'content/lexical/audit/retro-corrections/{w}.json'
              cur=json.loads((R/rp).read_text()); old=json.loads(show(rp))
              if cur.get('authority')!=old.get('authority') or cur.get('scope')!=old.get('scope'):
                  raise SystemExit(f'RECEIPT_AUTHORITY_SCOPE_DRIFT:{w}')
              if cur.get('readback') != old.get('readback'):
                  raise SystemExit(f'RECEIPT_READBACK_DRIFT:{w}')
          print('16/16 authorities and receipts preserved')
          PY

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, re
          raw=subprocess.check_output(['git','status','--porcelain=v1','-z','--untracked-files=all'])
          parts=raw.split(b'\0'); paths=[]
          for entry in parts:
              if not entry: continue
              text=entry.decode('utf-8','surrogateescape')
              path=text[3:]
              if ' -> ' in path: path=path.split(' -> ',1)[1]
              paths.append(path)
          allowed=[]; bad=[]
          for p in paths:
              ok=(
                  re.fullmatch(r'content/lexical/words/by-ordinal/o\d{4}\.json',p)
                  or p.startswith('content/lexical/relations/by-id/')
                  or p.startswith('content/lexical/canonical/senses/shards/')
                  or p.startswith('content/lexical/canonical/collocations/shards/')
                  or p.startswith('content/lexical/canonical/lookup/spelling/')
                  or p=='content/lexical/relations/manifest.json'
                  or re.fullmatch(r'content/lexical/semantic-reconciliation/o\d{4}-o\d{4}\.md',p)
                  or re.fullmatch(r'content/lexical/audit/retro-corrections/o\d{4}-o\d{4}\.json',p)
              )
              (allowed if ok else bad).append(p)
          if bad: raise SystemExit('UNAUTHORIZED_DIFF:'+str(bad))
          forbidden=[p for p in paths if p.startswith('content/lexical/canonical/words/') or p.startswith('content/lexical/canonical/relations/')]
          if forbidden: raise SystemExit('PRE_CUTOVER_CANONICAL_MUTATION:'+str(forbidden))
          print(f'allowed changed paths: {len(allowed)}')
          PY

      - name: Lexical transport guards
        run: python tools/test_lexical_transport_guards.py

      - name: Lexical shard tests
        run: python tools/test_lexical_shard.py

      - name: Parse all Lexical JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          n=0
          for p in Path('content/lexical').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8')); n+=1
          print('parsed',n,'json files')
          PY

      - name: Install Astro dependencies
        run: npm install --no-audit --no-fund

      - name: Full Astro build
        run: npm run build

      - name: Commit verified replay result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kian"
          git config user.email "kianwang022@gmail.com"
          git add content/lexical/words/by-ordinal content/lexical/relations/by-id content/lexical/relations/manifest.json \
                  content/lexical/canonical/senses/shards content/lexical/canonical/collocations/shards \
                  content/lexical/canonical/lookup/spelling content/lexical/semantic-reconciliation \
                  content/lexical/audit/retro-corrections
          git diff --cached --quiet && { echo 'No semantic integration changes produced'; exit 1; }
          git commit -m "lexical: integrate verified retro corrective truth o0025-o3124"
          git push origin HEAD
