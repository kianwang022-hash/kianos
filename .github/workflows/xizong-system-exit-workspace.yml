name: Xizong System Exit Workspace

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'static-web/src/components/XizongSystemExitRuntime.astro'
      - 'static-web/XIZONG_SYSTEM_COMPLETION_DESIGN.md'
      - 'static-web/XIZONG_PRACTICE_DESIGN.md'
      - 'static-web/XIZONG_PRODUCT_BRIEF.md'
      - 'static-web/src/components/XizongPracticeWorkbench.astro'
      - 'static-web/src/pages/xizong/practice/**'
      - 'static-web/src/styles/xizong-practice-workspace.css'
      - 'static-web/src/lib/xizongQuestions.mjs'
      - 'static-web/src/lib/xizongRetainedPractice.mjs'
      - 'static-web/src/lib/xizongPaperScoring.mjs'
      - 'content/xizong/questions/exam-format.json'
      - 'static-web/src/lib/sharedNavigation.mjs'
      - 'static-web/scripts/validate-xizong-retained-practice.mjs'
      - 'static-web/scripts/validate-xizong-paper-practice.mjs'
      - 'static-web/src/components/XizongQuestionCrosswalkConsumer.astro'
      - 'static-web/src/components/XizongSystemRepairReturn.astro'
      - 'static-web/src/pages/xizong/[system]/index.astro'
      - 'static-web/src/pages/xizong/[system]/recall.astro'
      - 'static-web/src/components/XizongRuntimeStageGuard.astro'
      - 'static-web/src/styles/xizong-system-exit-workspace.css'
      - 'static-web/src/styles/xizong-system-workspace.css'
      - 'static-web/src/styles/xizong-presentation.css'
      - 'static-web/src/styles/xizong-dense-calm.css'
      - 'static-web/scripts/validate-xizong-system-exit-style-ownership.mjs'
      - 'static-web/scripts/test-xizong-system-exit-workspace.mjs'
      - '.github/workflows/xizong-system-exit-workspace.yml'
  push:
    branches: [main]
    paths:
      - 'static-web/src/components/XizongSystemExitRuntime.astro'
      - 'static-web/XIZONG_SYSTEM_COMPLETION_DESIGN.md'
      - 'static-web/XIZONG_PRACTICE_DESIGN.md'
      - 'static-web/XIZONG_PRODUCT_BRIEF.md'
      - 'static-web/src/components/XizongPracticeWorkbench.astro'
      - 'static-web/src/pages/xizong/practice/**'
      - 'static-web/src/styles/xizong-practice-workspace.css'
      - 'static-web/src/lib/xizongQuestions.mjs'
      - 'static-web/src/lib/xizongRetainedPractice.mjs'
      - 'static-web/src/lib/xizongPaperScoring.mjs'
      - 'content/xizong/questions/exam-format.json'
      - 'static-web/src/lib/sharedNavigation.mjs'
      - 'static-web/scripts/validate-xizong-retained-practice.mjs'
      - 'static-web/scripts/validate-xizong-paper-practice.mjs'
      - 'static-web/src/components/XizongQuestionCrosswalkConsumer.astro'
      - 'static-web/src/components/XizongSystemRepairReturn.astro'
      - 'static-web/src/pages/xizong/[system]/index.astro'
      - 'static-web/src/pages/xizong/[system]/recall.astro'
      - 'static-web/src/components/XizongRuntimeStageGuard.astro'
      - 'static-web/src/styles/xizong-system-exit-workspace.css'
      - 'static-web/src/styles/xizong-system-workspace.css'
      - 'static-web/src/styles/xizong-presentation.css'
      - 'static-web/src/styles/xizong-dense-calm.css'
      - 'static-web/scripts/validate-xizong-system-exit-style-ownership.mjs'
      - 'static-web/scripts/test-xizong-system-exit-workspace.mjs'
      - '.github/workflows/xizong-system-exit-workspace.yml'

permissions:
  contents: read

concurrency:
  group: xizong-system-exit-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-exit-workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-web
    steps:
      - name: Checkout Current candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Scope Xizong content proof
        id: scope
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Shared config/navigation edits keep build + consumer proof. Re-audit
          # canonical Xizong content only when a content/semantic owner changed.
          # Manual runs and unavailable comparison evidence retain the full gate.
          content=true
          changed="$RUNNER_TEMP/xizong-proof-changed.txt"
          if [[ "$EVENT_NAME" != workflow_dispatch && -n "$BASE_SHA" && -n "$HEAD_SHA" ]] &&
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
             git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null &&
             git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed"; then
            if grep -Eq '^static-web/src/lib/sharedNavigation\.mjs$' "$changed" &&
               ! grep -Eiq '(^|/)[^/]*xizong[^/]*(/|$)|^LEARNING_ACCEPTANCE\.md$|^static-web/(package(-lock)?\.json|src/layouts/|src/styles/(global|runtime)\.css|src/lib/current\.mjs)' "$changed"; then
              content=false
            fi
          fi
          printf 'content=%s\n' "$content" >> "$GITHUB_OUTPUT"
          printf 'Xizong content proof: %s; shared build/browser proof retained\n' "$content"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate System Exit single visual owner
        run: node scripts/validate-xizong-system-exit-style-ownership.mjs
      - name: Validate Question attempt semantics
        if: steps.scope.outputs.content == 'true'
        run: node scripts/validate-xizong-question-attempts.mjs
      - name: Validate retained Practice aggregation
        if: steps.scope.outputs.content == 'true'
        run: node scripts/validate-xizong-retained-practice.mjs
      - name: Validate whole-paper scoring / Hidden semantics
        if: steps.scope.outputs.content == 'true'
        run: node scripts/validate-xizong-paper-practice.mjs
      - name: Validate reviewed Question Crosswalk contract
        if: steps.scope.outputs.content == 'true'
        run: node scripts/validate-xizong-question-crosswalk.mjs
      - name: Build Astro
        run: npm run build
      - name: Install browser acceptance tool
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute System Exit browser acceptance
        run: node scripts/test-xizong-system-exit-workspace.mjs
      - name: Upload System Exit browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xizong-system-exit-workspace
          path: |
            static-web/.qa/xizong-system-exit-workspace.json
            static-web/.qa/xizong-practice-workbench-front.png
            static-web/.qa/xizong-practice-workbench.png
            static-web/.qa/xizong-practice-retained-entry.png
            static-web/.qa/xizong-practice-retained-workbench.png
            static-web/.qa/xizong-practice-paper-front.png
            static-web/.qa/xizong-practice-paper-result.png
            static-web/.qa/xizong-system-exit-recall.png
            static-web/.qa/xizong-system-exit-recall-reveal.png
          if-no-files-found: warn
