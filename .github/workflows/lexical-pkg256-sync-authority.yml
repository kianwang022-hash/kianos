name: Lexical pkg256 sync corrected authority

on:
  push:
    branches:
      - lexical/pkg256-exec
    paths:
      - '.github/workflows/lexical-pkg256-sync-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg256-exec
          fetch-depth: 0
      - name: Sync corrected authority and rebuild preflight
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            tools/lexical_compile_reconciliation_package.py \
            content/lexical/semantic-reconciliation/o5875-o6374.md \
            content/lexical/execution/preflight/o5875-o6374.activation-contract.json \
            content/lexical/CURRENT.md
          python tools/lexical_compile_reconciliation_package.py \
            --start 5875 --end 6374 \
            --production content/lexical/semantic-review/o5875-o6124.md \
            --production content/lexical/semantic-review/o6125-o6374.md \
            --audit content/lexical/semantic-audit/o5825-o6024.audit.md \
            --audit content/lexical/semantic-audit/o6025-o6224.audit.md \
            --audit content/lexical/semantic-audit/o6225-o6424.audit.md \
            --out content/lexical/execution/preflight/o5875-o6374.reconciliation-compile.json
          python tools/lexical_prepare_execution_package.py \
            --accounting content/lexical/execution/preflight/o5875-o6374.reconciliation-compile.json \
            --reconciliation content/lexical/semantic-reconciliation/o5875-o6374.md \
            --issue 256 \
            --remote 227 --remote 2567 --remote 2827 --remote 2967 --remote 3063 \
            --remote 3472 --remote 4281 --remote 5558 --remote 7182 --remote 7671 \
            --out-prefix content/lexical/execution/preflight/o5875-o6374
      - name: Commit sync
        run: |
          set -euo pipefail
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add tools/lexical_compile_reconciliation_package.py content/lexical/CURRENT.md \
            content/lexical/semantic-reconciliation/o5875-o6374.md content/lexical/execution/preflight/o5875-o6374*.json \
            content/lexical/execution/preflight/o5875-o6374*.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'lexical: sync corrected pkg256 authority [skip ci]'
          git push origin HEAD:lexical/pkg256-exec
