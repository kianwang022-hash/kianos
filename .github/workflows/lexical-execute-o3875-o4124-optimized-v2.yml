name: Lexical Execute o3875-o4124 Optimized Resume

on:
  push:
    branches:
      - lexical/execute-o3875-o4124-optimized-v5
    paths:
      - content/lexical/execution/o3975-o4124.OPTIMIZED_ACTIVE

permissions:
  contents: write

jobs:
  execute-remaining-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fresh Current gate, helper, and exact refine identity patch
        shell: bash
        run: |
          set -euo pipefail
          BASE=0a9338e39ba036a3cd57557216733511df2f49a2
          git fetch origin main:refs/remotes/origin/main
          DRIFT=$(git diff --name-only "$BASE..origin/main" -- \
            content/lexical/words/by-ordinal \
            content/lexical/canonical/senses/shards \
            content/lexical/canonical/collocations/shards \
            content/lexical/relations/by-id \
            content/lexical/relations/manifest.json || true)
          if [ -n "$DRIFT" ]; then echo "LEXICAL_SEMANTIC_DRIFT_SINCE_EXECUTION_BASE"; echo "$DRIFT"; exit 1; fi
          git fetch origin 4c85edc2911928e20e264bb13d232949bb953984:refs/remotes/origin/forward-helper
          git show origin/forward-helper:tools/lexical_apply_retro_o0025_o0224.py > tools/lexical_apply_retro_o0025_o0224.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/lexical_apply_forward_o3875_o4124_remaining.py')
          t=p.read_text()
          old='''    refs=s.owner(4011).get("reference_senses",[]); pur=[r for r in refs if r.get("pos")=="verb" and any(k in norm(r.get("definition_en")) for k in ("purif","impurit"))]; imp=[r for r in refs if r.get("pos")=="verb" and any(k in norm(r.get("definition_en")) for k in ("improve","precise","subtle","small changes"))]\n    if len(pur)!=1 or len(imp)!=1 or pur[0]["stable_sense_id"]==imp[0]["stable_sense_id"]: raise RuntimeError("REFINE_STABLE_ID_MATCH_FAILED")\n    s.reactivate(4011,pur[0]["stable_sense_id"],level="L1"); s.reactivate(4011,imp[0]["stable_sense_id"],level="L1")'''
          new='''    s.reactivate(4011,"sense:refine:e22aa4e406305ada",level="L1")\n    s.reactivate(4011,"sense:refine:79cd17549e825c31",level="L1")\n    s.reactivate(4011,"sense:refine:1135921581225229",level="L2")'''
          if old not in t: raise SystemExit('REFINE_PATCH_ANCHOR_MISSING')
          p.write_text(t.replace(old,new,1))
          PY
          python -m py_compile tools/lexical_apply_forward_o3875_o4124_remaining.py
          git config user.name "Kian"
          git config user.email "kianwang022@gmail.com"

      - name: Execute shards 3-5 in one runner
        shell: bash
        run: |
          set -euo pipefail
          run_shard () {
            shard="$1"; lo="$2"; hi="$3"
            echo "=== EXECUTE SHARD $shard o${lo}-o${hi} ==="
            python tools/lexical_apply_forward_o3875_o4124_remaining.py --shard "$shard"
            python tools/lexical_natural_owner.py audit
            python - "$lo" "$hi" <<'PY'
          import json, pathlib, subprocess, sys
          lo=int(sys.argv[1]); hi=int(sys.argv[2]); receipt=pathlib.Path(f'content/lexical/execution/receipts/o{lo:04d}-o{hi:04d}.json'); r=json.loads(receipt.read_text()); expected=set(r['changed_word_ordinals'])
          raw=subprocess.check_output(['git','status','--porcelain=v1','-z','--untracked-files=all']); actual=set(); bad=[]
          for e in raw.split(b'\0'):
              if not e: continue
              p=e.decode('utf-8','surrogateescape')[3:]
              if ' -> ' in p: p=p.split(' -> ',1)[1]
              if p.startswith('content/lexical/words/by-ordinal/o') and p.endswith('.json'): actual.add(int(p.rsplit('/o',1)[1][:-5])); continue
              if p.startswith('content/lexical/canonical/senses/shards/') or p.startswith('content/lexical/canonical/collocations/shards/'): continue
              if p.startswith('content/lexical/relations/by-id/') or p=='content/lexical/relations/manifest.json': continue
              if p==str(receipt): continue
              if p.startswith('tools/') or p.startswith('.github/workflows/') or '.OPTIMIZED_ACTIVE' in p: continue
              if p.startswith('content/lexical/'): bad.append(p)
          if actual!=expected: raise SystemExit(f'WORD_WRITE_SET_MISMATCH expected={sorted(expected)} actual={sorted(actual)}')
          if bad: raise SystemExit(f'UNAUTHORIZED_LEXICAL_PATHS:{sorted(set(bad))}')
          print('exact shard diff gate PASS',lo,hi,'words=',len(actual))
          PY
            find tools -type d -name __pycache__ -prune -exec rm -rf {} +
            git add content/lexical/words/by-ordinal content/lexical/canonical/senses/shards content/lexical/canonical/collocations/shards content/lexical/relations "content/lexical/execution/receipts/o${lo}-o${hi}.json"
            git diff --cached --quiet && { echo "No shard changes for o${lo}-o${hi}"; exit 1; }
            git commit -m "lexical: execute forward shard o${lo}-o${hi}"
            git push origin HEAD:lexical/execute-o3875-o4124-optimized-v5
          }
          run_shard 3 3975 4024
          run_shard 4 4025 4074
          run_shard 5 4075 4124

      - name: Package-wide lexical verification
        shell: bash
        run: |
          set -euo pipefail
          python tools/lexical_natural_owner.py audit
          python tools/test_lexical_transport_guards.py
          python tools/test_lexical_shard.py
          python - <<'PY'
          import json
          from pathlib import Path
          n=0
          for p in Path('content/lexical').rglob('*.json'): json.loads(p.read_text(encoding='utf-8')); n+=1
          print('parsed',n,'lexical json files')
          PY

      - name: Full Astro build
        shell: bash
        run: |
          set -euo pipefail
          cd static-web
          npm install --no-audit --no-fund
          npm run build

      - name: Write durable package receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('content/lexical/execution/receipts'); ranges=[(3875,3924),(3925,3974),(3975,4024),(4025,4074),(4075,4124)]; rs=[json.loads((root/f'o{a:04d}-o{b:04d}.json').read_text()) for a,b in ranges]
          sources=sorted({o for r in rs for o in r['semantic_source_ordinals']}); authorized=[1023,1436,1981,2772,3675,3747,4176,5280,5594,5596]; declared=sorted({o for r in rs for o in r.get('out_of_range_dependency_ordinals',[])})
          if len(sources)!=105: raise SystemExit(f'SOURCE_UNION_NOT_105:{len(sources)}')
          if declared!=authorized: raise SystemExit(f'REMOTE_ENVELOPE_MISMATCH:{declared}')
          receipt={'schema':'kianos.lexical.forward_package_receipt.v3','status':'VERIFIED_READY_FOR_MAIN','scope':[3875,4124],'authority':'content/lexical/semantic-reconciliation/o3875-o4124.md','semantic_source_union_count':105,'semantic_source_ordinals':sources,'authorized_out_of_range_word_dependencies':authorized,'shard_receipts':[f'content/lexical/execution/receipts/o{a:04d}-o{b:04d}.json' for a,b in ranges],'relation_manifest_count':json.loads(Path('content/lexical/relations/manifest.json').read_text()).get('relation_count'),'checks':{'current_semantic_drift_gate':'PASS','five_shard_receipts':'PASS','250_owner_readback':'PASS','exact_105_source_union':'PASS','exact_10_remote_dependency_envelope':'PASS','natural_owner_registry_audit':'PASS','transport_guards':'PASS','shard_tests':'PASS','all_lexical_json':'PASS','astro_build':'PASS'},'next_catalog':'o4125+ NOT_ACTIVATED_UNTIL_THIS_PACKAGE_MERGES'}
          (root/'o3875-o4124.forward-package.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n'); print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

      - name: Remove one-time execution transport
        shell: bash
        run: |
          rm -f .github/workflows/lexical-execute-o3875-o3924.yml .github/workflows/lexical-o3875-o3924-introspect.yml .github/workflows/lexical-execute-o3875-o4124-optimized.yml .github/workflows/lexical-execute-o3875-o4124-optimized-v2.yml
          rm -f tools/lexical_apply_forward_o3875_o3924.py tools/lexical_apply_forward_o3875_o4124_remaining.py
          rm -f content/lexical/execution/o3875-o3924.ACTIVE content/lexical/execution/o3925-o4124.OPTIMIZED_ACTIVE content/lexical/execution/o3975-o4124.OPTIMIZED_ACTIVE
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit verified package receipt and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A .github/workflows tools/lexical_apply_forward_o3875_o3924.py tools/lexical_apply_forward_o3875_o4124_remaining.py content/lexical/execution
          git diff --cached --quiet && { echo 'No package exit changes'; exit 1; }
          git commit -m "lexical: verify forward package o3875-o4124"
          git push origin HEAD:lexical/execute-o3875-o4124-optimized-v5
