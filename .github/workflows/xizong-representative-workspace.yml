name: Xizong Representative Workspace

on:
  pull_request:
    paths:
      - 'content/xizong/**'
      - 'static-web/src/components/Xizong*.astro'
      - 'static-web/src/lib/xizong*.mjs'
      - 'static-web/src/pages/xizong/**'
      - 'static-web/scripts/test-xizong-representative-workspace.mjs'
      - '.github/workflows/xizong-representative-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  representative-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Validate Xizong contracts
        working-directory: static-web
        run: npm run validate:xizong
      - name: Build Current site
        working-directory: static-web
        run: npm run build
      - name: Install isolated browser acceptance tool
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute A1 A2 A3 B C representative Workspace acceptance
        working-directory: static-web
        run: node scripts/test-xizong-representative-workspace.mjs
      - name: Upload representative Workspace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xizong-representative-workspace-${{ github.sha }}
          path: static-web/.qa/xizong-representative-workspace.json
          retention-days: 14
