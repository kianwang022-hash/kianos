name: Politics Functional First Journey

on:
  push:
    branches: [main]
    paths:
      - 'content/politics/**'
      - 'static-web/package.json'
      - 'static-web/src/components/Politics*.astro'
      - 'static-web/src/lib/politics*.mjs'
      - 'static-web/src/pages/politics/**'
      - 'static-web/scripts/*politics*.mjs'
      - '.github/workflows/static-web-politics-functional-journey.yml'
  pull_request:
    paths:
      - 'content/politics/**'
      - 'static-web/package.json'
      - 'static-web/src/components/Politics*.astro'
      - 'static-web/src/lib/politics*.mjs'
      - 'static-web/src/pages/politics/**'
      - 'static-web/scripts/*politics*.mjs'
      - '.github/workflows/static-web-politics-functional-journey.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: politics-functional-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Validate Politics runtime
        working-directory: static-web
        run: npm run validate:politics
      - name: Audit purpose-first rollout across all PASS units
        working-directory: static-web
        run: node scripts/audit-politics-purpose-first-rollout.mjs
      - name: Build Current site
        working-directory: static-web
        run: npm run build
      - name: Install isolated browser acceptance tool
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute Politics Functional First journeys
        working-directory: static-web
        run: node scripts/test-politics-functional-journey.mjs
      - name: Verify purpose-first Politics Golden UI
        working-directory: static-web
        run: node scripts/test-politics-golden-purpose-first.mjs
      - name: Verify Marx C01 purpose-first pilot
        working-directory: static-web
        run: node scripts/test-politics-marx-c01-purpose-first.mjs
      - name: Verify five-subject purpose-first batch matrix
        working-directory: static-web
        run: node scripts/test-politics-purpose-first-batch-matrix.mjs
      - name: Execute Mao Runtime journeys
        working-directory: static-web
        run: node scripts/test-politics-mao-runtime.mjs
      - name: Audit Mao Evidence model
        working-directory: static-web
        run: node scripts/audit-politics-mao-evidence.mjs
      - name: Execute Mao Evidence journeys
        working-directory: static-web
        run: node scripts/test-politics-mao-evidence.mjs
      - name: Save journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: politics-functional-journey-${{ github.sha }}
          path: politics-functional-audit/
          retention-days: 7
      - name: Save Mao Runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: politics-mao-runtime-${{ github.sha }}
          path: politics-mao-runtime-audit/
          retention-days: 7
      - name: Save Mao Evidence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: politics-mao-evidence-${{ github.sha }}
          path: politics-mao-evidence-audit/
          retention-days: 7
