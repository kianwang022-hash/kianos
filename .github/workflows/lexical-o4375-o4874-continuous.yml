name: Lexical o4375-o4874 continuous 500-owner execution

on:
  push:
    branches:
      - lexical/execute-o4375-o4874-20260916
    paths:
      - 'tools/lexical_package_runtime.py'
      - 'tools/lexical_manifest_o4375_o4874.py'
      - 'tools/lexical_execute_o4375_o4874_v2.py'
      - 'tools/lexical_verify_o4375_o4874.py'
      - '.github/workflows/lexical-o4375-o4874-continuous.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexical-o4375-o4874-continuous
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      KIANOS_BASELINE_MAIN: 135b023633dd109403cc223a2971c36669a4a889
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/execute-o4375-o4874-20260916
          fetch-depth: 0

      - name: Validate whole-package manifest
        run: |
          python tools/lexical_execute_o4375_o4874_v2.py --validate-manifest
          python -m py_compile tools/lexical_package_runtime.py tools/lexical_manifest_o4375_o4874.py tools/lexical_execute_o4375_o4874_v2.py tools/lexical_verify_o4375_o4874.py

      - name: Execute 500-owner package continuously
        run: |
          set -euo pipefail
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          ranges=(4375-4424 4425-4474 4475-4524 4525-4574 4575-4624 4625-4674 4675-4724 4725-4774 4775-4824 4825-4874)
          for i in $(seq 0 9); do
            r=${ranges[$i]}
            receipt="content/lexical/execution/receipts/o${r%-*}-o${r#*-}.json"
            if [ -f "$receipt" ]; then
              echo "RESUME_SKIP checkpoint=$i range=$r"
              continue
            fi
            echo "EXECUTE checkpoint=$i range=$r"
            python tools/lexical_execute_o4375_o4874_v2.py --checkpoint "$i"
            python tools/test_lexical_transport_guards.py
            python tools/test_lexical_shard.py
            python - <<'PY'
          import json, subprocess
          from pathlib import Path
          changed=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          targets=[p for p in changed if p.startswith('content/lexical/') and p.endswith('.json') and Path(p).exists()]
          for p in targets: json.loads(Path(p).read_text(encoding='utf-8'))
          print('CHECKPOINT_JSON_PASS',len(targets))
          PY
            git add content/lexical
            git commit -m "lexical: execute o${r%-*}-o${r#*-} internal receipt [skip ci]"
            git push origin HEAD:lexical/execute-o4375-o4874-20260916
          done

      - name: Package accounting and registry verification
        run: |
          python tools/lexical_verify_o4375_o4874.py
          python tools/lexical_natural_owner.py audit
          python tools/test_lexical_transport_guards.py
          python tools/test_lexical_shard.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          base='135b023633dd109403cc223a2971c36669a4a889'
          changed=subprocess.check_output(['git','diff','--name-only',f'{base}..HEAD'],text=True).splitlines()
          targets=[p for p in changed if p.startswith('content/lexical/') and p.endswith('.json') and Path(p).exists()]
          for p in targets: json.loads(Path(p).read_text(encoding='utf-8'))
          print('PACKAGE_JSON_PASS',len(targets))
          PY

      - name: Full Astro build
        working-directory: static-web
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run build

      - name: Finalize durable 500-owner package receipt
        env:
          KIANOS_ASTRO_BUILD: PASS
        run: |
          python tools/lexical_verify_o4375_o4874.py --finalize
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical/execution/o4375-o4874.package-receipt.json
          git commit -m 'lexical: verify o4375-o4874 package closure [skip ci]'
          git push origin HEAD:lexical/execute-o4375-o4874-20260916
