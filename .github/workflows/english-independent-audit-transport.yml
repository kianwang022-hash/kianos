name: English Fresh Independent Execution
on:
  push:
    branches: [work/english-final-independent-audit-20260919-r2]
    paths: [.github/workflows/english-independent-audit-transport.yml]
permissions:
  contents: write
jobs:
  independent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply and persist verified bounded candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib, subprocess
          chunks = ''.join(Path('.github/english-audit-transport/part'+str(i)).read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(chunks, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '7678c6381e8da78eeb063330e5ffe070f89e00cf3d3e09125c138a87de5fcdfa'
          Path('/tmp/english-candidate.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/english-candidate.patch'], check=True)
          subprocess.run(['git','apply','--index','/tmp/english-candidate.patch'], check=True)
          PY
          git rm -r .github/english-audit-transport
          git rm .github/workflows/english-independent-audit-transport.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(english): preserve exam drafts, exact Session identity and demand-specific lexical evidence'
          git push origin HEAD:work/english-final-independent-audit-20260919-r2
          mkdir -p static-web/.qa/english-fresh
          git rev-parse HEAD > static-web/.qa/english-fresh/TESTED_HEAD.txt
      - name: Independent synthetic boundary tests
        working-directory: static-web
        env:
          AUDIT_OUTPUT: .qa/english-fresh/boundaries.json
        run: node scripts/test-english-fresh-boundaries.mjs | tee .qa/english-fresh/boundaries.log
      - name: Install execution dependencies
        working-directory: static-web
        run: |
          npm install --no-audit --no-fund
          cp package-lock.json .qa/english-fresh/resolved-package-lock.json
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Generate only isolated synthetic objects using Current templates
        working-directory: static-web
        run: node scripts/prepare-english-fresh-browser.mjs
      - name: Real browser journeys and restart
        working-directory: static-web
        env:
          AUDIT_OUTPUT_DIR: .qa/english-fresh
          AUDIT_BASE: http://127.0.0.1:4333
        run: |
          npm run dev -- --host 127.0.0.1 --port 4333 > .qa/english-fresh/server.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for i in range(60):
            try:
              urllib.request.urlopen('http://127.0.0.1:4333/english-exam/audit-synthetic/', timeout=5)
              break
            except Exception: time.sleep(1)
          else: raise RuntimeError('Synthetic Current server did not start')
          PY
          python scripts/test-english-fresh-browser.py | tee .qa/english-fresh/browser.log
      - name: Remove fixture routes and verify production build
        if: always()
        working-directory: static-web
        run: |
          node scripts/prepare-english-fresh-browser.mjs --clean
          npm run build > .qa/english-fresh/build.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-fresh-independent-execution
          path: |
            static-web/.qa/english-fresh/*.json
            static-web/.qa/english-fresh/*.txt
            static-web/.qa/english-fresh/*.log
            static-web/.qa/english-fresh/*.png
          retention-days: 14
