name: English Independent Audit Transport
on:
  push:
    branches: [work/english-final-independent-audit-20260919-r2]
    paths: [.github/workflows/english-independent-audit-transport.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies using repository convention
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Archive build dependencies only
        run: |
          mkdir -p /tmp/english-independent-audit
          git rev-parse HEAD > /tmp/english-independent-audit/HEAD.txt
          cp static-web/package-lock.json /tmp/english-independent-audit/resolved-package-lock.json
          tar -czf /tmp/english-independent-audit/node-modules.tar.gz -C static-web node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: english-independent-audit-dependencies
          path: /tmp/english-independent-audit/
          retention-days: 3
