name: Temp Xizong P3 Validation Fix

on:
  push:
    branches:
      - work/xizong-second-pass-p3-review-surface

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/xizong-second-pass-p3-review-surface
          fetch-depth: 0
      - name: Remove production-coverage-dependent fallback assertion
        run: node static-web/scripts/tmp-p3-validation-fix.mjs
      - name: Commit validation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static-web/scripts/validate-xizong-learning.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(xizong): keep second-pass fallback coverage-independent"
          git push origin HEAD:work/xizong-second-pass-p3-review-surface
