name: Lexical C o3151-o3250

on:
  push:
    branches:
      - work/lexical-c-o3151-o3250-20260923
    paths:
      - 'content/lexical/semantic-review/dual/C/o3151-o3250.decision.json'
      - 'tools/lexical_apply_c_o3151_o3250.py'
      - '.github/workflows/lexical-c-o3151-o3250.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply C window
        run: python3 tools/lexical_apply_c_o3151_o3250.py

      - name: Natural Owner audit
        run: python3 tools/lexical_natural_owner.py audit

      - name: Verify bounded scope
        run: |
          python3 - <<'PY'
          import subprocess,sys
          files=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          ords=[]
          prefix='content/lexical/words/by-ordinal/o'
          for p in files:
              if p.startswith(prefix) and p.endswith('.json'):
                  ords.append(int(p[len(prefix):-5]))
          bad=[o for o in ords if not 3151<=o<=3250]
          print({'changed_files':len(files),'changed_word_ordinals':ords,'bad':bad})
          if bad:
              sys.exit(1)
          PY
          git diff --check

      - name: Commit canonical mutation
        id: mutation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/lexical
          git commit -m "Lexical C: reconcile o3151-o3250"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Seal cursor and self-delete executor
        env:
          MUTATION_SHA: ${{ steps.mutation.outputs.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os

          p=Path('content/lexical/execution/dual-review-C.json')
          d=json.loads(p.read_text())
          d['status']='ACTIVE_PREFIX_GATED'
          d['next_ordinal']=3251
          d['completed_through']=3250
          d['semantic_decided_through']=3250
          d['canonical_applied_through']=3250
          d['next_semantic_ordinal']=3251
          d['active_checkpoint_branch']=None
          d['checkpoint_start_ordinal']=3051
          d['checkpoint_target_through']=3550
          d['checkpoint_staged_through']=3250
          d['checkpoint_full_rebuild_pending']=False
          d['checkpoint_batch_apply_pending']=False
          d['pending_decision_manifests']=[]

          cp=d.get('checkpoint') if isinstance(d.get('checkpoint'),dict) else {}
          if cp.get('start_ordinal')!=3051:
              cp={'start_ordinal':3051,'target_end_ordinal':3550,'windows':[]}
          cp['semantic_completed_through']=3250
          cp['semantic_decided_through']=3250
          cp['canonical_applied_through']=3250
          cp['pending_batch_apply']=False
          cp['pending_full_7946_flob_rebuild']=False
          cp.setdefault('windows',[]).append({
              'range':[3151,3250],
              'a_review_commit':'ae54e7c9ed202e9f851d867c139d51036d9dacbf',
              'b_review_commit':'525a510a7847cf24833eb2825f6ab43ebf62ec0f',
              'c_mutation_commit':os.environ['MUTATION_SHA'],
              'decision_manifest':'content/lexical/semantic-review/dual/C/o3151-o3250.decision.json'
          })
          d['checkpoint']=cp

          receipt={
              'schema':'kianos.lexical.streaming_c_window_receipt.v1',
              'status':'PASS',
              'range':[3151,3250],
              'semantic_baseline_sha':'12766cf94b89bd135016e3213637e31edd19adfe',
              'shared_watermark_at_reconcile':5550,
              'a_review_commit':'ae54e7c9ed202e9f851d867c139d51036d9dacbf',
              'b_review_commit':'525a510a7847cf24833eb2825f6ab43ebf62ec0f',
              'c_mutation_commit':os.environ['MUTATION_SHA'],
              'decision_manifest':'content/lexical/semantic-review/dual/C/o3151-o3250.decision.json',
              'semantic_decided_through':3250,
              'canonical_applied_through':3250,
              'natural_owner_audit':'PASS',
              'flob_required_for_semantic_closure':False,
              'shared_relation_closed':'must/must not vs need/need not decision relation',
              'retired_spelling_relation':'normalisation/normalization'
          }
          rp=Path('content/lexical/execution/mutation-receipts/dual-review-c-o3151-o3250.json')
          rp.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          d.setdefault('window_receipts',[]).append(str(rp))
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY

          git rm tools/lexical_apply_c_o3151_o3250.py .github/workflows/lexical-c-o3151-o3250.yml
          git add content/lexical/semantic-review/dual/C/o3151-o3250.decision.json content/lexical/execution/dual-review-C.json content/lexical/execution/mutation-receipts/dual-review-c-o3151-o3250.json
          git commit -m "Lexical C: seal o3151-o3250"
          git push origin HEAD:${GITHUB_REF_NAME}
