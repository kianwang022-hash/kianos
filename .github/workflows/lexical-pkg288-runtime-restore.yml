name: Lexical pkg288 restore runtime and patch Unicode alias

on:
  push:
    branches:
      - lexical/pkg288-exec
    paths:
      - '.github/workflows/lexical-pkg288-runtime-restore.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg288-exec
          fetch-depth: 0
      - name: Restore complete runtime from main and apply minimal alias patch
        run: |
          git fetch origin main
          git show origin/main:tools/lexical_package_runtime.py > tools/lexical_package_runtime.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/lexical_package_runtime.py')
          s=p.read_text()
          old='''    if not canonical_path.exists() or not alias_path.exists():\n        raise RuntimeError(f"LOOKUP_SHARD_MISSING o{ordinal:04d} {word}->{alias}")\n    canonical = load(canonical_path)\n    alias_data = canonical if alias_path == canonical_path else load(alias_path)\n'''
          new='''    if not canonical_path.exists():\n        raise RuntimeError(f"CANONICAL_LOOKUP_SHARD_MISSING o{ordinal:04d} {word}")\n    canonical = load(canonical_path)\n    alias_data = canonical if alias_path == canonical_path else (load(alias_path) if alias_path.exists() else {})\n'''
          if old not in s:
              raise SystemExit('ALIAS_PATCH_ANCHOR_MISSING')
          p.write_text(s.replace(old,new,1))
          PY
          python -m py_compile tools/lexical_package_runtime.py
          grep -q 'def rebuild_core_from_active' tools/lexical_package_runtime.py
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add tools/lexical_package_runtime.py
          git commit -m 'lexical: restore full runtime with Unicode alias shard support [skip ci]'
          git push origin HEAD:lexical/pkg288-exec
