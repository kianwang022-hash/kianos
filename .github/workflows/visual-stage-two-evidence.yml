name: Visual Subject Workspaces
on:
  push:
    branches: ['ui/visual-convergence-20260916']
    paths:
      - 'static-web/src/**'
      - 'static-web/scripts/capture-visual-stage-two.mjs'
      - '.github/workflows/visual-stage-two-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-subjects-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and browser
        working-directory: static-web
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npx playwright install --with-deps chromium
      - name: Build and capture Current subject workspaces
        working-directory: static-web
        run: |
          mkdir -p ../visual-stage-two
          git rev-parse HEAD > ../visual-stage-two/commit.txt
          npm run build > ../visual-stage-two/build.log 2>&1
          node scripts/capture-visual-stage-two.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-subjects-${{ github.sha }}
          path: visual-stage-two/
          retention-days: 7
