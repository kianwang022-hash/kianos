name: LexicalOS Historical Round Bulk Triage

on:
  push:
    branches:
      - main
    paths:
      - 'tools/lexical_historical_round_bulk_triage.py'
      - 'tools/lexical_historical_round_from_file.py'
      - 'tools/lexical_historical_round_owner_surfaces.py'
      - 'tools/lexical_historical_round_compound_surfaces.py'
      - 'tools/lexical_historical_round_enrich_owner_packet.py'
      - 'content/lexical/audit/migration-integrity/r31-execution-authority.md'
      - '.github/workflows/lexical-historical-round-triage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r31-bulk-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read compact R31 authority and bulk-triage Current
        shell: bash
        run: |
          python tools/lexical_historical_round_compound_surfaces.py \
            content/lexical/audit/migration-integrity/r31-execution-authority.md \
            --legacy-repo kianwang022-hash/kianos-legacy \
            --comment-id 5589834920 \
            --audit-id R31_7701_7946_CORE_EXPANSION_CONTRAST \
            --expected-core 49 \
            --expected-expansion 99 \
            --expected-contrast 65 \
            --output /tmp/r31-bulk-triage.json \
            --summary /tmp/r31-bulk-triage-summary.md

      - name: Enrich Expansion candidates with compact Current owner projections
        shell: bash
        run: |
          python tools/lexical_historical_round_enrich_owner_packet.py \
            /tmp/r31-bulk-triage.json \
            --output /tmp/r31-bulk-triage.json

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/r31-bulk-triage-summary.md ]; then
            cat /tmp/r31-bulk-triage-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## R31 bulk triage summary unavailable' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload triage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lexical-r31-bulk-triage
          path: |
            /tmp/r31-bulk-triage.json
            /tmp/r31-bulk-triage-summary.md
          if-no-files-found: error
          retention-days: 14
