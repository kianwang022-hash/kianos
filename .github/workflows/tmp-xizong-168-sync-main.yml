name: TEMP Xizong 168 Sync Main

on:
  push:
    branches:
      - chat/xizong-multipass-question-attempts

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/xizong-multipass-question-attempts
          fetch-depth: 0
      - name: Merge latest main into PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:chat/xizong-multipass-question-attempts
