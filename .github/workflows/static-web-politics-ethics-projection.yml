name: Politics Ethics Projection Audit

on:
  pull_request:
    paths:
      - 'content/politics/**'
      - 'static-web/src/components/Politics*.astro'
      - 'static-web/src/lib/politics*.mjs'
      - 'static-web/src/pages/politics/**'
      - 'static-web/scripts/audit-politics-ethics-projection.mjs'
      - '.github/workflows/static-web-politics-ethics-projection.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: politics-ethics-projection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Audit Ethics Projection
        working-directory: static-web
        run: node scripts/audit-politics-ethics-projection.mjs
      - name: Validate Politics runtime
        working-directory: static-web
        run: npm run validate:politics
      - name: Build Current site
        working-directory: static-web
        run: npm run build
