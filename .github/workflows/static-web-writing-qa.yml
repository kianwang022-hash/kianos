name: Static Web Writing QA

on:
  push:
    branches: [main]
    paths:
      - 'LEARNING_ACCEPTANCE.md'
      - 'content/english/LEARNING_CONTRACT.md'
      - 'content/english/manifest.json'
      - 'content/english/modules/writing/**'
      - 'content/english/source/question_bank.v1.json'
      - 'content/english/source/global_source_truth.v1.json'
      - 'static-web/package.json'
      - 'static-web/astro.config.mjs'
      - 'static-web/src/layouts/**'
      - 'static-web/src/styles/global.css'
      - 'static-web/src/styles/runtime.css'
      - 'static-web/src/styles/writing*.css'
      - 'static-web/src/lib/current.mjs'
      - 'static-web/src/lib/*writing*.mjs'
      - 'static-web/src/lib/*Writing*.mjs'
      - 'static-web/src/components/Writing*.astro'
      - 'static-web/src/pages/writing.astro'
      - 'static-web/src/pages/writing/**'
      - 'static-web/src/pages/writing-learn.astro'
      - 'static-web/scripts/*writing*.mjs'
      - '.github/workflows/static-web-writing-qa.yml'
  pull_request:
    paths:
      - 'LEARNING_ACCEPTANCE.md'
      - 'content/english/LEARNING_CONTRACT.md'
      - 'content/english/manifest.json'
      - 'content/english/modules/writing/**'
      - 'content/english/source/question_bank.v1.json'
      - 'content/english/source/global_source_truth.v1.json'
      - 'static-web/package.json'
      - 'static-web/astro.config.mjs'
      - 'static-web/src/layouts/**'
      - 'static-web/src/styles/global.css'
      - 'static-web/src/styles/runtime.css'
      - 'static-web/src/styles/writing*.css'
      - 'static-web/src/lib/current.mjs'
      - 'static-web/src/lib/*writing*.mjs'
      - 'static-web/src/lib/*Writing*.mjs'
      - 'static-web/src/components/Writing*.astro'
      - 'static-web/src/pages/writing.astro'
      - 'static-web/src/pages/writing/**'
      - 'static-web/src/pages/writing-learn.astro'
      - 'static-web/scripts/*writing*.mjs'
      - '.github/workflows/static-web-writing-qa.yml'

concurrency:
  group: writing-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  writing-runtime-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-web
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Writing acceptance evidence
        run: npm run validate:writing
      - name: Build Astro
        run: npm run build
