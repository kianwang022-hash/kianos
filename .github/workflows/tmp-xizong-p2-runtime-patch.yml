name: Temp Xizong P2 Runtime Patch

on:
  push:
    branches:
      - work/xizong-second-pass-p2-targeted-queue

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/xizong-second-pass-p2-targeted-queue
          fetch-depth: 0
      - name: Apply bounded runtime and browser-test patch
        run: node static-web/scripts/tmp-p2-runtime-patch.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static-web/src/components/XizongSystemExitRuntime.astro static-web/scripts/test-xizong-a2-functional-journey.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "xizong: wire targeted second-pass queue into runtime"
          git push origin HEAD:work/xizong-second-pass-p2-targeted-queue
