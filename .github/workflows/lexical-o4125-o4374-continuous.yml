name: Lexical o4125-o4374 continuous package execution

on:
  push:
    branches:
      - lexical/execute-o4125-o4374-20260916
    paths:
      - '.github/workflows/lexical-o4125-o4374-continuous.yml'
      - 'tools/lexical_relation_primitives.py'
      - 'tools/lexical_execute_o4275_o4324_v2.py'
      - 'tools/lexical_execute_o4325_o4374.py'
      - 'tools/lexical_execute_o4325_o4374_v2.py'
      - 'tools/lexical_verify_o4125_o4374.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexical-o4125-o4374-continuous
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      KIANOS_BASELINE_MAIN: 9474f13e6d82935b78998eddf27b157a966e0e75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/execute-o4125-o4374-20260916
          fetch-depth: 0

      - name: Confirm resume frontier
        run: |
          test -f content/lexical/execution/receipts/o4125-o4174.json
          test -f content/lexical/execution/receipts/o4175-o4224.json
          test -f content/lexical/execution/receipts/o4225-o4274.json
          closed=150
          if [ -f content/lexical/execution/receipts/o4275-o4324.json ]; then closed=200; fi
          if [ -f content/lexical/execution/receipts/o4325-o4374.json ]; then closed=250; fi
          echo "RESUME_FRONTIER_CONFIRMED ${closed}/250"

      - name: Resume boundary 4
        run: |
          if [ -f content/lexical/execution/receipts/o4275-o4324.json ]; then
            echo 'BOUNDARY4_ALREADY_PASS'
            exit 0
          fi
          python tools/lexical_execute_o4275_o4324_v2.py
          python tools/test_lexical_transport_guards.py
          python tools/test_lexical_shard.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          changed=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          targets=[p for p in changed if p.startswith('content/lexical/') and p.endswith('.json')]
          for p in targets: json.loads(Path(p).read_text(encoding='utf-8'))
          print('BOUNDARY4_JSON_PASS',len(targets))
          PY
          rm -f content/lexical/execution/diagnostics/o4275-o4324.failure.txt
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical
          git commit -m 'lexical: execute o4275-o4324 boundary'
          git push origin HEAD:lexical/execute-o4125-o4374-20260916

      - name: Resume boundary 5
        run: |
          if [ -f content/lexical/execution/receipts/o4325-o4374.json ]; then
            echo 'BOUNDARY5_ALREADY_PASS'
            exit 0
          fi
          python tools/lexical_execute_o4325_o4374_v2.py
          python tools/test_lexical_transport_guards.py
          python tools/test_lexical_shard.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          changed=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          targets=[p for p in changed if p.startswith('content/lexical/') and p.endswith('.json')]
          for p in targets: json.loads(Path(p).read_text(encoding='utf-8'))
          print('BOUNDARY5_JSON_PASS',len(targets))
          PY
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical
          git commit -m 'lexical: execute o4325-o4374 boundary'
          git push origin HEAD:lexical/execute-o4125-o4374-20260916

      - name: Package accounting and registry verification
        run: |
          python tools/lexical_verify_o4125_o4374.py
          python tools/lexical_natural_owner.py audit
          python tools/test_lexical_transport_guards.py
          python tools/test_lexical_shard.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          base='9474f13e6d82935b78998eddf27b157a966e0e75'
          changed=subprocess.check_output(['git','diff','--name-only',f'{base}..HEAD'],text=True).splitlines()
          targets=[p for p in changed if p.startswith('content/lexical/') and p.endswith('.json') and Path(p).exists()]
          for p in targets: json.loads(Path(p).read_text(encoding='utf-8'))
          print('PACKAGE_JSON_PASS',len(targets))
          PY

      - name: Full Astro build
        working-directory: static-web
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run build

      - name: Finalize durable package receipt
        env:
          KIANOS_ASTRO_BUILD: PASS
        run: |
          python tools/lexical_verify_o4125_o4374.py --finalize
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical/execution/o4125-o4374.package-receipt.json
          git commit -m 'lexical: verify o4125-o4374 package closure'
          git push origin HEAD:lexical/execute-o4125-o4374-20260916
