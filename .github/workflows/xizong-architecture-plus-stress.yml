name: Xizong Architecture Plus Stress

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'content/xizong/knowledge/learner/study-policy.json'
      - 'static-web/src/lib/xizongMemoryModel.mjs'
      - 'static-web/src/lib/xizongSessionInstruction.mjs'
      - 'static-web/src/lib/xizongQuestionAttempts.mjs'
      - 'static-web/src/lib/xizongRetainedPractice.mjs'
      - 'static-web/src/lib/xizongScoreAttribution.mjs'
      - 'static-web/scripts/validate-xizong-memory-retention.mjs'
      - 'static-web/scripts/validate-xizong-targeted-practice.mjs'
      - 'static-web/scripts/validate-xizong-score-attribution.mjs'
      - 'static-web/scripts/stress-xizong-architecture-plus.mjs'
      - '.github/workflows/xizong-architecture-plus-stress.yml'

permissions:
  contents: read

jobs:
  architecture-plus-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: static-web
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Validate selective delayed retention
        run: node scripts/validate-xizong-memory-retention.mjs
      - name: Validate targeted practice boundaries
        run: node scripts/validate-xizong-targeted-practice.mjs
      - name: Validate score attribution boundaries
        run: node scripts/validate-xizong-score-attribution.mjs
      - name: Run Architecture+ full stress
        run: node scripts/stress-xizong-architecture-plus.mjs
