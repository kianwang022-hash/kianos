name: Lexical pkg301 preparation

on:
  push:
    branches: [lexical/pkg301-exec]
    paths:
      - '.github/workflows/lexical-pkg301-prepare.yml'
      - 'content/lexical/semantic-reconciliation/o7375-o7874.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile exact reconciliation accounting
        run: |
          python tools/lexical_compile_reconciliation_package.py \
            --start 7375 --end 7874 \
            --production content/lexical/semantic-review/o7375-o7624.md \
            --production content/lexical/semantic-review/o7625-o7874.md \
            --audit content/lexical/semantic-audit/o7375-o7624.audit.md \
            --audit content/lexical/semantic-audit/o7625-o7874.audit.md \
            --out content/lexical/execution/preflight/o7375-o7874.reconciliation-compile.json
      - name: Enforce frozen accounting
        run: |
          python - <<'PY'
          import json
          p='content/lexical/execution/preflight/o7375-o7874.reconciliation-compile.json'
          d=json.load(open(p))
          assert d['production_upgrade_count']==251, d['production_upgrade_count']
          assert d['audit_verdict_counts'].get('FLIP_TO_UPGRADE')==36, d['audit_verdict_counts']
          assert d['audit_verdict_counts'].get('REFINE_UPGRADE')==1, d['audit_verdict_counts']
          assert d['audit_verdict_counts'].get('FLIP_TO_NO_CHANGE',0)==0, d['audit_verdict_counts']
          assert d['audit_verdict_counts'].get('IDENTITY_RISK',0)==0, d['audit_verdict_counts']
          assert d['semantic_source_owner_count']==287, d['semantic_source_owner_count']
          assert sum(x['source_count'] for x in d['receipt_counts'])==287
          print('PKG301_ACCOUNTING_PASS', [x['source_count'] for x in d['receipt_counts']])
          PY
      - name: Prepare identity evidence and execution sheet
        run: |
          python tools/lexical_prepare_execution_package.py \
            --accounting content/lexical/execution/preflight/o7375-o7874.reconciliation-compile.json \
            --reconciliation content/lexical/semantic-reconciliation/o7375-o7874.md \
            --issue 301 \
            --remote 6240 \
            --out-prefix content/lexical/execution/preflight/o7375-o7874
      - name: Persist preparation artifacts
        run: |
          git config user.name 'Kian'
          git config user.email 'kianwang022@gmail.com'
          git add content/lexical/execution/preflight/o7375-o7874.*
          if git diff --cached --quiet; then
            echo 'No preparation delta'
            exit 0
          fi
          git commit -m 'lexical: compile pkg301 preparation artifacts [skip ci]'
          git push origin HEAD:lexical/pkg301-exec
