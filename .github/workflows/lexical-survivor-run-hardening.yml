name: Lexical survivor run frozen hardening

on:
  push:
    branches:
      - lexical/execute-o3875-o4124-20260916
    paths:
      - content/lexical/execution/o4025-o4124.RUN_HARDEN

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact frozen identities to executor
        shell: bash
        run: |
          set -euo pipefail
          python tools/lexical_harden_o4025_o4124_executor.py
          python -m py_compile tools/lexical_apply_forward_o3875_o4124_remaining.py
          git config user.name "Kian"
          git config user.email "kianwang022@gmail.com"
          git add tools/lexical_apply_forward_o3875_o4124_remaining.py
          git diff --cached --quiet && { echo NO_HARDENING_DIFF; exit 1; }
          git commit -m "lexical: harden frozen package identities"
          git push origin HEAD:lexical/execute-o3875-o4124-20260916
