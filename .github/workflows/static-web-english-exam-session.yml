name: English Exam Session

on:
  pull_request:
    paths: ['.github/workflows/static-web-english-exam-session.yml']

permissions:
  contents: write

concurrency:
  group: english-exam-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-materialization:
    if: github.event.pull_request.number == 754 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/freeze-english-seal-integrity-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish exact bounded candidate after native regression
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,lzma,hashlib,json,subprocess,os,pathlib,urllib.request
          # One-time mechanical transport of the already-tested patch. No model,
          # learner data, deployment, merge, force push, or follow-up dispatcher.
          repo='kianwang022-hash/kianos'
          parts=['d32eacbef6a941eb85945f962c79d9e15d63ac3a','09b5b70a10e1c13a54335eb04f3557cf57a31d72','daa007e1db221f15cf7c37bffd12649d0ba8a63a','5d7c168007b81cf68b8568c3fb538b1553f489af']
          chunks=[]
          for sha in parts:
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:blob=json.load(response)
              assert blob['sha']==sha and blob['encoding']=='base64','PATCH_BLOB_MISMATCH'
              chunk=base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(chunk)).encode()+b'\0'+chunk).hexdigest()==sha,'PATCH_BLOB_CORRUPT'
              chunks.append(chunk)
          raw=b''.join(chunks)
          assert hashlib.sha256(raw).hexdigest()=='8e143876cd565b5e18eb6b981332cd75ae07a972849eb7037655a19489d4e72a','PAYLOAD_CHANGED'
          payload=json.loads(lzma.decompress(raw))
          paths=payload['paths']
          assert len(paths)==len(set(paths)) and len(paths)<=120
          assert all(p=='AGENTS.md' or p.startswith('static-web/') for p in paths)
          assert all('..' not in pathlib.PurePosixPath(p).parts for p in paths)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          def digest_map(value):return hashlib.sha256(json.dumps(value,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          before={p:git('hash-object',p) if pathlib.Path(p).is_file() else None for p in paths}
          assert digest_map(before)==payload['preimages'],'PREIMAGES_CHANGED'
          subprocess.run(['git','apply','--unidiff-zero','--check','--index','-'],input=payload['patch'],text=True,check=True)
          subprocess.run(['git','apply','--unidiff-zero','--index','-'],input=payload['patch'],text=True,check=True)
          assert sorted(git('diff','--cached','--name-only').splitlines())==paths,'WRITE_SET_CHANGED'
          after={p:git('hash-object',p) for p in paths}
          assert digest_map(after)==payload['postimages'],'POSTIMAGES_CHANGED'
          for args in [
           ['--test','static-web/scripts/test-english-exam-seal-integrity.mjs','static-web/scripts/test-freeze-integrity.mjs'],
           ['static-web/scripts/test-private-learner-checkpoint.mjs'],
           ['static-web/scripts/test-shared-control-three-subjects.mjs'],
           ['--experimental-vm-modules','static-web/scripts/test-l1-control-transactions.mjs'],
           ['static-web/scripts/test-xizong-forecast-model.mjs'],
           ['static-web/scripts/test-codex-issue-watcher.mjs'],
           ['static-web/scripts/test-codex-execution-policy.mjs']]:subprocess.run(['node',*args],check=True)
          branch='fix/freeze-english-seal-integrity-20260922'
          remote=git('ls-remote','origin','refs/heads/'+branch).split()[0]
          assert remote==os.environ['EXPECTED_HEAD'],'BRANCH_MOVED_NO_PUSH'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','fix(runtime): bounded freeze truth, recovery and writer integrity repairs'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          pathlib.Path('english-exam-audit').mkdir(exist_ok=True)
          report={'status':'PUBLISHED_CANDIDATE','head':git('rev-parse','HEAD'),'files':after,'native_tests':'PASS','browser_tests':'NOT_RUN','deployment':'NOT_RUN'}
          pathlib.Path('english-exam-audit/repair-publication.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({'status':report['status'],'head':report['head'],'files':len(paths)}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freeze-repair-publication-${{ github.run_id }}
          path: english-exam-audit/repair-publication.json
          retention-days: 14
