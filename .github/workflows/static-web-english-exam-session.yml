name: English Exam Session

on:
  pull_request:
    paths: ['.github/workflows/static-web-english-exam-session.yml']

permissions:
  contents: write

concurrency:
  group: english-exam-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-reconciliation:
    if: github.event.pull_request.number == 754 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/freeze-english-seal-integrity-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish exact native-interface delta after regression
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,lzma,hashlib,json,subprocess,os,pathlib,urllib.request
          # One deterministic transport of nine already-tested public files.
          # No model, learner records, deployment, merge, force push or rearm.
          repo='kianwang022-hash/kianos';sha='c14cb314ae9c935ac6cc30f83b95746d8bcf9143'
          req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response:blob=json.load(response)
          assert blob['sha']==sha and blob['encoding']=='base64'
          raw=base64.b64decode(blob['content'])
          assert hashlib.sha256(raw).hexdigest()=='c05a18d1c9643717383a0b31569966cb0470c51b3d6b4f959d6bfdbc461da4ce','PAYLOAD_CHANGED'
          payload=json.loads(lzma.decompress(raw));paths=payload['paths']
          assert len(paths)==9 and len(set(paths))==9 and all(p.startswith('static-web/') and '..' not in pathlib.PurePosixPath(p).parts for p in paths)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          before={p:git('hash-object',p) for p in paths}
          assert before==payload['preimages'],'PREIMAGES_CHANGED'
          subprocess.run(['git','apply','--check','--index','-'],input=payload['patch'],text=True,check=True)
          subprocess.run(['git','apply','--index','-'],input=payload['patch'],text=True,check=True)
          assert sorted(git('diff','--cached','--name-only').splitlines())==paths,'WRITE_SET_CHANGED'
          after={p:git('hash-object',p) for p in paths}
          assert after==payload['postimages'],'POSTIMAGES_CHANGED'
          for args in [
           ['--test','scripts/test-english-exam-seal-integrity.mjs','scripts/test-freeze-integrity.mjs'],
           ['--experimental-vm-modules','scripts/test-l1-continuation.mjs','..'],
           ['--experimental-vm-modules','scripts/test-l1-control-transactions.mjs'],
           ['scripts/test-private-learner-checkpoint.mjs'],['scripts/test-shared-control-three-subjects.mjs'],
           ['scripts/test-xizong-forecast-model.mjs'],['scripts/test-english-evidence-resume.mjs'],
           ['scripts/test-english-generated-daily-packet.mjs'],['scripts/test-private-control-relay.mjs'],
           ['scripts/test-daily-learning-packet.mjs'],['scripts/test-private-daily-learning-packet-relay.mjs'],
           ['scripts/test-private-daily-learning-packet-bridge.mjs'],['scripts/test-exam-plan-read-model.mjs'],
           ['scripts/test-english-generated-drill-store.mjs'],['scripts/test-english-external-combined-store.mjs']]:
              subprocess.run(['node',*args],cwd='static-web',check=True)
          subprocess.run(['node','static-web/scripts/test-xizong-source-revision-transitive.mjs'],check=True)
          branch='fix/freeze-english-seal-integrity-20260922'
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==os.environ['EXPECTED_HEAD'],'BRANCH_MOVED_NO_PUSH'
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','fix(recovery): reconcile native receipt consumers and actual browser focus proof'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          pathlib.Path('english-exam-audit').mkdir(exist_ok=True)
          pathlib.Path('english-exam-audit/interface-publication.json').write_text(json.dumps({'status':'PUBLISHED_CANDIDATE','head':git('rev-parse','HEAD'),'files':after,'native_tests':'PASS','deployment':'NOT_RUN'},indent=2))
          PY
      - name: Install and build exact candidate
        working-directory: static-web
        run: |
          npm install --no-audit --no-fund
          npm run build
          node scripts/test-private-daily-learning-packet.mjs
      - name: Install isolated browser
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Existing healthy whole-paper journey
        working-directory: static-web
        run: node scripts/test-english-exam-session-browser.mjs
      - name: Corruption and actual native-focus two-page journeys
        if: success() || failure()
        working-directory: static-web
        run: xvfb-run -a node scripts/test-freeze-browser.mjs
      - name: Existing cross-subject journey with valid native fixture
        if: success() || failure()
        working-directory: static-web
        run: node scripts/test-final-cross-subject-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freeze-interface-browser-${{ github.run_id }}
          path: |
            english-exam-audit/
            static-web/.qa/final-cross-subject/
          retention-days: 14
