name: English Exam Session

on:
  pull_request:
    paths:
      - 'content/english/manifest.json'
      - 'static-web/src/lib/englishExamPaper.mjs'
      - 'static-web/src/lib/englishExamSession.mjs'
      - 'static-web/src/lib/englishSessionControl.mjs'
      - 'static-web/src/lib/englishLearnerEvidence.mjs'
      - 'static-web/src/lib/englishWritingRuntimeTask.mjs'
      - 'static-web/src/lib/englishWritingRuntimeSourceTruth.mjs'
      - 'static-web/src/lib/browserLearnerWriter.mjs'
      - 'static-web/src/lib/privateCheckpointRuntime.mjs'
      - 'static-web/src/lib/privateControlRuntime.mjs'
      - 'static-web/src/lib/sharedControlCheckpoint.mjs'
      - 'static-web/src/components/EnglishExamTaskBridge.astro'
      - 'static-web/src/components/ReadingWorkspace.astro'
      - 'static-web/src/components/ClozeWorkspace.astro'
      - 'static-web/src/components/ReadingBWorkspace.astro'
      - 'static-web/src/components/TranslationWorkspace.astro'
      - 'static-web/src/components/WritingWorkspace.astro'
      - 'static-web/src/components/ReadingAnswerGate.astro'
      - 'static-web/src/components/ObjectiveAnswerGate.astro'
      - 'static-web/src/components/TranslationReferenceLoader.astro'
      - 'static-web/src/components/ReadingLastLocation.astro'
      - 'static-web/src/components/ObjectiveNavigator.astro'
      - 'static-web/src/pages/english.astro'
      - 'static-web/src/pages/english-exam.astro'
      - 'static-web/src/pages/english-exam/**'
      - 'static-web/src/pages/english-exam-answer/**'
      - 'static-web/src/pages/english-exam-writing/**'
      - 'static-web/src/pages/reading/**'
      - 'static-web/src/pages/cloze/**'
      - 'static-web/src/pages/reading-b/**'
      - 'static-web/src/pages/translation/**'
      - 'static-web/scripts/validate-english-exam-session.mjs'
      - 'static-web/scripts/test-english-exam-session-browser.mjs'
      - 'static-web/scripts/test-english-exam-seal-integrity.mjs'
      - 'static-web/scripts/test-freeze-integrity.mjs'
      - 'static-web/scripts/test-freeze-browser.mjs'
      - '.github/workflows/static-web-english-exam-session.yml'
  push:
    branches: [main]
    paths:
      - 'content/english/manifest.json'
      - 'static-web/src/lib/englishExamPaper.mjs'
      - 'static-web/src/lib/englishExamSession.mjs'
      - 'static-web/src/lib/englishSessionControl.mjs'
      - 'static-web/src/lib/englishLearnerEvidence.mjs'
      - 'static-web/src/lib/browserLearnerWriter.mjs'
      - 'static-web/src/lib/privateCheckpointRuntime.mjs'
      - 'static-web/src/lib/privateControlRuntime.mjs'
      - 'static-web/src/lib/sharedControlCheckpoint.mjs'
      - 'static-web/src/components/EnglishExamTaskBridge.astro'
      - 'static-web/src/pages/english-exam.astro'
      - 'static-web/src/pages/english-exam/**'
      - 'static-web/src/pages/english-exam-answer/**'
      - 'static-web/src/pages/english-exam-writing/**'
      - 'static-web/scripts/validate-english-exam-session.mjs'
      - 'static-web/scripts/test-english-exam-session-browser.mjs'
      - 'static-web/scripts/test-english-exam-seal-integrity.mjs'
      - 'static-web/scripts/test-freeze-integrity.mjs'
      - 'static-web/scripts/test-freeze-browser.mjs'
      - '.github/workflows/static-web-english-exam-session.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-exam-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exam-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime
        id: runtime
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Validate full-paper and bounded integrity semantics
        id: native
        working-directory: static-web
        run: |
          node scripts/validate-english-exam-session.mjs
          node --test scripts/test-english-exam-seal-integrity.mjs scripts/test-freeze-integrity.mjs
          node --experimental-vm-modules scripts/test-l1-continuation.mjs ..
          node --experimental-vm-modules scripts/test-l1-control-transactions.mjs
          node scripts/test-private-learner-checkpoint.mjs
          node scripts/test-shared-control-three-subjects.mjs
          node scripts/test-xizong-forecast-model.mjs
          node scripts/test-english-evidence-resume.mjs
          node scripts/test-private-control-relay.mjs
      - name: Build learner site
        id: build
        working-directory: static-web
        run: |
          npm run build
          node scripts/test-private-daily-learning-packet.mjs
      - name: Install browser acceptance
        id: browser
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run full-paper browser journey
        working-directory: static-web
        run: node scripts/test-english-exam-session-browser.mjs
      - name: Run corruption and two-page browser journeys
        id: freeze_browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        working-directory: static-web
        run: xvfb-run -a node scripts/test-freeze-browser.mjs
      - name: Bounded native focus diagnostic
        if: ${{ !cancelled() && steps.freeze_browser.outcome == 'failure' && steps.browser.outcome == 'success' }}
        working-directory: static-web
        run: |
          xvfb-run -a node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {spawn} from 'node:child_process';
          import {chromium} from 'playwright';
          import {listEnglishExamPapers} from './src/lib/englishExamPaper.mjs';
          const base='http://127.0.0.1:4389';
          const server=spawn('npm',['run','preview','--','--host','127.0.0.1','--port','4389'],{stdio:'ignore',detached:true});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const observations=[];let browser;
          try {
            for(let i=0;i<80;i++){try{if((await fetch(base)).ok)break;}catch{}await sleep(200);}
            browser=await chromium.launch({headless:false});
            const context=await browser.newContext();
            await context.addInitScript(()=>{
              window.__focusEvents=[];window.__handoffMessages=[];
              for(const name of ['focus','blur','pageshow','pagehide'])window.addEventListener(name,()=>window.__focusEvents.push({name,focus:document.hasFocus(),visibility:document.visibilityState}),true);
              const channel=new BroadcastChannel('kianos-native-learner-writer-v1');
              channel.onmessage=({data})=>window.__handoffMessages.push({kind:data?.kind,focus:document.hasFocus(),visibility:document.visibilityState});
            });
            const pages=[],sessions=[];
            const snapshot=async(label)=>{
              const states=[];
              for(const [i,page] of pages.entries())states.push({page:i,...await page.evaluate(async()=>({focus:document.hasFocus(),visibility:document.visibilityState,writer:document.documentElement.dataset.learnerWriter,events:window.__focusEvents,messages:window.__handoffMessages.slice(-8),locks:await navigator.locks.query()}))});
              observations.push({label,states});
            };
            for(const label of ['a','b']){
              const page=await context.newPage();pages.push(page);
              const cdp=await context.newCDPSession(page);sessions.push(cdp);
              await cdp.send('Emulation.setFocusEmulationEnabled',{enabled:false});
              await page.bringToFront();
              await page.goto(base+'/english-exam/'+listEnglishExamPapers()[0].paperId+'/');
              await sleep(1300);await snapshot('opened-'+label);
            }
            for(const cdp of sessions)await cdp.send('Emulation.setFocusEmulationEnabled',{enabled:false});
            await pages[1].bringToFront();await sleep(1300);await snapshot('focus-disabled-again-after-navigation');
          }catch(error){observations.push({error:String(error.stack||error)});}
          finally{
            await browser?.close();try{process.kill(-server.pid,'SIGTERM');}catch{}
            fs.mkdirSync('../english-exam-audit',{recursive:true});
            fs.writeFileSync('../english-exam-audit/native-focus-diagnostic.json',JSON.stringify(observations,null,2));
            console.log(JSON.stringify(observations,null,2));
          }
          JS
      - name: Existing cross-subject browser journey
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        working-directory: static-web
        run: node scripts/test-final-cross-subject-regression.mjs
      - name: Isolated watcher regression and kernel error evidence
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        working-directory: static-web
        run: |
          mkdir -p ../english-exam-audit
          cat > "$RUNNER_TEMP/freeze-listen-observer.cjs" <<'JS'
          const net=require('node:net'),fs=require('node:fs');
          const original=net.Server.prototype.listen;
          net.Server.prototype.listen=function(...args){
            this.once('error',error=>{
              if(error.code==='EADDRINUSE')fs.appendFileSync(process.env.FREEZE_LISTEN_LOG,JSON.stringify({pid:process.pid,code:error.code,port:error.port,address:error.address})+'\n');
            });
            return original.apply(this,args);
          };
          JS
          export FREEZE_LISTEN_LOG="$PWD/../english-exam-audit/watcher-listen-errors.jsonl"
          export NODE_OPTIONS="--require $RUNNER_TEMP/freeze-listen-observer.cjs"
          node scripts/test-codex-issue-watcher.mjs
          node scripts/test-codex-execution-policy.mjs
      - name: Capture public candidate source for bounded reproduction
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json,hashlib
          root=pathlib.Path('.');out=root/'english-exam-audit';out.mkdir(exist_ok=True)
          prefixes=('static-web/src/','static-web/scripts/','.github/workflows/static-web-english-exam-session.yml')
          rows=[]
          for item in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
            if not item or not item.startswith(prefixes):continue
            p=pathlib.Path(item)
            if p.suffix not in ('.mjs','.astro','.yml','.sh','.css','.ts','.json'):continue
            raw=p.read_bytes()
            if len(raw)>1000000:continue
            try:content=raw.decode('utf-8')
            except UnicodeDecodeError:continue
            blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            rows.append({'path':item,'blob':blob,'content':content})
          (out/'candidate-source.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'files':rows}))
          PY
      - name: Upload full-paper proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-exam-session-${{ github.sha }}
          path: |
            english-exam-audit/
            static-web/.qa/final-cross-subject/
          include-hidden-files: true
          retention-days: 14
