name: Materialize stage-one screenshot refinements
on:
  push:
    branches: ['ui/visual-convergence-20260916']
    paths: ['.github/refine-stage-one.py']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded presentation patch
        run: |
          python .github/refine-stage-one.py
          rm .github/refine-stage-one.py .github/workflows/refine-stage-one.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static-web/src .github/refine-stage-one.py .github/workflows/refine-stage-one.yml
          git commit -m 'fix(ui): enforce application presentation over scoped component defaults'
          git push origin HEAD:ui/visual-convergence-20260916
