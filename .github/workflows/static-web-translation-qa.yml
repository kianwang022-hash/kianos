name: Static Web Translation QA

on:
  push:
    branches: [main]
    paths:
      - 'content/english/**'
      - 'static-web/**'
      - '.github/workflows/static-web-translation-qa.yml'
  pull_request:
    paths:
      - 'content/english/**'
      - 'static-web/**'
      - '.github/workflows/static-web-translation-qa.yml'

jobs:
  translation-runtime-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-web
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Translation learning acceptance
        run: npm run validate:translation
      - name: Build Astro
        run: npm run build
