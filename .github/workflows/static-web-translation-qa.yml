name: Static Web Translation QA

on:
  push:
    branches: [main]
    paths:
      - 'LEARNING_ACCEPTANCE.md'
      - 'content/english/LEARNING_CONTRACT.md'
      - 'content/english/manifest.json'
      - 'content/english/modules/translation.md'
      - 'content/english/modules/translation/**'
      - 'content/english/source/question_bank.v1.json'
      - 'content/english/source/global_source_truth.v1.json'
      - 'static-web/package.json'
      - 'static-web/astro.config.mjs'
      - 'static-web/src/layouts/**'
      - 'static-web/src/styles/global.css'
      - 'static-web/src/styles/runtime.css'
      - 'static-web/src/styles/translation*.css'
      - 'static-web/src/lib/current.mjs'
      - 'static-web/src/lib/*translation*.mjs'
      - 'static-web/src/lib/*Translation*.mjs'
      - 'static-web/src/components/Translation*.astro'
      - 'static-web/src/pages/translation.astro'
      - 'static-web/src/pages/translation/**'
      - 'static-web/src/pages/translation-learn.astro'
      - 'static-web/scripts/*translation*.mjs'
      - '.github/workflows/static-web-translation-qa.yml'
  pull_request:
    paths:
      - 'LEARNING_ACCEPTANCE.md'
      - 'content/english/LEARNING_CONTRACT.md'
      - 'content/english/manifest.json'
      - 'content/english/modules/translation.md'
      - 'content/english/modules/translation/**'
      - 'content/english/source/question_bank.v1.json'
      - 'content/english/source/global_source_truth.v1.json'
      - 'static-web/package.json'
      - 'static-web/astro.config.mjs'
      - 'static-web/src/layouts/**'
      - 'static-web/src/styles/global.css'
      - 'static-web/src/styles/runtime.css'
      - 'static-web/src/styles/translation*.css'
      - 'static-web/src/lib/current.mjs'
      - 'static-web/src/lib/*translation*.mjs'
      - 'static-web/src/lib/*Translation*.mjs'
      - 'static-web/src/components/Translation*.astro'
      - 'static-web/src/pages/translation.astro'
      - 'static-web/src/pages/translation/**'
      - 'static-web/src/pages/translation-learn.astro'
      - 'static-web/scripts/*translation*.mjs'
      - '.github/workflows/static-web-translation-qa.yml'

concurrency:
  group: translation-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translation-runtime-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-web
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Translation Source gate
        env:
          KIANOS_TRANSLATION_SOURCE_GATE_OUT: ${{ runner.temp }}/translation-source-gate.json
        run: npm run validate:translation-source
      - name: Upload Translation Source gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-source-gate
          path: ${{ runner.temp }}/translation-source-gate.json
          if-no-files-found: error
      - name: Validate Translation Runtime gate
        env:
          KIANOS_TRANSLATION_RUNTIME_GATE_OUT: ${{ runner.temp }}/translation-runtime-gate.json
        run: node scripts/validate-translation-runtime-gate.mjs
      - name: Upload Translation Runtime gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-runtime-gate
          path: ${{ runner.temp }}/translation-runtime-gate.json
          if-no-files-found: error
      - name: Validate Translation Evidence gate
        env:
          KIANOS_TRANSLATION_EVIDENCE_GATE_OUT: ${{ runner.temp }}/translation-evidence-gate.json
        run: node scripts/validate-translation-evidence-gate.mjs
      - name: Upload Translation Evidence gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-evidence-gate
          path: ${{ runner.temp }}/translation-evidence-gate.json
          if-no-files-found: error
      - name: Build Astro
        run: npm run build
      - name: Validate Translation Projection gate
        env:
          KIANOS_TRANSLATION_PROJECTION_GATE_OUT: ${{ runner.temp }}/translation-projection-gate.json
        run: node scripts/validate-translation-projection.mjs
      - name: Upload Translation Projection gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-projection-gate
          path: ${{ runner.temp }}/translation-projection-gate.json
          if-no-files-found: error
      - name: Install browser acceptance
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute Translation learner browser loop
        run: node scripts/test-translation-learner-journey.mjs
      - name: Upload Translation learner browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-learner-journey-${{ github.sha }}
          path: translation-browser-audit/
          retention-days: 14
          if-no-files-found: warn
