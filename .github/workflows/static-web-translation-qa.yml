name: Static Web Translation QA

on:
  push:
    branches: [main]
    paths:
      - 'LEARNING_ACCEPTANCE.md'
      - 'content/english/LEARNING_CONTRACT.md'
      - 'content/english/manifest.json'
      - 'content/english/modules/translation.md'
      - 'content/english/modules/translation/**'
      - 'content/english/source/question_bank.v1.json'
      - 'content/english/source/global_source_truth.v1.json'
      - 'static-web/package.json'
      - 'static-web/astro.config.mjs'
      - 'static-web/src/layouts/**'
      - 'static-web/src/styles/global.css'
      - 'static-web/src/styles/runtime.css'
      - 'static-web/src/styles/translation*.css'
      - 'static-web/src/lib/current.mjs'
      - 'static-web/src/lib/*translation*.mjs'
      - 'static-web/src/lib/*Translation*.mjs'
      - 'static-web/src/components/Translation*.astro'
      - 'static-web/src/pages/translation.astro'
      - 'static-web/src/pages/translation/**'
      - 'static-web/src/pages/translation-learn.astro'
      - 'static-web/scripts/*translation*.mjs'
      - '.github/workflows/static-web-translation-qa.yml'
  pull_request:
    paths:
      - 'LEARNING_ACCEPTANCE.md'
      - 'content/english/LEARNING_CONTRACT.md'
      - 'content/english/manifest.json'
      - 'content/english/modules/translation.md'
      - 'content/english/modules/translation/**'
      - 'content/english/source/question_bank.v1.json'
      - 'content/english/source/global_source_truth.v1.json'
      - 'static-web/package.json'
      - 'static-web/astro.config.mjs'
      - 'static-web/src/layouts/**'
      - 'static-web/src/styles/global.css'
      - 'static-web/src/styles/runtime.css'
      - 'static-web/src/styles/translation*.css'
      - 'static-web/src/lib/current.mjs'
      - 'static-web/src/lib/*translation*.mjs'
      - 'static-web/src/lib/*Translation*.mjs'
      - 'static-web/src/components/Translation*.astro'
      - 'static-web/src/pages/translation.astro'
      - 'static-web/src/pages/translation/**'
      - 'static-web/src/pages/translation-learn.astro'
      - 'static-web/scripts/*translation*.mjs'
      - '.github/workflows/static-web-translation-qa.yml'

concurrency:
  group: translation-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translation-runtime-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-web
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Translation learning acceptance
        run: npm run validate:translation
      - name: Build Astro
        run: npm run build
