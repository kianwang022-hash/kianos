name: Xizong Forecast Clean

on:
  push:
    branches:
      - main
    paths:
      - 'static-web/src/lib/xizongForecastModel.mjs'
      - 'static-web/src/lib/xizongStudyPacket.mjs'
      - 'static-web/src/lib/xizongMemoryModel.mjs'
      - 'static-web/src/lib/xizongQuestions.mjs'
      - 'static-web/src/lib/xizong.mjs'
      - 'static-web/src/lib/xizongPaperScoring.mjs'
      - 'static-web/src/lib/dailyLearningPacketRuntime.mjs'
      - 'static-web/src/lib/examOrchestratorClient.mjs'
      - 'static-web/src/components/ExamOrchestratorHome.astro'
      - 'static-web/src/components/XizongPracticeWorkbench.astro'
      - 'static-web/src/pages/index.astro'
      - 'static-web/scripts/test-xizong-forecast-model.mjs'
      - 'static-web/scripts/test-xizong-forecast-real-u-adapter.mjs'
      - 'static-web/scripts/validate-xizong-paper-practice.mjs'
      - 'static-web/scripts/audit-xizong-mother-standard-final-v3.mjs'
      - 'content/xizong/MATURITY_PACKAGE.md'
      - 'content/xizong/knowledge/learner/xizong-2027-biochemistry-delta-slot.json'
      - 'content/xizong/questions/exam-format-2027-slot.json'
      - '.github/workflows/xizong-forecast-clean.yml'
  pull_request:
    paths:
      - 'static-web/src/lib/xizongForecastModel.mjs'
      - 'static-web/src/lib/xizongStudyPacket.mjs'
      - 'static-web/src/lib/xizongMemoryModel.mjs'
      - 'static-web/src/lib/xizongQuestions.mjs'
      - 'static-web/src/lib/xizong.mjs'
      - 'static-web/src/lib/xizongPaperScoring.mjs'
      - 'static-web/src/lib/dailyLearningPacketRuntime.mjs'
      - 'static-web/src/lib/examOrchestratorClient.mjs'
      - 'static-web/src/components/ExamOrchestratorHome.astro'
      - 'static-web/src/components/XizongPracticeWorkbench.astro'
      - 'static-web/src/pages/index.astro'
      - 'static-web/scripts/test-xizong-forecast-model.mjs'
      - 'static-web/scripts/test-xizong-forecast-real-u-adapter.mjs'
      - 'static-web/scripts/validate-xizong-paper-practice.mjs'
      - 'static-web/scripts/audit-xizong-mother-standard-final-v3.mjs'
      - 'content/xizong/MATURITY_PACKAGE.md'
      - 'content/xizong/knowledge/learner/xizong-2027-biochemistry-delta-slot.json'
      - 'content/xizong/questions/exam-format-2027-slot.json'
      - '.github/workflows/xizong-forecast-clean.yml'

concurrency:
  group: xizong-forecast-clean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Run Xizong Forecast adversarial suite
        working-directory: static-web
        run: |
          node scripts/test-xizong-forecast-model.mjs
          node scripts/test-xizong-forecast-real-u-adapter.mjs
          node scripts/validate-xizong-paper-practice.mjs
          (cd .. && node static-web/scripts/test-xizong-source-revision-transitive.mjs)
          node scripts/validate-xizong-targeted-practice.mjs
          node scripts/test-exam-plan-read-model.mjs
          node scripts/test-xizong-chat-return.mjs
          node scripts/test-private-learner-checkpoint.mjs
          node scripts/test-private-daily-learning-packet.mjs
          node scripts/stress-xizong-architecture-plus.mjs
          node scripts/audit-xizong-mother-standard-final-v3.mjs
      - name: Build Current site
        working-directory: static-web
        run: npm run build
