name: English Family Coherence

on:
  push:
    branches: [main]
    paths:
      - 'content/english/**'
      - 'content/lexical/**'
      - 'static-web/src/layouts/Base.astro'
      - 'static-web/src/pages/english.astro'
      - 'static-web/src/pages/objective-learn.astro'
      - 'static-web/src/pages/translation-learn.astro'
      - 'static-web/src/pages/writing-learn.astro'
      - 'static-web/src/pages/reading/**'
      - 'static-web/src/pages/cloze/**'
      - 'static-web/src/pages/translation/**'
      - 'static-web/src/pages/external-reading.astro'
      - 'static-web/src/pages/vocabulary/**'
      - 'static-web/src/components/English*.astro'
      - 'static-web/src/components/External*.astro'
      - 'static-web/src/components/Reading*.astro'
      - 'static-web/src/components/Cloze*.astro'
      - 'static-web/src/components/Translation*.astro'
      - 'static-web/src/components/Vocabulary*.astro'
      - 'static-web/src/styles/english*.css'
      - 'static-web/src/lib/englishExamPaper.mjs'
      - 'static-web/src/lib/englishLearnerEvidence.mjs'
      - 'static-web/scripts/privateExternalReadingStore.mjs'
      - 'static-web/scripts/privateExternalReadingBridge.mjs'
      - 'static-web/scripts/test-external-reading-content.mjs'
      - 'static-web/scripts/test-external-reading-session-control.mjs'
      - 'static-web/scripts/test-external-reading-browser.mjs'
      - 'static-web/scripts/externalReadingSyntheticFixture.mjs'
      - 'tools/english-external/**'
      - 'static-web/src/lib/englishExamSession.mjs'
      - 'static-web/src/components/EnglishExamTaskBridge.astro'
      - 'static-web/src/pages/english-exam.astro'
      - 'static-web/src/pages/english-exam/**'
      - 'static-web/src/pages/english-exam-writing/**'
      - 'static-web/src/pages/english-exam-answer/**'
      - 'static-web/scripts/validate-english-exam-session.mjs'
      - 'static-web/scripts/test-english-exam-session-browser.mjs'
      - 'static-web/src/lib/englishSessionControl.mjs'
      - 'static-web/scripts/validate-english-performance-profile.mjs'
      - 'static-web/scripts/validate-english-chat-control.mjs'
      - 'static-web/scripts/validate-lexical-english-handoff.mjs'
      - 'static-web/scripts/test-english-family-coherence.mjs'
      - 'static-web/scripts/test-objective-guide-visual.mjs'
      - 'static-web/scripts/test-english-learner-language.mjs'
      - '.github/workflows/static-web-english-family-coherence.yml'
  pull_request:
    paths:
      - 'content/english/**'
      - 'content/lexical/**'
      - 'static-web/src/layouts/Base.astro'
      - 'static-web/src/pages/english.astro'
      - 'static-web/src/pages/objective-learn.astro'
      - 'static-web/src/pages/translation-learn.astro'
      - 'static-web/src/pages/writing-learn.astro'
      - 'static-web/src/pages/reading/**'
      - 'static-web/src/pages/cloze/**'
      - 'static-web/src/pages/translation/**'
      - 'static-web/src/pages/external-reading.astro'
      - 'static-web/src/pages/vocabulary/**'
      - 'static-web/src/components/English*.astro'
      - 'static-web/src/components/External*.astro'
      - 'static-web/src/components/Reading*.astro'
      - 'static-web/src/components/Cloze*.astro'
      - 'static-web/src/components/Translation*.astro'
      - 'static-web/src/components/Vocabulary*.astro'
      - 'static-web/src/styles/english*.css'
      - 'static-web/src/lib/englishExamPaper.mjs'
      - 'static-web/src/lib/englishLearnerEvidence.mjs'
      - 'static-web/scripts/privateExternalReadingStore.mjs'
      - 'static-web/scripts/privateExternalReadingBridge.mjs'
      - 'static-web/scripts/test-external-reading-content.mjs'
      - 'static-web/scripts/test-external-reading-session-control.mjs'
      - 'static-web/scripts/test-external-reading-browser.mjs'
      - 'static-web/scripts/externalReadingSyntheticFixture.mjs'
      - 'tools/english-external/**'
      - 'static-web/src/lib/englishExamSession.mjs'
      - 'static-web/src/components/EnglishExamTaskBridge.astro'
      - 'static-web/src/pages/english-exam.astro'
      - 'static-web/src/pages/english-exam/**'
      - 'static-web/src/pages/english-exam-writing/**'
      - 'static-web/src/pages/english-exam-answer/**'
      - 'static-web/scripts/validate-english-exam-session.mjs'
      - 'static-web/scripts/test-english-exam-session-browser.mjs'
      - 'static-web/src/lib/englishSessionControl.mjs'
      - 'static-web/scripts/validate-english-performance-profile.mjs'
      - 'static-web/scripts/validate-english-chat-control.mjs'
      - 'static-web/scripts/validate-lexical-english-handoff.mjs'
      - 'static-web/scripts/test-english-family-coherence.mjs'
      - 'static-web/scripts/test-objective-guide-visual.mjs'
      - 'static-web/scripts/test-english-learner-language.mjs'
      - '.github/workflows/static-web-english-family-coherence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-family-coherence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Validate External Reading private-content boundary
        working-directory: static-web
        run: node scripts/test-external-reading-content.mjs
      - name: Validate External Reading Chat Resume
        working-directory: static-web
        run: node scripts/test-external-reading-session-control.mjs
      - name: Validate bounded English performance profile
        working-directory: static-web
        run: node scripts/validate-english-performance-profile.mjs
      - name: Validate English evidence fidelity E4
        working-directory: static-web
        run: node scripts/validate-english-evidence-fidelity-e4.mjs
      - name: Validate English native alias history and Source-version interfaces
        working-directory: static-web
        run: node scripts/validate-english-native-closure.mjs
      - name: Validate English Forecast system logic
        working-directory: static-web
        run: node scripts/validate-english-forecast-model.mjs
      - name: Validate Chat-owned English control
        working-directory: static-web
        run: node scripts/validate-english-chat-control.mjs
      - name: Validate English synthetic baseline readiness
        working-directory: static-web
        run: node scripts/validate-english-synthetic-baseline.mjs
      - name: Validate English productive scoring structure
        working-directory: static-web
        run: node scripts/validate-english-productive-scoring.mjs
      - name: Validate English ↔ Lexical Chat handoff
        working-directory: static-web
        run: node scripts/validate-lexical-english-handoff.mjs
      - name: Validate English full-paper runtime
        working-directory: static-web
        run: node scripts/validate-english-exam-session.mjs
      - name: Build Current site
        working-directory: static-web
        run: npm run build
      - name: Install isolated browser acceptance tool
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute External Reading browser journey
        working-directory: static-web
        run: node scripts/test-external-reading-browser.mjs
      - name: Execute English family coherence journey
        working-directory: static-web
        run: node scripts/test-english-family-coherence.mjs
      - name: Execute English synthetic baseline browser journey
        working-directory: static-web
        run: node scripts/test-english-synthetic-baseline-browser.mjs
      - name: Execute native Source-version Resume browser journey
        working-directory: static-web
        run: node scripts/test-english-native-source-resume-browser.mjs
      - name: Execute English full-paper browser journey
        working-directory: static-web
        run: node scripts/test-english-exam-session-browser.mjs
      - name: Assert Objective Guide readability and editorial geometry
        working-directory: static-web
        run: node scripts/test-objective-guide-visual.mjs
      - name: Reject learner-facing engineering language
        working-directory: static-web
        run: node scripts/test-english-learner-language.mjs
      - name: Preserve fresh screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-family-coherence-${{ github.sha }}
          path: |
            english-family-audit/
            english-synthetic-audit/
            english-language-audit/
            english-exam-audit/
            english-native-interface-audit/
          retention-days: 14
