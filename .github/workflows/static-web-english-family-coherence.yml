      - 'static-web/src/lib/englishLearnerEvidence.mjs'
      - 'static-web/scripts/privateExternalReadingStore.mjs'
      - 'static-web/scripts/privateExternalReadingBridge.mjs'
      - 'static-web/scripts/test-external-reading-content.mjs'
      - 'static-web/scripts/test-external-reading-session-control.mjs'
      - 'static-web/scripts/test-external-reading-browser.mjs'
      - 'static-web/scripts/externalReadingSyntheticFixture.mjs'
      - 'tools/english-external/**'
      - 'static-web/src/lib/englishExamSession.mjs'
      - 'static-web/src/components/EnglishExamTaskBridge.astro'
