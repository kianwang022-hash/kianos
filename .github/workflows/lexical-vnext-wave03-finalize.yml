name: Lexical vNext Wave03 Finalize

on:
  push:
    branches:
      - lexical/vnext-wave03-o0025-o0124

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize 100-owner package
        shell: bash
        run: |
          set -euo pipefail
          test -f content/lexical/audit/vnext-content-execution/wave03-shard01-o0037-o0064-receipt.json
          test -f content/lexical/audit/vnext-content-execution/wave03-shard02-o0065-o0124-receipt.json
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          W=Path('content/lexical/words/by-ordinal'); O=Path('content/lexical/audit/vnext-content-execution')
          up={26,27,28,31,33,34,35}; safe={25,32,36}
          rows=[]
          for n in range(25,37):
              p=W/f'o{n:04d}.json'; d=json.loads(p.read_text()); r=d['record']
              if not r.get('senses'): raise SystemExit(f'ACTIVE_ZERO:o{n:04d}')
              if r.get('needs_delta_review'): raise SystemExit(f'OPEN_DELTA:o{n:04d}')
              q=d.setdefault('provenance',{}); q['vnext_content_batch']='vnext-wave03-prefix-o0025-o0036'; q['vnext_content_judgment']='fresh_current_readback'
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
              raw=p.read_bytes(); rows.append({'ordinal':n,'word_id':d['word_id'],'word':d['word'],'operation':'UPGRADED' if n in up else 'NO_CHANGE','final_quality':'SAFE_SIMPLE' if n in safe else 'DEPTH_READY','active_sense_count':len(r['senses']),'construction_count':len(r.get('constructions',[])),'relation_ref_count':len(d.get('relation_refs',[])),'final_content_sha256':hashlib.sha256(raw).hexdigest()})
          prefix={'schema':'kianos.lexical.vnext_content_execution_receipt.v1','wave':'wave03-o0025-o0124','shard':'o0025-o0036','status':'PASS','authority':'fresh vNext readback; old Batch04 is candidate/provenance evidence only','owner_count':12,'upgraded_count':7,'no_change_count':5,'depth_ready_count':9,'safe_simple_count':3,'blocked_count':0,'relation_mutations':1,'form_mutations':0,'learner_state_mutation':0,'pack_membership_mutation':0,'owners':rows}
          (O/'wave03-prefix-o0025-o0036-receipt.json').write_text(json.dumps(prefix,ensure_ascii=False,indent=2)+'\n')
          s1=json.loads((O/'wave03-shard01-o0037-o0064-receipt.json').read_text()); s2=json.loads((O/'wave03-shard02-o0065-o0124-receipt.json').read_text())
          allrows=prefix['owners']+s1['owners']+s2['owners']
          if [x['ordinal'] for x in allrows] != list(range(25,125)): raise SystemExit('NON_CONTIGUOUS_WAVE03')
          wave={'schema':'kianos.lexical.vnext_content_wave_receipt.v1','wave':'wave03-o0025-o0124','status':'PASS','base_main_sha':'327386b7a1ece84e6d846aa76f48abe87a69d39c','owner_count':100,'ordinal_start':25,'ordinal_end':124,'contiguous':True,'upgraded_count':36,'no_change_count':64,'depth_ready_count':74,'safe_simple_count':26,'blocked_count':0,'relation_mutations':1,'form_mutations':0,'learner_state_mutation':0,'pack_membership_mutation':0,'next_cursor':'o0125','closure_model':'100-owner package / 12+28+60 local semantic closures; historical assets candidate-only','receipts':['wave03-prefix-o0025-o0036-receipt.json','wave03-shard01-o0037-o0064-receipt.json','wave03-shard02-o0065-o0124-receipt.json'],'owners':allrows}
          (O/'wave03-o0025-o0124.json').write_text(json.dumps(wave,ensure_ascii=False,indent=2)+'\n')

          cur=Path('content/lexical/CURRENT.md'); t=cur.read_text()
          t=t.replace('Batch02: `content/lexical/audit/vnext-content-execution/batch02-o0013-o0024.json` — PASS on this branch; durable after merge.','Batch02: `content/lexical/audit/vnext-content-execution/batch02-o0013-o0024.json` — PASS.\n- Wave03: `content/lexical/audit/vnext-content-execution/wave03-o0025-o0124.json` — PASS (100 owners).')
          t=t.replace('### Batch02 `o0013–o0024` — PASS on branch','### Batch02 `o0013–o0024` — PASS')
          marker='### Contiguous progress / next cursor'
          add='''### Wave03 `o0025–o0124` — PASS\n\nReceipt: `content/lexical/audit/vnext-content-execution/wave03-o0025-o0124.json`.\n\n```text\n100 / 100 concluded\n36 UPGRADED | 64 NO_CHANGE\n74 DEPTH_READY | 26 SAFE_SIMPLE\n0 BLOCKED\n1 Relation mutation | 0 Form mutations\n0 learner-state mutations | 0 Pack mutations\n```\n\nThis is the first throughput-cadence package: one 100-owner work package closed through smaller semantic units rather than 100 identical micro-PRs. The old Batch04/05 material was acceleration evidence only; fresh vNext judgment could accept, reject, or supersede it.\n\n'''
          if '### Wave03 `o0025–o0124`' not in t: t=t.replace(marker,add+marker)
          t=t.replace('current-generation contiguous coverage = `24 / 7,946`; next ordinal = `o0025`','current-generation contiguous coverage = `124 / 7,946`; next ordinal = `o0125`')
          t=t.replace('next bounded unit from o0025','next bounded unit from o0125')
          t=t.replace('Start the next unit from the newly accepted `main@HEAD`, never by stacking on this branch.','After Wave03 merges, start the next package from the newly accepted `main@HEAD`, never by stacking on this branch.')
          cur.write_text(t)

          acc=Path('content/lexical/ACCEPTANCE.md'); a=acc.read_text()
          a=a.replace('two bounded contiguous vNext Content units covering `o0001–o0024`','accepted vNext Content execution covering `o0001–o0124`, including the first 100-owner throughput package')
          a=a.replace('Current-generation contiguous coverage after Batch02 merges is **24 / 7,946**.','Current-generation contiguous coverage after Wave03 merges is **124 / 7,946**.')
          wave_sec='''### Wave03 `o0025–o0124` — PASS\n\nReceipt: `content/lexical/audit/vnext-content-execution/wave03-o0025-o0124.json`.\n\n```text\n100 / 100 concluded\n36 UPGRADED | 64 NO_CHANGE\n74 DEPTH_READY | 26 SAFE_SIMPLE\n0 BLOCKED\n1 Relation mutation | 0 Form mutations\n0 learner-state mutations | 0 Pack mutations\n```\n\nWave03 deliberately increased throughput without weakening the semantic stop rule: simple trustworthy owners fast-passed, rich/lifecycle-risk owners received direct repair, and acceptance still closed by final integrated readback. Historical Batch04/05 judgments remained candidate/sentinel evidence rather than target authority.\n\n> **contiguous current-generation Content coverage = `124 / 7,946`; next cursor = `o0125`.**\n\nFull-catalog K remains BLOCKED.\n\n---\n\n'''
          if '### Wave03 `o0025–o0124`' not in a: a=a.replace('## P / R / E｜BLOCKED for unrestricted full-catalog use',wave_sec+'## P / R / E｜BLOCKED for unrestricted full-catalog use')
          a=a.replace('o0001–o0024 bounded realization       ✅ PASS after Batch02 merge','o0001–o0124 vNext realization         ✅ PASS\nremaining 7,822 owners                ← CURRENT')
          a=a.replace('remaining 7,922 owners                ← CURRENT\n','')
          acc.write_text(a)
          PY
      - name: Validate final wave and Astro
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for root in ['content/lexical/words/by-ordinal','content/lexical/relations/by-id','content/lexical/audit/vnext-content-execution']:
              for p in Path(root).rglob('*.json'): json.loads(p.read_text())
          w=json.loads(Path('content/lexical/audit/vnext-content-execution/wave03-o0025-o0124.json').read_text())
          assert w['owner_count']==100 and w['blocked_count']==0 and w['next_cursor']=='o0125'
          print('WAVE03_FINAL_READBACK_PASS')
          PY
          cd static-web
          npm install --no-audit --no-fund
          npm run build
      - name: Remove temporary execution workflows and commit
        shell: bash
        run: |
          git rm -f .github/workflows/lexical-vnext-wave03-inspect.yml .github/workflows/lexical-vnext-wave03-apply-shard01.yml .github/workflows/lexical-vnext-wave03-apply-shard02.yml .github/workflows/lexical-vnext-wave03-finalize.yml
          git config user.name 'kianos-lexical-vnext'
          git config user.email 'actions@users.noreply.github.com'
          git add content/lexical/words/by-ordinal content/lexical/audit/vnext-content-execution content/lexical/CURRENT.md content/lexical/ACCEPTANCE.md
          git commit -m 'lexical: close vNext Wave03 o0025-o0124 throughput package'
          git push origin HEAD:lexical/vnext-wave03-o0025-o0124
