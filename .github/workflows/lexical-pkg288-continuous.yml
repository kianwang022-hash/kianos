name: Lexical pkg288 continuous execution

# Resume marker: L3-only Core pins are now part of the frozen executable package.
on:
  push:
    branches:
      - lexical/pkg288-exec
    paths:
      - 'tools/lexical_execute_o6375_o6874.py'
      - 'content/lexical/execution/manifests/o6375-o6874/**'
      - '.github/workflows/lexical-pkg288-continuous.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexical-pkg288-continuous
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      KIANOS_BASELINE_MAIN: e5f3f72bce3aeb1e7386beb2984401954565211f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg288-exec
          fetch-depth: 0
      - name: Validate manifest
        run: |
          python -m py_compile tools/lexical_execute_o6375_o6874.py
          python tools/lexical_execute_o6375_o6874.py --validate-manifest
      - name: Execute from durable receipts
        run: |
          set -euo pipefail
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          ranges=(6375-6424 6425-6474 6475-6524 6525-6574 6575-6624 6625-6674 6675-6724 6725-6774 6775-6824 6825-6874)
          for i in $(seq 0 9); do
            r=${ranges[$i]}
            receipt="content/lexical/execution/receipts/o${r%-*}-o${r#*-}.json"
            if [ -f "$receipt" ]; then
              echo "RESUME_SKIP checkpoint=$i range=$r"
              continue
            fi
            echo "EXECUTE checkpoint=$i range=$r"
            python tools/lexical_execute_o6375_o6874.py --checkpoint "$i"
            python tools/test_lexical_transport_guards.py
            python tools/test_lexical_shard.py
            python - <<'PY'
          import json, subprocess
          from pathlib import Path
          changed=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          targets=[p for p in changed if p.startswith('content/lexical/') and p.endswith('.json') and Path(p).exists()]
          for p in targets: json.loads(Path(p).read_text(encoding='utf-8'))
          print('CHECKPOINT_JSON_PASS',len(targets))
          PY
            git add content/lexical
            git commit -m "lexical: execute o${r%-*}-o${r#*-} internal receipt [skip ci]"
            git push origin HEAD:lexical/pkg288-exec
          done
