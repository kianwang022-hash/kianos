name: Home L3 Visual Temp

on:
  push:
    branches: ['work/home-l3-convergence-20260918']
    paths:
      - '.github/workflows/home-l3-visual-temp.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build
        working-directory: static-web
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          npm run build
      - name: Capture existing stage-one visuals
        working-directory: static-web
        run: node scripts/capture-visual-stage-one.mjs
      - name: Upload Home screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-l3-visual-${{ github.sha }}
          path: |
            visual-evidence/stage1/home.png
            visual-evidence/stage1/report.json
          if-no-files-found: error
          retention-days: 3
