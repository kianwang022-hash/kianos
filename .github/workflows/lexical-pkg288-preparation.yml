name: Lexical pkg288 preparation

on:
  push:
    branches:
      - lexical/pkg288-exec
    paths:
      - '.github/workflows/lexical-pkg288-preparation.yml'
      - 'tools/lexical_compile_reconciliation_package.py'
      - 'tools/lexical_prepare_execution_package_v2.py'
      - 'content/lexical/semantic-reconciliation/o6375-o6874.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexical-pkg288-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg288-exec
          fetch-depth: 0
      - name: Compile frozen accounting
        run: |
          set -euo pipefail
          python tools/lexical_compile_reconciliation_package.py \
            --start 6375 --end 6874 \
            --production content/lexical/semantic-review/o6375-o6624.md \
            --production content/lexical/semantic-review/o6625-o6874.md \
            --audit content/lexical/semantic-audit/o6225-o6424.audit.md \
            --audit content/lexical/semantic-audit/o6425-o6624.audit.md \
            --audit content/lexical/semantic-audit/o6625-o6874.audit.md \
            --out content/lexical/execution/preflight/o6375-o6874.reconciliation-compile.json
          python tools/lexical_compile_reconciliation_extras.py \
            --start 6375 --end 6874 \
            --production content/lexical/semantic-review/o6375-o6624.md \
            --production content/lexical/semantic-review/o6625-o6874.md \
            --audit content/lexical/semantic-audit/o6225-o6424.audit.md \
            --audit content/lexical/semantic-audit/o6425-o6624.audit.md \
            --audit content/lexical/semantic-audit/o6625-o6874.audit.md \
            --out content/lexical/execution/preflight/o6375-o6874.reconciliation-extras.json
      - name: Compile Current identity evidence
        run: |
          python tools/lexical_prepare_execution_package_v2.py \
            --accounting content/lexical/execution/preflight/o6375-o6874.reconciliation-compile.json \
            --reconciliation content/lexical/semantic-reconciliation/o6375-o6874.md \
            --issue 288 \
            --out-prefix content/lexical/execution/preflight/o6375-o6874
          python tools/lexical_scan_package_remote_refs.py \
            --sheet content/lexical/execution/preflight/o6375-o6874.execution-sheet.md \
            --start 6375 --end 6874 \
            --out content/lexical/execution/preflight/o6375-o6874.remote-reference-scan.json
      - name: Fail closed on source count drift
        run: |
          python - <<'PY'
          import json
          p=json.load(open('content/lexical/execution/preflight/o6375-o6874.reconciliation-compile.json'))
          assert p['production_upgrade_count']==277, p['production_upgrade_count']
          assert p['audit_verdict_counts']=={'FLIP_TO_UPGRADE':25,'REFINE_UPGRADE':3}, p['audit_verdict_counts']
          assert p['semantic_source_owner_count']==302, p['semantic_source_owner_count']
          assert not p['identity_risks'], p['identity_risks']
          print('PKG288_ACCOUNTING_PASS', p['receipt_counts'])
          PY
      - name: Commit preparation outputs
        run: |
          set -euo pipefail
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical/execution/preflight/o6375-o6874.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'lexical: prepare pkg288 execution inputs [skip ci]'
          git push origin HEAD:lexical/pkg288-exec
