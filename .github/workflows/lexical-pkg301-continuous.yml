name: Lexical pkg303 final-tail continuous execution carrier

on:
  push:
    branches:
      - lexical/pkg303-final-tail
    paths:
      - 'tools/lexical_execute_o7875_o7946.py'
      - 'tools/lexical_package_runtime.py'
      - 'content/lexical/execution/manifests/o7875-o7946/**'
      - '.github/workflows/lexical-pkg301-continuous.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexical-pkg303-final-tail-continuous
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      KIANOS_BASELINE_MAIN: de70a99c415bb550e85866c1f48714e5c60187c4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg303-final-tail
          fetch-depth: 0
      - name: Validate manifest
        run: |
          python -m py_compile tools/lexical_execute_o7875_o7946.py tools/lexical_package_runtime.py
          python tools/lexical_execute_o7875_o7946.py --validate-manifest
      - name: Execute from durable receipts
        run: |
          set -euo pipefail
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          ranges=(7875-7924 7925-7946)
          for i in $(seq 0 1); do
            r=${ranges[$i]}
            receipt="content/lexical/execution/receipts/o${r%-*}-o${r#*-}.json"
            if [ -f "$receipt" ]; then
              echo "RESUME_SKIP checkpoint=$i range=$r"
              continue
            fi
            echo "EXECUTE checkpoint=$i range=$r"
            python tools/lexical_execute_o7875_o7946.py --checkpoint "$i"
            python tools/test_lexical_transport_guards.py
            python tools/test_lexical_shard.py
            python - <<'PY'
          import json, subprocess
          from pathlib import Path
          changed=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          targets=[p for p in changed if p.startswith('content/lexical/') and p.endswith('.json') and Path(p).exists()]
          for p in targets: json.loads(Path(p).read_text(encoding='utf-8'))
          print('CHECKPOINT_JSON_PASS',len(targets))
          PY
            git add content/lexical
            git commit -m "lexical: execute o${r%-*}-o${r#*-} internal receipt [skip ci]"
            git push origin HEAD:lexical/pkg303-final-tail
          done
