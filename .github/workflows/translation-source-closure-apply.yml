name: Translation Source Closure Apply

on:
  pull_request:
    paths:
      - 'static-web/scripts/apply-translation-source-closure.mjs'
      - '.github/workflows/translation-source-closure-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-web
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact Translation Source closure
        run: node scripts/apply-translation-source-closure.mjs
      - name: Validate Source gate before commit
        run: node scripts/validate-translation-source.mjs
      - name: Verify focused diff
        working-directory: .
        run: |
          git diff --check
          git diff --stat
          git status --short
      - name: Commit Source closure
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/english/source/question_bank.v1.json content/english/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix(translation): close remaining Source references'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
