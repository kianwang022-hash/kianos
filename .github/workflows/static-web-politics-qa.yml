name: Static Web Politics QA

on:
  push:
    branches: [main]
    paths:
      - 'content/politics/**'
      - 'static-web/**'
      - '.github/workflows/static-web-politics-qa.yml'
  pull_request:
    paths:
      - 'content/politics/**'
      - 'static-web/**'
      - '.github/workflows/static-web-politics-qa.yml'

jobs:
  politics-runtime-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-web
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit Politics canonical coverage
        run: node scripts/audit-politics-coverage.mjs
      - name: Audit Xiao1000 semantic chapter routing
        run: node scripts/audit-politics-question-routing.mjs
      - name: Prove scoped Politics source loading without monoliths
        run: node scripts/audit-politics-scoped-source.mjs
      - name: Audit K03 canonical knowledge closure
        run: node scripts/audit-politics-k03-knowledge.mjs
      - name: Audit K03 learning and projection closure
        run: node scripts/audit-politics-k03-learning-projection.mjs
      - name: Validate Politics Current bindings
        run: npm run validate:politics
      - name: Build Astro
        run: npm run build
