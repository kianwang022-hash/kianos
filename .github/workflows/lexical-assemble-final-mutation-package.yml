name: Lexical Assemble Final Mutation Package

on:
  push:
    branches:
      - 'work/lexical-continuous-*'
    paths:
      - 'content/lexical/execution/package-chunks/READY'

permissions:
  contents: write

concurrency:
  group: lexical-package-assemble-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  assemble-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble and verify package
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, subprocess
          from pathlib import Path
          root = Path('content/lexical/execution/package-chunks')
          meta = json.loads((root / 'meta.json').read_text(encoding='utf-8'))
          count = int(meta['chunk_count'])
          chunks = [root / f'chunk-{i:02d}.b64' for i in range(count)]
          assert all(p.is_file() for p in chunks), 'MISSING_PACKAGE_CHUNK'
          b64 = ''.join(p.read_text(encoding='ascii').strip() for p in chunks)
          payload = base64.b64decode(b64, validate=True)
          encoding = meta.get('encoding', 'base64')
          raw = gzip.decompress(payload) if encoding == 'gzip+base64' else payload
          actual = hashlib.sha256(raw).hexdigest()
          assert actual == meta['template_sha256'], (actual, meta['template_sha256'])
          pkg = json.loads(raw.decode('utf-8'))
          assert pkg['schema'] == 'kianos.lexical.final_mutation_package.v1'
          assert pkg['package_id'] == meta['package_id']
          pkg['source_head'] = subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          target = Path(meta['target'])
          target.write_text(json.dumps(pkg, ensure_ascii=False, indent=2, allow_nan=False) + '\n', encoding='utf-8')
          print({'package_id': pkg['package_id'], 'source_head': pkg['source_head'], 'template_sha256': actual})
          PY

      - name: Commit local one-shot request
        run: |
          git config user.name "KianOS Lexical Package Assembler"
          git config user.email "actions@users.noreply.github.com"
          TARGET="content/lexical/execution/final-mutation-package.json"
          git add "$TARGET"
          CHANGED="$(git diff --cached --name-only)"
          test "$CHANGED" = "$TARGET"
          PKG_ID="$(python -c "import json; print(json.load(open('content/lexical/execution/package-chunks/meta.json'))['package_id'])")"
          git commit -m "content(lexical): request final mutation package $PKG_ID"

      - name: Executor guard self-tests
        run: python tools/test_lexical_final_mutation_executor.py

      - name: Apply approved mutation package
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/lexical-final-mutation
          python tools/lexical_apply_final_mutation_package.py \
            --package content/lexical/execution/final-mutation-package.json \
            --report /tmp/lexical-final-mutation/apply.json

      - name: Rebuild all Final Learner Objects
        run: python tools/lexical_build_final_learner_objects.py

      - name: Verify full learner-object closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('content/lexical/learner/final/manifest.json').read_text(encoding='utf-8'))
          assert m['object_count'] == 7946, m
          assert len(m['shards']) > 100, m
          print({'object_count': m['object_count'], 'shard_count': len(m['shards'])})
          PY

      - name: Finalize mechanical receipt
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python tools/lexical_apply_final_mutation_package.py \
            --package content/lexical/execution/final-mutation-package.json \
            --report /tmp/lexical-final-mutation/final.json \
            --finalize

      - name: Bounded lexical duplicate validation
        run: |
          python tools/lexical_secondary_duplicate_audit.py \
            --output /tmp/lexical-final-mutation/secondary-duplicate.json

      - name: Prove working-tree scope
        run: |
          python - <<'PY'
          import re, subprocess
          allowed = [
              re.compile(r'^content/lexical/words/by-ordinal/o\d{4}\.json$'),
              re.compile(r'^content/lexical/relations/by-id/[0-9a-f]{2}/[0-9a-f]{64}\.json$'),
              re.compile(r'^content/lexical/relations/manifest\.json$'),
              re.compile(r'^content/lexical/learner/repair-blueprints/shards/o\d{4}-\d{4}\.json$'),
              re.compile(r'^content/lexical/audit/baseline-v2/.+\.json$'),
              re.compile(r'^content/lexical/execution/manifests/.+\.(json|md|tsv)$'),
              re.compile(r'^content/lexical/execution/mutation-receipts/.+\.json$'),
              re.compile(r'^content/lexical/learner/final/.+$'),
              re.compile(r'^content/lexical/execution/final-mutation-package\.json$'),
          ]
          paths=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          bad=[p for p in paths if not any(rx.fullmatch(p) for rx in allowed)]
          if bad:
              raise SystemExit('WORKTREE_SCOPE_VIOLATION:' + ','.join(bad))
          print({'changed_paths': len(paths)})
          PY

      - name: Remove one-shot mutation request
        run: git rm content/lexical/execution/final-mutation-package.json

      - name: Commit and push candidate materialization
        run: |
          git config user.name "KianOS Lexical Mutation Executor"
          git config user.email "actions@users.noreply.github.com"
          git add -A content/lexical
          if git diff --cached --quiet; then
            echo "NO_EFFECT_MUTATION_PACKAGE"
            exit 2
          fi
          PACKAGE_ID="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/lexical-final-mutation/final.json',encoding='utf-8'))['package_id'])
          PY
          )"
          git commit -m "content(lexical): apply final mutation package ${PACKAGE_ID}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload executor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexical-final-mutation-assembled-${{ github.sha }}
          path: /tmp/lexical-final-mutation/
          if-no-files-found: warn
          retention-days: 14
