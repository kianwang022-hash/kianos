name: Lexical o3825-o3874 Introspect

on:
  push:
    branches:
      - lexical/execute-o3625-o3874-20260916
    paths:
      - .github/workflows/lexical-o3825-o3874-introspect.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Summarize shard-5 owners
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ords=[3826,3828,3831,3832,3833,3835,3837,3840,3841,3845,3847,3848,3849,3850,3858,3859,3863,3864,3867,3868,3870,3871,3880]
          root=Path('content/lexical/words/by-ordinal')
          for o in ords:
              d=json.loads((root/f'o{o:04d}.json').read_text()); r=d['record']
              print('\n###',o,d['word'])
              print('CORE',json.dumps(r.get('core_concept',{}),ensure_ascii=False,sort_keys=True))
              for s in r.get('senses',[]):
                  print('SENSE',json.dumps({k:s.get(k) for k in ['sense_id','pos','definition_cn','definition_en','level','governing_pattern','transitivity','usage_note']},ensure_ascii=False,sort_keys=True))
                  for c in s.get('collocations',[]): print(' COLL',json.dumps(c,ensure_ascii=False,sort_keys=True))
              print('REFS',json.dumps([{k:x.get(k) for k in ['stable_sense_id','status','merged_into_sense_id','pos','definition_cn','definition_en']} for x in d.get('reference_senses',[])],ensure_ascii=False,sort_keys=True))
              print('CONS',json.dumps(r.get('constructions',[]),ensure_ascii=False,sort_keys=True))
              print('REL',json.dumps(d.get('relation_refs',[]),ensure_ascii=False,sort_keys=True))
              print('FORM',json.dumps(r.get('form_identity'),ensure_ascii=False,sort_keys=True))
          PY
