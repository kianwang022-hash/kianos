name: Apply bounded stage-one presentation
on:
  push:
    branches: ['ui/visual-convergence-20260916']
    paths: ['.github/apply-ui-stage-one.py']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize already locally-built presentation edits
        run: |
          python .github/apply-ui-stage-one.py
          git diff --stat -- static-web/src
          rm .github/apply-ui-stage-one.py .github/workflows/apply-ui-stage-one.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static-web/src .github/apply-ui-stage-one.py .github/workflows/apply-ui-stage-one.yml
          git commit -m 'ui: materialize Home, English whole-task and immersive Lexical presentation'
          git push origin HEAD:ui/visual-convergence-20260916
