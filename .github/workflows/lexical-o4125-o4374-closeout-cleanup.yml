name: Lexical o4125-o4374 closeout cleanup

on:
  push:
    branches:
      - lexical/closeout-o4125-o4374-20260916
    paths:
      - '.github/workflows/lexical-o4125-o4374-closeout-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/closeout-o4125-o4374-20260916
          fetch-depth: 0
      - name: Retire survivor and remove package-local execution surfaces
        run: |
          set -euo pipefail
          if ! grep -qx 'lexical/execute-o4125-o4374-20260916' .github/retired-branches.txt; then
            printf '%s\n' '' '# 2026-09-16: o4125-o4374 package fully accepted on main via PR #228.' '# Survivor is superseded by the squash-merged package and no longer owns continuation.' 'lexical/execute-o4125-o4374-20260916' >> .github/retired-branches.txt
          fi

          rm -f \
            .github/lexical-o4125-o4374-closeout.marker \
            .github/workflows/lexical-o4125-o4374-continuous.yml \
            .github/workflows/lexical-o4125-o4374-preflight.yml \
            .github/workflows/lexical-o4125-o4374-shard1.yml \
            .github/workflows/lexical-o4175-o4224-shard2.yml \
            .github/workflows/lexical-o4225-o4274-shard3.yml \
            .github/workflows/lexical-o4275-o4324-shard4.yml \
            tools/lexical_apply_o4125_o4374.py \
            tools/lexical_execute_o4125_o4174.py \
            tools/lexical_execute_o4175_o4224.py \
            tools/lexical_execute_o4225_o4274.py \
            tools/lexical_execute_o4225_o4274_run.py \
            tools/lexical_execute_o4275_o4324.py \
            tools/lexical_execute_o4275_o4324_v2.py \
            tools/lexical_execute_o4325_o4374.py \
            tools/lexical_execute_o4325_o4374_v2.py \
            tools/lexical_verify_o4125_o4374.py \
            .github/workflows/lexical-o4125-o4374-closeout-cleanup.yml

          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add -A
          git commit -m 'lexical: clean o4125-o4374 execution surfaces'
          git push origin HEAD:lexical/closeout-o4125-o4374-20260916
