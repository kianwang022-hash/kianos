      - 'static-web/scripts/kianos-static-server.mjs'

permissions:
  contents: read

concurrency:
  group: exam-os-maturity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exam-os-maturity:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      KIANOS_CSS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install learner site dependencies
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Build exact candidate
        working-directory: static-web
        run: npm run build
      - name: Install isolated Chromium
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run Exam OS maturity matrix
        working-directory: static-web
        run: npm run test:exam-os-maturity
      - name: Save maturity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam-os-maturity-${{ github.sha }}
          path: |
            final-cross-subject-evidence/
            static-web/.qa/exam-os-maturity/
          retention-days: 14
