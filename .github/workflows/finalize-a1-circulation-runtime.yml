name: Finalize A1 circulation runtime

on:
  push:
    branches:
      - chat/a1-circulation-runtime-finalize-20260912

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/a1-circulation-runtime-finalize-20260912
          fetch-depth: 1

      - name: Generalize System Exit and advance shared cursor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          component = Path('static-web/src/components/XizongSystemExitRuntime.astro')
          text = component.read_text()
          replacements = {
            '<h3>把呼吸系统从脑子里叫出来</h3>': '<h3>闭卷恢复 {system.title}</h3>',
            '<p>这一步只做一次。网站不会替你猜哪套要保留；未锁定前，不启动 System sweep，避免把整卷陌生题提前拆掉。</p>': '<p>完整卷保留是浏览器全局的个人学习状态；当前已保存的年份会自动从所有 System sweep 排除，需要时可在这里修改。</p>',
            '<h3><span data-sweep-count>{sweep.questionCount}</span> 道呼吸真题范围已恢复</h3>': '<h3><span data-sweep-count>{sweep.questionCount}</span> 道系统真题范围已恢复</h3>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected component text: {old}')
              text = text.replace(old, new, 1)
          component.write_text(text)

          cursor_path = Path('content/xizong/knowledge/learner/continuation.json')
          c = json.loads(cursor_path.read_text())
          c['current_system'] = {
            'canonical_id': 'A1',
            'system_id': 'circulation',
            'reason': 'A1 circulation is the newly re-audited second System-level official-question scope used to validate that the A2 System Exit pattern generalizes without medical inference in Astro.'
          }
          c['current_stage'] = 'A1_CIRCULATION_SCOPE_REAUDIT_COMPLETE_RUNTIME_GENERALIZED'

          completed = c.get('completed_shared_work', [])
          old_holdout = 'Full-paper holdout is not guessed by Runtime. The learner must explicitly select the retained paper years before the first System sweep; the selection stays private in browser state and the selected years are excluded from System question consumption.'
          new_holdout = 'Full-paper holdout is private browser-global learner state rather than shared Current. System sweeps exclude the years stored in that browser state; the learner-specific year values are not persisted in shared governance.'
          completed = [new_holdout if x == old_holdout else x for x in completed]
          a1_done = 'A1 circulation System membership was re-audited and restored as exactly 376 Current official Question Truth IDs. Recovery is deterministic: 342 unambiguous exact lecture-scope owners plus the only collision-group subset compatible with the later frozen 376-owner range (19 physiological-hemostasis + 15 cardiac-pump questions); later HLK Block owner counts independently exclude the competing blood-characteristic and renal-tubule groups. The restored inventory SHA256 is ded191082a6226353d92c05756dfebe4237335e361f7a945e1a2f3b204c457be.'
          if a1_done not in completed:
              completed.append(a1_done)
          generic_done = 'System Exit presentation is generalized across Current Systems: System title and question-range copy no longer hard-code respiratory, while the existing shared browser-global holdout state continues to filter questions by official exam year.'
          if generic_done not in completed:
              completed.append(generic_done)
          c['completed_shared_work'] = completed

          c['current_owners_to_read'] = [
            'content/xizong/knowledge/learner/study-policy.json',
            'content/xizong/knowledge/learner/a1-circulation-question-scope.json',
            'content/xizong/knowledge/learner/a2-respiratory-question-scope.json',
            'content/xizong/knowledge/systems/a1-circulation/system.json',
            'content/xizong/knowledge/systems/a2-respiratory/system.json',
            'content/xizong/questions/manifest.json',
            'content/xizong/question-relations/README.md',
            'static-web/src/lib/xizongQuestions.mjs',
            'static-web/src/components/XizongSystemExitRuntime.astro',
            'static-web/src/pages/xizong/[system]/index.astro'
          ]
          c['next_action'] = {
            'stage': 'REAL_A1_SYSTEM_EXIT_VALIDATION',
            'instruction': 'Use the Current A1 circulation exit path as a learner: closed-book System Recall -> browser-global full-paper holdout -> enter the remaining circulation System sweep -> verify fast-pass and Wrong/Uncertain handling -> export a real W/U packet to Chat -> finish with a short System Recall. Do not add another learning feature merely because A1 scope now exists.',
            'question_scope': 'content/xizong/knowledge/learner/a1-circulation-question-scope.json',
            'success_condition': 'A1 expands to exactly 376 Current Question Truth IDs, the browser-global holdout removes its stored full-paper years before consumption, no respiratory-specific presentation leaks into A1, and Wrong/Uncertain evidence reaches Chat without guessed Question-to-KP mapping.',
            'validation_note': 'A1 membership has been deterministically re-audited against historical source-coverage/taxonomy evidence and later HLK owner-range evidence. This branch runs a full Astro build before the transition is fast-forwarded to main; real learner use remains the stronger interaction-level evidence.'
          }

          donot = c.get('do_not_reopen_without_new_evidence', [])
          repl = {
            'Do not rebuild the respiratory 359-question System scope by model inference; its Current deterministic scope is restored and runtime-validated by count/hash/Question Truth existence.': 'Do not rebuild the restored A1 circulation 376-question or A2 respiratory 359-question System scopes by model inference; both are deterministic Current identifier scopes and Runtime must fail closed on count/hash/Question Truth mismatch.',
            'Do not auto-select or auto-consume full-paper holdout papers. The learner explicitly chooses them.': 'Do not persist learner-specific full-paper holdout year values in shared Current; holdout is private browser-global learner state and every System sweep must respect the stored years.',
            'Do not recover circulation/urinary System question scopes merely for completeness until real A2 System Exit use shows this Runtime shape is worth generalizing.': 'Do not recover urinary System question scope merely for completeness; use the same deterministic evidence standard that was required for A1/A2 and do not infer membership from titles or model intuition.'
          }
          c['do_not_reopen_without_new_evidence'] = [repl.get(x, x) for x in donot]

          after = c.get('after_validation', [])
          old_after = 'If the A2 System Exit flow is good in real use, recover the already-audited circulation and urinary System-level scopes using the same deterministic Current pattern rather than re-reviewing those questions from scratch.'
          new_after = 'If A1/A2 System Exit remains good in real use and the urinary historical evidence can meet the same deterministic standard, re-audit A3 urinary next rather than re-reviewing its questions from scratch.'
          c['after_validation'] = [new_after if x == old_after else x for x in after]
          cursor_path.write_text(json.dumps(c, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Full Astro build
        working-directory: static-web
        run: |
          npm ci
          npm run build

      - name: Commit validated final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kianos-runtime-bot'
          git config user.email 'kianos-runtime-bot@users.noreply.github.com'
          git rm .github/workflows/finalize-a1-circulation-runtime.yml
          git add static-web/src/components/XizongSystemExitRuntime.astro content/xizong/knowledge/learner/continuation.json
          git commit -m 'xizong: generalize System Exit after A1 scope recovery'
          git push origin HEAD:chat/a1-circulation-runtime-finalize-20260912
