name: Exam Orchestrator Current

on:
  pull_request:
    paths:
      - '.github/workflows/exam-orchestrator-current.yml'
      - 'EXAM_ORCHESTRATOR_CONTRACT.md'
      - 'EXAM_ORCHESTRATOR_CURRENT.json'
      - 'static-web/src/lib/examOrchestrator.mjs'
      - 'static-web/src/lib/examChatPlan.mjs'
      - 'static-web/src/lib/examOrchestratorClient.mjs'
      - 'static-web/src/lib/examPlanReadModel.mjs'
      - 'static-web/scripts/validate-exam-chat-control.mjs'
      - 'static-web/scripts/validate-exam-orchestrator-current.mjs'
      - 'static-web/src/components/ExamOrchestratorHome.astro'
  push:
    branches: [main]
    paths:
      - '.github/workflows/exam-orchestrator-current.yml'
      - 'EXAM_ORCHESTRATOR_CONTRACT.md'
      - 'EXAM_ORCHESTRATOR_CURRENT.json'
      - 'static-web/src/lib/examOrchestrator.mjs'
      - 'static-web/src/lib/examChatPlan.mjs'
      - 'static-web/src/lib/examOrchestratorClient.mjs'
      - 'static-web/src/lib/examPlanReadModel.mjs'
      - 'static-web/scripts/validate-exam-chat-control.mjs'
      - 'static-web/scripts/validate-exam-orchestrator-current.mjs'
      - 'static-web/src/components/ExamOrchestratorHome.astro'

permissions:
  contents: read

concurrency:
  group: exam-orchestrator-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-current-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate contract and runtime projection
        working-directory: static-web
        run: node scripts/validate-exam-orchestrator-current.mjs
      - name: Validate Chat-owned orchestration boundary
        working-directory: static-web
        run: node scripts/validate-exam-chat-control.mjs
      - name: Build learner site
        working-directory: static-web
        run: |
          npm install --no-audit --no-fund
          npm run build
