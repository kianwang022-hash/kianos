name: Chat Control Transport Prototype

on:
  pull_request:
    paths:
      - "static-web/src/lib/privateControlCommand.mjs"
      - "static-web/src/lib/privateControlRuntime.mjs"
      - "static-web/src/lib/xizongSessionInstruction.mjs"
      - "static-web/src/lib/xizongDailyEvidence.mjs"
      - "static-web/scripts/test-private-control-runtime.mjs"
      - "static-web/scripts/test-xizong-session-instruction.mjs"
      - "static-web/scripts/test-xizong-daily-evidence.mjs"
      - "static-web/src/lib/dailyLearningPacketRuntime.mjs"
      - "static-web/scripts/test-home-daily-learning-packet.mjs"
      - "static-web/src/lib/xizongPrivateCheckpoint.mjs"
      - "static-web/scripts/test-xizong-session-checkpoint.mjs"
      - "static-web/src/components/XizongMemoryWorkspace.astro"
      - "static-web/src/components/XizongHomeTools.astro"
      - "static-web/src/components/XizongBlockV6.astro"
      - "static-web/src/components/XizongSystemExitRuntime.astro"
      - ".github/workflows/chat-control-transport-prototype.yml"

jobs:
  semantic-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Xizong session semantics
        working-directory: static-web
        run: node scripts/test-xizong-session-instruction.mjs
      - name: Private control dispatch semantics
        working-directory: static-web
        run: node scripts/test-private-control-runtime.mjs
      - name: Xizong daily evidence semantics
        working-directory: static-web
        run: node scripts/test-xizong-daily-evidence.mjs
      - name: Home daily packet integration
        working-directory: static-web
        run: node scripts/test-home-daily-learning-packet.mjs
      - name: Xizong session private durability
        working-directory: static-web
        run: node scripts/test-xizong-session-checkpoint.mjs
