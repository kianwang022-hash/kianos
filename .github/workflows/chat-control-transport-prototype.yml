name: Chat Control Transport Prototype

on:
  pull_request:
    paths:
      - "static-web/src/lib/privateControlCommand.mjs"
      - "static-web/src/lib/privateControlRuntime.mjs"
      - "static-web/src/lib/xizongSessionInstruction.mjs"
      - "static-web/src/lib/xizongDailyEvidence.mjs"
      - "static-web/scripts/test-private-control-runtime.mjs"
      - "static-web/scripts/test-private-control-checkpoint.mjs"
      - "static-web/scripts/test-xizong-session-instruction.mjs"
      - "static-web/scripts/test-xizong-daily-evidence.mjs"
      - "static-web/scripts/test-xizong-study-packet-bindings.mjs"
      - "static-web/src/lib/dailyLearningPacketRuntime.mjs"
      - "static-web/scripts/test-home-daily-learning-packet.mjs"
      - "static-web/src/lib/xizongPrivateCheckpoint.mjs"
      - "static-web/scripts/test-xizong-session-checkpoint.mjs"
      - "static-web/src/components/XizongMemoryWorkspace.astro"
      - "static-web/src/components/XizongHomeTools.astro"
      - "static-web/src/components/XizongBlockV6.astro"
      - "static-web/src/components/XizongSystemExitRuntime.astro"
      - "static-web/astro.config.mjs"
      - "static-web/src/layouts/BaseFrame.astro"
      - "static-web/src/lib/privateControlClient.mjs"
      - "static-web/scripts/privateControlBridge.mjs"
      - "static-web/scripts/privateControlStore.mjs"
      - "static-web/scripts/test-private-control-browser.mjs"
      - "static-web/scripts/privateControlRelay.mjs"
      - "static-web/scripts/test-private-control-relay.mjs"
      - ".github/workflows/chat-control-transport-prototype.yml"

jobs:
  semantic-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Xizong session semantics
        working-directory: static-web
        run: node scripts/test-xizong-session-instruction.mjs
      - name: Private control dispatch semantics
        working-directory: static-web
        run: node scripts/test-private-control-runtime.mjs
      - name: Private control checkpoint durability
        working-directory: static-web
        run: node scripts/test-private-control-checkpoint.mjs
      - name: Private Git relay semantics
        working-directory: static-web
        run: node scripts/test-private-control-relay.mjs
      - name: Xizong daily evidence semantics
        working-directory: static-web
        run: node scripts/test-xizong-daily-evidence.mjs
      - name: Xizong study packet executable bindings
        working-directory: static-web
        run: node scripts/test-xizong-study-packet-bindings.mjs
      - name: Home daily packet integration
        working-directory: static-web
        run: node scripts/test-home-daily-learning-packet.mjs
      - name: Xizong session private durability
        working-directory: static-web
        run: node scripts/test-xizong-session-checkpoint.mjs


  browser-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: static-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install isolated browser acceptance tool
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute private control round trip
        run: node scripts/test-private-control-browser.mjs
      - name: Upload control browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-control-browser
          path: static-web/.qa/private-control-browser.json
          if-no-files-found: warn
