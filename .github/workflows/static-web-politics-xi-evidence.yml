name: Politics Xi Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'content/politics/learning/xi/**'
      - 'static-web/src/components/Politics*.astro'
      - 'static-web/src/lib/politics*.mjs'
      - 'static-web/src/pages/politics/**'
      - 'static-web/scripts/audit-politics-xi-evidence.mjs'
      - 'static-web/scripts/test-politics-subject-workbench-journey.mjs'
      - '.github/workflows/static-web-politics-xi-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'content/politics/learning/xi/**'
      - 'static-web/src/components/Politics*.astro'
      - 'static-web/src/lib/politics*.mjs'
      - 'static-web/src/pages/politics/**'
      - 'static-web/scripts/audit-politics-xi-evidence.mjs'
      - 'static-web/scripts/test-politics-subject-workbench-journey.mjs'
      - '.github/workflows/static-web-politics-xi-evidence.yml'
permissions:
  contents: read

concurrency:
  group: politics-xi-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Validate Politics runtime
        working-directory: static-web
        run: npm run validate:politics
      - name: Build Current site
        working-directory: static-web
        run: npm run build
      - name: Audit Xi Evidence model
        working-directory: static-web
        run: node scripts/audit-politics-xi-evidence.mjs
      - name: Install browser acceptance tool
        working-directory: static-web
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute Xi Evidence journey
        working-directory: static-web
        run: POLITICS_SUBJECT=xi node scripts/test-politics-subject-workbench-journey.mjs
      - name: Save Xi Evidence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: politics-xi-evidence-${{ github.sha }}
          path: politics-xi-workbench-audit/
          retention-days: 7
