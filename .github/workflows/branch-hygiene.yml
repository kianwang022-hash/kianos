name: Branch Hygiene

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: branch-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Current
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retire branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          delete_branch() {
            local branch="$1"
            [[ -z "$branch" || "$branch" == "main" || "$branch" == "HEAD" ]] && return 0
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Retiring branch: $branch"
              git push origin --delete "$branch"
            fi
          }

          if [[ -f .github/retired-branches.txt ]]; then
            while IFS= read -r line || [[ -n "$line" ]]; do
              branch="${line%%#*}"
              branch="$(printf '%s' "$branch" | xargs)"
              [[ -z "$branch" ]] && continue
              delete_branch "$branch"
            done < .github/retired-branches.txt
          fi

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"
            [[ "$branch" == "main" || "$branch" == "HEAD" ]] && continue
            if git merge-base --is-ancestor "origin/$branch" origin/main; then
              delete_branch "$branch"
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/)

          # Squash-merged Codex task branches are not ancestors of main.
          # Retire them only when the exact Issue is completed and an exact-head PR is merged.
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"
            if [[ "$branch" =~ ^codex/issue([0-9]+)-[A-Za-z0-9._-]+$ ]]; then
              issue="${BASH_REMATCH[1]}"
              state="$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json state,stateReason --jq '.state + ":" + (.stateReason // "")' 2>/dev/null || true)"
              [[ "$state" == "CLOSED:COMPLETED" ]] || continue
              merged_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state merged --json number --jq 'length' 2>/dev/null || echo 0)"
              [[ "$merged_count" =~ ^[0-9]+$ ]] || merged_count=0
              if (( merged_count > 0 )); then
                echo "Retiring completed Codex task branch: $branch (Issue #$issue)"
                delete_branch "$branch"
              fi
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/)

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          echo '## Branch Hygiene survivors' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          git for-each-ref --format='- `%(refname:short)`' refs/remotes/origin/ \
            | sed 's#origin/##' \
            | grep -v -- '- `main`' \
            | grep -v -- '- `HEAD`' \
            >> "$GITHUB_STEP_SUMMARY" || true
