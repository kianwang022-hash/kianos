          p=Path('content/lexical/execution/preflight/o4375-o4874.execution-sheet.md')
          text=p.read_text(encoding='utf-8')
          assert text.count('\n## o')==161
          print('EXECUTION_SHEET_CONTRACT_PASS 161/161')
          PY
      - name: Commit execution sheet
        run: |
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical/execution/preflight/o4375-o4874.execution-sheet.md
          git commit -m 'lexical: compile concise o4375-o4874 execution sheet [skip ci]'
