name: English Objective Runtime

on:
  push:
    branches: [main]
    paths:
      - 'LEARNING_ACCEPTANCE.md'
      - 'content/english/LEARNING_CONTRACT.md'
      - 'content/english/manifest.json'
      - 'content/english/modules/objective-learning.md'
      - 'content/english/modules/objective-runtime.md'
      - 'content/english/modules/objective-evidence-runtime.md'
      - 'content/english/modules/reading-a.md'
      - 'content/english/modules/cloze.md'
      - 'content/english/modules/reading-b.md'
      - 'content/english/source/question_bank.v1.json'
      - 'content/english/source/reading_corpus.v1.json'
      - 'content/english/source/reading_b_layout.v1.json'
      - 'content/english/source/global_source_truth.v1.json'
      - 'static-web/package.json'
      - 'static-web/astro.config.mjs'
      - 'static-web/src/layouts/**'
      - 'static-web/src/styles/global.css'
      - 'static-web/src/styles/runtime.css'
      - 'static-web/src/styles/objective*.css'
      - 'static-web/src/styles/cloze*.css'
      - 'static-web/src/styles/reading*.css'
      - 'static-web/src/lib/current.mjs'
      - 'static-web/src/lib/englishObjective.mjs'
      - 'static-web/src/lib/englishReading.mjs'
      - 'static-web/src/components/Objective*.astro'
      - 'static-web/src/components/Cloze*.astro'
      - 'static-web/src/components/Reading*.astro'
      - 'static-web/src/pages/objective-learn.astro'
      - 'static-web/src/pages/cloze.astro'
      - 'static-web/src/pages/cloze/**'
      - 'static-web/src/pages/cloze-answer/**'
      - 'static-web/src/pages/reading.astro'
      - 'static-web/src/pages/reading/**'
      - 'static-web/src/pages/reading-review/**'
      - 'static-web/src/pages/reading-answer/**'
      - 'static-web/src/pages/reading-b.astro'
      - 'static-web/src/pages/reading-b/**'
      - 'static-web/src/pages/reading-b-answer/**'
      - 'static-web/scripts/*objective*.mjs'
      - 'static-web/scripts/*reading-b*.mjs'
      - '.github/workflows/english-objective-runtime.yml'
  pull_request:
    paths:
      - 'LEARNING_ACCEPTANCE.md'
      - 'content/english/LEARNING_CONTRACT.md'
      - 'content/english/manifest.json'
      - 'content/english/modules/objective-learning.md'
      - 'content/english/modules/objective-runtime.md'
      - 'content/english/modules/objective-evidence-runtime.md'
      - 'content/english/modules/reading-a.md'
      - 'content/english/modules/cloze.md'
      - 'content/english/modules/reading-b.md'
      - 'content/english/source/question_bank.v1.json'
      - 'content/english/source/reading_corpus.v1.json'
      - 'content/english/source/reading_b_layout.v1.json'
      - 'content/english/source/global_source_truth.v1.json'
      - 'static-web/package.json'
      - 'static-web/astro.config.mjs'
      - 'static-web/src/layouts/**'
      - 'static-web/src/styles/global.css'
      - 'static-web/src/styles/runtime.css'
      - 'static-web/src/styles/objective*.css'
      - 'static-web/src/styles/cloze*.css'
      - 'static-web/src/styles/reading*.css'
      - 'static-web/src/lib/current.mjs'
      - 'static-web/src/lib/englishObjective.mjs'
      - 'static-web/src/lib/englishReading.mjs'
      - 'static-web/src/components/Objective*.astro'
      - 'static-web/src/components/Cloze*.astro'
      - 'static-web/src/components/Reading*.astro'
      - 'static-web/src/pages/objective-learn.astro'
      - 'static-web/src/pages/cloze.astro'
      - 'static-web/src/pages/cloze/**'
      - 'static-web/src/pages/cloze-answer/**'
      - 'static-web/src/pages/reading.astro'
      - 'static-web/src/pages/reading/**'
      - 'static-web/src/pages/reading-review/**'
      - 'static-web/src/pages/reading-answer/**'
      - 'static-web/src/pages/reading-b.astro'
      - 'static-web/src/pages/reading-b/**'
      - 'static-web/src/pages/reading-b-answer/**'
      - 'static-web/scripts/*objective*.mjs'
      - 'static-web/scripts/*reading-b*.mjs'
      - '.github/workflows/english-objective-runtime.yml'

permissions:
  contents: read

concurrency:
  group: english-objective-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect objective source inventory
        working-directory: static-web
        run: node scripts/inspect-objective-source.mjs
      - name: Install Astro dependencies
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Build Astro
        working-directory: static-web
        run: npm run build
