name: English Objective Runtime

on:
  push:
    branches: [main]
    paths:
      - 'content/english/**'
      - 'static-web/**'
      - '.github/workflows/english-objective-runtime.yml'
  pull_request:
    paths:
      - 'content/english/**'
      - 'static-web/**'
      - '.github/workflows/english-objective-runtime.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect objective source inventory
        working-directory: static-web
        run: node scripts/inspect-objective-source.mjs
      - name: Install Astro dependencies
        working-directory: static-web
        run: npm install --no-audit --no-fund
      - name: Build Astro
        working-directory: static-web
        run: npm run build
