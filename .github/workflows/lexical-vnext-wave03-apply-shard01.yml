name: Lexical vNext Wave03 Apply Shard01

on:
  push:
    branches:
      - lexical/vnext-wave03-o0025-o0124

permissions:
  contents: write

concurrency:
  group: lexical-vnext-wave03-shard01
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop if shard already applied
        id: guard
        shell: bash
        run: |
          if [[ -f content/lexical/audit/vnext-content-execution/wave03-shard01-o0037-o0064-receipt.json ]]; then
            echo 'done=true' >> "$GITHUB_OUTPUT"
          else
            echo 'done=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Direct-close o0037-o0064 from Current truth
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, hashlib, json
          from pathlib import Path

          ROOT = Path('.')
          WORDS = ROOT / 'content/lexical/words/by-ordinal'
          OUT = ROOT / 'content/lexical/audit/vnext-content-execution'
          OUT.mkdir(parents=True, exist_ok=True)
          BATCH = 'vnext-wave03-shard01-o0037-o0064'

          quality = {
              37:'DEPTH_READY',38:'DEPTH_READY',39:'DEPTH_READY',40:'DEPTH_READY',41:'SAFE_SIMPLE',42:'DEPTH_READY',
              43:'SAFE_SIMPLE',44:'SAFE_SIMPLE',45:'DEPTH_READY',46:'DEPTH_READY',47:'DEPTH_READY',48:'SAFE_SIMPLE',
              49:'DEPTH_READY',50:'DEPTH_READY',51:'DEPTH_READY',52:'DEPTH_READY',53:'DEPTH_READY',54:'DEPTH_READY',
              55:'SAFE_SIMPLE',56:'DEPTH_READY',57:'DEPTH_READY',58:'DEPTH_READY',59:'DEPTH_READY',60:'DEPTH_READY',
              61:'DEPTH_READY',62:'DEPTH_READY',63:'SAFE_SIMPLE',64:'DEPTH_READY'
          }
          upgraded = {37,38,40,42,49,50,51,52,53,54,56,57,58,59,60,62}

          def path(n): return WORDS / f'o{n:04d}.json'
          def load(n): return json.loads(path(n).read_text())
          def dump(n,d): path(n).write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          def senses(d): return d['record']['senses']
          def sense(d, sid):
              return next(x for x in senses(d) if x.get('sense_id') == sid)
          def set_core(d, cn, en, mental_cn, mental_en, clusters=None):
              c=d['record']['core_concept']
              c['core_meaning_cn']=cn; c['core_meaning_en']=en
              c['mental_model_cn']=mental_cn; c['mental_model_en']=mental_en
              if clusters is not None: c['core_clusters']=clusters
          def cons(cid, level, cn, pattern, direction='R+P'):
              return {'construction_id':cid,'direction':direction,'level':level,'meaning_cn':cn,'pattern':pattern}
          def close(d,n):
              r=d['record']; r['needs_delta_review']=False
              p=d.setdefault('provenance',{})
              p['semantic_delta']=max(1,int(p.get('semantic_delta') or 0))
              p['vnext_content_batch']=BATCH
              p['vnext_content_judgment']='fresh_current_readback'
          def promote_ref(d, needle, level, cn=None, en=None, label=None, pos=None, trans='nonverb', pattern='', usage=None):
              refs=d.get('reference_senses',[])
              idx=None
              for i,row in enumerate(refs):
                  hay=((row.get('definition_en') or '')+' '+(row.get('definition_cn') or '')).lower()
                  if needle.lower() in hay:
                      idx=i; break
              if idx is None: raise RuntimeError(f"REF_NOT_FOUND:{d['word']}:{needle}")
              row=refs.pop(idx); sid=row['stable_sense_id']
              item={
                  'collocations':[], 'confidence':'high',
                  'definition_cn':cn or row.get('definition_cn'), 'definition_en':en or row.get('definition_en'),
                  'governing_pattern':pattern, 'level':level, 'needs_human_review':0,
                  'pos':pos or row.get('pos'), 'sense_id':sid,
                  'sense_label_en':label or en or row.get('definition_en'),
                  'sort_order':len(senses(d)), 'transitivity':trans
              }
              if usage: item['usage_note']=usage
              senses(d).append(item)
              for ident in d.get('identity_refs',{}).get('senses',[]):
                  if ident.get('sense_id')==sid:
                      ident['status']='active'; ident['merged_into_sense_id']=None
              return sid
          def new_sense(d, key, level, cn, en, label, pos='adjective', trans='nonverb', pattern='', usage=None):
              sid='sense:'+d['word']+':'+hashlib.sha256((d['word']+'|'+key).encode()).hexdigest()[:16]
              if not any(x.get('sense_id')==sid for x in senses(d)):
                  item={'collocations':[],'confidence':'high','definition_cn':cn,'definition_en':en,'governing_pattern':pattern,
                        'level':level,'needs_human_review':0,'pos':pos,'sense_id':sid,'sense_label_en':label,
                        'sort_order':len(senses(d)),'transitivity':trans}
                  if usage: item['usage_note']=usage
                  senses(d).append(item)
                  d.setdefault('identity_refs',{}).setdefault('senses',[]).append({
                      'sense_id':sid,'status':'active','merged_into_sense_id':None,'source_row':None,
                      'source_path':'content/lexical/audit/vnext-content-execution/wave03-shard01-o0037-o0064-receipt.json',
                      'vnext_created':True})
              return sid
          def clusters_for(d, groups):
              return [{'label_cn':a,'label_en':b,'pos':c,'sense_ids':ids} for a,b,c,ids in groups]

          # 37 accord
          d=load(37)
          set_core(d,'主干是“进入一致/匹配”：名词可表示和谐或正式协定，动词可表示相符；另保留较正式的“给予/授予”分支。',
                   'mainly agreement or matching—harmony, a formal agreement, or being consistent—with a separate formal grant/give verb branch',
                   'in accord with / accord with＝一致；peace accord＝协定；of one’s own accord＝自愿地；accord sth to sb＝正式授予。',
                   'route by frame: agreement, treaty, voluntary action, then formal granting')
          d['record']['constructions']=[
              cons('construction:37accord0001','L1','与……一致；符合……','in accord with + sth'),
              cons('construction:37accord0002','L1','自愿地；主动地','of one’s own accord'),
              cons('construction:37accord0003','L2','与……相符；一致','accord with + sth','R'),
              cons('construction:37accord0004','L2','正式给予/授予某人某物','accord + sth + to + sb')]
          for s in senses(d): s['confidence']='high'
          close(d,37); dump(37,d)

          # 38 accordance
          d=load(38); sid=senses(d)[0]['sense_id']
          set_core(d,'与规则、标准、要求或既定安排保持一致/相符。','conformity with a rule, standard, requirement, or arrangement',
                   '几乎总在 in accordance with 中调用：不是普通“同意”，而是“依照/符合某个标准”。',
                   'retrieve it chiefly through in accordance with: conformity, not ordinary interpersonal agreement',
                   clusters_for(d,[('一致；符合','conformity with a standard or rule','noun',[sid])]))
          d['record']['constructions']=[cons('construction:38accordance0001','L1','依照；按照；与……一致','in accordance with + rule/law/standard/plan')]
          senses(d)[0]['confidence']='high'; senses(d)[0]['usage_note']='Most learner use is the fixed frame in accordance with.'
          close(d,38); dump(38,d)

          # 40 account
          d=load(40)
          d['record']['constructions']=[
              cons('construction:40account0001','L1','解释……的原因/差异','account for + result/difference/variation'),
              cons('construction:40account0002','L1','占总量的某一比例','account for + number/proportion/percentage'),
              cons('construction:40account0003','L1','把……考虑在内','take + sth + into account / take account of + sth'),
              cons('construction:40account0004','L2','叙述；说明……','give an account of + event/experience')]
          for s in senses(d): s['confidence']='high'
          close(d,40); dump(40,d)

          # 42 accumulate
          d=load(42); sid=senses(d)[0]['sense_id']
          set_core(d,'数量随时间逐步堆起来：既可主动积累某物，也可让某物自行逐渐累积。','build up gradually over time, either by collecting something or by something increasing on its own',
                   '抓“gradual build-up”：accumulate evidence/wealth 是主动积累；dust/debt accumulates 是自行越积越多。',
                   'one gradual-build-up model for transitive collecting and intransitive increase',
                   clusters_for(d,[('逐渐积累/积聚','build up gradually over time','verb',[sid])]))
          s=senses(d)[0]; s['confidence']='high'; s['definition_cn']='逐渐积累、积聚；（数量）随时间增加'; s['definition_en']='to collect or build up gradually over time; also to increase in amount by accumulation'; s['transitivity']='vt/vi'; s['governing_pattern']='accumulate + object / subject + accumulates'
          d['record']['constructions']=[cons('construction:42accumulate0001','L1','逐渐积累知识、财富、证据等','accumulate + knowledge/wealth/evidence'),cons('construction:42accumulate0002','L1','某物逐渐积聚/累积','dust/debt/data + accumulates','R')]
          close(d,42); dump(42,d)

          # 49 acid
          d=load(49); ids=[x['sense_id'] for x in senses(d)]
          set_core(d,'从化学上的“酸性/尖锐性”向感官或语气上的“酸、尖刻”延伸。','chemical acidity extending metaphorically to sourness or sharp/biting tone',
                   'acid solution/rain＝化学酸；acid taste＝酸味；acid remark/tone＝尖刻。LSD 俚语留在 reference。',
                   'route chemical acid first, then the sour/sharp adjective branch',
                   clusters_for(d,[('酸；酸性物质','acid substance','noun',[ids[0]]),('酸性的；酸味/尖刻的','acidic, sour, or biting','adjective',[ids[1]])]))
          for s in senses(d): s['confidence']='high'
          senses(d)[1]['usage_note']='The adjective may be literal (acidic/sour) or figurative (an acid remark/tone = biting, caustic).'
          d['record']['constructions']=[cons('construction:49acid0001','L1','酸性物质/现象','acid + solution/rain/soil'),cons('construction:49acid0002','L2','尖刻的评论或语气','acid + remark/comment/tone','R')]
          close(d,49); dump(49,d)

          # 50 acknowledge
          d=load(50); ids=[x['sense_id'] for x in senses(d)]
          set_core(d,'把某个事实、收到的信息、他人的贡献或身份“明确承认出来”。','make something explicitly recognized: a fact, receipt, contribution, or status',
                   'acknowledge that/fact＝承认；acknowledge receipt＝确认收到；acknowledge help＝致谢；acknowledge sb as＝认可身份。',
                   'one explicit-recognition model across truth, receipt, thanks, and status',
                   clusters_for(d,[('承认事实/存在','recognize truth or existence','verb',[ids[0]]),('确认收到','confirm receipt','verb',[ids[1]]),('致谢/认可贡献','recognize contribution with thanks','verb',[ids[2]]),('认可身份/地位','recognize status or authority','verb',[ids[3]])]))
          d['record']['constructions']=[cons('construction:50ack0001','L1','承认某事实','acknowledge + fact / acknowledge that + clause'),cons('construction:50ack0002','L1','确认收到','acknowledge receipt of + sth'),cons('construction:50ack0003','L2','认可某人的帮助/贡献','acknowledge + sb/help/contribution'),cons('construction:50ack0004','L2','承认某人为某种身份','acknowledge + sb + as + role/status')]
          for s in senses(d): s['confidence']='high'
          close(d,50); dump(50,d)

          # 51 acquaint
          d=load(51); sid=senses(d)[0]['sense_id']
          set_core(d,'把人带到“熟悉/了解某事”的状态。','bring someone into familiarity with a person, subject, or situation',
                   '主动：acquaint sb with sth；更常见状态表达：be/get acquainted with。',
                   'causative acquaint someone with; state/result be or get acquainted with',clusters_for(d,[('使熟悉；使了解','make familiar with','verb',[sid])]))
          d['record']['constructions']=[cons('construction:51acquaint0001','L1','使某人熟悉/了解某事','acquaint + sb + with + sth'),cons('construction:51acquaint0002','L1','熟悉/了解某事；与某人相识','be/get acquainted with + sb/sth')]
          senses(d)[0]['confidence']='high'; close(d,51); dump(51,d)

          # 52 acquaintance
          d=load(52); ids=[x['sense_id'] for x in senses(d)]
          set_core(d,'“知道/认识，但没有进入亲密关系”的中间距离：可指熟悉程度、熟人或泛泛关系。','limited familiarity short of close intimacy: knowledge, a person known, or a loose relationship',
                   'an acquaintance＝熟人；acquaintance with＝对某事有些了解；make sb’s acquaintance＝结识。',
                   'familiarity without closeness is the organizing boundary',clusters_for(d,[('了解；熟悉','limited familiarity or knowledge','noun',[ids[0]]),('熟人','person known but not close friend','noun',[ids[1]]),('相识关系','relationship short of friendship','noun',[ids[2]])]))
          d['record']['constructions']=[cons('construction:52acquaintance0001','L1','熟人；相识的人','an acquaintance'),cons('construction:52acquaintance0002','L1','对……有一定了解','have an acquaintance with + subject','R'),cons('construction:52acquaintance0003','L2','结识某人','make the acquaintance of + sb','R')]
          for s in senses(d): s['confidence']='high'
          close(d,52); dump(52,d)

          # 53 acquire
          d=load(53); sid=senses(d)[0]['sense_id']
          set_core(d,'不是瞬间“拿到”，而是通过获得、学习、购买或长期形成，把某物变成自己拥有的。','come to possess something through gaining, learning, buying, or gradual development',
                   'acquire skill/knowledge＝习得；acquire property/company＝取得/购得；acquire a taste/habit＝逐渐形成。',
                   'focus on coming into possession rather than the generic Chinese gloss 获得',clusters_for(d,[('取得；习得；逐渐获得','come to possess or develop','verb',[sid])]))
          s=senses(d)[0]; s['confidence']='high'; s['definition_cn']='取得；习得；购得；逐渐形成'; s['definition_en']='to come to possess, gain, learn, buy, or develop something'
          d['record']['constructions']=[cons('construction:53acquire0001','L1','习得知识/技能','acquire + knowledge/skill'),cons('construction:53acquire0002','L2','取得资产/公司等','acquire + property/company/assets'),cons('construction:53acquire0003','L2','逐渐养成品味/习惯','acquire + taste/habit','R')]
          close(d,53); dump(53,d)

          # 54 acquisition
          d=load(54); ids=[x['sense_id'] for x in senses(d)]
          set_core(d,'acquire 的名词结果空间：获得的过程、得到的东西，以及商业上的收购。','the process or result of acquiring, plus the business sense of buying another company',
                   'language/skill acquisition＝习得过程；a new acquisition＝新获得物；mergers and acquisitions＝并购。',
                   'separate process, acquired result, and corporate purchase',clusters_for(d,[('获得/习得过程','process of acquiring','noun',[ids[0]]),('获得物','thing acquired','noun',[ids[1]]),('收购','corporate acquisition','noun',[ids[2]])]))
          d['record']['constructions']=[cons('construction:54acquisition0001','L1','……的获得/习得','acquisition of + knowledge/skill/language'),cons('construction:54acquisition0002','L1','并购','mergers and acquisitions'),cons('construction:54acquisition0003','L2','新获得的人或物','a new acquisition','R')]
          for s in senses(d): s['confidence']='high'
          close(d,54); dump(54,d)

          # 56 across
          d=load(56); ids=[x['sense_id'] for x in senses(d)]
          set_core(d,'核心空间关系是“跨过/横贯一条边界或范围”，再派生出对面、遍及；come across/get across 是独立高价值短语。','crossing a boundary or spanning a range, yielding opposite-side and throughout meanings; phrasal uses come across/get across are separate learner objects',
                   'across the street＝横过；across from＝在对面；across the country＝遍及；come across＝偶遇；get sth across＝讲明白。',
                   'keep literal crossing/spanning separate from lexicalized come across/get across',clusters_for(d,[('穿过；横过','from one side to the other','preposition',[ids[0]]),('到对面','to the opposite side','adverb',[ids[1]]),('遍及；横跨范围','throughout a place/group/range','preposition',[ids[2]])]))
          d['record']['constructions']=[cons('construction:56across0001','L1','在……正对面','across from + sb/sth'),cons('construction:56across0002','L1','偶然遇到/发现','come across + sb/sth'),cons('construction:56across0003','L1','把意思讲清楚/传达出去','get + idea/message + across'),cons('construction:56across0004','L1','遍及某地/群体/范围','across + country/industry/range')]
          for s in senses(d): s['confidence']='high'
          close(d,56); dump(56,d)

          # 57 act — recover ordinary live branches
          d=load(57)
          vbeh=promote_ref(d,'take action; to behave','L1','行动；表现；采取行动','to take action or behave in a particular way','take action or behave',pos='verb',trans='vi',usage='Common frames include act quickly, act on advice, and act as + role.')
          vrole=promote_ref(d,'play the role','L2','扮演；表演','to perform or play a role in a play, film, or situation','perform or play a role',pos='verb',trans='vi/vt')
          nlaw=promote_ref(d,'law made by a government','L2','法案；法令','a law passed by a legislative body','law or statute',pos='noun')
          nplay=promote_ref(d,'part of a play or opera','L3','（戏剧/歌剧的）一幕','a main division of a play or opera','division of a play',pos='noun')
          aid='sense:act:601bb18249c95285'
          set_core(d,'把“做出来的行为”作为中心：act 可指一次行为，也可作动词表示行动/表现；再延伸到表演角色、法律法案和戏剧的一幕。','centered on doing: an act is a deed; to act is to take action or behave, with role-performance, statute, and theatrical-act branches',
                   'act of kindness＝行为；act quickly/as＝行动/担任；act a role＝表演；an Act＝法案；Act II＝第二幕。',
                   'route deed → action/behavior → performance, with statute/theatrical noun branches',clusters_for(d,[('行为；行动','deed or action','noun',[aid]),('行动；表现','take action or behave','verb',[vbeh]),('表演；扮演','perform a role','verb',[vrole]),('法案；法令','law or statute','noun',[nlaw]),('戏剧的一幕','division of a play','noun',[nplay])]))
          d['record']['constructions']=[cons('construction:57act0001','L1','采取行动；按……行动','act + adverb / act on + advice/information'),cons('construction:57act0002','L1','充当；担任','act as + role'),cons('construction:57act0003','L2','扮演某角色','act/play + role','R')]
          for s in senses(d): s['confidence']='high'
          close(d,57); dump(57,d)

          # 58 action — recover process/effect/fighting
          d=load(58); baseid=senses(d)[0]['sense_id']
          proc=promote_ref(d,'process of doing something','L1','行动；采取措施的过程','the process of doing something, especially to achieve a result','process of acting',pos='noun')
          effect=promote_ref(d,'effect that one substance','L2','作用；作用过程','the effect or action of one substance or process on another','effect or mechanism of action',pos='noun')
          fight=promote_ref(d,'fighting during a war','L3','战斗；作战','fighting in war or military conflict','military fighting',pos='noun')
          set_core(d,'从“一次做出的行为”到“为了结果而采取行动的过程”；专业语境还可指作用机制，军事语境可指战斗。','from a specific deed to the process of taking action for a result, with effect/mechanism and military-fighting branches',
                   'an action＝一个行为；take action＝采取行动；mechanism/action of drug＝作用；killed in action＝战斗中。',
                   'separate a deed from action-as-process, then specialist effect and combat',clusters_for(d,[('行为','specific deed','noun',[baseid]),('行动过程；措施','process of acting','noun',[proc]),('作用；机制','effect or mechanism','noun',[effect]),('战斗','military fighting','noun',[fight])]))
          d['record']['constructions']=[cons('construction:58action0001','L1','采取行动','take action'),cons('construction:58action0002','L1','行动方案','course of action'),cons('construction:58action0003','L2','……的作用/作用机制','action of + drug/chemical/process','R'),cons('construction:58action0004','L3','在战斗中','in action','R')]
          for s in senses(d): s['confidence']='high'
          close(d,58); dump(58,d)

          # 59 activate
          d=load(59); ids=[x['sense_id'] for x in senses(d)]
          set_core(d,'让原本未运行/未启动的设备、系统、通路或过程开始起作用。','cause an inactive device, system, pathway, or process to start working',
                   'activate device/account/pathway/receptor＝启动或激活；“使有放射性”是低频技术分支。',
                   'one start-working model across devices, systems, accounts, and biological pathways',clusters_for(d,[('启动；激活','make active or operational','verb',[ids[0]]),('使具放射性','make radioactive','verb',[ids[1]])]))
          s=senses(d)[0]; s['confidence']='high'; s['definition_cn']='启动；激活；使设备、系统或过程开始运作'; s['definition_en']='to make a device, system, account, pathway, or process active or operational'
          senses(d)[1]['level']='L3'; senses(d)[1]['confidence']='high'
          d['record']['constructions']=[cons('construction:59activate0001','L1','启动设备/账户/系统','activate + device/account/system'),cons('construction:59activate0002','L1','激活通路/受体/机制','activate + pathway/receptor/mechanism')]
          close(d,59); dump(59,d)

          # 60 active — add missing operating/functioning branch
          d=load(60); existing=[x['sense_id'] for x in senses(d)]
          opid=new_sense(d,'operating-or-functioning','L1','正在运行/起作用的；处于活动状态的','currently operating, functioning, or having an effect','operating or functioning')
          set_core(d,'共同核心是“不是静止/被动/停用，而是在参与、运行或产生作用”。','not inactive or passive: participating, operating, progressing, or producing an effect',
                   'active role＝积极参与；active system/ingredient＝正在起作用；active disease＝活动性疾病；active voice＝主动语态。',
                   'route by what is active: person/participation, system/function, disease process, grammar',clusters_for(d,[('积极参与的','actively participating','adjective',[existing[0]]),('正在运行/起作用的','operating or functioning','adjective',[opid]),('活动性/进展性的','active disease process','adjective',[existing[1]]),('积极分子/主动语态','specialist noun branches','noun',existing[2:])]))
          d['record']['constructions']=[cons('construction:60active0001','L1','积极发挥作用/参与','active + role/participation/member'),cons('construction:60active0002','L1','正在运行或起作用','active + system/ingredient/component'),cons('construction:60active0003','L1','活动性疾病','active + disease/infection')]
          for s in senses(d): s['confidence']='high'
          close(d,60); dump(60,d)

          # 62 actor
          d=load(62); ids=[x['sense_id'] for x in senses(d)]
          set_core(d,'可以是舞台/影视中扮演角色的人，也可以泛指在某个系统、事件或谈判中实际发挥作用的“行动者/参与方”。','a performer who plays roles, or more generally a participant/entity that acts within a system or event',
                   'actor in a film＝演员（不限性别）；key/state/non-state actor＝关键行动者/参与方。',
                   'separate performer from general acting participant; actor is gender-neutral in ordinary modern English',clusters_for(d,[('演员','performer who plays roles','noun',[ids[0]]),('行动者；参与方','participant or entity that acts','noun',[ids[1]])]))
          s=senses(d)[0]; s['confidence']='high'; s['definition_cn']='演员'; s['definition_en']='a performer who acts in plays, films, television, or other dramatic productions'; s['sense_label_en']='performer in drama or film'; s['usage_note']='Modern actor is normally gender-neutral; actress may be used when gender is specifically relevant.'
          senses(d)[1]['confidence']='high'; senses(d)[1]['level']='L1'
          d['record']['constructions']=[cons('construction:62actor0001','L1','影视/戏剧演员','actor in + film/play/series'),cons('construction:62actor0002','L1','某领域的重要行动者/参与方','key/state/non-state actor in + system/process')]
          close(d,62); dump(62,d)

          # Fresh-pass readback: reject any unresolved mechanical delta flag.
          for n in range(37,65):
              d=load(n)
              if n not in upgraded and d['record'].get('needs_delta_review') is True:
                  raise RuntimeError(f'FRESH_PASS_HAS_OPEN_DELTA:o{n:04d}:{d["word"]}')
              active=[x.get('sense_id') for x in senses(d)]
              if not active: raise RuntimeError(f'ACTIVE_ZERO:o{n:04d}:{d["word"]}')
              if len(active)!=len(set(active)): raise RuntimeError(f'DUPLICATE_ACTIVE:o{n:04d}:{d["word"]}')
              aset=set(active)
              for c in d['record'].get('core_concept',{}).get('core_clusters',[]):
                  bad=set(c.get('sense_ids',[]))-aset
                  if bad: raise RuntimeError(f'CORE_CLUSTER_BAD:o{n:04d}:{bad}')

          rows=[]
          for n in range(37,65):
              d=load(n); raw=path(n).read_bytes()
              rows.append({
                  'ordinal':n,'word_id':d['word_id'],'word':d['word'],
                  'operation':'UPGRADED' if n in upgraded else 'NO_CHANGE',
                  'final_quality':quality[n],
                  'active_sense_count':len(senses(d)),
                  'construction_count':len(d['record'].get('constructions',[])),
                  'relation_ref_count':len(d.get('relation_refs',[])),
                  'final_content_sha256':hashlib.sha256(raw).hexdigest()
              })
          receipt={
              'schema':'kianos.lexical.vnext_content_execution_receipt.v1',
              'wave':'wave03-o0025-o0124','shard':'o0037-o0064','status':'PASS',
              'authority':'fresh vNext judgment over Current Natural Owners; historical Fresh-Rebuild work is candidate/sentinel evidence only',
              'owner_count':28,'upgraded_count':len(upgraded),'no_change_count':28-len(upgraded),
              'depth_ready_count':sum(v=='DEPTH_READY' for v in quality.values()),
              'safe_simple_count':sum(v=='SAFE_SIMPLE' for v in quality.values()),
              'blocked_count':0,'relation_mutations':0,'form_mutations':0,'learner_state_mutation':0,'pack_membership_mutation':0,
              'owners':rows
          }
          (OUT/'wave03-shard01-o0037-o0064-receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

      - name: Validate JSON corpus
        if: steps.guard.outputs.done != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for root in ['content/lexical/words/by-ordinal','content/lexical/relations/by-id']:
              for p in Path(root).rglob('*.json'):
                  json.loads(p.read_text())
          print('LEXICAL_JSON_READBACK_PASS')
          PY

