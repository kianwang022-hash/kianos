name: Translation Source Debt Inspection

on:
  pull_request:
    paths:
      - 'static-web/scripts/inspect-translation-source-debts.mjs'
      - '.github/workflows/translation-source-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-web
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Translation Source debts
        env:
          KIANOS_TRANSLATION_SOURCE_INSPECTION_OUT: ${{ runner.temp }}/translation-source-inspection.json
        run: node scripts/inspect-translation-source-debts.mjs
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: translation-source-inspection
          path: ${{ runner.temp }}/translation-source-inspection.json
          if-no-files-found: error
