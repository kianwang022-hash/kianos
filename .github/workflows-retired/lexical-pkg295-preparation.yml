name: Lexical pkg295 preparation

on:
  push:
    branches: [lexical/pkg295-exec]
    paths:
      - '.github/workflows/lexical-pkg295-preparation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexical-pkg295-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg295-exec
          fetch-depth: 0
      - name: Compile exact package accounting
        run: |
          python tools/lexical_compile_reconciliation_package.py \
            --start 6875 --end 7374 \
            --production content/lexical/semantic-review/o6875-o7124.md \
            --production content/lexical/semantic-review/o7125-o7374.md \
            --audit content/lexical/semantic-audit/o6875-o7124.audit.md \
            --audit content/lexical/semantic-audit/o7125-o7374.audit.md \
            --out content/lexical/execution/preflight/o6875-o7374.reconciliation-compile.json
      - name: Enforce expected source contract
        run: |
          python - <<'PY'
          import json
          p='content/lexical/execution/preflight/o6875-o7374.reconciliation-compile.json'
          x=json.load(open(p))
          assert x['production_upgrade_count']==270, x['production_upgrade_count']
          assert x['audit_verdict_counts'].get('FLIP_TO_UPGRADE')==34, x['audit_verdict_counts']
          assert x['audit_verdict_counts'].get('REFINE_UPGRADE',0)==0, x['audit_verdict_counts']
          assert x['audit_verdict_counts'].get('FLIP_TO_NO_CHANGE',0)==0, x['audit_verdict_counts']
          assert x['semantic_source_owner_count']==304, x['semantic_source_owner_count']
          assert not x['identity_risks'], x['identity_risks']
          print('SOURCE_CONTRACT_PASS 304/304')
          PY
      - name: Compile execution evidence
        run: |
          python tools/lexical_prepare_execution_package_v2.py \
            --accounting content/lexical/execution/preflight/o6875-o7374.reconciliation-compile.json \
            --reconciliation content/lexical/semantic-reconciliation/o6875-o7374.md \
            --issue 295 \
            --remote 2949 --remote 6001 --remote 3646 --remote 3718 \
            --out-prefix content/lexical/execution/preflight/o6875-o7374
      - name: Verify Production directives were captured
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('content/lexical/execution/preflight/o6875-o7374.execution-sheet.md').read_text()
          for marker in ['Re-rank fraternal','Broaden fraudulent','Anchor fraught','Repair gibe around taunt/mock','Add same-owner BrE spelling `hypnotise`']:
              assert marker in s, marker
          assert s.count('PRODUCTION: NO_CHANGE in Production / Audit-authorized source') == 34, 'Only the 34 Audit-only additions may lack a Production UPGRADE directive'
          print('PRODUCTION_DIRECTIVE_CAPTURE_PASS')
          PY
      - name: Commit preparation artifacts
        run: |
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical/execution/preflight/o6875-o7374.*
          if ! git diff --cached --quiet; then
            git commit -m 'lexical: recompile pkg295 format-complete preflight [skip ci]'
            git push origin HEAD:lexical/pkg295-exec
          fi
