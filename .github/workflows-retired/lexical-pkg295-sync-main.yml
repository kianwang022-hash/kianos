name: Lexical pkg295 sync latest main

on:
  push:
    branches: [lexical/pkg295-exec]
    paths:
      - '.github/workflows/lexical-pkg295-sync-main.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg295-exec
          fetch-depth: 0
      - name: Merge latest main
        run: |
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:lexical/pkg295-exec
