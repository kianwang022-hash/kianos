name: Lexical pkg251 preparation

on:
  push:
    branches: [lexical/pkg251-exec]
    paths:
      - '.github/workflows/lexical-pkg251-preparation.yml'
      - 'tools/lexical_prepare_pkg251.py'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg251-exec
      - name: Compile execution package
        run: |
          python tools/lexical_prepare_pkg251.py \
            --accounting content/lexical/execution/preflight/o5375-o5874.reconciliation-compile.json \
            --reconciliation content/lexical/semantic-reconciliation/o5375-o5874.md \
            --issue 251 \
            --remote 98 --remote 186 --remote 1111 --remote 1405 --remote 1666 --remote 1667 --remote 1669 --remote 1907 --remote 2140 --remote 2708 --remote 2855 --remote 3375 --remote 3406 --remote 3575 --remote 3931 --remote 3962 --remote 3988 --remote 4168 --remote 4300 --remote 4413 --remote 5339 --remote 6495 \
            --out-prefix content/lexical/execution/preflight/o5375-o5874
      - name: Commit preparation outputs
        run: |
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical/execution/preflight/o5375-o5874.current-identities.json \
                  content/lexical/execution/preflight/o5375-o5874.identity-index.json \
                  content/lexical/execution/preflight/o5375-o5874.execution-sheet.md \
                  content/lexical/execution/preflight/o5375-o5874.manifest-candidates.json \
                  content/lexical/execution/preflight/o5375-o5874.manifest-summary.md \
                  content/lexical/execution/preflight/o5375-o5874.unresolved-resolution.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'lexical: compile pkg251 execution inputs [skip ci]'
          git push origin HEAD:lexical/pkg251-exec
