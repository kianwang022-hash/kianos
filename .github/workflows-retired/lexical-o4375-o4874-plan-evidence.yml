name: Lexical o4375-o4874 plan evidence

on:
  push:
    branches:
      - lexical/execute-o4375-o4874-20260916
    paths:
      - 'tools/lexical_compile_plan_evidence_o4375_o4874.py'
      - '.github/workflows/lexical-o4375-o4874-plan-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/execute-o4375-o4874-20260916
          fetch-depth: 0
      - name: Compile package plan evidence
        run: |
          python tools/lexical_compile_plan_evidence_o4375_o4874.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('content/lexical/execution/preflight/o4375-o4874.plan-evidence.json')
          o=json.loads(p.read_text(encoding='utf-8'))
          assert o['owner_count']==166
          assert all(x['evidence'] for x in o['owners'][:161])
          print('PLAN_EVIDENCE_CONTRACT_PASS 161/161')
          PY
      - name: Commit plan evidence
        run: |
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical/execution/preflight/o4375-o4874.plan-evidence.json
          git commit -m 'lexical: compile o4375-o4874 plan evidence [skip ci]'
          git push origin HEAD:lexical/execute-o4375-o4874-20260916
