name: Lexical pkg295 continuous execution

on:
  push:
    branches:
      - lexical/pkg295-exec
    paths:
      - 'tools/lexical_execute_o6875_o7374.py'
      - 'tools/lexical_package_runtime.py'
      - 'content/lexical/execution/manifests/o6875-o7374/**'
      - '.github/workflows/lexical-pkg295-continuous.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexical-pkg295-continuous
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      KIANOS_BASELINE_MAIN: dae994bce7c35934d12c39e8939b2c8452fafa35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg295-exec
          fetch-depth: 0
      - name: Validate manifest
        run: |
          python -m py_compile tools/lexical_execute_o6875_o7374.py tools/lexical_package_runtime.py
          python tools/lexical_execute_o6875_o7374.py --validate-manifest
      - name: Execute from durable receipts
        run: |
          set -euo pipefail
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          ranges=(6875-6924 6925-6974 6975-7024 7025-7074 7075-7124 7125-7174 7175-7224 7225-7274 7275-7324 7325-7374)
          for i in $(seq 0 9); do
            r=${ranges[$i]}
            receipt="content/lexical/execution/receipts/o${r%-*}-o${r#*-}.json"
            if [ -f "$receipt" ]; then
              echo "RESUME_SKIP checkpoint=$i range=$r"
              continue
            fi
            echo "EXECUTE checkpoint=$i range=$r"
            python tools/lexical_execute_o6875_o7374.py --checkpoint "$i"
            python tools/test_lexical_transport_guards.py
            python tools/test_lexical_shard.py
            python - <<'PY'
          import json, subprocess
          from pathlib import Path
          changed=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          targets=[p for p in changed if p.startswith('content/lexical/') and p.endswith('.json') and Path(p).exists()]
          for p in targets: json.loads(Path(p).read_text(encoding='utf-8'))
          print('CHECKPOINT_JSON_PASS',len(targets))
          PY
            git add content/lexical
            git commit -m "lexical: execute o${r%-*}-o${r#*-} internal receipt [skip ci]"
            git push origin HEAD:lexical/pkg295-exec
          done
