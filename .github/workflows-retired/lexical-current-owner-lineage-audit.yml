name: Lexical Current Owner Lineage Audit

on:
  pull_request:
    paths:
      - 'content/lexical/words/**'
      - 'content/lexical/acceptance/**'
      - 'content/lexical/audit/fresh-rebuild/**'
      - 'content/lexical/semantic-reconciliation/**'
      - 'tools/lexical_current_owner_lineage_audit.py'
      - '.github/workflows/lexical-current-owner-lineage-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit 7,946 Current-owner lineage
        run: |
          python tools/lexical_current_owner_lineage_audit.py --output /tmp/lexical-lineage-report.json
      - name: Upload lineage report
        uses: actions/upload-artifact@v4
        with:
          name: lexical-current-owner-lineage-${{ github.sha }}
          path: /tmp/lexical-lineage-report.json
          retention-days: 14
