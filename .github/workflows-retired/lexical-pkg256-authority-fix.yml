name: Lexical pkg256 authority correction

on:
  push:
    branches:
      - lexical/pkg256-authority-fix
    paths:
      - 'tools/lexical_compile_reconciliation_package.py'
      - '.github/workflows/lexical-pkg256-authority-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg256-authority-fix
          fetch-depth: 0
      - name: Recompile exact package accounting
        run: |
          python tools/lexical_compile_reconciliation_package.py \
            --start 5875 --end 6374 \
            --production content/lexical/semantic-review/o5875-o6124.md \
            --production content/lexical/semantic-review/o6125-o6374.md \
            --audit content/lexical/semantic-audit/o5825-o6024.audit.md \
            --audit content/lexical/semantic-audit/o6025-o6224.audit.md \
            --audit content/lexical/semantic-audit/o6225-o6424.audit.md \
            --out content/lexical/execution/preflight/o5875-o6374.reconciliation-compile.json
      - name: Commit corrected accounting
        run: |
          set -euo pipefail
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          git add content/lexical/execution/preflight/o5875-o6374.reconciliation-compile.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'lexical: correct pkg256 audit accounting [skip ci]'
          git push origin HEAD:lexical/pkg256-authority-fix
