name: Lexical Batch Audit Result

on:
  push:
    branches:
      - 'work/lexical-continuous-*'
    paths:
      - 'content/lexical/execution/audit-result.json'

permissions:
  contents: write

concurrency:
  group: lexical-audit-result-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate and record explicit B result
        run: |
          python tools/test_lexical_live_batch.py
          python tools/lexical_live_batch.py record-audit-file \
            --request content/lexical/execution/audit-result.json

      - name: Read result
        id: audit
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          req=json.load(open('content/lexical/execution/audit-result.json',encoding='utf-8'))
          print('candidate=' + req['candidate_id'])
          print('result=' + req['result'])
          PY

      - name: Commit cursor transition and consume request
        run: |
          git config user.name "KianOS Lexical Orchestrator"
          git config user.email "actions@users.noreply.github.com"
          git rm content/lexical/execution/audit-result.json
          git add content/lexical/execution/live-batch.json
          git commit -m "chore(lexical): record ${{ steps.audit.outputs.candidate }} B result"
          git push origin HEAD:"${GITHUB_REF_NAME}"
