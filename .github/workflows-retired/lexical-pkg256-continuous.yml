name: Lexical pkg256 continuous execution

on:
  push:
    branches:
      - lexical/pkg256-exec
    paths:
      - 'tools/lexical_execute_o5875_o6374.py'
      - 'content/lexical/execution/manifests/o5875-o6374/**'
      - '.github/workflows/lexical-pkg256-continuous.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexical-pkg256-continuous
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      KIANOS_BASELINE_MAIN: fba9a50861e1687e863b544616bb8524a123ecd4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexical/pkg256-exec
          fetch-depth: 0
      - name: Validate manifest
        run: |
          python -m py_compile tools/lexical_execute_o5875_o6374.py
          python tools/lexical_execute_o5875_o6374.py --validate-manifest
      - name: Execute from durable receipts
        run: |
          set -euo pipefail
          git config user.name Kian
          git config user.email kianwang022@gmail.com
          ranges=(5875-5924 5925-5974 5975-6024 6025-6074 6075-6124 6125-6174 6175-6224 6225-6274 6275-6324 6325-6374)
          for i in $(seq 0 9); do
            r=${ranges[$i]}
            receipt="content/lexical/execution/receipts/o${r%-*}-o${r#*-}.json"
            if [ -f "$receipt" ]; then
              echo "RESUME_SKIP checkpoint=$i range=$r"
              continue
            fi
            echo "EXECUTE checkpoint=$i range=$r"
            python tools/lexical_execute_o5875_o6374.py --checkpoint "$i"
            python tools/test_lexical_transport_guards.py
            python tools/test_lexical_shard.py
            python - <<'PY'
          import json, subprocess
          from pathlib import Path
          changed=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          targets=[p for p in changed if p.startswith('content/lexical/') and p.endswith('.json') and Path(p).exists()]
          for p in targets: json.loads(Path(p).read_text(encoding='utf-8'))
          print('CHECKPOINT_JSON_PASS',len(targets))
          PY
            git add content/lexical
            git commit -m "lexical: execute o${r%-*}-o${r#*-} internal receipt [skip ci]"
            git push origin HEAD:lexical/pkg256-exec
          done
