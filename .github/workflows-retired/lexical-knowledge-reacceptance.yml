name: Lexical Current Integrity Signals (non-acceptance)

on:
  pull_request:
    paths:
      - 'content/lexical/words/by-ordinal/**'
      - 'content/lexical/audit/knowledge-reacceptance/**'
      - 'tools/lexical_knowledge_reacceptance_audit.py'
      - '.github/workflows/lexical-knowledge-reacceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-integrity-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan Current lexical owner integrity and diagnostic signals
        shell: bash
        run: |
          python tools/lexical_knowledge_reacceptance_audit.py \
            --output /tmp/lexical-current-integrity-signals.json \
            --summary /tmp/lexical-current-integrity-signals.md

      - name: Publish non-acceptance diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Lexical Current Integrity Signals'
            echo ''
            echo '> Diagnostic only. This workflow does not grant Knowledge Acceptance, semantic PASS, audit closure, learner mastery, or executor authorization.'
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/lexical-current-integrity-signals.md ]; then
            cat /tmp/lexical-current-integrity-signals.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Current integrity signal summary unavailable' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexical-current-integrity-signals
          path: |
            /tmp/lexical-current-integrity-signals.json
            /tmp/lexical-current-integrity-signals.md
          if-no-files-found: warn
          retention-days: 14
