name: Lexical Merge Materialization Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'content/lexical/words/**'
      - 'content/lexical/canonical/collocations/**'
      - 'tools/lexical_merge_materialization_audit.py'
      - '.github/workflows/lexical-merge-materialization-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Classify presentation merges
        run: python tools/lexical_merge_materialization_audit.py --output lexical-merge-audit/report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: lexical-merge-materialization-${{ github.sha }}
          path: lexical-merge-audit/report.json
          retention-days: 14
